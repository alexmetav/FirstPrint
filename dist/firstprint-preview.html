/* Featured market facts as one quiet line. */
.home .featured .hero-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
}
.home .featured .hero-facts > div {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  padding: 0;
  border: 0;
  background: none;
  box-shadow: none;
}
.home .featured .hero-facts > div > .i {
  display: none;
}
.home .featured .hero-facts dt {
  order: 2;
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0;
  text-transform: none;
  color: var(--muted);
}
.home .featured .hero-facts dd {
  order: 1;
  margin: 0;
  font-size: 15px;
  font-weight: 600;
}
.home-rail {
  align-items: start;
}

/* =====================================================================
   Market page composition: compact header, one line of facts, slim
   timeline, outcomes as one calm list, folded rules. Empty markets show
   no zeros.
   ===================================================================== */

.mh {
  display: grid;
  gap: 12px;
  margin-bottom: 20px;
}
.mh .m-title {
  align-items: center;
  gap: 14px;
}
.mh .m-title .sym {
  font-size: clamp(26px, 3vw, 32px);
}
.mh .m-name {
  font-size: 14px;
  color: var(--muted);
}
.mh .m-question {
  margin: 4px 0 0;
  max-width: 62ch;
  font-size: 17px;
  font-weight: 500;
  line-height: 1.45;
  color: var(--text);
}
.mh .m-status {
  margin: 0;
  font-size: 14px;
  color: var(--muted);
}
.m-facts {
  display: flex;
  flex-wrap: wrap;
  margin: 4px 0 0;
  padding: 12px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.m-facts > div {
  display: grid;
  gap: 2px;
  padding: 0 20px;
  border-left: 1px solid var(--line);
}
.m-facts > div:first-child {
  padding-left: 0;
  border-left: 0;
}
.m-facts dt {
  font-size: 12px;
  color: var(--muted);
}
.m-facts dd {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.m-facts dd .muted {
  font-weight: 400;
}
.m-refs {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--muted);
}
.m-refs > .i {
  width: 14px;
  height: 14px;
}
.m-refs .price-links {
  display: inline-flex;
  gap: 6px;
  margin: 0 0 0 4px;
}
.m-refs .price-links > .muted {
  display: none;
}
.m-refs .price-links .btn {
  min-height: 28px;
  padding: 0 10px;
  font-size: 12px;
}

/* Slim timeline: three points on one line. */
.market-layout .timeline {
  position: relative;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0;
  margin: 0 0 24px;
}
.market-layout .timeline li {
  padding: 18px 12px 0 0;
  border: 0;
  background: none;
  box-shadow: none;
  border-top: 2px solid var(--line);
  opacity: 1;
}
.market-layout .timeline li.done {
  border-top-color: var(--up);
}
.market-layout .timeline li.now {
  border-top-color: transparent;
  background: linear-gradient(90deg, var(--up), var(--line)) top / 100% 2px no-repeat;
  box-shadow: none;
}
.market-layout .timeline .step-dot {
  position: absolute;
  top: -6px;
  margin: 0;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--line-strong);
  box-shadow: 0 0 0 3px var(--bg);
}
.market-layout .timeline li {
  position: relative;
}
.market-layout .timeline .done .step-dot {
  background: var(--up);
}
.market-layout .timeline .now .step-dot {
  background: var(--up);
  box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px color-mix(in srgb, var(--up) 25%, transparent);
}
.market-layout .timeline b {
  font-size: 13px;
  font-weight: 600;
}
.market-layout .timeline .muted {
  font-size: 12px;
}

/* Outcomes: one list with hairline dividers. */
.market-layout .ladder {
  gap: 0;
  margin-bottom: 8px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
  overflow: hidden;
}
.market-layout .ladder-head {
  padding: 12px 16px;
  font-size: 11px;
  border-bottom: 1px solid var(--line);
}
.market-layout .rung {
  min-height: 60px;
  padding: 10px 16px;
  border: 0;
  border-top: 1px solid var(--line);
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}
.market-layout .ladder-head + .rung {
  border-top: 0;
}
.market-layout .rung::before {
  background: color-mix(in srgb, var(--c) 12%, transparent);
}
.market-layout .rung:not(:disabled):hover {
  transform: none;
  background: color-mix(in srgb, var(--text) 3%, transparent);
}
.market-layout .rung[aria-pressed='true'] {
  background: color-mix(in srgb, var(--c) 8%, transparent);
  box-shadow: inset 3px 0 0 var(--c);
}
.market-layout .rung-name b {
  font-size: 15px;
  font-weight: 600;
}
.market-layout .rung .num {
  font-size: 15px;
  font-weight: 600;
}
.num-soft {
  color: var(--muted);
  font-size: 13px !important;
  font-weight: 500 !important;
}
.ladder-quiet .ladder-head,
.ladder-quiet .rung {
  grid-template-columns: minmax(0, 1fr) auto;
}
.rung-cta {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  opacity: 0;
  transition: opacity 140ms var(--ease-out);
}
.rung-cta .i {
  width: 14px;
  height: 14px;
}
.rung:hover .rung-cta,
.rung:focus-visible .rung-cta,
.rung[aria-pressed='true'] .rung-cta {
  opacity: 1;
  color: var(--c);
}
@media (hover: none) {
  .rung-cta {
    opacity: 1;
  }
}
.ladder-note {
  margin: 0 0 24px;
}

/* Rules folded away, calm. */
.m-rules {
  margin: 0 0 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
}
.m-rules summary {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  list-style: none;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
}
.m-rules summary::-webkit-details-marker {
  display: none;
}
.m-rules summary .i {
  width: 16px;
  height: 16px;
  color: var(--muted);
}
.m-rules summary .i:last-child {
  margin-left: auto;
  transition: transform 160ms var(--ease-out);
}
.m-rules[open] summary .i:last-child {
  transform: rotate(90deg);
}
.m-rules > :not(summary) {
  margin: 0 16px 16px;
}
.m-rules .m-note {
  padding: 12px 14px;
  border-radius: 10px;
  background: var(--raised);
  font-size: 14px;
}

/* Calmer panels on the market page. */
.market-layout .section.panel,
.market-layout .trade-card {
  background: var(--surface);
  box-shadow: inset 0 1px 0 var(--hairline-hi);
}

/* Cards and the featured market before anyone predicts. */
.card-new {
  align-self: start;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  color: var(--brand);
  background: color-mix(in srgb, var(--brand) 14%, transparent);
}
.card-quiet {
  margin: 0;
  font-size: 13px;
  color: var(--muted);
}
.qp-row.qp-mini .qp {
  min-height: 34px;
  font-size: 12px;
}
.mini-ladder.quiet .mini-rung {
  grid-template-columns: minmax(0, 1fr) auto;
}
.mini-ladder.quiet .mini-rung > span:last-child {
  display: none;
}
.home-note {
  margin: 8px 0 0;
  padding: 16px;
  border: 1px dashed var(--line-strong);
  border-radius: 14px;
  font-size: 14px;
  color: var(--muted);
  text-align: center;
}

@media (max-width: 640px) {
  .m-facts {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px 0;
  }
  .m-facts > div {
    padding: 0 12px;
  }
  .m-facts > div:nth-child(odd) {
    padding-left: 0;
    border-left: 0;
  }
  .mh .m-question {
    font-size: 16px;
  }
  .market-layout .timeline b {
    font-size: 12px;
  }
}
.trade {
  box-shadow: none;
  top: 124px;
}
.mh .m-refs {
  margin-bottom: 4px;
}
@media (max-width: 900px) {
  .trade {
    top: auto;
  }
}
@media (max-width: 640px) {
  .top-link {
    display: none;
  }
}
/* Featured facts read label first: "Start price $0.02028 · Closes in 10d 23h". */
.home .featured .hero-facts dt {
  order: 1;
}
.home .featured .hero-facts dd {
  order: 2;
}
.home .featured .hero-facts > div + div::before {
  content: '·';
  order: 0;
  margin-right: 10px;
  color: var(--muted);
}
.home .featured .hero-facts {
  gap: 4px 10px;
}
@media (max-width: 900px) {
  .home .featured .mini-ladder.quiet {
    display: none;
  }
}


/* =====================================================================
   Type system. One family (Inter), one scale, five roles:
   titles · outcome labels · numbers · descriptions · metadata.
   Weights: 400 reading, 500 labels and navigation, 600 titles, numbers
   and buttons, 650 only for page-level titles. Numbers use tabular
   figures so points, percentages and countdowns line up and don't jitter.
   ===================================================================== */
:root {
  --fs-meta: 12px;
  --fs-sm: 13px;
  --fs-base: 15px;
  --fs-md: 16px;
  --fs-lg: 18px;
  --fs-xl: 22px;
  --fs-2xl: 28px;
  --lh-tight: 1.15;
  --lh-snug: 1.3;
  --lh-body: 1.55;
}
body {
  font-family: var(--body);
  font-optical-sizing: auto;
  letter-spacing: -0.006em;
}
b,
strong {
  font-weight: 600;
}

/* Page-level titles: page, featured market, market page, dashboard name. */
h1,
.page-title,
.featured h1,
.mh .m-title .sym,
.dash-name {
  font-weight: 650;
  line-height: var(--lh-tight);
  letter-spacing: -0.022em;
}
.page-title,
.mh .m-title .sym {
  font-size: var(--fs-2xl);
}
.featured h1 {
  font-size: clamp(26px, 2.6vw, 32px);
}
.dash-name {
  font-size: 24px;
}
.featured .h1-soft {
  font-weight: 400;
}

/* Section headings and card headings. */
h2,
.section-head h2,
.home-head h2 {
  font-size: var(--fs-lg);
  font-weight: 600;
  line-height: var(--lh-snug);
  letter-spacing: -0.012em;
}
.rail-head h3,
.dash-card-head h2,
.trade-card h2,
.m-rules summary,
.modal h2 {
  font-size: var(--fs-base);
  font-weight: 600;
  line-height: var(--lh-snug);
  letter-spacing: -0.01em;
}
.trade-card h2 {
  font-size: var(--fs-lg);
}

/* Market titles on cards and lists. */
.mcard .sym,
.mkt-cell span,
.rail-list li > a,
.who-cell a {
  font-size: var(--fs-md);
  font-weight: 600;
  line-height: var(--lh-snug);
  letter-spacing: -0.01em;
}
.mkt-cell span,
.rail-list li > a,
.who-cell a {
  font-size: var(--fs-base);
}
.mcard .card-name,
.mh .m-name,
.hero-name {
  font-size: var(--fs-sm);
  font-weight: 400;
  line-height: var(--lh-snug);
  color: var(--muted);
}
.hero-name {
  font-size: var(--fs-base);
}

/* Outcome labels: coloured, medium weight. */
.o-name,
.rung-name b,
.mini-rung b,
.qp span,
.qp-yn .qp,
.odds-legend span,
.orec-name {
  font-weight: 500;
  letter-spacing: -0.005em;
}
.o-name,
.mini-rung b,
.qp span {
  font-size: var(--fs-base);
}
.qp span {
  font-size: var(--fs-sm);
}
.market-layout .rung-name b {
  font-size: var(--fs-md);
  font-weight: 500;
}
.o-name small,
.rung-name small,
.mini-rung .muted {
  font-size: var(--fs-meta);
  font-weight: 400;
}

/* Numbers: semibold, tabular, slightly tight. */
.tick,
.num,
.num-cell,
.o-pct,
.pct,
.gauge b,
.qp b,
.qp-sm,
.sum-value,
.record-grid dd,
.m-facts dd,
.hero-facts dd,
.stats dd,
.stat-tile dd,
.rail-list b,
.dash-ledger b,
.points,
.chance b,
.odds-legend b,
.odds-big b,
.orec-num,
.side-n,
.count,
.count-badge,
.rail-rank,
.table td.right,
.table th.right,
.stake-input input,
#stake,
.summary dd,
.when,
.card-foot,
.m-facts,
.hero-facts,
.mobile-bar,
.odds-axis,
.odds-time,
.pchart-axis,
.bell-n,
.gift-n {
  font-variant-numeric: tabular-nums;
}
.o-pct,
.market-layout .rung .num,
.gauge b,
.m-facts dd,
.hero-facts dd,
.rail-list b,
.dash-ledger b,
.record-grid dd,
.sum-value {
  font-weight: 600;
  letter-spacing: -0.01em;
}
.qp b {
  font-weight: 500;
}
.sum-value {
  font-size: var(--fs-2xl);
  line-height: var(--lh-tight);
}
.record-grid dd {
  font-size: var(--fs-lg);
}

/* Descriptions: regular weight, comfortable line height. */
.mh .m-question {
  font-size: 17px;
  font-weight: 400;
  line-height: 1.5;
}
.lede,
.page-lede,
.section-head p,
.card-quiet,
.card-result,
.rail-card p,
.dash-card-text,
.dash-empty p,
.empty p,
.home-note,
.m-note,
.rules li,
.howto li {
  font-weight: 400;
  line-height: var(--lh-body);
}
.section-head p,
.card-quiet,
.rail-card p,
.dash-card-text,
.dash-empty p,
.home-note {
  font-size: var(--fs-sm);
}
.fine,
.ladder-note {
  font-size: var(--fs-meta);
  line-height: 1.5;
  color: var(--muted);
}

/* Metadata: small, regular, muted. Labels above values stay quiet. */
.mcard .card-foot,
.m-facts dt,
.m-refs,
.odds-time,
.dash-meta,
.feed .muted,
.dw-main .muted,
.dl-main small,
.mcard .card-mine,
.timeline .muted {
  font-size: var(--fs-meta);
  font-weight: 400;
}
.mcard .card-foot .st {
  font-weight: 500;
}
.mcard .card-foot .when {
  font-weight: 500;
  color: var(--text);
}
.sum-label,
.record-grid dt,
.hero-facts dt,
.field-label {
  font-weight: 500;
}
.eyebrow,
.dash-eyebrow,
.side-label,
.ladder-head,
.table th,
.mini-head,
.hero-facts dt.caps {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* Navigation and controls. */
.subnav a {
  font-size: 14px;
  font-weight: 500;
}
.subnav a[aria-current='page'] {
  font-weight: 500;
}
.home-side button,
.top-menu a,
.top-menu button {
  font-size: 14px;
  font-weight: 400;
}
.home-side button[aria-current='true'] {
  font-weight: 500;
}
.top-menu .menu-quiet {
  font-size: var(--fs-sm);
}
.tabs button,
.dash-tabs button {
  font-size: 14px;
  font-weight: 500;
}
.tabbar a {
  font-size: 11px;
  font-weight: 500;
}
.chip {
  font-family: var(--body);
  font-size: var(--fs-sm);
  font-weight: 500;
}
.chip.points {
  font-weight: 600;
}
.btn {
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.005em;
}
.btn-gold,
.btn-solid,
.btn-lg {
  font-weight: 600;
}
.st,
.pill,
.tag {
  font-weight: 500;
}
.wordmark .word {
  font-weight: 650;
}

@media (max-width: 640px) {
  .page-title,
  .mh .m-title .sym {
    font-size: 24px;
  }
  .mh .m-question {
    font-size: var(--fs-md);
  }
  .sum-value {
    font-size: 26px;
  }
}
/* Outcome names inside sentences and the prediction panel's outcome buttons. */
.oc,
.picker button b {
  font-weight: 500;
}
.picker button small {
  font-variant-numeric: tabular-nums;
  font-weight: 400;
}
/* Featured facts: spacing instead of dots, so a wrapped line never starts with a stray "·". */
.home .featured .hero-facts > div + div::before {
  content: none;
}
.home .featured .hero-facts {
  gap: 6px 20px;
}

/* =====================================================================
   Featured market: one flat panel. Left: who, what, when, one action.
   Right: the outcomes as a single list where each row is the pick.
   No glows, no boxes inside boxes.
   ===================================================================== */
.feat {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  gap: 0;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  box-shadow: inset 0 1px 0 var(--hairline-hi);
  overflow: hidden;
}
.feat-main {
  display: grid;
  align-content: start;
  gap: 16px;
  padding: 28px;
}
.feat-kicker {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--fs-meta);
  color: var(--muted);
}
.feat-id {
  display: flex;
  align-items: center;
  gap: 14px;
}
.feat-id h2 {
  margin: 0;
  font-size: var(--fs-2xl);
  font-weight: 650;
  line-height: 1.1;
  letter-spacing: -0.022em;
}
.feat-id p {
  margin: 2px 0 0;
  font-size: var(--fs-sm);
  color: var(--muted);
}
.feat-q {
  margin: 0;
  max-width: 44ch;
  font-size: var(--fs-base);
  line-height: 1.5;
  color: color-mix(in srgb, var(--text) 82%, var(--muted));
}
.feat-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 0;
  margin: 0;
}
.feat-facts > div {
  padding: 0 20px;
  border-left: 1px solid var(--line);
}
.feat-facts > div:first-child {
  padding-left: 0;
  border-left: 0;
}
.feat-facts dt {
  font-size: var(--fs-meta);
  color: var(--muted);
}
.feat-facts dd {
  margin: 2px 0 0;
  font-size: var(--fs-md);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}
.feat-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
  margin-top: 4px;
}
.feat-actions .btn {
  min-height: 40px;
  padding: 0 16px;
}
.feat-actions .btn .i {
  width: 15px;
  height: 15px;
}
.feat-hint {
  font-size: var(--fs-meta);
  color: var(--muted);
}

.feat-side {
  display: grid;
  align-content: start;
  padding: 12px 0;
  border-left: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 35%, var(--surface));
}
.feat-side-head {
  display: flex;
  justify-content: space-between;
  padding: 12px 24px 8px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.fo-row {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto 64px;
  align-items: center;
  gap: 16px;
  min-height: 52px;
  padding: 0 24px;
  border: 0;
  border-top: 1px solid var(--line);
  background: transparent;
  color: var(--text);
  text-align: left;
  font: inherit;
  transition: background-color 140ms var(--ease-out);
}
.fo-row:first-of-type {
  border-top: 0;
}
.fo-row::before {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  width: var(--share);
  background: color-mix(in srgb, var(--c) 10%, transparent);
  pointer-events: none;
}
.fo-row > * {
  position: relative;
}
.fo-row:hover:not(:disabled),
.fo-row:focus-visible {
  background: color-mix(in srgb, var(--c) 8%, transparent);
  outline: none;
}
.fo-row:focus-visible {
  box-shadow: inset 2px 0 0 var(--c);
}
.fo-row:disabled {
  cursor: default;
}
.fo-name {

/* ===== Home hero: one-line pitch, live numbers, the next market to close ===== */
.home-hero {
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  align-items: center;
  gap: 32px;
  margin-bottom: 24px;
  padding: 40px 40px 36px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background:
    linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 100% 64px,
    linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 64px 100%,
    var(--surface);
  background-blend-mode: normal;
}
.home-hero::before {
  /* Fade the grid so it sits behind the words, not on top of them. */
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(100deg, var(--surface) 30%, color-mix(in srgb, var(--surface) 70%, transparent) 65%, color-mix(in srgb, var(--surface) 40%, transparent));
  pointer-events: none;
}
.hero-art {
  position: absolute;
  inset: auto 0 0 0;
  width: 100%;
  height: 78%;
  color: var(--up);
  opacity: 0.55;
  pointer-events: none;
}
.hero-copy,
.hero-next {
  position: relative;
}
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 20px;
  padding: 6px 12px;
  border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent);
  border-radius: 999px;
  background: color-mix(in srgb, var(--gold) 8%, transparent);
  color: var(--gold);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.hero-badge svg {
  width: 14px;
  height: 14px;
}
.home-hero h1 {
  margin: 0;
  max-width: 15em;
  font-size: clamp(30px, 3.3vw, 46px);
  font-weight: 500;
  line-height: 1.06;
  letter-spacing: -0.04em;
  color: var(--text);
}
.hero-sub {
  margin: 18px 0 0;
  max-width: 36em;
  font-size: var(--fs-md);
  line-height: 1.6;
  color: var(--muted);
}
.hero-sub b {
  font-weight: 500;
}
.hero-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 36px;
  margin: 28px 0 0;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}
.hero-stats div {
  margin: 0;
}
.hero-stats dt {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.hero-stats dd {
  margin: 6px 0 0;
  font-family: var(--mono);
  font-size: 20px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  color: var(--text);
}
/* Top payout: only the number moves. It uses the theme's green (dark on light, bright on dark), so it
   stays sharp in both themes, with a marker-pen highlight that swipes under it and a periodic pop. */
.hero-stats dd .hero-top {
  position: relative;
  isolation: isolate;
  display: inline-block;
  padding: 0 0.12em;
  font-size: 1.35em;
  font-weight: 700;
  line-height: 1;
  color: var(--up);
  text-shadow: 0 0 14px color-mix(in srgb, var(--up) 40%, transparent);
  transform-origin: left bottom;
  /* Pops a few times when Home opens, then rests, so an idle Home costs no CPU. */
  animation: hero-top-pop 3.2s ease-in-out 3;
}
.hero-stats dd .hero-top::before {
  content: '';
  position: absolute;
  z-index: -1;
  left: 0;
  right: 0;
  bottom: 0.02em;
  height: 0.5em;
  border-radius: 0.2em;
  background: color-mix(in srgb, var(--up) 24%, transparent);
  transform-origin: left center;
  animation: hero-top-marker 3.2s ease-in-out 3;
}
@keyframes hero-top-pop {
  0%, 62%, 100% { transform: scale(1); }
  70% { transform: scale(1.12); }
  80% { transform: scale(0.98); }
  88% { transform: scale(1.03); }
}
@keyframes hero-top-marker {
  0% { transform: scaleX(0); }
  30%, 85% { transform: scaleX(1); }
  100% { transform: scaleX(1); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .hero-stats dd .hero-top,
  .hero-stats dd .hero-top::before { animation: none; }
}

}
.hero-deck {
  position: relative;
  display: grid;
  gap: 12px;
  align-self: center;
}
/* A 3D stack: the front card, with the next markets as layers peeking out behind it.
   Each card's depth (--d: 0 front, 1, 2, 3 hidden at the back) sets where it sits. */
.hero-slides {
  --step: 18px;
  position: relative;
  display: grid;
  perspective: 1600px;
  perspective-origin: 50% 0%;
  isolation: isolate;
}
.hero-deck.has-many .hero-slides {
  padding-top: calc(var(--step) * 2);
}
.hero-deck.has-many:hover .hero-slides {
  --step: 24px;
}
.hero-slide {
  --d: 0;
  position: relative;
  grid-area: 1 / 1;
  z-index: calc(10 - var(--d));
  transform-origin: 50% 0%;
  transform: translateY(calc(var(--d) * var(--step) * -1)) translateZ(calc(var(--d) * -60px)) rotateX(calc(var(--d) * 2deg));
  transition: transform 0.7s cubic-bezier(0.22, 0.8, 0.24, 1), opacity 0.5s;
  will-change: transform;
}
.hero-slide:not(.is-on) {
  pointer-events: none;
}
/* Cards further back are dimmed by a black layer: animating its opacity is cheap, unlike a filter. */
.hero-slide::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 5;
  border-radius: 16px;
  background: #000;
  opacity: calc(var(--d) * 0.22);
  pointer-events: none;
  transition: opacity 0.7s;
}
.hero-slide.is-far {
  opacity: 0;
}
.hero-slide.is-out {
  animation: deck-to-back 0.9s cubic-bezier(0.45, 0, 0.25, 1);
}
/* The front card drops forward and down, fades, then slips in at the back of the stack. */
@keyframes deck-to-back {
  0% {
    z-index: 30;
    opacity: 1;
    transform: none;
  }
  32% {
    z-index: 30;
    opacity: 0;
    transform: translateY(90px) translateZ(60px) rotateX(-18deg) scale(0.98);
  }
  46% {
    z-index: 0;
    opacity: 0;
    transform: translateY(calc(var(--step) * -3)) translateZ(-200px);
  }
}
.hero-dots {
  display: flex;
  justify-content: center;
  gap: 6px;
}
.hero-dots button {
  width: 6px;
  height: 6px;
  padding: 0;

}
.hero-dots button[aria-current='true'] {

}
/* Reduced motion: the layers still step forward, gently, without the 3D drop. */
@media (prefers-reduced-motion: reduce) {
  .hero-slide {
    transition: transform 0.5s ease, opacity 0.4s;
  }
  .hero-slide.is-out {
    animation: deck-fade-back 0.6s ease;
  }
}
@keyframes deck-fade-back {
  0% {
    z-index: 30;
    opacity: 1;
    transform: none;
  }
  40% {
    z-index: 30;
    opacity: 0;
    transform: none;
  }
  41% {

    opacity: 0;
  }
}

.dot-live::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 1px solid var(--up);
  opacity: 0;
  animation: live-ping 2.4s ease-out 6;
}
@keyframes live-ping {
  0% { transform: scale(0.6); opacity: 0.9; }
  70%, 100% { transform: scale(1.6); opacity: 0; }
}

a.hero-badge-live {
  border-color: color-mix(in srgb, var(--up) 40%, var(--line));
  background: color-mix(in srgb, var(--up) 9%, transparent);
  color: var(--text);
  text-decoration: none;
  transition: border-color 0.2s, background-color 0.2s;
}
a.hero-badge-live:hover {
  border-color: var(--up);
  background: color-mix(in srgb, var(--up) 15%, transparent);
}
a.hero-badge-live .i {
  width: 13px;
  height: 13px;
  transition: transform 0.2s;
}
a.hero-badge-live:hover .i {
  transform: translateX(3px);
}

.testnet-card {
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(0, 1.1fr) minmax(0, 1fr);
  grid-template-areas:
    'coins copy steps'
    'coins actions steps';
  align-items: center;
  gap: 14px 28px;
  margin-bottom: 24px;
  padding: 24px 28px 28px;
  overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--gold) 28%, var(--line));
  border-radius: 20px;
  background:
    radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--gold) 10%, transparent), transparent 55%),
    var(--surface);
}
.tn-coins {
  grid-area: coins;
  position: relative;
  width: 64px;
  height: 64px;
}
.tn-coins i {
  position: absolute;
  left: 8px;
  width: 48px;
  height: 14px;
  border-radius: 50%;
  background: linear-gradient(180deg, #ffe680, #d9a400);
  box-shadow: inset 0 -2px 0 rgba(120, 85, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.25);
  animation: coin-bob 2.8s ease-in-out 6;
}
.tn-coins i:nth-child(1) { top: 40px; }
.tn-coins i:nth-child(2) { top: 28px; animation-delay: 0.15s; }
.tn-coins i:nth-child(3) { top: 16px; animation-delay: 0.3s; }
@keyframes coin-bob {
  50% { transform: translateY(-4px); }
}
.tn-copy {
  grid-area: copy;
  display: grid;
  gap: 8px;
}
.tn-kicker {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin: 0;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--up);
}
.testnet-card h2 {
  margin: 0;
  font-size: clamp(20px, 2vw, 26px);
  font-weight: 500;
  line-height: 1.2;
  letter-spacing: -0.025em;
}
.tn-sub {
  margin: 0;
  color: var(--muted);
  font-size: var(--fs-sm);
  line-height: 1.6;
}
.tn-actions {
  grid-area: actions;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.tn-steps {
  grid-area: steps;
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.tn-steps li {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: color-mix(in srgb, var(--surface-2) 60%, transparent);
  transition: border-color 0.25s, background-color 0.25s;
}
.tn-steps b {
  display: block;
  font-size: var(--fs-sm);
  font-weight: 500;
}
.tn-steps small {
  display: block;
  font-size: var(--fs-meta);
  color: var(--muted);
}
.tn-n {
  display: grid;
  place-items: center;
  flex: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
}
.tn-n .i {
  width: 14px;
  height: 14px;
}
.tn-steps li.done {
  opacity: 0.75;
}
.tn-steps li.done .tn-n {
  border-color: var(--up);
  background: var(--up);
  color: #04130a;
}
.tn-steps li.next {
  border-color: color-mix(in srgb, var(--brand) 55%, var(--line));
  background: color-mix(in srgb, var(--brand) 8%, transparent);
}
.tn-steps li.next .tn-n {
  border-color: var(--brand);
  color: var(--brand);
}
.tn-progress {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 3px;
  background: var(--line);
}
.tn-progress i {
  display: block;
  height: 100%;
  width: calc(var(--done, 0) * 100%);
  background: linear-gradient(90deg, var(--up), var(--gold));
  transition: width 0.6s var(--ease-out);
}
.tn-close {
  position: absolute;
  top: 12px;
  right: 12px;
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.tn-close:hover {
  background: var(--surface-2);
  color: var(--text);
}
.tn-close .i {
  width: 14px;
  height: 14px;
}

/* Coins that fly into the balance, and the balance's reaction. */
.coin-fly {
  position: fixed;
  top: -11px;
  left: -11px;
  z-index: 1000;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.9) 0 12%, transparent 30%),
    radial-gradient(circle at 50% 50%, #ffe45c 0 46%, #e0a800 47% 52%, #ffd60a 53% 70%, #b58300 100%);
  box-shadow:
    inset 0 -2px 0 rgba(120, 80, 0, 0.45),
    0 0 10px rgba(255, 214, 10, 0.55),
    0 0 22px rgba(255, 190, 0, 0.25);
  pointer-events: none;
  will-change: transform, opacity;
  backface-visibility: visible;
}
.coin-pop {
  position: fixed;
  z-index: 999;
  width: 12px;
  height: 12px;
  margin: -6px 0 0 -6px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 236, 140, 0.95), rgba(255, 214, 10, 0.35) 50%, transparent 70%);
  pointer-events: none;
  animation: coin-pop 0.6s var(--ease-out) forwards;
}
@keyframes coin-pop {
  from { transform: scale(0.4); opacity: 1; }
  to { transform: scale(9); opacity: 0; }
}
.pts-tick {
  animation: pts-tick 0.18s var(--ease-out);
}
@keyframes pts-tick {
  50% { transform: scale(1.05); border-color: color-mix(in srgb, var(--gold) 60%, var(--line-strong)); }
}
.pts-hit {
  animation: pts-hit 0.7s var(--ease-out);
}
@keyframes pts-hit {
  25% {
    transform: scale(1.14);
    border-color: var(--gold);
    background: color-mix(in srgb, var(--gold) 16%, var(--surface));
    box-shadow: 0 0 0 5px color-mix(in srgb, var(--gold) 22%, transparent), 0 0 28px color-mix(in srgb, var(--gold) 45%, transparent);
  }
  60% { transform: scale(0.98); }
}
.pts-burst {
  position: fixed;
  z-index: 1001;
  width: 0;
  height: 0;
  pointer-events: none;
}
.pts-burst i {
  position: absolute;
  border-radius: 50%;
}
.pb-ring {
  width: 40px;
  height: 40px;
  margin: -20px 0 0 -20px;
  border: 2px solid var(--gold);
  animation: pb-ring 0.6s var(--ease-out) forwards;
}
@keyframes pb-ring {
  from { transform: scale(0.3); opacity: 0.9; }
  to { transform: scale(1.8); opacity: 0; border-width: 0.5px; }
}
.pb-spark {
  width: 5px;
  height: 5px;
  margin: -2.5px 0 0 -2.5px;
  background: #ffe45c;
  box-shadow: 0 0 6px var(--gold);
  animation: pb-spark 0.7s var(--ease-out) forwards;
}
@keyframes pb-spark {
  from { transform: translate(0, 0) scale(1); opacity: 1; }
  to { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
}
.pts-gain {
  position: fixed;
  z-index: 1001;
  transform: translateX(-50%);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px 3px 6px;
  border-radius: 999px;
  background: linear-gradient(180deg, #ffe45c, var(--gold));
  color: #1a1400;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  box-shadow: 0 6px 18px -6px rgba(255, 200, 0, 0.6);
  pointer-events: none;
  animation: pts-gain 1.4s var(--ease-out) forwards;
}
.pts-gain .i {
  width: 13px;
  height: 13px;
}
@keyframes pts-gain {
  0% { opacity: 0; transform: translate(-50%, -8px) scale(0.6); }
  18% { opacity: 1; transform: translate(-50%, 0) scale(1.08); }
  30% { transform: translate(-50%, 0) scale(1); }
  75% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, 8px); }
}

/* The reward toast: brand coin, the amount in gold, the streak line and the week's pips. */
#toast.reward {
  padding: 0;
  border-radius: 18px;
  background: var(--surface);
  color: var(--text);
  border: 1px solid color-mix(in srgb, var(--gold) 28%, var(--line-strong));
  box-shadow: var(--shadow-lg), 0 0 0 1px rgba(0, 0, 0, 0.2), 0 10px 40px -12px color-mix(in srgb, var(--gold) 30%, transparent);
  text-align: left;
  font-weight: 500;
  overflow: hidden;
  transform: translate(-50%, 24px) scale(0.92);
  transition: opacity 200ms, transform 200ms;
}
#toast.reward.show {
  transform: translate(-50%, 0) scale(1);
  transition: opacity 260ms, transform 520ms cubic-bezier(0.34, 1.56, 0.64, 1);
}
#toast.reward::before {
  /* A soft gold glow behind the coin, and a sheen that crosses once. */
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(120px 80px at 34px 50%, color-mix(in srgb, var(--gold) 16%, transparent), transparent 70%),
    linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, 0.07) 50%, transparent 65%) no-repeat;
  background-size: 100% 100%, 250% 100%;
  background-position: 0 0, 150% 0;
  pointer-events: none;
}
#toast.reward.show::before {
  animation: rt-sheen 1.1s 0.25s var(--ease-out) both;
}
@keyframes rt-sheen {
  to { background-position: 0 0, -60% 0; }
}
.rt {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px 10px 10px;
}
.rt-coin {
  flex: none;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  color: var(--warn);
  background: color-mix(in srgb, var(--gold) 14%, var(--surface-2));
  border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent);
  box-shadow: 0 0 18px -4px color-mix(in srgb, var(--gold) 55%, transparent);
}
.rt-coin .i {
  width: 24px;
  height: 24px;
}
#toast.reward.show .rt-coin {
  animation: rt-coin 0.7s 0.1s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
@keyframes rt-coin {
  from { transform: scale(0.4) rotate(-40deg); }
}
.rt-body {
  display: grid;
  gap: 2px;
  min-width: 0;
}
.rt-amt {
  font-family: var(--mono);
  font-size: 20px;
  font-weight: 650;
  line-height: 1.1;
  letter-spacing: -0.02em;
  color: var(--warn);
  font-variant-numeric: tabular-nums;
}
.rt-amt small {
  margin-left: 6px;
  font-family: var(--body);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0;
  color: var(--text);
}
.rt-sub,
.rt-note {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  color: var(--muted);
  white-space: nowrap;
}
.rt-sub .i {
  width: 14px;
  height: 14px;
  color: #ff8a3d;
}
.rt-sub b {
  color: var(--text);
  font-weight: 600;
}
.rt-dot {
  opacity: 0.5;
  margin: 0 2px;
}
.rt-note {
  font-size: 12px;
}
.rt-week {
  display: flex;
  gap: 3px;
  margin-left: 4px;
  align-self: center;
}
.rt-week i {
  width: 6px;
  height: 18px;
  border-radius: 3px;
  background: var(--line-strong);
}
.rt-week i.on {
  background: var(--gold);
}
#toast.reward.show .rt-week i.now {
  animation: rt-pip 0.6s 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  box-shadow: 0 0 8px var(--gold);
}
@keyframes rt-pip {
  from { transform: scaleY(0.2); background: var(--line-strong); box-shadow: none; }
}
@media (max-width: 380px) {
  .rt-week {
    display: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  #toast.reward,
  #toast.reward.show {
    transform: translate(-50%, 0);
    transition: opacity 160ms;
  }
  #toast.reward.show::before,
  #toast.reward.show .rt-coin,
  #toast.reward.show .rt-week i.now,
  .pts-hit,
  .pts-tick {
    animation: none;
  }
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* Page changes: the fade and rise is run from app.js (enterView) with the Web Animations API. */

/* Touch and scrolling feel. */
html {
  -webkit-tap-highlight-color: transparent;
}
button,
a,
.rung,
.fo-row,
.chip {
  touch-action: manipulation;
}
@media (prefers-reduced-motion: no-preference) {
  html {
    scroll-behavior: smooth;
  }
}
@media (prefers-reduced-motion: reduce) {
  .tn-coins i,
  .dot-live::after,
  .pts-hit,
  .pts-gain {
    animation: none;
  }
}

@media (max-width: 1100px) {
  .testnet-card {
    grid-template-columns: auto minmax(0, 1fr);
    grid-template-areas:
      'coins copy'
      'steps steps'
      'actions actions';
  }
  .tn-steps {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
@media (max-width: 640px) {
  .testnet-card {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: 'copy' 'steps' 'actions';
    padding: 20px 18px 22px;
    border-radius: 16px;
  }
  .tn-coins {
    display: none;
  }
  .tn-steps {
    grid-template-columns: minmax(0, 1fr);
  }
  .tn-actions .btn {
    flex: 1 1 auto;
    justify-content: center;
  }
}
.testnet-card:has(.tn-close) {
  padding-right: 56px;
}
@media (max-width: 640px) {
  .testnet-card:has(.tn-close) {
    padding-right: 18px;
  }
  .testnet-card:has(.tn-close) .tn-copy {
    padding-right: 32px;
  }
}

/* Admin: start price with the "upcoming token" option underneath. */
.price-field {
  display: grid;
  gap: 8px;
  align-content: start;
}
.price-field .upcoming-check {
  font-size: var(--fs-sm);
}
.price-field small {
  font-size: var(--fs-meta);
  line-height: 1.5;
}
.price-field input:disabled {
  opacity: 0.6;
}
.price-field {
  grid-column: 1 / -1;
  grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
  align-items: end;
  column-gap: 14px;
}
.upcoming-opt {
  display: grid;
  gap: 6px;
  padding-bottom: 4px;
}
.upcoming-opt .upcoming-check {
  justify-self: start;
}
@media (max-width: 640px) {
  .price-field {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* ===== Upcoming tokens: not trading yet ===== */
.st-soon {
  color: var(--gold);
}
.card-upcoming {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: color-mix(in srgb, var(--gold) 55%, var(--text));
  background: color-mix(in srgb, var(--gold) 14%, transparent);
}
.card-upcoming .i,
.pill-soon .i {
  width: 12px;
  height: 12px;
}
.pill-soon {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: color-mix(in srgb, var(--gold) 55%, var(--text));
  background: color-mix(in srgb, var(--gold) 14%, transparent);
}
.card-soon {
  display: flex;
  align-items: flex-start;
  gap: 8px;

}
.card-soon .i {
  flex: none;
  width: 14px;

.m-upcoming {

.m-upcoming b {
  font-weight: 500;
}
.m-upcoming p {
  margin: 4px 0 0;
  font-size: var(--fs-sm);

.st-soon {
  color: color-mix(in srgb, var(--gold) 55%, var(--text));

.st-soon i {

/* Wallet choices with each wallet's own logo. */

.price-check {

.price-check > .muted {

.pc-prices {

.utc-hint {
