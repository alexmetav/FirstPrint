<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Firstprint: predict new exchange listings</title>
    <meta name="description" content="Predict where newly listed crypto tokens trade 72 hours after they list on a centralized exchange." />
    <meta name="theme-color" content="#0d1421" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet" />
    <style>
/* Firstprint website styles
   Palette: ink navy surfaces; a five-step outcome scale from Crash (red) to Moon (gold).
   Type: Bricolage Grotesque for display and numbers, system UI for reading text. */

:root {
  --bg: #0d1421;
  --surface: #141d2e;
  --raised: #1b2740;
  --line: #25324a;
  --text: #e7edf7;
  --muted: #8995ab;
  --focus: #9ec5ff;

  --crash: #ff4d6a;
  --down: #ff8a5c;
  --flat: #9faac0;
  --up: #3fd69a;
  --moon: #ffc53d;

  --display: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
  --body: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --page: 1180px;

  color-scheme: dark;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f6fa;
    --surface: #ffffff;
    --raised: #eef2f8;
    --line: #dce2ec;
    --text: #0f1b2d;
    --muted: #58657a;
    --focus: #2f6fd6;
    --crash: #d92d4b;
    --down: #d9612e;
    --flat: #6e7a90;
    --up: #0e9f63;
    --moon: #b7860b;
    color-scheme: light;
  }
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 var(--body);
  font-variant-numeric: tabular-nums;
}

a {
  color: inherit;
}

button,
input,
select {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.skip {
  position: absolute;
  left: -999px;
  top: 8px;
  padding: 8px 12px;
  background: var(--surface);
  border-radius: var(--r-sm);
  z-index: 100;
}
.skip:focus {
  left: 8px;
}

h1,
h2,
h3 {
  font-family: var(--display);
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.01em;
}

.muted {
  color: var(--muted);
}

/* Outcome name, colored by its bucket */
.oc {
  color: var(--c);
  font-family: var(--display);
  font-weight: 700;
}

.loading {
  padding: 64px 0;
  text-align: center;
  color: var(--muted);
}

/* ---------------------------------------------------------------- Top bar */

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}

.topbar-inner {
  max-width: var(--page);
  margin: 0 auto;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 28px;
}

.wordmark {
  display: inline-flex;
  align-items: center;
  font-family: var(--display);
  font-weight: 800;
  font-size: 23px;
  line-height: 1;
  letter-spacing: -0.03em;
  text-decoration: none;
  white-space: nowrap;
}
/* The mark is the outcome ladder in miniature: Moon on top, Crash at the bottom. */
.wordmark .mark {
  display: inline-grid;
  gap: 2px;
  width: 16px;
  margin-right: 8px;
}
.wordmark .mark i {
  display: block;
  height: 3px;
  border-radius: 2px;
}
.wordmark .mark i:nth-child(1) { background: var(--moon); width: 100%; }
.wordmark .mark i:nth-child(2) { background: var(--up); width: 80%; }
.wordmark .mark i:nth-child(3) { background: var(--flat); width: 60%; }
.wordmark .mark i:nth-child(4) { background: var(--down); width: 80%; }
.wordmark .mark i:nth-child(5) { background: var(--crash); width: 100%; }

.wallet-chip {
  font-size: 14px;
  padding: 5px 12px;
  border-radius: 999px;
  background: var(--raised);
  text-decoration: none;
  white-space: nowrap;
}

.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--up);
}
.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--up);
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse {
  50% { opacity: 0.35; }
}

.wallet-options {
  display: grid;
  gap: 8px;
  margin-top: 16px;
}
.wallet-option {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--raised);
  text-align: left;
  font-weight: 600;
}
.wallet-option:hover:not(:disabled) {
  border-color: var(--focus);
}
.wallet-option img {
  border-radius: 6px;
}
.wallet-option .muted {
  font-size: 13px;
  font-weight: 400;
}
.wallet-fallback {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: grid;
  place-items: center;
  background: var(--line);
  font-family: var(--display);
}
.no-wallet {
  margin-top: 16px;
  padding: 14px;
  border: 1px dashed var(--line);
  border-radius: var(--r-md);
}
.no-wallet p {
  margin: 0 0 10px;
}
.wallet-links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.wallet-list {
  list-style: none;
  padding: 0;
  margin: 0 0 12px;
}
.wallet-list li {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.wallet-list .addr {
  font-family: var(--display);
  font-weight: 700;
}

.radar td {
  vertical-align: top;
}
.radar-sym {
  display: block;
  font-family: var(--display);
  font-weight: 800;
  font-size: 18px;
}
.radar-title {
  display: block;
  font-size: 13px;
  color: var(--muted);
  max-width: 46ch;
}
.table td a.radar-title {
  font-family: var(--body);
  font-weight: 400;
}
a.radar-title:hover {
  color: var(--text);
}

.nav {
  display: flex;
  gap: 4px;
}
.nav a {
  text-decoration: none;
  color: var(--muted);
  padding: 6px 10px;
  border-radius: var(--r-sm);
}
.nav a:hover {
  color: var(--text);
}
.nav a[aria-current='page'] {
  color: var(--text);
  background: var(--raised);
}

.account {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.points {
  font-family: var(--display);
  font-weight: 700;
  font-size: 15px;
  padding: 5px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  text-decoration: none;
  white-space: nowrap;
}

.btn {
  display: inline-block;
  text-decoration: none;
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 999px;
  padding: 7px 14px;
  font-weight: 600;
  white-space: nowrap;
}
.btn:hover {
  background: var(--raised);
}
.btn-solid {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}
.btn-solid:hover {
  background: color-mix(in srgb, var(--text) 85%, var(--bg));
}
.btn:disabled {
  opacity: 0.5;
  cursor: default;
}

/* --------------------------------------------------------------- Demo bar */

.demo-bar {
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--moon) 9%, var(--bg));
}
.demo-bar-inner {
  max-width: var(--page);
  margin: 0 auto;
  padding: 8px 20px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 14px;
  font-size: 14px;
}
.demo-bar p {
  margin: 0;
  flex: 1 1 280px;
}
.demo-bar .btn {
  padding: 4px 12px;
  font-size: 13px;
}

/* -------------------------------------------------------------- Page frame */

main {
  max-width: var(--page);
  margin: 0 auto;
  padding: 28px 20px 96px;
  min-height: 70vh;
}
main:focus {
  outline: none;
}

.footer {
  max-width: var(--page);
  margin: 0 auto;
  padding: 24px 20px 40px;
  color: var(--muted);
  font-size: 13px;
  border-top: 1px solid var(--line);
}
.footer p {
  margin: 0;
}

.page-title {
  font-size: clamp(28px, 4vw, 40px);
  letter-spacing: -0.025em;
}
.page-lede {
  color: var(--muted);
  margin: 6px 0 24px;
  max-width: 62ch;
}

/* ---------------------------------------------------------- Featured market */

.featured {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
  gap: 32px;
  align-items: center;
  padding: 28px 0 36px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 24px;
}

.featured h1 {
  font-size: clamp(34px, 5.4vw, 64px);
  line-height: 0.98;
  letter-spacing: -0.035em;
  font-weight: 800;
  font-stretch: 88%;
}
.featured h1 .countdown {
  display: block;
  color: var(--moon);
}
.featured .lede {
  color: var(--muted);
  margin: 14px 0 20px;
  max-width: 46ch;
}
.featured .actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.mini-ladder {
  display: grid;
  gap: 6px;
}
.mini-rung {
  position: relative;
  display: grid;
  grid-template-columns: 64px 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: var(--r-sm);
  background: var(--surface);
  overflow: hidden;
  font-size: 14px;
}
.mini-rung::before {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  width: var(--share);
  background: color-mix(in srgb, var(--c) 22%, transparent);
}
.mini-rung > * {
  position: relative;
}
.mini-rung b {
  font-family: var(--display);
  color: var(--c);
}
.mini-rung .pct {
  font-family: var(--display);
  font-weight: 700;
}

/* ----------------------------------------------------------------- Toolbar */

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
}
.tabs button {
  border: 0;
  background: transparent;
  padding: 6px 14px;
  border-radius: 999px;
  color: var(--muted);
  font-weight: 600;
}
.tabs button[aria-selected='true'] {
  background: var(--raised);
  color: var(--text);
}
.tabs .count {
  font-weight: 500;
  margin-left: 4px;
  opacity: 0.8;
}

.select {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 14px;
}
.select select {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 6px 10px;
}

/* -------------------------------------------------------------- Market grid */

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}

.card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 16px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
  text-decoration: none;
  transition: border-color 120ms;
}
.card:hover {
  border-color: color-mix(in srgb, var(--text) 30%, var(--line));
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.sym {
  font-family: var(--display);
  font-weight: 800;
  font-size: 26px;
  letter-spacing: -0.02em;
  line-height: 1;
}
.exch {
  font-size: 13px;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 1px 8px;
}
.card-name {
  color: var(--muted);
  font-size: 14px;
  margin-top: -6px;
}

.strip {
  display: flex;
  height: 8px;
  border-radius: 999px;
  overflow: hidden;
  gap: 2px;
  background: var(--raised);
}
.strip span {
  background: var(--c);
  min-width: 3px;
}
.strip.empty span {
  opacity: 0.25;
}

.card-lead {
  font-size: 14px;
  min-height: 21px;
}
.card-lead b {
  color: var(--c);
  font-family: var(--display);
}

.card-foot {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 13px;
  color: var(--muted);
  border-top: 1px solid var(--line);
  padding-top: 10px;
  margin-top: auto;
}
.card-foot .when {
  color: var(--text);
}

.empty {
  padding: 48px 20px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed var(--line);
  border-radius: var(--r-md);
}
.empty .btn {
  margin-top: 12px;
}

/* ------------------------------------------------------------- Market page */

.market-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 32px;
  align-items: start;
}

.back {
  display: inline-block;
  color: var(--muted);
  text-decoration: none;
  font-size: 14px;
  margin-bottom: 14px;
}
.back:hover {
  color: var(--text);
}

.m-head {
  margin-bottom: 20px;
}
.m-title {
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
}
.m-title .sym {
  font-size: clamp(40px, 6vw, 60px);
  letter-spacing: -0.035em;
  font-stretch: 90%;
}
.m-question {
  font-size: 18px;
  margin: 8px 0 6px;
  max-width: 60ch;
}
.m-status {
  color: var(--muted);
  margin: 0;
}
.m-status strong {
  color: var(--text);
  font-weight: 600;
}

.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 28px;
  margin: 18px 0 22px;
  padding: 0;
}
.stats div {
  display: flex;
  flex-direction: column;
}
.stats dt {
  font-size: 13px;
  color: var(--muted);
}
.stats dd {
  margin: 0;
  font-family: var(--display);
  font-weight: 700;
  font-size: 20px;
}

.chart {
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
  padding: 14px 14px 10px;
  margin-bottom: 22px;
}
.chart-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 14px;
  margin-bottom: 8px;
}
.chart-head .now {
  font-family: var(--display);
  font-weight: 700;
  font-size: 18px;
}
.chart svg {
  display: block;
  width: 100%;
  height: 180px;
}
.chart-empty {
  height: 120px;
  display: grid;
  place-items: center;
  color: var(--muted);
  text-align: center;
  padding: 0 20px;
}

/* The outcome ladder: Moon at the top, Crash at the bottom. */

.ladder {
  display: grid;
  gap: 8px;
  margin-bottom: 28px;
}
.ladder-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 72px 72px 96px;
  gap: 12px;
  padding: 0 16px;
  font-size: 13px;
  color: var(--muted);
}
.ladder-head span:not(:first-child) {
  text-align: right;
}

.rung {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 72px 72px 96px;
  gap: 12px;
  align-items: center;
  width: 100%;
  text-align: left;
  padding: 14px 16px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--surface);
  overflow: hidden;
}
.rung::before {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  width: var(--share);
  background: color-mix(in srgb, var(--c) 16%, transparent);
  transition: width 400ms ease;
}
.rung > * {
  position: relative;
}
.rung:not(:disabled):hover {
  border-color: var(--c);
}
.rung:disabled {
  cursor: default;
}
.rung[aria-pressed='true'] {
  border-color: var(--c);
  box-shadow: inset 3px 0 0 var(--c);
}

.rung-name {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.rung-name b {
  font-family: var(--display);
  font-size: 19px;
  color: var(--c);
  line-height: 1.2;
}
.rung-name small {
  color: var(--muted);
  font-size: 13px;
}
.rung .num {
  text-align: right;
  font-family: var(--display);
  font-weight: 700;
  font-size: 16px;
}
.rung .num small {
  display: block;
  font-family: var(--body);
  font-weight: 400;
  font-size: 12px;
  color: var(--muted);
}

.tag {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  padding: 1px 8px;
  border-radius: 999px;
  margin-left: 8px;
  vertical-align: 2px;
  font-family: var(--body);
}
.tag-you {
  background: var(--text);
  color: var(--bg);
}
.tag-now {
  background: var(--c);
  color: var(--bg);
}

.ladder.settled .rung:not(.won) {
  opacity: 0.5;
}
.rung.won {
  border-color: var(--c);
  border-width: 2px;
  padding: 13px 15px;
}

/* Sections under the ladder */

.section {
  border-top: 1px solid var(--line);
  padding: 18px 0;
}
.section h2 {
  font-size: 20px;
  margin-bottom: 10px;
}
.section p {
  margin: 0 0 10px;
  max-width: 68ch;
}

.facts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px 24px;
  margin: 0;
}
.facts dt {
  font-size: 13px;
  color: var(--muted);
}
.facts dd {
  margin: 0;
  font-weight: 600;
}

.rules {
  margin: 0;
  padding-left: 20px;
  max-width: 68ch;
}
.rules li {
  margin-bottom: 8px;
}

.activity {
  list-style: none;
  margin: 0;
  padding: 0;
}
.activity li {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.activity b {
  color: var(--c);
  font-family: var(--display);
}

/* ------------------------------------------------------------- Trade panel */

.trade {
  position: sticky;
  top: 76px;
}

.trade-card {
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--surface);
  padding: 18px;
}
.trade-card h2 {
  font-size: 20px;
  margin-bottom: 12px;
}

.picker {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-bottom: 16px;
}
.picker button {
  border: 1px solid var(--line);
  background: var(--raised);
  border-radius: var(--r-sm);
  padding: 8px 2px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.picker button b {
  font-family: var(--display);
  font-size: 14px;
  color: var(--c);
}
.picker button small {
  font-size: 12px;
  color: var(--muted);
}
.picker button[aria-checked='true'] {
  background: var(--c);
  border-color: var(--c);
}
.picker button[aria-checked='true'] b,
.picker button[aria-checked='true'] small {
  color: var(--bg);
}

.field-label {
  display: block;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 6px;
}

.stake-input {
  display: flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--bg);
  padding: 0 14px;
}
.stake-input:focus-within {
  border-color: var(--focus);
}
.stake-input input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: transparent;
  font-family: var(--display);
  font-weight: 700;
  font-size: 26px;
  padding: 8px 0;
  outline: none;
}
.stake-input span {
  color: var(--muted);
}

.chips {

// Generated by scripts/build-web.ts from src/engine/engine.ts. Do not edit.
/**
 * Firstprint market engine.
 *
 * Pure, dependency-free logic shared by the server and the Mini App:
 * outcome buckets, TWAP price oracle, pool caps, early-bird weights,
 * payouts, and settlement with void rules.
 *
 * Amounts are integers in minor units (points, or USDT micro-units later).
 * Times are Unix milliseconds.

// ---------------------------------------------------------------------------
// Types
// ---------------------------------------------------------------------------

/** Ordered from worst to best outcome. */
const BUCKETS                    = ['crash', 'down', 'flat', 'up', 'moon'];

const DEFAULT_THRESHOLDS             = { crash: -0.5, down: -0.1, up: 0.1, moon: 0.5 };

const MINUTE = 60_000;
const HOUR = 60 * MINUTE;

const DEFAULT_CONFIG               = {
  thresholds: DEFAULT_THRESHOLDS,
  earlyBirdK: 0.5,
  feeBps: 400,
  softCap: 50_000,
  volumeCapRatio: null,
  perUserCapPct: 0.1,
  baselineMs: HOUR,
  durationMs: 72 * HOUR,
  settleWindowMs: HOUR,
  minCoverage: 0.5,
  minTrades: 10,
  maxListingDelayMs: 24 * HOUR,
  maxHaltMs: 6 * HOUR,
};

// ---------------------------------------------------------------------------
// Buckets
// ---------------------------------------------------------------------------

/** Rounds away float noise so exactly -10% lands in "down", not "flat". */
function clean(r        )         {
  return Math.round(r * 1e9) / 1e9;
}

function returnPct(base        , final        )         {
  if (!(base > 0) || !(final >= 0)) throw new Error('Prices must be positive');
  return clean(final / base - 1);
}

function bucketForReturn(r        , t             = DEFAULT_THRESHOLDS)         {
  const x = clean(r);
  if (x <= t.crash) return 'crash';
  if (x <= t.down) return 'down';
  if (x < t.up) return 'flat';
  if (x < t.moon) return 'up';
  return 'moon';
}

function bucketRangeLabel(b        , t             = DEFAULT_THRESHOLDS)         {
  const p = (n        ) => `${n > 0 ? '+' : ''}${Math.round(n * 100)}%`;
  switch (b) {
    case 'crash': return `${p(t.crash)} or worse`;
    case 'down': return `${p(t.crash)} to ${p(t.down)}`;
    case 'flat': return `${p(t.down)} to ${p(t.up)}`;
    case 'up': return `${p(t.up)} to ${p(t.moon)}`;
    case 'moon': return `${p(t.moon)} or better`;
  }
}

// ---------------------------------------------------------------------------
// Price oracle
// ---------------------------------------------------------------------------

/**
 * Time-weighted average of 1-minute closes over [start, end).
 * Missing minutes carry the last known price forward, including the last
 * candle before the window. Slots before any known price are skipped.
 */
function twap(candles                   , start        , end        )              {
  const sorted = [...candles].sort((a, b) => a.ts - b.ts);
  const slots = Math.max(0, Math.floor((end - start) / MINUTE));
  if (slots === 0) return { twap: null, coverage: 0, volume: 0, trades: null };

  const byMinute = new Map                ();
  let last                = null;
  for (const c of sorted) {
    if (c.ts < start) last = c.close;
    else if (c.ts < end) byMinute.set(Math.floor((c.ts - start) / MINUTE), c);
  }

  let sum = 0;
  let priced = 0;
  let real = 0;
  let volume = 0;
  let trades = 0;
  let hasTrades = false;

  for (let i = 0; i < slots; i++) {
    const c = byMinute.get(i);
    if (c) {
      last = c.close;
      real++;
      volume += c.volume;
      if (c.trades !== undefined) {
        trades += c.trades;
        hasTrades = true;
      }
    }
    if (last !== null) {
      sum += last;
      priced++;
    }
  }

  return {
    twap: priced > 0 ? sum / priced : null,
    coverage: real / slots,
    volume,
    trades: hasTrades ? trades : null,
  };
}

/**
 * Volume-weighted median across venues. A single venue with little volume
 * can't drag the result far. Falls back to a plain median without volume.
 */
function venueMedian(venues                       )                {
  const valid = venues.filter((v)                                      => v.price !== null && v.price > 0);
  if (valid.length === 0) return null;
  const sorted = [...valid].sort((a, b) => a.price - b.price);
  const total = sorted.reduce((s, v) => s + Math.max(0, v.volume), 0);

  if (total <= 0) {
    const mid = Math.floor(sorted.length / 2);
    return sorted.length % 2 ? sorted[mid].price : (sorted[mid - 1].price + sorted[mid].price) / 2;
  }

  let cum = 0;
  for (const v of sorted) {
    cum += Math.max(0, v.volume);
    if (cum >= total / 2) return v.price;
  }
  return sorted[sorted.length - 1].price;
}

// ---------------------------------------------------------------------------
// Pool
// ---------------------------------------------------------------------------

function weightFor(placedAt        , tOpen        , tClose        , k        )         {
  if (tClose <= tOpen) return 1;
  const f = (tClose - placedAt) / (tClose - tOpen);
  return 1 + k * Math.min(1, Math.max(0, f));
}

function hardCapFor(cfg              , baselineVolume        )         {
  if (cfg.volumeCapRatio === null) return cfg.softCap;
  return Math.max(0, Math.min(cfg.softCap, Math.floor(cfg.volumeCapRatio * baselineVolume)));
}

/**
 * Applies the pool hard cap and per-user cap in time order, so the latest
 * predictions are the ones refunded when a cap is hit.
 */
function applyCaps(
  predictions                       ,
  hardCap        ,
  cfg                                                    ,
  tOpen        ,
  tClose        ,
)                       {
  const userCap = Math.floor(hardCap * cfg.perUserCapPct);
  const used = new Map                ();
  let poolLeft = hardCap;

  const ordered = [...predictions].sort((a, b) => a.placedAt - b.placedAt || a.id.localeCompare(b.id));
  return ordered.map((p) => {
    const userLeft = userCap - (used.get(p.userId) ?? 0);
    const accepted = Math.max(0, Math.min(p.stake, userLeft, poolLeft));
    used.set(p.userId, (used.get(p.userId) ?? 0) + accepted);
    poolLeft -= accepted;
    return {
      ...p,
      accepted,
      refund: p.stake - accepted,
      weight: weightFor(p.placedAt, tOpen, tClose, cfg.earlyBirdK),
    };
  });
}

function emptyTotals()             {
  return { crash: 0, down: 0, flat: 0, up: 0, moon: 0 };
}

function poolTotals(predictions                                              )             {
  const t = emptyTotals();
  for (const p of predictions) t[p.bucket] += p.stake;
  return t;
}

/** Estimated payout for a new prediction, assuming the pool doesn't change. */
function quote(
  existing                       ,
  bucket        ,
  stake        ,
  placedAt        ,
  cfg                                             ,
  tOpen        ,
  tClose        ,
)        {
  const weight = weightFor(placedAt, tOpen, tClose, cfg.earlyBirdK);
  if (stake <= 0) return { weight, payout: 0, multiple: 0 };
  const pool = existing.reduce((s, p) => s + p.stake, 0) + stake;
  const net = pool - Math.floor((pool * cfg.feeBps) / 10_000);
  const winnersWeighted =
    existing
      .filter((p) => p.bucket === bucket)
      .reduce((s, p) => s + p.stake * weightFor(p.placedAt, tOpen, tClose, cfg.earlyBirdK), 0) +
    stake * weight;
  const payout = Math.floor((net * stake * weight) / winnersWeighted);
  return { weight, payout, multiple: payout / stake };
}

function refundAll(accepted                               , reason            )             {
  return {
    pool: accepted.reduce((s, p) => s + p.accepted, 0),
    fee: 0,
    netPool: 0,
    dust: 0,
    voidReason: reason,
    payouts: accepted.map((p) => ({
      predictionId: p.id,
      userId: p.userId,
      bucket: p.bucket,
      accepted: p.accepted,
      refund: p.refund + p.accepted,
      payout: 0,
      weight: p.weight,
    })),
  };
}

function computePayouts(
  accepted                               ,
  winning        ,
  cfg                              ,
)             {
  const live = accepted.filter((p) => p.accepted > 0);
  const pool = live.reduce((s, p) => s + p.accepted, 0);
  if (pool === 0) return refundAll(accepted, 'empty_pool');

  const bucketsUsed = new Set(live.map((p) => p.bucket));
  if (bucketsUsed.size < 2) return refundAll(accepted, 'one_sided_pool');

  const winners = live.filter((p) => p.bucket === winning);
  if (winners.length === 0) return refundAll(accepted, 'no_winners');

  const fee = Math.floor((pool * cfg.feeBps) / 10_000);
  const netPool = pool - fee;
  const totalWeighted = winners.reduce((s, p) => s + p.accepted * p.weight, 0);

  let paid = 0;
  const payouts           = accepted.map((p) => {
    const won = p.accepted > 0 && p.bucket === winning;
    const payout = won ? Math.floor((netPool * p.accepted * p.weight) / totalWeighted) : 0;
    paid += payout;
    return {
      predictionId: p.id,
      userId: p.userId,
      bucket: p.bucket,
      accepted: p.accepted,
      refund: p.refund,
      payout,
      weight: p.weight,
    };
  });

  return { pool, fee, netPool, dust: netPool - paid, payouts, voidReason: null };
}

// ---------------------------------------------------------------------------
// Settlement
// ---------------------------------------------------------------------------

function windows(cfg              , listingAt        ) {
  const settleAt = listingAt + cfg.durationMs;
  return {
    baseline: { start: listingAt, end: listingAt + cfg.baselineMs },
    final: { start: settleAt - cfg.settleWindowMs, end: settleAt },
    closeAt: listingAt + cfg.baselineMs,
    settleAt,
  };
}

function windowOk(stats               , cfg              )          {
  const good = stats.filter((s) => s.twap !== null && s.coverage >= cfg.minCoverage);
  if (good.length === 0) return false;
  const reported = good.filter((s) => s.trades !== null);
  if (reported.length === 0) return true;
  return reported.reduce((n, s) => n + (s.trades ?? 0), 0) >= cfg.minTrades;
}

function settleMarket(input                 )                   {
  const { cfg } = input;
  const w = windows(cfg, input.listingAt);
  const venues = Object.keys(input.candles);

  const baseStats                = venues.map((v) => ({ venue: v, ...twap(input.candles[v], w.baseline.start, w.baseline.end) }));
  const finalStats                = venues.map((v) => ({ venue: v, ...twap(input.candles[v], w.final.start, w.final.end) }));

  const pick = (stats               ) =>
    venueMedian(stats.filter((s) => s.coverage >= cfg.minCoverage).map((s) => ({ venue: s.venue, price: s.twap, volume: s.volume })));

  const basePrice = pick(baseStats);
  const finalPrice = pick(finalStats);

  const shell = {
    baseline: { ...w.baseline, price: basePrice, venues: baseStats },
    final: { ...w.final, price: finalPrice, venues: finalStats },
  };

  const voided = (reason            )                   => ({
    ...refundAll(input.accepted, reason),
    ...shell,
    returnPct: null,
    winningBucket: null,
  });

  if (input.retracted) return voided('retracted');
  if (input.listingAt - input.announcedListingAt > cfg.maxListingDelayMs) return voided('listing_delayed');
  if (input.haltedMs > cfg.maxHaltMs) return voided('trading_halted');
  if (basePrice === null || !windowOk(baseStats, cfg)) return voided('insufficient_baseline_data');
  if (finalPrice === null || !windowOk(finalStats, cfg)) return voided('insufficient_settlement_data');

  const r = returnPct(basePrice, finalPrice);
  const winning = bucketForReturn(r, cfg.thresholds);
  const pool = computePayouts(input.accepted, winning, cfg);

  return {
    ...pool,
    ...shell,
    // The measured outcome stays visible even if the pool itself is refunded.
    returnPct: r,
    winningBucket: winning,
  };
}

// Solflare, Backpack, and others) with a fallback to legacy injected providers.

const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';

function b58encode(bytes) {
  let zeros = 0;
  while (zeros < bytes.length && bytes[zeros] === 0) zeros++;
  const digits = [];
  for (let i = zeros; i < bytes.length; i++) {
    let carry = bytes[i];
    for (let j = 0; j < digits.length; j++) {
      carry += digits[j] << 8;
      digits[j] = carry % 58;
      carry = (carry / 58) | 0;
    }
    while (carry) {
      digits.push(carry % 58);
      carry = (carry / 58) | 0;
    }
  }
  return '1'.repeat(zeros) + digits.reverse().map((d) => B58[d]).join('');
}

const standardWallets = new Map();
const walletListeners = new Set();

function isSolanaStandard(w) {
  return Boolean(
    w?.features?.['standard:connect'] &&
      w?.features?.['solana:signMessage'] &&
      (w.chains ?? []).some((c) => String(c).startsWith('solana:')),
  );
}

(function discover() {
  const api = {
    register(...wallets) {
      for (const w of wallets) if (isSolanaStandard(w)) standardWallets.set(w.name, w);
      walletListeners.forEach((fn) => fn());
      return () => wallets.forEach((w) => standardWallets.delete(w.name));
    },
  };
  window.addEventListener('wallet-standard:register-wallet', (e) => {
    try {
      e.detail(api);
    } catch {
      /* ignore misbehaving wallets */
    }
  });
  try {
    window.dispatchEvent(new CustomEvent('wallet-standard:app-ready', { detail: api }));
  } catch {
    /* old browsers */
  }
})();

function onWalletsChanged(fn) {
  walletListeners.add(fn);
  return () => walletListeners.delete(fn);
}

/** Wallets available in this browser. */
function listWallets() {
  const out = [...standardWallets.values()].map((w) => ({
    kind: 'standard',
    name: w.name,
    icon: typeof w.icon === 'string' && w.icon.startsWith('data:image/') ? w.icon : null,
    wallet: w,
  }));
  const legacy = [
    ['Phantom', window.phantom?.solana?.isPhantom ? window.phantom.solana : null],
    ['Solflare', window.solflare?.isSolflare ? window.solflare : null],
    ['Backpack', window.backpack?.isBackpack ? window.backpack : null],
  ];
  for (const [name, provider] of legacy) {
    if (provider && !out.some((w) => w.name.toLowerCase().includes(name.toLowerCase()))) {
      out.push({ kind: 'legacy', name, icon: null, provider });
    }
  }
  return out;
}

/**
 * Connects a wallet and signs the server's sign-in message.
 * getMessage(address) must return the exact text to sign.
 */
async function connectAndSign(entry, getMessage) {
  const encoder = new TextEncoder();
  if (entry.kind === 'standard') {
    const { accounts } = await entry.wallet.features['standard:connect'].connect();
    const account = accounts?.[0];
    if (!account) throw new Error('No account was shared by the wallet.');
    const message = await getMessage(account.address);
    const [signed] = await entry.wallet.features['solana:signMessage'].signMessage({ account, message: encoder.encode(message) });
    return { address: account.address, message, signature: b58encode(signed.signature), walletName: entry.name };
  }
  const provider = entry.provider;
  const res = await provider.connect();
  const address = (res?.publicKey ?? provider.publicKey).toString();
  const message = await getMessage(address);
  const signed = await provider.signMessage(encoder.encode(message), 'utf8');
  return { address, message, signature: b58encode(signed.signature ?? signed), walletName: entry.name };
}

async function disconnectWallets() {
  for (const w of standardWallets.values()) {
    try {
      await w.features['standard:disconnect']?.disconnect();
    } catch {
      /* ignore */
    }
  }
  for (const p of [window.phantom?.solana, window.solflare, window.backpack]) {
    try {
      await p?.disconnect?.();
    } catch {
      /* ignore */
    }
  }
}

  for (let i = 0; i < s.length; i++) {

  }
  return ((h >>> 0) % 1_000_000) / 1_000_000;
}

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new ApiError(400, 'bad_email', 'Enter a valid email address.');
      if (String(password ?? '').length < 8) throw new ApiError(400, 'bad_password', 'Password must be at least 8 characters.');
      if (this.accounts.has(email)) throw new ApiError(409, 'email_taken', 'An account with this email already exists. Log in instead.');
      if ([...this.users.values()].some((u) => u.username.toLowerCase() === username.toLowerCase())) {
        throw new ApiError(409, 'username_taken', 'That username is taken. Try another.');
      }
      const u = this.addUser(username, 1_000);
      this.accounts.set(email, { userId: u.id, password });
      this.sessionUserId = u.id;
      return { user: this.publicUser(u) };
    });
  }

  login({ email, password }) {
    return this.run(() => {
      const acc = this.accounts.get(String(email ?? '').trim().toLowerCase());
      if (!acc || acc.password !== password) throw new ApiError(401, 'bad_credentials', 'Email or password is incorrect.');
      this.sessionUserId = acc.userId;
      return { user: this.publicUser(this.users.get(acc.userId)) };
    });
  }

  logout() {
    return this.run(() => {
      this.sessionUserId = null;
      return { ok: true };
    });
  }

  claimDaily() {
    return this.run(() => {
      const u = this.me_();
      const today = new Date(this.now()).toISOString().slice(0, 10);
      if (u.lastClaimDay === today) throw new ApiError(409, 'already_claimed', 'Daily points already claimed. Come back tomorrow (UTC).');
      u.lastClaimDay = today;
      u.points += 100;
      return this.publicUser(u);
    });
  }

  markets(filter) {
    return this.run(() => {
      const pick = { open: ['open'], live: ['locked'], settled: ['resolved', 'void'], all: ['open', 'locked', 'resolved', 'void'] }[filter];
      const list = this.marketList.filter((m) => pick.includes(m.status));
      list.sort((a, b) => (filter === 'settled' ? b.listingAt - a.listingAt : a.listingAt - b.listingAt));
      return { markets: list.map((m) => this.view(m)), serverTime: this.now() };
    });
  }

  market(id) {
    return this.run(() => this.view(this.find(id)));
  }

  quote(id, bucket, stake) {
    return this.run(() => {
      const m = this.find(id);
      const { closeAt } = windows(m.cfg, m.listingAt);
      return quote(m.predictions, bucket, Math.max(0, Math.floor(stake) || 0), this.now(), m.cfg, m.openedAt, closeAt);
    });
  }

  predict(id, bucket, stake) {
    return this.run(() => {
      const u = this.me_();
      const m = this.find(id);
      const { closeAt } = windows(m.cfg, m.listingAt);
      if (!BUCKETS.includes(bucket)) throw new ApiError(400, 'bad_bucket', 'Choose Crash, Down, Flat, Up, or Moon.');
      if (!Number.isInteger(stake) || stake < 10) throw new ApiError(400, 'bad_stake', 'Stake must be a whole number of at least 10 points.');
      if (m.status !== 'open' || this.now() >= closeAt) throw new ApiError(409, 'market_closed', 'Predictions for this market are closed.');
      if (u.points < stake) throw new ApiError(400, 'insufficient_points', 'Not enough points for this prediction.');
      const userCap = Math.floor(m.cfg.softCap * m.cfg.perUserCapPct);
      const mine = m.predictions.filter((p) => p.userId === u.id).reduce((s, p) => s + p.stake, 0);
      if (mine + stake > userCap) throw new ApiError(409, 'user_cap', `You can stake up to ${userCap} points per market. You have ${userCap - mine} left.`);
      const p = this.addPrediction(m, u.id, bucket, stake, this.now());
      return { id: p.id, balance: u.points };
    });
  }

  chart(id) {
    return this.run(() => {
      const m = this.find(id);
      const { settleAt } = windows(m.cfg, m.listingAt);
      const end = Math.min(this.now(), settleAt);
      if (end <= m.listingAt) return { venue: null, series: [] };
      const span = end - m.listingAt;
      const step = Math.max(D3_MIN, Math.ceil(span / 120 / D3_MIN) * D3_MIN);
      const series = [];
      for (let ts = m.listingAt; ts < end; ts += step) series.push([ts, demoPrice(m, ts)]);
      return { venue: 'sim', series };
    });
  }

  activity(id) {
    return this.run(() => {
      const m = this.find(id);
      const activity = [...m.predictions]
        .sort((a, b) => b.placedAt - a.placedAt)
        .slice(0, 30)
        .map((p) => ({ username: this.users.get(p.userId).username, bucket: p.bucket, stake: p.stake, placedAt: p.placedAt }));
      return { activity };
    });
  }

  myPredictions() {
    return this.run(() => {
      const u = this.me_();
      const out = [];
      for (const m of this.marketList) {
        for (const p of m.predictions) {
          if (p.userId !== u.id) continue;
          out.push({ id: p.id, marketId: m.id, symbol: m.symbol, exchange: m.exchange, marketStatus: m.status, bucket: p.bucket, stake: p.stake, accepted: p.accepted, refund: p.refund, payout: p.payout, placedAt: p.placedAt });
        }
      }
      return { predictions: out.sort((a, b) => b.placedAt - a.placedAt) };
    });
  }

  leaderboard() {
    return this.run(() => {
      const rows = new Map();
      for (const m of this.marketList) {
        if (m.status !== 'resolved') continue;
        for (const p of m.predictions) {
          if (!p.accepted) continue;
          const r = rows.get(p.userId) ?? { userId: p.userId, name: this.users.get(p.userId).username, profit: 0, wins: 0, total: 0 };
          r.profit += (p.payout ?? 0) - p.accepted;
          r.wins += p.payout > 0 ? 1 : 0;
          r.total += 1;
          rows.set(p.userId, r);
        }
      }
      const ranked = [...rows.values()].sort((a, b) => b.profit - a.profit || b.wins - a.wins).map((r, i) => ({ ...r, rank: i + 1 }));
      const d = new Date(this.now());
      const start = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
      return {
        seasonStart: start,
        seasonEnd: start + 7 * 24 * D3_HOUR,
        entries: ranked.map(({ userId, ...r }) => ({ ...r, isMe: userId === this.sessionUserId })),
        me: ranked.find((r) => r.userId === this.sessionUserId) ?? null,
      };
    });
  }

  walletChallenge(address) {
    return this.run(() => {
      const nonce = b58encode(crypto.getRandomValues(new Uint8Array(12)));
      const message = [
        `${location.host || 'firstprint.demo'} wants you to sign in with your Solana account:`,
        address,
        '',
        'Sign in to Firstprint. This request will not trigger a transaction or cost any fees.',
        '',
        `URI: ${location.origin || 'https://firstprint.demo'}`,
        'Version: 1',
        'Chain ID: mainnet',
        `Nonce: ${nonce}`,
        `Issued At: ${new Date(this.now()).toISOString()}`,
      ].join('\n');
      this.challenges.set(address, message);
      return { message, nonce, expiresAt: this.now() + 5 * D3_MIN };
    });
  }

  // Demo mode accepts any signature; the real server verifies ed25519 signatures.
  walletVerify({ address, message, walletName }) {
    return this.run(() => {
      if (this.challenges.get(address) !== message) throw new ApiError(401, 'bad_signature', 'Wallet sign-in failed. Try connecting again.');
      this.challenges.delete(address);
      let created = false;
      let userId = this.walletOwners.get(address);
      if (!userId) {
        const u = this.addUser(`sol_${address.slice(0, 6)}`, 1_000);
        u.needsUsername = true;
        u.hasEmail = false;
        u.wallets.push({ address, walletName: walletName ?? null });
        this.walletOwners.set(address, u.id);
        userId = u.id;
        created = true;
      }
      this.sessionUserId = userId;
      return { user: this.publicUser(this.users.get(userId)), created };
    });
  }

  linkWallet({ address, message, walletName }) {
    return this.run(() => {
      const u = this.me_();
      if (this.challenges.get(address) !== message) throw new ApiError(401, 'bad_signature', 'Wallet sign-in failed. Try connecting again.');
      const owner = this.walletOwners.get(address);
      if (owner && owner !== u.id) throw new ApiError(409, 'wallet_taken', 'This wallet is already linked to another account.');
      if (!owner) {
        u.wallets.push({ address, walletName: walletName ?? null });
        this.walletOwners.set(address, u.id);
      }
      return { wallets: u.wallets };
    });
  }

  setUsername(username) {
    return this.run(() => {
      const u = this.me_();
      username = String(username ?? '').trim();
      if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) throw new ApiError(400, 'bad_username', 'Username must be 3–20 letters, numbers, or underscores.');
      if ([...this.users.values()].some((x) => x.id !== u.id && x.username.toLowerCase() === username.toLowerCase())) {
        throw new ApiError(409, 'username_taken', 'That username is taken. Try another.');
      }
      u.username = username;
      u.needsUsername = false;
      return this.publicUser(u);
    });
  }

  /** A random address and signature standing in for a real wallet in demo mode. */
  demoWallet() {
    return b58encode(crypto.getRandomValues(new Uint8Array(32)));
  }

  detectedListings() {
    return this.run(() => ({ listings: this.detected }));
  }

  /** Simulated live stream: price ticks for trading markets every 3 seconds. */
  subscribe(onEvent, onStatus = () => {}) {
    onStatus(true);
    const timer = setInterval(() => {
      this.advance();
      for (const m of this.marketList) {
        if (!(m.status === 'open' || m.status === 'locked') || this.now() < m.listingAt + D3_MIN) continue;
        const v = this.view(m);
        if (!v.live) continue;
        const wobble = 1 + (Math.random() - 0.5) * 0.01;
        const price = v.live.lastPrice * wobble;
        const r = v.live.basePrice ? returnPct(v.live.basePrice, price) : null;
        onEvent('price', {
          marketId: m.id,
          price,
          ts: this.now(),
          basePrice: v.live.basePrice,
          returnPct: r,
          projectedBucket: r === null ? null : bucketForReturn(r, m.cfg.thresholds),
        });
      }
    }, 3_000);
    return () => clearInterval(timer);
  }

  // --- Demo controls ----------------------------------------------------------------

  skip(ms) {
    this.offset += ms;
    this.advance();
  }
}

// Firstprint website. Vanilla ES modules, no build step.





const LADDER = ['moon', 'up', 'flat', 'down', 'crash'];
const NAMES = { crash: 'Crash', down: 'Down', flat: 'Flat', up: 'Up', moon: 'Moon' };
const VOID_REASONS = {
  listing_delayed: 'the listing was delayed by more than 24 hours',
  retracted: 'the exchange cancelled the listing',
  trading_halted: 'trading was halted for too long',
  insufficient_baseline_data: 'there was not enough trading right after listing',
  insufficient_settlement_data: 'there was not enough trading at the end',
  one_sided_pool: 'everyone picked the same outcome',
  no_winners: 'nobody picked the winning outcome',
  empty_pool: 'nobody made a prediction',
};

const S = {
  api: null,
  me: null,
  skew: 0,
  route: { name: 'home' },
  filter: 'open',
  exchange: 'all',
  lists: { open: [], live: [], settled: [] },
  market: null,
  chart: null,
  activity: [],
  trade: { bucket: null, stake: 100, quote: null, seq: 0, busy: false },
  tradeKey: '',
  sheetOpen: false,
  modal: null,
  modalBusy: false,
  refreshing: false,
  live: false,
};

// ------------------------------------------------------------------ Utilities

const $ = (sel, root = document) => root.querySelector(sel);
const now = () => Date.now() + S.skew;

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}
const fmtNum = (n) => Math.round(n ?? 0).toLocaleString('en-US');
const fmtPts = (n) => `${fmtNum(n)} pts`;

function fmtPct(r, digits = 1) {
  if (r === null || r === undefined) return '–';
  const v = Math.abs(r * 100).toFixed(digits);
  if (Number(v) === 0) return `0.${'0'.repeat(digits)}%`;
  return `${r > 0 ? '+' : '−'}${v}%`;
}

function fmtPrice(p) {
  if (!p) return '–';
  return `$${p >= 1 ? p.toFixed(3) : p.toPrecision(4)}`;
}

function fmtDur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${m}m`;
  if (m) return `${m}m ${String(sec).padStart(2, '0')}s`;
  return `${sec}s`;
}

function fmtSpan(ms) {
  const h = ms / 3_600_000;
  if (h >= 1) return `${Math.round(h)} hour${Math.round(h) === 1 ? '' : 's'}`;
  const m = Math.round(ms / 60_000);
  return `${m} minute${m === 1 ? '' : 's'}`;
}

function fmtDate(ts) {
  return new Date(ts).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

const until = (ts) => `<span data-until="${ts}">${fmtDur(ts - now())}</span>`;
const outcome = (b) => `<b class="oc" style="--c:var(--${b})">${NAMES[b]}</b>`;
const rangeLabel = (b, t) => bucketRangeLabel(b, t).replace(/-/g, '−');
const share = (m, b) => (m.pool ? m.totals[b] / m.pool : 0);

function estMultiple(m, b, stake = 100) {
  const net = (m.pool + stake) * (1 - m.feeBps / 10_000);
  return net / (m.totals[b] + stake);
}

function leader(m) {
  if (!m.pool) return null;
  return LADDER.reduce((best, b) => (m.totals[b] > m.totals[best] ? b : best), LADDER[0]);
}

let toastTimer;
function toast(msg, isError = false) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = `show${isError ? ' error' : ''}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.className = ''), 3200);
}

function syncClock(serverTime) {
  if (typeof serverTime === 'number') S.skew = serverTime - Date.now();
}

// ------------------------------------------------------------------ Data

async function refreshMe() {
  try {
    S.me = await S.api.me();
  } catch (err) {
    if (err instanceof ApiError && err.status === 401) S.me = null;
    else throw err;
  }
  renderTop();
}

async function loadHome() {
  const [open, live, settled] = await Promise.all(['open', 'live', 'settled'].map((f) => S.api.markets(f)));
  syncClock(open.serverTime);
  S.lists = { open: open.markets, live: live.markets, settled: settled.markets };
}

async function loadMarket(id) {
  const m = await S.api.market(id);
  syncClock(m.serverTime);
  const [chart, activity] = await Promise.all([
    m.phase === 'pre_listing' ? Promise.resolve(null) : S.api.chart(id),
    S.api.activity(id),
  ]);
  if (S.market?.id !== id) {
    S.trade = { bucket: null, stake: 100, quote: null, seq: 0, busy: false };
    S.tradeKey = '';
  }
  S.market = m;
  S.chart = chart;
  S.activity = activity.activity;
}

async function refresh() {
  if (S.refreshing || S.modal || S.route.name === 'admin') return;
  S.refreshing = true;
  try {
    if (S.me) await refreshMe();
    await loadRoute(false);
  } catch (err) {
    console.error(err);
  } finally {
    S.refreshing = false;
  }
}

// ------------------------------------------------------------------ Routing

function parseRoute() {
  const h = location.hash.replace(/^#/, '');
  const m = h.match(/^\/market\/([^/]+)$/);
  if (m) return { name: 'market', id: decodeURIComponent(m[1]) };
  if (h === '/leaderboard') return { name: 'leaderboard' };
  if (h === '/portfolio') return { name: 'portfolio' };
  if (h === '/radar') return { name: 'radar' };
  if (h === '/admin') return { name: 'admin' };
  return { name: 'home' };
}

async function onRoute() {
  const next = parseRoute();
  const changed = next.name !== S.route.name || next.id !== S.route.id;
  S.route = next;
  if (changed) {
    closeSheet();
    $('#view').innerHTML = '<p class="loading">Loading</p>';
    window.scrollTo(0, 0);
  }
  renderTop();
  await loadRoute(changed);
  if (changed) $('#view').focus({ preventScroll: true });
}

async function loadRoute() {
  const view = $('#view');
  try {
    if (S.route.name === 'home') {
      await loadHome();
      view.innerHTML = homeView();
    } else if (S.route.name === 'market') {
      await loadMarket(S.route.id);
      renderMarket();
    } else if (S.route.name === 'leaderboard') {
      const lb = await S.api.leaderboard();
      view.innerHTML = leaderboardView(lb);
    } else if (S.route.name === 'admin') {
      await renderAdmin();
    } else if (S.route.name === 'radar') {
      const { listings } = await S.api.detectedListings();
      view.innerHTML = radarView(listings);
    } else if (S.route.name === 'portfolio') {
      const preds = S.me ? (await S.api.myPredictions()).predictions : [];
      view.innerHTML = portfolioView(preds);
    }
    document.title = titleFor();
  } catch (err) {
    if (err instanceof ApiError && err.status === 404) {
      view.innerHTML = `<div class="empty"><p>This market doesn’t exist or was removed.</p><a class="btn" href="#/">Browse markets</a></div>`;
    } else {
      view.innerHTML = `<div class="empty"><p>${esc(err.message || 'Something went wrong.')}</p><button class="btn" data-action="retry">Try again</button></div>`;
    }
  }
}

function titleFor() {
  if (S.route.name === 'market' && S.market) return `${S.market.symbol} on ${S.market.exchange}: Firstprint`;
  if (S.route.name === 'leaderboard') return 'Leaderboard: Firstprint';
  if (S.route.name === 'radar') return 'Listing radar: Firstprint';
  if (S.route.name === 'admin') return 'Admin: Firstprint';
  if (S.route.name === 'portfolio') return 'Portfolio: Firstprint';
  return 'Firstprint: predict new exchange listings';
}

// ------------------------------------------------------------------ Home

function homeView() {
  const all = [...S.lists.open, ...S.lists.live, ...S.lists.settled];
  const exchanges = [...new Set(all.map((m) => m.exchange))].sort();
  const list = S.lists[S.filter].filter((m) => S.exchange === 'all' || m.exchange === S.exchange);
  const byListing = [...S.lists.open].sort((a, b) => a.listingAt - b.listingAt);
  const featured = byListing.find((m) => m.phase === 'pre_listing') ?? byListing[0];
  const tab = (f, label) =>
    `<button role="tab" aria-selected="${S.filter === f}" data-filter="${f}">${label}<span class="count">${S.lists[f].length}</span></button>`;

  return `
    ${featured ? featuredView(featured) : ''}
    <div class="toolbar">
      <div class="tabs" role="tablist" aria-label="Market status">
        ${tab('open', 'Upcoming')}${tab('live', 'Live')}${tab('settled', 'Settled')}
      </div>
      <label class="select">Exchange
        <select id="exchange-filter">
          <option value="all">All exchanges</option>
          ${exchanges.map((e) => `<option value="${esc(e)}"${S.exchange === e ? ' selected' : ''}>${esc(e)}</option>`).join('')}
        </select>

    ${
      list.length
        ? `<div class="grid">${list.map(cardView).join('')}</div>`

    }
    ${howItWorks()}`;
}

function emptyText() {
  if (S.filter === 'live') return '<p>No markets are running right now. Upcoming markets move here once predictions close.</p><button class="btn" data-filter="open">See upcoming</button>';
  if (S.filter === 'settled') return '<p>No settled markets yet. Results appear here 72 hours after each listing.</p>';
  return '<p>No upcoming listings match this filter. New markets open as soon as exchanges announce listings.</p>';
}

function featuredView(m) {
  const pre = m.phase === 'pre_listing';
  const test = m.kind === 'live_test';
  const verb = test ? (pre ? 'market starts' : 'market is live') : `${pre ? 'lists' : 'is trading'} on ${esc(m.exchange)}`;
  return `
    <section class="featured" aria-labelledby="featured-title">
      <div>
        <h1 id="featured-title">${esc(m.symbol)} ${verb}
          <span class="countdown">${pre ? `in ${until(m.listingAt)}` : `predictions close in ${until(m.closeAt)}`}</span>
        </h1>
        <p class="lede">Predict where ${esc(m.name || m.symbol)} trades ${fmtSpan(m.settleAt - m.listingAt)} after ${test ? `the market starts, using live prices from ${esc(venueNames(m))}` : 'listing'}.
          ${m.pool ? `${fmtPts(m.pool)} in the pool from ${m.predictors} predictor${m.predictors === 1 ? '' : 's'}.` : 'Nobody has predicted yet.'}</p>
        <div class="actions">
          <a class="btn btn-solid" href="#/market/${encodeURIComponent(m.id)}">Make a prediction</a>
          <a class="btn" href="#how">How it works</a>
        </div>
      </div>
      <div class="mini-ladder" aria-label="Pool split by outcome">
        ${LADDER.map((b) => {
          const pct = share(m, b) * 100;
          return `<div class="mini-rung" style="--c:var(--${b});--share:${pct}%"><b>${NAMES[b]}</b><span class="muted">${rangeLabel(b, m.thresholds)}</span><span class="pct">${Math.round(pct)}%</span></div>`;
        }).join('')}
      </div>
    </section>`;
}

function cardView(m) {
  const lead = leader(m);
  let leadText;
  if (m.status === 'resolved') leadText = `Settled in ${outcome(m.result.winningBucket)} at ${fmtPct(m.result.returnPct)}`;
  else if (m.status === 'void') leadText = 'Cancelled. Points were returned.';
  else if (m.live?.projectedBucket) leadText = `Now ${fmtPct(m.live.returnPct)}, tracking ${outcome(m.live.projectedBucket)}`;
  else if (lead) leadText = `${outcome(lead)} leads with ${Math.round(share(m, lead) * 100)}% of the pool`;
  else leadText = '<span class="muted">No predictions yet</span>';

  let when;
  if (m.phase === 'pre_listing') when = `${m.kind === 'live_test' ? 'Starts' : 'Lists'} in ${until(m.listingAt)}`;
  else if (m.phase === 'baseline') when = `Closes in ${until(m.closeAt)}`;
  else if (m.phase === 'running') when = `Result in ${until(m.settleAt)}`;
  else when = fmtDate(m.settleAt);

  return `
    <a class="card" href="#/market/${encodeURIComponent(m.id)}">
      <div class="card-top"><span class="sym">${esc(m.symbol)}</span><span class="exch">${esc(m.exchange)}</span></div>
      <div class="card-name">${esc(m.name || '')}${m.kind === 'live_test' ? ' <span class="tag tag-test">Live test</span>' : ''}</div>
      <div class="strip${m.pool ? '' : ' empty'}" aria-hidden="true">
        ${['crash', 'down', 'flat', 'up', 'moon'].map((b) => `<span style="--c:var(--${b});flex:${m.pool ? m.totals[b] : 1}"></span>`).join('')}
      </div>
      <div class="card-lead">${leadText}</div>
      <div class="card-foot"><span class="when">${when}</span><span>${fmtPts(m.pool)}</span></div>
    </a>`;
}

function howItWorks() {
  return `
    <section class="section" id="how" style="margin-top:36px">
      <h2>How it works</h2>
      <ol class="rules">
        <li>Firstprint watches seven exchanges for new listings and opens a market when one is confirmed. Connect a Solana wallet to get 1,000 free points.</li>
        <li>Pick one of five outcomes for the price 72 hours after listing, from Crash to Moon. Predictions stay open until 1 hour after trading starts, and earlier predictions earn a bigger share.</li>
        <li>The starting price is the average over the first hour of trading. The final price is the average over the last hour, so a single spike can’t decide a market.</li>
        <li>Everyone who picked the winning outcome splits the pool, minus a 4% fee. If nobody picked it, everyone gets their points back.</li>
      </ol>
    </section>`;
}

// ------------------------------------------------------------------ Market page

function renderMarket() {
  const m = S.market;
  const view = $('#view');
  if (!$('.market-layout', view) || view.dataset.market !== m.id) {
    view.dataset.market = m.id;
    view.innerHTML = `
      <div class="market-layout">
        <div id="market-main"></div>
        <aside class="trade" id="trade" aria-label="Make a prediction"></aside>
      </div>
      <div id="mobile-bar-root"></div>`;
    S.tradeKey = '';
  }
  $('#market-main').innerHTML = marketMain(m);
  $('#mobile-bar-root').innerHTML = mobileBar(m);
  renderTrade();
}

function statusLine(m) {
  switch (m.phase) {
    case 'pre_listing':
      return m.kind === 'live_test'
        ? `Starts in <strong>${until(m.listingAt)}</strong>. Predictions close ${fmtSpan(m.closeAt - m.listingAt)} after it starts.`
        : `Lists in <strong>${until(m.listingAt)}</strong>. Predictions close ${fmtSpan(m.closeAt - m.listingAt)} after trading starts.`;
    case 'baseline':
      return `${m.kind === 'live_test' ? 'The market has started.' : 'Trading started.'} Predictions close in <strong>${until(m.closeAt)}</strong>.`;
    case 'running':
      return `Predictions are closed. Result in <strong>${until(m.settleAt)}</strong>.`;
    case 'resolved':
      return `Settled in ${outcome(m.result.winningBucket)} at <strong>${fmtPct(m.result.returnPct)}</strong> on ${fmtDate(m.settleAt)}.`;
    case 'void':
      return `Cancelled because ${VOID_REASONS[m.result?.voidReason] ?? 'of a data problem'}. All points were returned.`;
  }
  return '';
}

function marketMain(m) {
  const span = fmtSpan(m.settleAt - m.listingAt);
  const settled = m.status === 'resolved' || m.status === 'void';
  const canPick = m.status === 'open';
  const mineBy = {};
  for (const p of m.mine) mineBy[p.bucket] = (mineBy[p.bucket] ?? 0) + p.stake;
  const nowBucket = m.live?.projectedBucket;
  const net = m.result ? m.result.pool - m.result.fee : 0;

  const rungs = LADDER.map((b) => {
    const pct = share(m, b) * 100;
    const won = m.status === 'resolved' && m.result.winningBucket === b;
    let pays = '–';
    if (canPick) pays = `${estMultiple(m, b).toFixed(1)}×`;
    else if (won && m.totals[b]) pays = `${(net / m.totals[b]).toFixed(2)}×`;
    else if (!settled && m.totals[b]) pays = `${(m.pool * (1 - m.feeBps / 10_000) / m.totals[b]).toFixed(1)}×`;
    return `
      <button class="rung${won ? ' won' : ''}" style="--c:var(--${b});--share:${pct}%" data-bucket="${b}"
        aria-pressed="${S.trade.bucket === b}" ${canPick ? '' : 'disabled'}
        aria-label="${NAMES[b]}, ${rangeLabel(b, m.thresholds)}, ${Math.round(pct)}% of pool">
        <span class="rung-name">
          <b>${NAMES[b]}${mineBy[b] ? `<span class="tag tag-you">You ${fmtNum(mineBy[b])}</span>` : ''}${
            nowBucket === b ? `<span class="tag tag-now">Now ${fmtPct(m.live.returnPct)}</span>` : ''
          }${won ? '<span class="tag tag-now">Winner</span>' : ''}</b>
          <small>${rangeLabel(b, m.thresholds)}</small>
        </span>
        <span class="num">${Math.round(pct)}%</span>
        <span class="num">${pays}</span>
        <span class="num pool-col">${fmtNum(m.totals[b])}<small>pts</small></span>
      </button>`;
  }).join('');

  return `
    <a class="back" href="#/">All markets</a>
    <header class="m-head">
      <div class="m-title"><h1 class="sym">${esc(m.symbol)}</h1><span class="exch">${esc(m.exchange)}</span>${
        (m.phase === 'baseline' || m.phase === 'running') && S.live ? '<span class="live-badge"><span class="live-dot" aria-hidden="true"></span>Live price</span>' : ''
      }</div>
      <p class="m-question">${
        m.kind === 'live_test'
          ? `Where will ${esc(m.name || m.symbol)} trade ${span} after this market starts?`
          : `Where will ${esc(m.name || m.symbol)} trade ${span} after listing on ${esc(m.exchange)}?`
      }</p>
      <p class="m-status">${statusLine(m)}</p>
      <p class="m-venues">${m.kind === 'live_test' ? '<span class="tag tag-test">Live test</span> ' : ''}Prices from ${esc(venueNames(m))}</p>
    </header>

    <dl class="stats">
      <div><dt>Pool</dt><dd>${fmtPts(m.pool)}</dd></div>
      <div><dt>Predictors</dt><dd>${fmtNum(m.predictors)}</dd></div>
      <div><dt>${m.kind === 'live_test' ? 'Starts' : 'Listing'}</dt><dd>${fmtDate(m.listingAt)}</dd></div>
      <div><dt>Result</dt><dd>${fmtDate(m.settleAt)}</dd></div>
    </dl>

    ${chartView(m)}

    <div class="ladder${settled ? ' settled' : ''}" role="group" aria-label="Outcomes">
      <div class="ladder-head"><span>Price after ${span}</span><span>Crowd</span><span>Pays</span><span class="pool-col">Pool</span></div>
      ${rungs}
      ${canPick ? '<p class="fine" style="margin:2px 0 0">Pays shows the current payout per point before early bonuses. Your estimate in the prediction panel includes your bonus.</p>' : ''}
    </div>

    <section class="section">
      <h2>How this market settles</h2>
      <ol class="rules">
        <li>Starting price: the average price over the first ${fmtSpan(m.closeAt - m.listingAt)} ${m.kind === 'live_test' ? 'after the market starts' : 'of trading'}, from ${esc(venueNames(m))}.</li>
        <li>Final price: the average over the last ${fmtSpan(m.closeAt - m.listingAt)} before ${fmtDate(m.settleAt)}. If the token trades on several exchanges, the volume-weighted median is used.</li>
        <li>Predictions close ${fmtSpan(m.closeAt - m.listingAt)} after trading starts. Earlier predictions get up to ${(1 + m.earlyBirdK).toFixed(1)}× weight when the pool is split.</li>
        <li>Winners split the pool minus a ${m.feeBps / 100}% fee. Limit ${fmtPts(m.userCap)} per person.</li>
        <li>The market is cancelled and refunded if the listing is delayed more than 24 hours, trading halts for too long, there isn’t enough trading data, or nobody picks the winning outcome.</li>
      </ol>
    </section>

    ${
      m.scorecard
        ? `<section class="section">
            <h2>About ${esc(m.symbol)}</h2>
            <dl class="facts">
              ${m.scorecard.fdvUsd ? `<div><dt>Valuation at listing</dt><dd>$${fmtCompact(m.scorecard.fdvUsd)}</dd></div>` : ''}
              ${m.scorecard.circulatingPct !== undefined ? `<div><dt>Circulating supply</dt><dd>${m.scorecard.circulatingPct}%</dd></div>` : ''}
              ${m.scorecard.airdropPct !== undefined ? `<div><dt>Airdrop share</dt><dd>${m.scorecard.airdropPct}%</dd></div>` : ''}
              ${m.scorecard.unlocks ? `<div style="grid-column:1/-1"><dt>Unlocks</dt><dd>${esc(m.scorecard.unlocks)}</dd></div>` : ''}
            </dl>
          </section>`
        : ''
    }

    <section class="section">
      <h2>Recent predictions</h2>
      ${
        S.activity.length
          ? `<ul class="activity">${S.activity
              .slice(0, 12)
              .map((a) => `<li><span>${esc(a.username)} picked ${outcome(a.bucket)}</span><span class="muted">${fmtPts(a.stake)}, ${fmtAgo(a.placedAt)}</span></li>`)
              .join('')}</ul>`
          : '<p class="muted">No predictions yet.</p>'
      }
    </section>`;
}

function venueNames(m) {
  const names = (m.venues ?? []).map((v) => v.name);
  if (!names.length) return m.exchange;
  return names.length <= 2 ? names.join(' and ') : `${names.slice(0, -1).join(', ')}, and ${names[names.length - 1]}`;
}

function fmtCompact(n) {
  if (n >= 1e9) return `${(n / 1e9).toFixed(1)}B`;
  if (n >= 1e6) return `${(n / 1e6).toFixed(n >= 1e8 ? 0 : 1)}M`;
  if (n >= 1e3) return `${(n / 1e3).toFixed(0)}K`;
  return String(n);
}

function fmtAgo(ts) {
  const ms = now() - ts;
  if (ms < 60_000) return 'just now';
  return `${fmtDur(ms).split(' ')[0]} ago`;
}

function chartView(m) {
  if (m.phase === 'pre_listing' || !S.chart?.series?.length) {
    return `<div class="chart"><div class="chart-empty">${
      m.kind === 'live_test' ? 'The price chart appears when the market starts.' : `The price chart starts when ${esc(m.symbol)} begins trading on ${esc(m.exchange)}.`
    }</div></div>`;
  }
  const base = m.result?.basePrice ?? m.live?.basePrice ?? null;
  const r = m.result?.returnPct ?? m.live?.returnPct ?? null;
  const b = m.result?.winningBucket ?? m.live?.projectedBucket ?? 'flat';
  const series = S.chart.series;
  const prices = series.map((p) => p[1]).concat(base ? [base] : []);
  const lo = Math.min(...prices);
  const hi = Math.max(...prices);
  const W = 600;
  const H = 180;
  const pad = 8;
  const t0 = series[0][0];
  const t1 = Math.max(series[series.length - 1][0], m.settleAt);
  const x = (t) => ((t - t0) / (t1 - t0 || 1)) * W;
  const y = (p) => H - pad - ((p - lo) / (hi - lo || 1)) * (H - 2 * pad);
  const d = series.map(([t, p], i) => `${i ? 'L' : 'M'}${x(t).toFixed(1)},${y(p).toFixed(1)}`).join('');
  const last = series[series.length - 1];

  return `
    <div class="chart">
      <div class="chart-head">
        <div><div>${m.status === 'resolved' ? 'Final change from starting price' : 'Change from starting price'}</div><div class="muted">Dashed line: starting price ${fmtPrice(base)}</div></div>
        <div class="now" style="color:var(--${b})">${fmtPct(r)}</div>
      </div>
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Price since listing, ${fmtPct(r)} from the starting price">
        ${base ? `<line x1="0" x2="${W}" y1="${y(base)}" y2="${y(base)}" stroke="var(--muted)" stroke-dasharray="4 5" vector-effect="non-scaling-stroke" />` : ''}
        <path d="${d}" fill="none" stroke="var(--${b})" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" />
        <circle cx="${x(last[0])}" cy="${y(last[1])}" r="3.5" fill="var(--${b})" />
      </svg>
    </div>`;
}

function mobileBar(m) {
  if (m.status !== 'open') return '';
  return `
    <div class="mobile-bar">
      <p>${m.phase === 'pre_listing' ? `${m.kind === 'live_test' ? 'Starts' : 'Lists'} in ${until(m.listingAt)}` : `Closes in ${until(m.closeAt)}`}</p>
      <button class="cta" style="--c:var(--text)" data-action="open-sheet">Make a prediction</button>
    </div>`;
}

// ------------------------------------------------------------------ Trade panel

function tradeMode(m) {
  if (m.status === 'open' && now() < m.closeAt) return 'open';
  if (m.status === 'resolved' || m.status === 'void') return 'settled';
  return 'closed';
}

function renderTrade() {
  const m = S.market;
  const el = $('#trade');
  if (!el) return;
  const mode = tradeMode(m);
  const key = `${m.id}|${mode}|${S.me ? S.me.id : ''}`;

  if (key !== S.tradeKey) {
    S.tradeKey = key;
    if (mode === 'open') {
      el.innerHTML = `
        <div class="trade-card" id="trade-card">
          <button class="sheet-close" data-action="close-sheet">Close</button>
          <h2>Predict ${esc(m.symbol)}</h2>
          <div class="picker" role="radiogroup" aria-label="Outcome" id="picker"></div>
          <label class="field-label" for="stake">Stake</label>
          <div class="stake-input"><input id="stake" inputmode="numeric" autocomplete="off" value="${S.trade.stake}" aria-describedby="trade-fine" /><span>pts</span></div>
          <div class="chips">
            ${[25, 50, 100, 250].map((v) => `<button type="button" data-stake="${v}">${v}</button>`).join('')}
            <button type="button" data-stake="max">Max</button>
          </div>
          <dl class="summary" id="trade-summary"></dl>
          <button class="cta" id="trade-cta" data-action="predict"></button>
          <p class="form-error" id="trade-error" role="alert"></p>
          <p class="fine" id="trade-fine"></p>
          <div id="trade-positions"></div>
        </div>`;
    } else {
      el.innerHTML = `
        <div class="trade-card">
          <button class="sheet-close" data-action="close-sheet">Close</button>
          <div id="trade-closed"></div>
          <div id="trade-positions"></div>
        </div>`;
    }
  }

  if (mode === 'open') {
    $('#picker').innerHTML = LADDER.map(
      (b) =>
        `<button type="button" role="radio" aria-checked="${S.trade.bucket === b}" data-pick="${b}" style="--c:var(--${b})"><b>${NAMES[b]}</b><small>${Math.round(share(m, b) * 100)}%</small></button>`,
    ).join('');
    updateSummary();
  } else if (mode === 'closed') {
    $('#trade-closed').innerHTML = `<h2>Predictions closed</h2><p class="muted">Result in ${until(m.settleAt)}.${
      m.live?.projectedBucket ? ` Right now the price is ${fmtPct(m.live.returnPct)}, which would settle in ${outcome(m.live.projectedBucket)}.` : ''
    }</p>`;
  } else {
    $('#trade-closed').innerHTML =
      m.status === 'resolved'
        ? `<h2>Settled in ${outcome(m.result.winningBucket)}</h2><p class="muted">Final price ${fmtPrice(m.result.finalPrice)}, ${fmtPct(m.result.returnPct)} from the starting price of ${fmtPrice(m.result.basePrice)}.</p>`
        : `<h2>Market cancelled</h2><p class="muted">Cancelled because ${VOID_REASONS[m.result?.voidReason] ?? 'of a data problem'}. Every prediction was refunded.</p>`;
  }
  $('#trade-positions').innerHTML = positionsView(m, mode);
}

function positionsView(m, mode) {
  if (!S.me) return mode === 'open' ? '' : '<p class="fine">Connect a wallet to track your predictions.</p>';
  if (!m.mine.length) return mode === 'open' ? '' : '<p class="fine">You didn’t predict on this market.</p>';
  const rows = m.mine
    .map((p) => {
      let state = 'Placed';
      if (m.status === 'locked') state = p.refund ? `${fmtPts(p.refund)} refunded by pool limit` : 'In play';
      if (m.status === 'resolved') state = p.payout > 0 ? `Won ${fmtPts(p.payout)}` : 'Didn’t win';
      if (m.status === 'void') state = `Refunded ${fmtPts(p.refund ?? p.stake)}`;
      return `<div class="position" style="--c:var(--${p.bucket})"><span><b>${NAMES[p.bucket]}</b> ${fmtPts(p.stake)}</span><span>${state}</span></div>`;
    })
    .join('');
  return `<div style="margin-top:16px"><h3 style="font-size:16px;margin-bottom:4px">Your predictions</h3>${rows}</div>`;
}

function updateSummary() {
  const m = S.market;
  const card = $('#trade-card');
  if (!card) return;
  const b = S.trade.bucket;
  const stake = S.trade.stake;
  card.style.setProperty('--c', b ? `var(--${b})` : 'var(--text)');

  const q = S.trade.quote;
  const summary = $('#trade-summary');
  if (!b) {
    summary.innerHTML = '<div><dt>Pick an outcome to see your estimated payout.</dt></div>';
  } else {
    summary.innerHTML = `
      <div class="big"><dt>If ${NAMES[b]} wins</dt><dd>${q ? `about ${fmtPts(q.payout)}` : '…'}</dd></div>
      <div><dt>Return on stake</dt><dd>${q && stake ? `${q.multiple.toFixed(2)}×` : '–'}</dd></div>
      <div><dt>Early bonus</dt><dd>${q ? `${q.weight.toFixed(2)}×` : '–'}</dd></div>
      <div><dt>Price range</dt><dd>${rangeLabel(b, m.thresholds)}</dd></div>`;
  }

  const cta = $('#trade-cta');
  if (!S.me) {
    cta.textContent = 'Connect wallet to predict';
    cta.disabled = false;
  } else if (!b) {
    cta.textContent = 'Pick an outcome';
    cta.disabled = true;
  } else {
    cta.textContent = S.trade.busy ? 'Placing prediction' : `Predict ${NAMES[b]} for ${fmtPts(stake || 0)}`;
    cta.disabled = S.trade.busy || !stake || stake < m.minStake;
  }

  $('#trade-fine').textContent = S.me
    ? `You have ${fmtPts(S.me.points)}. Limit ${fmtPts(m.userCap)} per market. Minimum ${m.minStake} pts.`
    : 'Connect a Solana wallet to start with 1,000 free points.';
}

let quoteTimer;
function requestQuote() {
  clearTimeout(quoteTimer);
  const m = S.market;
  const b = S.trade.bucket;
  if (!b || !m) return updateSummary();
  const seq = ++S.trade.seq;
  quoteTimer = setTimeout(async () => {
    try {
      const q = await S.api.quote(m.id, b, S.trade.stake || 0);
      if (seq === S.trade.seq) {
        S.trade.quote = q;
        updateSummary();
      }
    } catch (err) {
      console.error(err);
    }
  }, 180);
  S.trade.quote = null;
  updateSummary();
}

function pickBucket(b) {
  if (!S.market || S.market.status !== 'open') return;
  S.trade.bucket = b;
  $('#trade-error') && ($('#trade-error').textContent = '');
  document.querySelectorAll('.rung').forEach((r) => r.setAttribute('aria-pressed', String(r.dataset.bucket === b)));
  renderTrade();
  requestQuote();
}

async function submitPrediction() {
  if (!S.me) return openAuth('connect');
  const m = S.market;
  const { bucket, stake } = S.trade;
  if (!bucket || S.trade.busy) return;
  S.trade.busy = true;
  updateSummary();
  try {
    await S.api.predict(m.id, bucket, stake);
    toast(`Predicted ${NAMES[bucket]} for ${fmtPts(stake)}`);
    $('#trade-error').textContent = '';
    closeSheet();
    await refreshMe();
    await loadMarket(m.id);
    renderMarket();
    requestQuote();
  } catch (err) {
    const el = $('#trade-error');
    if (el) el.textContent = err.message;
    if (err instanceof ApiError && err.status === 401) {
      S.me = null;
      renderTop();
      openAuth('connect');
    }
  } finally {
    S.trade.busy = false;
    if ($('#trade-card')) updateSummary();
  }
}

function openSheet() {
  const el = $('#trade');
  if (!el) return;
  S.sheetOpen = true;
  el.classList.add('open');
  if (!$('.sheet-backdrop')) {
    const bd = document.createElement('div');
    bd.className = 'sheet-backdrop';
    bd.dataset.action = 'close-sheet';
    document.body.appendChild(bd);
  }
  ($('#picker button') || el).focus?.();
}

function closeSheet() {
  S.sheetOpen = false;
  $('#trade')?.classList.remove('open');
  $('.sheet-backdrop')?.remove();
}

const isMobile = () => window.matchMedia('(max-width: 900px)').matches;

// ------------------------------------------------------------------ Leaderboard & portfolio

function leaderboardView(lb) {
  const rows = lb.entries
    .map(
      (e) => `
      <tr class="${e.isMe ? 'me' : ''}">
        <td class="rank">${e.rank}</td>
        <td>${esc(e.name)}${e.isMe ? ' <span class="tag tag-you">You</span>' : ''}</td>
        <td class="right ${e.profit >= 0 ? 'profit-pos' : 'profit-neg'}">${e.profit >= 0 ? '+' : '−'}${fmtNum(Math.abs(e.profit))}</td>
        <td class="right hide-sm">${e.wins} of ${e.total}</td>
      </tr>`,
    )
    .join('');
  return `
    <h1 class="page-title">Leaderboard</h1>
    <p class="page-lede">Points won or lost on markets settled this week. The board resets every Monday at 00:00 UTC.</p>
    ${
      lb.entries.length
        ? `<table class="table"><thead><tr><th>Rank</th><th>Predictor</th><th class="right">Profit</th><th class="right hide-sm">Correct</th></tr></thead><tbody>${rows}</tbody></table>`
        : '<div class="empty"><p>No markets have settled this week yet.</p></div>'
    }
    ${S.me && !lb.me ? '<p class="fine">You’ll appear here after one of your predictions settles.</p>' : ''}`;
}

function portfolioView(preds) {
  if (!S.me) {
    return `
      <h1 class="page-title">Portfolio</h1>
      <div class="empty"><p>Connect a Solana wallet to see your points and predictions. New accounts start with 1,000 free points.</p>
        <button class="btn btn-solid" data-action="connect">Connect wallet</button></div>`;
  }
  const active = preds.filter((p) => p.marketStatus === 'open' || p.marketStatus === 'locked');
  const settled = preds.filter((p) => p.marketStatus === 'resolved' || p.marketStatus === 'void');
  const table = (list, empty) =>
    list.length
      ? `<table class="table"><thead><tr><th>Market</th><th>Outcome</th><th class="right">Stake</th><th class="right">Status</th></tr></thead><tbody>${list
          .map((p) => {
            let status = p.marketStatus === 'open' ? 'Open' : 'In play';
            if (p.marketStatus === 'resolved') status = p.payout > 0 ? `<span class="profit-pos">Won ${fmtNum(p.payout)}</span>` : 'Didn’t win';

          })
          .join('')}</tbody></table>`
      : `<p class="muted">${empty}</p>`;

  return `

              .join('')}</ul>`

    <section class="section"><h2>Settled</h2>${table(settled, 'Your results appear here after markets settle.')}</section>`;
}

// ------------------------------------------------------------------ Listing radar

function radarView(listings) {
  const t = now();
  const sorted = [...listings].sort((a, b) => {
    const fa = a.listingAt && a.listingAt > t;
    const fb = b.listingAt && b.listingAt > t;
    if (fa !== fb) return fa ? -1 : 1;
    if (fa) return a.listingAt - b.listingAt;
    return (b.publishedAt ?? b.detectedAt) - (a.publishedAt ?? a.detectedAt);
  });
  const rows = sorted
    .map((d) => {
      const future = d.listingAt && d.listingAt > now();
      const when = !d.listingAt ? '<span class="muted">Not announced</span>' : future ? `in ${until(d.listingAt)}` : fmtDate(d.listingAt);
      const market = d.marketId
        ? `<a class="btn" href="#/market/${encodeURIComponent(d.marketId)}">Predict</a>`
        : '<span class="muted">Opening soon</span>';
      const title = d.url
        ? `<a class="radar-title" href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">${esc(d.title || 'Announcement')}</a>`
        : `<span class="radar-title">${esc(d.title || '')}</span>`;
      return `
        <tr>
          <td><span class="radar-sym">${esc(d.symbol || '?')}</span>${title}</td>
          <td>${esc(d.exchangeName)}</td>
          <td class="hide-sm">${d.source === 'announcement' ? 'Announcement' : 'New trading pair'}<br><span class="muted">${fmtAgo(d.publishedAt ?? d.detectedAt)}</span></td>
          <td>${when}</td>
          <td class="right">${market}</td>
        </tr>`;
    })
    .join('');
  return `
    <h1 class="page-title">Listing radar</h1>
    <p class="page-lede">New listings found automatically from exchange announcements and new trading pairs on Binance, MEXC, Bybit, OKX, Gate, Bitget, and KuCoin. A market opens once the listing and its trading time are confirmed.</p>
    ${
      listings.length
        ? `<table class="table radar"><thead><tr><th>Token</th><th>Exchange</th><th class="hide-sm">Found from</th><th>Trading starts</th><th class="right">Market</th></tr></thead><tbody>${rows}</tbody></table>`
        : '<div class="empty"><p>No new listings found yet. The radar checks every exchange every few minutes.</p></div>'
    }`;
}
