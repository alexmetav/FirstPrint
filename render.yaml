services:
  - type: web
    name: firstprint-demo-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:demo
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0

  # The full app: accounts, points, admin panel, manual markets. Runs on Render's free plan, which has no
  # persistent disk, so the server keeps its SQLite database in a private Supabase Storage bucket: it
  # restores it at start-up, copies it every minute when something changed, and once more on shutdown.
  # One instance only. To use a persistent disk instead, set plan: starter, add
  #   disk: { name: firstprint-data, mountPath: /data, sizeGB: 1 }
  # set DB_PATH to /data/firstprint.db, and remove the two SUPABASE_ variables.
  - type: web
    name: firstprint-app
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: NODE_ENV
        value: production
      - key: MANUAL_ONLY
        value: "1"
      - key: SOLANA_CHAIN
        value: devnet
      # Render creates a random key. Read it in the dashboard (Environment) to open /#/admin.
      - key: ADMIN_KEY
        generateValue: true
      # The address people type in the browser, no trailing slash. With the app served on the main site
      # through Vercel (see vercel.json) this is https://www.firstprint.fun
      - key: PUBLIC_URL
        sync: false
      # Proxies in front of the server: Render's load balancer plus Vercel's rewrite. Used to tell visitors
      # apart for rate limits. Use 1 if people reach the app directly on its onrender.com address instead.
      - key: TRUST_PROXY_HOPS
        value: "2"
      # Database backup (Supabase free plan): the project URL and its service_role key. Secret, enter in Render only.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Optional sign-in methods; each is hidden in the app until it is set.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
