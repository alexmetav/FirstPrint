@media (max-width: 640px) {
  .check-list li {
    grid-template-columns: 10px minmax(0, 1fr);
  }
  .check-list li > .btn {
    grid-column: 2;
    justify-self: start;
  }
}

/* Admin: new listings queue, live price fill, Telegram setup */
.todo-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.live-fill {
  margin-top: 6px;
  justify-self: start;
  width: fit-content;
}
.tg-steps {
  margin: 0 0 14px;
  padding-left: 20px;
  display: grid;
  gap: 6px;
  color: var(--text-2, var(--muted));
}
.tg-steps code,
.tg-code {
  font-family: 'Geist Mono', ui-monospace, monospace;
  font-size: 13px;
  padding: 2px 6px;
  border-radius: 6px;
  background: var(--surface-2, var(--surface));
  border: 1px solid var(--line);
  color: var(--text);
}
.tg-code {
  font-size: 15px;
  font-weight: 600;
  user-select: all;
}
@media (max-width: 640px) {
  .todo li .todo-actions {
    grid-column: 1 / -1;
    justify-content: flex-start;
  }
}

/* Telegram channel: market page button, dashboard card */
.m-head-actions {
  margin-left: auto;
  align-self: flex-start;
  display: flex;
  gap: 8px;
  flex: none;
}
.m-head-actions .share-btn {
  margin-left: 0;
}
.tg-join svg {
  color: #229ed9;
}
.tg-card {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 12px 14px;
  align-items: start;
}
.tg-card b {
  display: block;
  margin-bottom: 2px;
}
.tg-card p {
  margin: 0;
  font-size: 13px;
}
.tg-logo {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: color-mix(in srgb, #229ed9 16%, transparent);
  color: #229ed9;
}
.tg-logo svg {
  width: 22px;
  height: 22px;
}
/* The button sits under the text it belongs to, not under the logo. */
.tg-card .tg-join {
  grid-column: 2;
  justify-self: start;
}
.tg-channel-form {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 12px;
}
.tg-channel-form input {
  flex: 1 1 220px;
  max-width: 320px;
}

/* Daily streak: day tiles and the month calendar */
.streak-card {
  display: grid;
  gap: 16px;
  margin-bottom: 18px;
}
.st-head {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 14px;
}
.st-flame {
  width: 46px;
  height: 46px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: color-mix(in srgb, var(--flat) 14%, transparent);
  color: var(--flat);
}
.st-flame.lit {
  background: color-mix(in srgb, var(--down) 18%, transparent);
  color: var(--down);
}
.st-flame svg {
  width: 24px;
  height: 24px;
}
.st-head > div {
  display: grid;
}
.st-count {
  font-size: 22px;
  letter-spacing: -0.02em;
}
.st-note {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--up);
  font-weight: 600;
}
.st-note svg {
  width: 15px;
  height: 15px;
}
.st-days {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 8px;
}
.st-day {
  position: relative;
  display: grid;
  justify-items: center;
  gap: 4px;
  padding: 12px 4px 10px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--surface);
  text-align: center;
}
.st-day .st-n {
  font-family: 'Geist Mono', ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--muted);
  white-space: nowrap;
}
.st-day b {
  font-size: 17px;
  font-variant-numeric: tabular-nums;
}
.st-day .st-ico {
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
}
.st-day .st-ico svg {
  width: 13px;
  height: 13px;
}
.st-day.next b {
  color: var(--muted);
}
.st-day.done {
  border-color: color-mix(in srgb, var(--up) 40%, var(--line));
  background: color-mix(in srgb, var(--up) 9%, var(--surface));
}
.st-day.done .st-ico {
  background: var(--up);
  color: #fff;
}
.st-day.today {
  border-color: var(--warn);
  background: color-mix(in srgb, var(--warn) 12%, var(--surface));
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 18%, transparent);
}
.st-day.today b {
  color: var(--warn);
}
.st-day.today .st-ico {
  color: var(--warn);
}
.st-day:last-child b::after {
  content: '';
}
.st-rule {
  margin: 0;
  font-size: 13px;
}
.st-cal {
  border-top: 1px solid var(--line);
  padding-top: 14px;
}
.st-cal-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 10px;
  font-size: 14px;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 6px;
  max-width: 420px;
}
.cal-wd {
  text-align: center;
  font-family: 'Geist Mono', ui-monospace, monospace;
  font-size: 11px;
  color: var(--muted);
}
.cal-cell {
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border-radius: 10px;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  border: 1px solid transparent;
}
.cal-cell.hit {
  background: color-mix(in srgb, var(--up) 18%, transparent);
  color: var(--up);
  font-weight: 650;
}
.cal-cell.is-today {
  border-color: var(--warn);
  color: var(--text);
}
.cal-cell.future {
  opacity: 0.45;
}
.cal-cell.blank {
  visibility: hidden;
}
.streak-card.compact .st-day {
  padding: 9px 2px 8px;
}
.streak-card.compact .st-day b {
  font-size: 14px;
}
.streak-card.compact .st-day .st-n {
  font-size: 10px;
}
@media (max-width: 560px) {
  .st-head {
    grid-template-columns: auto minmax(0, 1fr);
  }
  .st-head > .btn,
  .st-head > .st-note {
    grid-column: 1 / -1;
  }
  .st-days {
    gap: 5px;
  }
  .st-day {
    padding: 9px 2px 8px;
    border-radius: 11px;
  }
  .st-day b {
    font-size: 14px;
  }
  .st-day .st-n {
    font-size: 9.5px;
    letter-spacing: 0;
  }
}

/* Analytics: tiles, charts and the partner page. Chart colours are validated for both themes. */
.viz-page {
  --viz-1: #3987e5;
  --viz-2: #d95926;
  --viz-3: #199e70;
  display: grid;
  gap: 16px;
}
:root[data-theme='light'] .viz-page {
  --viz-1: #2a78d6;
  --viz-2: #eb6834;
  --viz-3: #1baf7a;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme='dark']) .viz-page {
    --viz-1: #2a78d6;
    --viz-2: #eb6834;
    --viz-3: #1baf7a;
  }
}
.viz-page.shared {
  max-width: 1100px;
  margin: 0 auto;
}
.viz-head .page-lede {
  max-width: 640px;
}
.viz-filters {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.viz-filters .muted {
  font-size: 13px;
}
.viz-filters .tabs {
  margin: 0;
}
.viz-filters .viz-export {
  margin-left: auto;
}
.viz-section-head {
  margin: 8px 0 -2px;
}
.viz-section-head h2 {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 4px;
  font-size: 18px;
}
.viz-section-head h2 svg {
  width: 18px;
  height: 18px;
}
.viz-section-head p {
  margin: 0;
  font-size: 13px;
}
.viz-section-head a {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.hbar .flag {
  font-family: 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
}
.viz-tiles {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}
@media (max-width: 560px) {
  .viz-tiles {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
.viz-tile {
  display: grid;
  gap: 4px;
  padding: 16px 18px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
}
.viz-tile-label {
  font-size: 13px;
  color: var(--muted);
}
.viz-tile-value {
  font-size: 30px;
  font-weight: 650;
  letter-spacing: -0.03em;
  line-height: 1.1;
}
.viz-tile-sub {
  font-size: 12.5px;
  color: var(--muted);
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: baseline;
}
.viz-delta {
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}
.viz-delta.up {
  color: var(--up);
}
.viz-delta.down {
  color: var(--crash);
}
.viz-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}
.viz-card {
  display: grid;
  gap: 12px;
  align-content: start;
  margin: 0;
}
.viz-card.wide {
  grid-column: 1 / -1;
}
.viz-card-head h3 {
  margin: 0;
  font-size: 16px;
}
.viz-card-head p {
  margin: 2px 0 0;
  font-size: 13px;
}
svg.viz {
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
}
.viz-grid line.viz-grid,
.viz .viz-grid {
  stroke: var(--line);
  stroke-width: 1;
}
.viz .viz-axis {
  fill: var(--muted);
  font-size: 11px;
  font-family: 'Geist Mono', ui-monospace, monospace;
}
.viz .viz-bar {
  fill: var(--viz-1);
}
.viz .viz-line {
  fill: none;
  stroke: var(--viz-1);
  stroke-width: 2;
  stroke-linejoin: round;
  stroke-linecap: round;
}
.viz .viz-area {
  fill: var(--viz-1);
  opacity: 0.1;
}
.viz .viz-end,
.viz .viz-pt {
  fill: var(--viz-1);
  stroke: var(--surface);
  stroke-width: 2;
}
.viz .viz-end-label {
  fill: var(--text);
  font-size: 12px;
  font-weight: 650;
}
.viz .viz-hit {
  fill: transparent;
}
.viz .viz-guide {
  stroke: var(--line-strong);
  stroke-width: 1;
  opacity: 0;
}
.viz .viz-pt {
  opacity: 0;
}
.viz-slot:hover .viz-guide,
.viz-slot:hover .viz-pt {
  opacity: 1;
}
.viz-slot:hover .viz-bar {
  opacity: 0.75;
}
.viz-stack {
  display: flex;
  gap: 2px;
  height: 22px;
  border-radius: 6px;
  overflow: hidden;
}
.viz-stack i {
  display: block;
  min-width: 4px;
}
.viz-stack i:hover {
  opacity: 0.8;
}
.viz-legend {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 8px;
  font-size: 14px;
}
.viz-legend li {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto 44px;
  align-items: center;
  gap: 10px;
}
.viz-legend li .muted {
  text-align: right;
  font-size: 13px;
}
.viz-key {
  width: 12px;
  height: 12px;
  border-radius: 3px;
}
.hbars {
  display: grid;
  gap: 10px;
}
.hbar {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 2fr) auto;
  align-items: center;
  gap: 12px;
  font-size: 14px;
}
.hbar-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.hbar-label .muted {
  font-size: 12.5px;
}
.hbar-track {
  height: 12px;
  border-radius: 4px;
  background: color-mix(in srgb, var(--viz-1) 10%, transparent);
  overflow: hidden;
}
.hbar-track i {
  display: block;
  height: 100%;
  border-radius: 0 4px 4px 0;
  background: var(--viz-1);
}
.hbar b {
  font-variant-numeric: tabular-nums;
  min-width: 48px;
  text-align: right;
}
.viz-extra {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 12px;
}
.viz-extra div {
  display: grid;
  gap: 2px;
  padding: 14px 16px;
  border-radius: var(--r-md);
  background: var(--surface-2);
  border: 1px solid var(--line);
}
.viz-extra b {
  font-size: 20px;
  letter-spacing: -0.02em;
}
.viz-extra span {
  font-size: 12.5px;
  color: var(--muted);
}
.viz-table summary {
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
}
.viz-table .table-wrap {
  margin-top: 10px;
  max-height: 360px;
  overflow: auto;
}
.viz-share {
  margin-bottom: 16px;
}
.viz-share input {
  font-family: 'Geist Mono', ui-monospace, monospace;
  font-size: 13px;
  max-width: none !important;
}
#viz-tip {
  position: fixed;
  left: 0;
  top: 0;
  z-index: 200;
  pointer-events: none;
  display: grid;
  gap: 1px;
  padding: 8px 11px;
  border-radius: 10px;
  background: var(--raised, var(--surface));
  border: 1px solid var(--line-strong);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  font-size: 12.5px;
  color: var(--muted);
}
#viz-tip b {
  color: var(--text);
  font-size: 14px;
}
#viz-tip[hidden] {
  display: none;
}
svg.viz.viz-narrow {
  display: none;
}
@media (max-width: 760px) {
  svg.viz.viz-wide {
    display: none;
  }
  svg.viz.viz-narrow {
    display: block;
  }
  .viz-grid {
    grid-template-columns: minmax(0, 1fr);
  }
  .viz-tile-value {
    font-size: 24px;
  }
  .hbar {
    grid-template-columns: minmax(0, 1fr) 90px auto;
  }
}

/* ===== Admin: exchange check (Settings) ===== */
.ex-check {
  display: grid;
  gap: 8px;
  margin: 0 0 12px;
  padding: 0;
  list-style: none;
}
.ex-check li {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 12px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  min-width: 0;
}
.ex-check small {
  grid-column: 1 / -1;
  overflow-wrap: anywhere;
}
.ex-verdict {
  font-weight: 600;
  font-size: var(--fs-sm);
}
.ex-verdict.pass {
  color: var(--up);
}
.ex-verdict.fail {
  color: var(--crash);
}

/* ===== Admin: Telegram banner preview on the market form ===== */
.banner-check {
  display: grid;
  gap: 8px;
}
.banner-check > .btn {
  justify-self: start;
}
.banner-img {
  display: block;
  width: 100%;
  max-width: 640px;
  height: auto;
  border-radius: 10px;
  border: 1px solid var(--line);
}

/* ===== Shareable PnL card ===== */
.pnl-card img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: #07080c;
  aspect-ratio: 1200 / 630;
}
.pnl-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 14px;
}
.pnl-actions .btn {
  justify-content: center;
}
.my-result {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}
.pnl-mini {
  display: inline-grid;
  place-items: center;
  width: 30px;
  height: 30px;
  margin-left: 8px;
  vertical-align: middle;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.pnl-mini:hover {
  color: var(--text);
  border-color: var(--text);
}
.pnl-mini .i {
  width: 15px;
  height: 15px;
}
.inbox li:has(.pnl-mini) {
  grid-template-columns: auto minmax(0, 1fr) auto;
}

/* ===== Admin: markets that open by themselves ===== */
.auto-open {
  display: grid;
  gap: 8px;
  margin-top: 10px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
}
.auto-open[hidden],
.auto-open-at[hidden] {
  display: none;
}
.auto-open-at {
  display: grid;
  gap: 4px;
}
.auto-note {
  display: block;
  margin-top: 4px;
  max-width: 280px;
}

/* ===== Admin: Settings → Team ===== */
.team-list {
  display: grid;
  gap: 8px;
  margin: 0 0 14px;
  padding: 0;
  list-style: none;
}
.team-list li {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
}
.team-who {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}
.team-who .i {
  width: 16px;
  height: 16px;
  flex: none;
}
.team-form {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  gap: 8px;
}
@media (max-width: 560px) {
  .team-form {
    grid-template-columns: 1fr;
  }
}

/* ===== Dashboard: Firstprint wallet and on-chain activity ===== */
.fp-wallet {
  display: inline-grid;
  place-items: center;
  color: var(--accent, var(--up));
}
.fp-wallet .i {
  width: 18px;
  height: 18px;
}
.chain-list {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.chain-list li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.chain-list li > span {
  display: grid;
  gap: 2px;
  min-width: 0;
}
.kpis-mini {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px;
  margin: 12px 0;
}
.kpis-mini dt {
  font-size: var(--fs-sm);
  color: var(--muted);
}
.kpis-mini dd {
  margin: 2px 0 0;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.dash-wallets button.dw-link {
  background: none;
  border: 0;
  padding: 4px;
  color: var(--muted);
  cursor: pointer;
}
.dash-wallets button.dw-link:hover {
  color: var(--text);
}

/* Card footer: status, pool and exchange on one line, the time on its own line, never spilling out. */
.mcard .card-foot {
  flex-wrap: wrap;
  justify-content: flex-start;
  row-gap: 4px;
}
.mcard .card-foot .when {
  flex: 1 0 100%;
  margin-left: 0;
  padding-left: 0;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.mcard .card-foot .card-ex {
  min-width: 0;
  flex: 0 1 auto;
}

/* Featured facts: side by side, each only as wide as it needs; they wrap on narrow screens. */
.feat-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 14px 28px;
}
.feat-facts dd {
  white-space: nowrap;
}
.feat-facts .feat-sub {
  display: block;
  margin: 2px 0 0;
}
@media (max-width: 640px) {
  .feat-facts {
    gap: 12px 22px;
  }
}

/* Featured panel as a flipping deck of the trending markets. */
.feat-deck .hero-slide > .feat {
  height: 100%;
}
.feat-kicker .i {
  width: 13px;
  height: 13px;
  margin-right: 4px;
  vertical-align: -2px;
  color: var(--gold);
}
/* Closing-next card: the close time gets a full row so the date never breaks. */
.hero-next-facts > span:first-child {
  grid-column: 1 / -1;
}
.hero-next-facts b {
  white-space: nowrap;
}

/* ===== Daily streak in the top bar: a flame chip and a small pop-over ===== */
.streak-chip {
  position: relative;
  gap: 4px;
  padding: 0 10px;
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
}
.streak-chip .i {
  width: 16px;
  height: 16px;
  color: var(--muted);
}
.streak-chip.lit .i {
  color: #ff9f0a;
}
.streak-chip.can-claim {
  border-color: color-mix(in srgb, #ff9f0a 55%, transparent);
  background: color-mix(in srgb, #ff9f0a 12%, var(--surface));
}
.streak-chip.can-claim .i {
  color: #ff9f0a;
  /* A few flickers to catch the eye; the orange chip keeps saying "claim me" after that. */
  animation: flameFlicker 1.8s ease-in-out 3;
}
@keyframes flameFlicker {
  0%, 100% { transform: scale(1) rotate(0); }
  40% { transform: scale(1.12) rotate(-4deg); }
  70% { transform: scale(0.96) rotate(3deg); }
}
.streak-dot {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--up);
  box-shadow: 0 0 0 2px var(--surface);
}
.streak-pop {
  position: absolute;
  top: calc(100% + 8px);
  right: 20px;
  z-index: 60;
  width: 320px;
  padding: 16px;
  display: grid;
  gap: 14px;
  border-radius: 14px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  box-shadow: inset 0 1px 0 var(--hairline-hi), 0 24px 48px -16px rgba(0, 0, 0, 0.55);
  animation: menuIn 160ms var(--ease-out);
}
.sp-head {
  display: flex;
  align-items: center;
  gap: 10px;
}
.sp-head b {
  display: block;
  font-size: var(--fs-base);
  font-weight: 600;
}
.sp-head small {
  display: block;
  margin-top: 2px;
  font-size: var(--fs-sm);
  color: var(--muted);
}
.sp-flame {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--muted);
}
.sp-flame.lit {
  background: color-mix(in srgb, #ff9f0a 16%, transparent);
  color: #ff9f0a;
}
.sp-flame .i {
  width: 18px;
  height: 18px;
}
.sp-days {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.sp-day {
  display: grid;
  justify-items: center;
  gap: 4px;
  text-align: center;
}
.sp-dot {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1.5px solid var(--line-strong);
  color: #fff;
}
.sp-dot .i {
  width: 14px;
  height: 14px;
  stroke-width: 2.6;
}
.sp-day.done .sp-dot {
  border-color: var(--up);
  background: var(--up);
}
.sp-day.today .sp-dot {
  border-color: #ff9f0a;
  box-shadow: 0 0 0 3px color-mix(in srgb, #ff9f0a 22%, transparent);
}
.sp-day b {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.sp-day.next b {
  color: var(--muted);
}
.sp-day small {
  font-size: 10px;
  color: var(--muted);
  white-space: nowrap;
}
.sp-claim {
  width: 100%;
  justify-content: center;
}
.sp-rule {
  margin: 0;
  font-size: 11.5px;
  color: var(--muted);
}
@media (max-width: 640px) {
  .streak-pop {
    position: fixed;
    top: 64px;
    left: 12px;
    right: 12px;
    width: auto;
  }
}

/* ===== Dashboard, portfolio style: balance and P/L cards, a stat strip, positions ===== */
.pf-top {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
  gap: var(--dash-gap);
}
.pf-card {
  position: relative;
  display: grid;
  align-content: start;
  gap: 12px;
  min-width: 0;
  padding: 20px 22px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  overflow: hidden;
}
.pf-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.pf-label .i {
  width: 14px;
  height: 14px;
}
.pf-value {
  font-family: var(--mono);
  font-size: 34px;
  font-weight: 500;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.pf-value .unit {
  margin-left: 6px;
  font-size: 14px;
  letter-spacing: 0;
  color: var(--muted);
}
.pf-sub {
  margin: -6px 0 0;
  font-size: var(--fs-sm);
  color: var(--muted);
}
.pf-bar {
  height: 6px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--gold) 70%, transparent);
  overflow: hidden;
}
.pf-bar i {
  display: block;
  height: 100%;
  background: var(--up);
  border-right: 2px solid var(--surface);
}
.pf-split {
  display: flex;
  gap: 28px;
  margin: 0;
}
.pf-split dt {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-sm);
  color: var(--muted);
}
.pf-split dd {
  margin: 2px 0 0;
  font-family: var(--mono);
  font-size: var(--fs-md);
  font-variant-numeric: tabular-nums;
}
.pf-key {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.pf-key.avail {
  background: var(--up);
}
.pf-key.play {
  background: var(--gold);
}
.pf-actions {
  display: flex;
  gap: 8px;
  margin-top: 4px;
}
.pnl-range {
  display: inline-flex;
  margin-left: auto;
  padding: 2px;
  gap: 2px;
  border: 1px solid var(--line);
  border-radius: 999px;
}
.pnl-range button {
  padding: 3px 9px;
  border: 0;
  border-radius: 999px;
  background: none;
  color: var(--muted);
  font: inherit;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  cursor: pointer;
}
.pnl-range button[aria-pressed='true'] {
  background: var(--surface-2);
  color: var(--text);
}
.pnl-chart {
  display: block;
  width: calc(100% + 44px);
  height: 92px;
  margin: 4px -22px -20px;
}
.pnl-zero {
  stroke: var(--line-strong);
  stroke-width: 1;
  stroke-dasharray: 3 4;
}
.pnl-line {
  fill: none;
  stroke-width: 2;
}
.pnl-line.up {
  stroke: var(--up);
}
.pnl-line.crash {
  stroke: var(--crash);
}
.pnl-flat {
  height: 1px;
  margin: 46px 0 45px;
  background: repeating-linear-gradient(90deg, var(--line-strong) 0 3px, transparent 3px 7px);
}
.stat-strip {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  margin: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
}
.stat-strip > div {
  padding: 14px 18px;
  min-width: 0;
}
.stat-strip > div + div {
  border-left: 1px solid var(--line);
}
.stat-strip dt {
  font-size: 11.5px;
  color: var(--muted);
}
.stat-strip dd {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin: 4px 0 0;
  font-family: var(--mono);
  font-size: var(--fs-md);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.stat-strip dd small {
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 11px;
  font-weight: 400;
  color: var(--muted);
}
.pos-table td small.muted {
  display: block;
  margin-top: 2px;
  font-size: 11px;
}
.pos-table .mkt-cell > span {
  display: grid;
}
.pos-note {
  margin: 10px 16px 14px;
}
@media (max-width: 900px) {
  .pf-top {
    grid-template-columns: minmax(0, 1fr);
  }
  .stat-strip {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .stat-strip > div:nth-child(4) {
    border-left: 0;
  }
  .stat-strip > div:nth-child(n + 4) {
    border-top: 1px solid var(--line);
  }
}
@media (max-width: 480px) {
  .pf-value {
    font-size: 28px;
  }
  .stat-strip > div {
    padding: 12px;
  }
}

/* ===== Market cards: clean, and visibly live =====
   Motion only ever reflects what is real: the pulse and sheen are decoration, numbers tick only
   when they actually change, and "+N" appears only when new players join. */
.mcard {
  position: relative;
}
.mcard .o-row {
  position: relative;
  isolation: isolate;
  padding: 6px 8px;
  margin: 0 -8px;
  border-radius: 9px;
  overflow: hidden;
}
/* The crowd's share as a bar behind each outcome, like depth in an order book. */
.mcard .o-row::before {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  z-index: -1;
  /* Stops short of the pick button: the share fills only the name and percentage. */
  width: calc((100% - 92px) * var(--sf, 0));
  background: color-mix(in srgb, var(--c) 13%, transparent);
  border-radius: inherit;
  transition: width 0.8s var(--ease-out, ease);
}
.mcard .card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: nowrap;
}
.card-act {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--muted);
  font-size: 12px;
}
.card-act .i {
  width: 13px;
  height: 13px;
}
.card-act .tick {
  color: var(--text);
  font-weight: 500;
}
.card-act.quiet {
  font-style: normal;
}
/* "+N" when new players join, floating up from the corner. */
.card-bump {
  position: absolute;
  top: 12px;
  right: 14px;
  z-index: 3;
  padding: 2px 8px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--up) 18%, var(--surface));
  color: var(--up);
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  pointer-events: none;
  animation: bumpUp 2.4s ease-out forwards;
}
@keyframes bumpUp {
  0% { opacity: 0; transform: translateY(8px) scale(0.9); }
  15% { opacity: 1; transform: translateY(0) scale(1); }
  70% { opacity: 1; transform: translateY(-10px); }
  100% { opacity: 0; transform: translateY(-22px); }
}
.mcard.has-new {
  animation: cardGlow 1.6s ease-out;
}
@keyframes cardGlow {
  0% { box-shadow: 0 0 0 1px color-mix(in srgb, var(--up) 55%, transparent), 0 0 24px -6px color-mix(in srgb, var(--up) 45%, transparent); }
  100% { box-shadow: 0 0 0 1px transparent, 0 0 0 0 transparent; }
}
@media (prefers-reduced-motion: reduce) {
  .mcard .o-row::after {
    display: none;
  }
}

.mcard .o-row .qp-sm {
  width: 76px;
  justify-content: center;
}
.foot-l {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.card-timer {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.card-timer .i {
  width: 12px;
  height: 12px;
}
.card-timer.today {
  color: var(--down);
  background: color-mix(in srgb, var(--down) 12%, transparent);
}
.card-timer.urgent {
  color: var(--crash);
  background: color-mix(in srgb, var(--crash) 14%, transparent);
}

/* ===== Admin → Find tokens ===== */
.discover {
  display: grid;
  gap: 16px;
}
.discover .section-head {
  align-items: center;
}
.discover .section-head > .btn {
  margin-left: auto;
}
.disc-ex {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 4px 0 14px;
}
.disc-ex-item {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 2px;
  border: 1px solid var(--line);
  border-radius: 999px;
}
.disc-ex-item .btn {
  border: 0;
}
.disc-ex-item.on {
  border-color: color-mix(in srgb, var(--brand, #0a84ff) 60%, transparent);
  background: color-mix(in srgb, var(--brand, #0a84ff) 10%, transparent);
}
.disc-ex-item .icon-btn {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  color: var(--muted);
}
.disc-ex-item .icon-btn .i {
  width: 14px;
  height: 14px;
}
.disc-table td {
  vertical-align: middle;
}
.disc-table td small {
  display: block;
  font-size: 12px;
}
.disc-tok {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.disc-tok img {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  object-fit: cover;
}
.disc-chg {
  margin-left: 6px;
  font-family: var(--mono);
  font-size: 12px;
}
.disc-chg.up { color: var(--up); }
.disc-chg.down { color: var(--crash); }
.disc-links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

/* =====================================================================
   Admin, clean pass: smaller headings, numbers first, long help folded
   into "How it works", grouped market form.
   ===================================================================== */

.admin-main .panel {
  padding: 18px 20px;
  margin-bottom: 14px;
}
.admin-main .panel-flush {
  padding: 0;
}
.admin-main .panel-flush > .section-head {
  padding: 14px 20px 10px;
}
.admin-main .section-head {
  gap: 10px;
  margin-bottom: 12px;
}
.admin-main .section-head h2 {
  font-size: 16px;
}
.admin-main .section-head p {
  margin-top: 1px;
  font-size: 13px;
}
.admin-main .section-ico {
  width: 30px;
  height: 30px;
  border-radius: 9px;
}
.admin-main .section-ico .i {
  width: 16px;
  height: 16px;
}
.admin-top {
  margin-bottom: 16px;
  align-items: center;
}
.admin-top .page-title {
  margin: 0 0 2px;
}
.admin-top p {
  font-size: 14px;
}

/* Headline numbers */
.adm-stats {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 1px;
  margin-bottom: 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--line);
  overflow: hidden;
}
.adm-stat {
  all: unset;
  box-sizing: border-box;
  display: grid;
  gap: 2px;
  padding: 14px 16px;
  background: var(--surface);
  cursor: pointer;
  transition: background 0.15s;
}
.adm-stat:hover {
  background: var(--surface-2);
}
.adm-stat:focus-visible {
  outline: 2px solid var(--focus, var(--brand));
  outline-offset: -2px;
}
.adm-stat-l {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  color: var(--muted);
}
.adm-stat-l::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--c);
}
.adm-stat b {
  font-size: 24px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}
.adm-stat small {
  font-size: 12px;
  color: var(--muted);
}
@media (max-width: 900px) {
  .adm-stats {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .adm-stat:last-child {
    grid-column: 1 / -1;
  }
}

/* One panel, a few tabs */
.adm-tabs {
  display: flex;
  gap: 4px;
  margin: -4px 0 14px;
  border-bottom: 1px solid var(--line);
}
.adm-tabs button {
  all: unset;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 10px 10px;
  margin-bottom: -1px;
  font-size: 14px;
  font-weight: 500;
  color: var(--muted);
  border-bottom: 2px solid transparent;
  cursor: pointer;
}
.adm-tabs button[aria-selected='true'] {
  color: var(--text);
  border-bottom-color: var(--text);
}
.adm-tabs button:focus-visible {
  outline: 2px solid var(--focus, var(--brand));
  border-radius: 6px;
}
.admin-main .todo {
  gap: 8px;
}
.admin-main .todo li {
  padding: 10px 12px;
}
.admin-main .todo-ico {
  width: 30px;
  height: 30px;
  border-radius: 9px;
}

/* Folded sections */
.adm-collapse {
  margin-bottom: 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--surface);
}
.adm-collapse > summary,
.adm-row > summary {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 12px 16px;
  cursor: pointer;
  list-style: none;
}
.adm-collapse > summary::-webkit-details-marker,
.adm-row > summary::-webkit-details-marker,
.adm-how > summary::-webkit-details-marker,
.mf-more > summary::-webkit-details-marker {
  display: none;
}
.adm-collapse > summary::after,
.adm-row > summary::after,
.mf-more > summary::after {
  content: '';
  width: 7px;
  height: 7px;
  margin-left: auto;
  border-right: 1.5px solid var(--muted);
  border-bottom: 1.5px solid var(--muted);
  transform: rotate(45deg) translateY(-2px);
  transition: transform 0.15s;
}
.adm-collapse[open] > summary::after,
.adm-row[open] > summary::after,
.mf-more[open] > summary::after {
  transform: rotate(225deg) translateY(-2px);
}
.adm-collapse > summary .i {
  width: 16px;
  height: 16px;
}
.adm-collapse > summary .muted {
  font-size: 13px;
}
.adm-collapse > :not(summary) {
  margin: 0 16px 14px;
}
.adm-collapse-foot {
  display: flex;
  justify-content: flex-end;
}
.adm-warn > summary .i {
  color: var(--warn);
}
.adm-warn.high {
  border-color: color-mix(in srgb, var(--crash) 35%, var(--line));
}
.adm-warn.high > summary .i {
  color: var(--crash);
}
.adm-warn .check-list {
  margin-top: 0;
}

/* Results waiting: one row each, the form opens below */
.adm-row {
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
}
.adm-row + .adm-row {
  margin-top: 8px;
}
.adm-row > summary {
  padding: 10px 12px;
}
.adm-row-cta {
  margin-left: auto;
  font-size: 13px;
  font-weight: 600;
  color: var(--crash);
}
.adm-row > summary::after {
  margin-left: 6px;
}
.adm-row .admin-result {
  margin: 0;
  border: 0;
  border-top: 1px solid var(--line);
  border-radius: 0 0 var(--r-md) var(--r-md);
}

/* "How it works" */
.adm-how {
  margin-top: 10px;
  font-size: 13px;
}
.adm-how > summary {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--muted);
  cursor: pointer;
  list-style: none;
  border: 0 !important;
  padding: 0 !important;
  font-weight: 500;
}
.adm-how > summary::before {
  content: '' !important;
  width: 5px;
  height: 5px;
  border-right: 1.5px solid currentColor;
  border-bottom: 1.5px solid currentColor;
  transform: rotate(-45deg);
  transition: transform 0.15s;
}
.adm-how[open] > summary::before {
  transform: rotate(45deg);
}
.adm-how > summary:hover {
  color: var(--text);
}
.adm-how > p {
  margin: 8px 0 0;
  max-width: 72ch;
  color: var(--muted);
  line-height: 1.55;
}
.admin-main .section-head .toggle.head-action {
  padding: 0;
  border: 0;
  background: none;
}

/* Market form */
.admin-main .mf {
  display: grid;
  gap: 0;
}
.mf-type {
  display: inline-flex;
  justify-self: start;
  gap: 2px;
  margin: 0;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
}
.mf-type label {
  display: block !important;
  cursor: pointer;
}
.mf-type input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}
.mf-type span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 500;
  color: var(--muted);
}
.mf-type .i {
  width: 15px;
  height: 15px;
}
.mf-type input:checked + span {
  background: var(--surface-2);
  color: var(--text);
  box-shadow: inset 0 0 0 1px var(--line-strong);
}
.mf-type input:focus-visible + span {
  outline: 2px solid var(--focus, var(--brand));
}
.mf-type:disabled {
  opacity: 0.6;
}
.mf-hint {
  margin: 8px 0 4px;
  font-size: 13px;
  color: var(--muted);
}
.mf-note {
  margin: 10px 0 0;
  padding: 10px 12px;
  border-radius: var(--r-md);
  background: color-mix(in srgb, var(--warn) 9%, transparent);
  font-size: 13px;
}
.mf-group {
  display: grid;
  gap: 12px;
  padding: 18px 0;
  border-bottom: 1px solid var(--line);
}
.mf-h {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.mf-cols {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.mf-cols-3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
@media (max-width: 720px) {
  .mf-cols,
  .mf-cols-3 {
    grid-template-columns: minmax(0, 1fr);
  }
}
.mf .utc-hint {
  margin-top: 4px;
}
.mf-fine {
  margin: 0;
  font-size: 12.5px;
  color: var(--muted);
}
.mf .upcoming-opt {
  display: grid;
  gap: 0;
}
.mf .upcoming-opt .adm-how {
  margin-top: 6px;
}
.mf .auto-open {
  display: grid;
  gap: 10px;
  margin-top: 12px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
}
.mf .auto-open[hidden] {
  display: none;
}
.mf .auto-open .adm-how {
  margin-top: 0;
}
.mf-tools {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.mf #price-check-out:empty,
.mf #banner-preview-out:empty {
  display: none;
}
.mf .banner-check {
  margin: 0;
}
.mf-more {
  border-bottom: 1px solid var(--line);
}
.mf-more > summary {
  display: flex !important;
  align-items: center;
  padding: 16px 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  font-size: 14px;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  list-style: none;
}
.mf-more > summary::before {
  content: none !important;
}
.mf-more > summary:hover {
  color: var(--text);
}
.mf-more > .mf-cols {
  padding-bottom: 18px;
}
.mf-actions {
  padding-top: 18px;
}

/* Logo row: icon and text side by side on the Upload button */
.admin-main .admin-form label.logo-upload {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.logo-row .logo-link {
  flex: 1 1 220px;
}
.admin-main .mf-cols > label {
  align-content: start;
}
.mf-type label {
  position: relative;
}

/* "⋯" menu on admin table rows */
.row-menu {
  position: relative;
}
.row-menu > summary {
  list-style: none;
  padding-inline: 8px;
}
.row-menu > summary::-webkit-details-marker {
  display: none;
}
.row-menu > summary .i {
  margin: 0;
}
.row-menu-list {
  position: fixed;
  z-index: 60;
  display: grid;
  min-width: 190px;
  padding: 5px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  background: var(--raised, var(--surface-2));
  box-shadow: var(--shadow-lg);
}
.row-menu-item {
  all: unset;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 13.5px;
  white-space: nowrap;
  cursor: pointer;
}
.row-menu-item:hover,
.row-menu-item:focus-visible {
  background: color-mix(in srgb, var(--text) 8%, transparent);
}
.row-menu-item .i {
  width: 15px;
  height: 15px;
}
.row-menu-item.danger {
  color: var(--crash);
}

@media (max-width: 640px) {
  .admin-main .todo li {
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px;
  }
  .admin-main .todo-ico {
    display: none;
  }
  .admin-main .todo li > .btn {
    grid-column: auto;
  }
  .admin-main .todo li .todo-actions {
    grid-column: 1 / -1;
  }
  .adm-collapse > summary .muted {
    display: none;
  }
  .adm-collapse > summary .count-badge + .muted,
  .adm-collapse > summary b + .muted {
    display: none;
  }
}

/* Market form: "Close in" presets and the price check link */
.mf-presets {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 13px;
}
.mf-presets .muted {
  margin-right: 4px;
}
.mf-presets .chip-btn {
  all: unset;
  padding: 5px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}
.mf-presets .chip-btn:hover {
  border-color: var(--line-strong);
}
.mf-presets .chip-btn.on {
  border-color: var(--text);
  background: var(--surface-2);
}
.mf-presets .chip-btn:focus-visible {
  outline: 2px solid var(--focus, var(--brand));
}
.mf-verify {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin: 0;
  font-size: 13px;
  color: var(--muted);
}
.mf-verify > .i {
  width: 15px;
  height: 15px;
  color: var(--up);
}
.mf-verify a {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 600;
}
.mf-verify a .i {
  width: 13px;
  height: 13px;
}
.mf .upcoming-opt[hidden] {
  display: none;
}

/* Find tokens: a token that already got a market in this visit */
.disc-made {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  font-weight: 600;
  color: var(--up);
  white-space: nowrap;
}
.disc-made .i {
  width: 15px;
  height: 15px;
}
.head-action.row-gap {
  display: inline-flex;
  gap: 8px;
  flex-wrap: wrap;
}
/* A wide table scrolls inside its panel; it never widens the page. */
.admin-main {
  min-width: 0;
}

/* Markets priced at the close: the note on the market page, the Countdown tab intro and the result timer. */
.m-upcoming.m-atclose {
  border-color: color-mix(in srgb, var(--up) 30%, var(--line));
  background: color-mix(in srgb, var(--up) 6%, transparent);
}
.m-upcoming.m-atclose > .i {
  color: var(--up);
}
.countdown-note {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  line-height: 1.5;
}
.countdown-note .i {
  flex: none;
  width: 14px;
  height: 14px;
  margin-top: 3px;
}
.card-timer.card-timer-result {
  color: var(--text);
}
.mf-presets .muted {
  min-width: 108px;
}
.mf .start-close-check {
  width: fit-content;
  max-width: 100%;
}

/* The selected tab is marked in the text colour, not brand blue: white in dark mode, black in light mode.
   Blue stays for actions (buttons, links). */
.nav a[aria-current='page'] .i,
.tabbar a[aria-current='page'] .i,
.subnav a[aria-current='page'] .i,
.home-side button[aria-current='true'] .i,
.admin-nav button[aria-current='page'] .i,
.tabs button[aria-selected='true'] .i,
.tabs-scroll button[aria-selected='true'] .i {
  color: var(--text);
}
.dash-tabs button[aria-selected='true']::after {
  background: var(--text);
}
.dash-tabs.seg-on::before {
  background: var(--text);
}

/* How it works: the same type as the market cards above (16px titles, 14px muted body), not a bigger, bolder block. */
.steps {
  gap: 14px;
}
.steps li {
  padding: 18px;
}
.steps li::after {
  top: 16px;
  right: 18px;
  font-family: var(--mono);
  font-size: var(--fs-sm);
  font-weight: 500;
  color: var(--muted);
  opacity: 0.6;
}
.steps .step-ico {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  margin-bottom: 12px;
}
.steps .step-ico .i {
  width: 18px;
  height: 18px;
}
.steps li > b {
  display: block;
  font-family: var(--body);
  font-size: var(--fs-md);
  font-weight: 600;
  line-height: var(--lh-snug);
  letter-spacing: -0.01em;
}
.steps p {
  margin: 6px 0 0;
  font-size: var(--fs-sm);
  line-height: 1.6;
}
.steps p .oc {
  font-family: inherit;
  font-size: inherit;
  font-weight: 500;
  white-space: nowrap;
}
.steps p .oc .i {
  width: 13px;
  height: 13px;
  margin-right: 3px;
  vertical-align: -2px;
}
/* Icon tiles without their own colour use the text colour, not blue. */
.card-ico,
.tile-ico,
.todo-ico,
.start-ico,
.claim-ico {
  color: var(--c, var(--text));
  background: color-mix(in srgb, var(--c, var(--text)) 10%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c, var(--text)) 18%, transparent);
}
.task-ico {
  color: var(--text);
  background: color-mix(in srgb, var(--text) 10%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text) 18%, transparent);
}
/* Old markets: "Close now" is the destructive one, in red; the "all" buttons sit together. */
.btn.btn-close-now {
  color: #fff;
  background: var(--crash);
  border-color: var(--crash);
}
.btn.btn-close-now:hover {
  background: color-mix(in srgb, var(--crash) 85%, #000);
  border-color: color-mix(in srgb, var(--crash) 85%, #000);
}
.adm-fix-all {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-left: auto;
}
/* "All markets" under Trending on the home page. */
.home-head.home-subhead {
  margin-top: 32px;
  align-items: center;
  gap: 10px;
}
.home-subhead .side-n {
  font-size: 13px;
}
/* Price warnings: the actions beside each, and the switch-all bar at the top. */
.check-list li .check-actions {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 8px;
}
.adm-warn-all {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 4px 0 12px;
}
.adm-warn-all p {
  margin: 0;
  font-size: 13px;
}

/* Plain toasts: a quiet dark card instead of a bright white pill. */
#toast {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  padding: 10px 14px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.35;
  box-shadow: var(--shadow-lg);
  max-width: min(360px, calc(100vw - 32px));
  transform: translate(-50%, 12px) scale(0.98);
  transition: opacity 180ms, transform 260ms var(--ease-out);
}
#toast.show {
  transform: translate(-50%, 0) scale(1);
}
#toast.error {
  border-color: transparent;
}

/* The prediction toast: token logo, the pick in its colour, the stake leaving in red. */
#toast.pick {
  padding: 8px 14px 8px 8px;
  border-radius: 16px;
  text-align: left;
  width: max-content;
}
.pt {
  display: flex;
  align-items: center;
  gap: 10px;
}
.pt .pt-logo {
  width: 34px;
  height: 34px;
  flex: none;
  font-size: 13px;
}
.pt-body {
  display: grid;
  gap: 1px;
  min-width: 0;
}
.pt-pick {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 15px;
  font-weight: 600;
  color: var(--c);
  white-space: nowrap;
}
.pt-pick .i {
  width: 15px;
  height: 15px;
}
.pt-pick small {
  margin-left: 3px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
}
.pt-win {
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.pt-amt {
  margin-left: 14px;
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 600;
  color: var(--crash);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
#toast.pick.show .pt-amt {
  animation: pt-amt 420ms 80ms var(--ease-out) both;
}
@keyframes pt-amt {
  from { opacity: 0; transform: translateY(-6px); }
}
@media (prefers-reduced-motion: reduce) {
  #toast,
  #toast.show {
    transform: translate(-50%, 0);
    transition: opacity 160ms;
  }
  #toast.pick.show .pt-amt {
    animation: none;
  }
}
/* On a market page the phone's "Make a prediction" bar sits above the tab bar: keep toasts above both. */
@media (max-width: 900px) {
  body:has(.mobile-bar) #toast {
    bottom: calc(154px + env(safe-area-inset-bottom));
  }
}
@media (max-width: 640px) {
  body:has(.mobile-bar) #toast {
    bottom: calc(142px + env(safe-area-inset-bottom));
  }
}

/* "You 100" on a rung: a soft chip in the outcome's colour instead of a bright white pill. */
.tag-you {
  background: color-mix(in srgb, var(--c, var(--text)) 16%, transparent);
  color: var(--c, var(--text));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c, var(--text)) 35%, transparent);
  font-weight: 600;
}

/* Card footer, right: participants, then when the result comes. */
.mcard .foot-r {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
  min-width: 0;
}
.card-result {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--muted);
  font-size: 12px;
}
.card-result .i {
  width: 13px;
  height: 13px;
}
.card-result b {
  margin-left: 2px;
  color: var(--text);
  font-weight: 500;
}
@media (max-width: 360px) {
  .mcard .card-foot {
    flex-wrap: wrap;
    row-gap: 6px;
  }
}

/* An open market: a small green dot on the token logo says it's live. */
.av-live {
  position: relative;
  display: inline-flex;
  flex: none;
}
.av-live .live-dot {
  position: absolute;
  right: 1px;
  top: 1px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--up);
  box-shadow: 0 0 0 2.5px var(--surface);
}
.av-live .live-dot::after {
  /* A soft ring that breathes a few times, then rests: says "live" without costing idle CPU. */
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: var(--up);
  animation: live-ring 2s ease-out 3;
}
@keyframes live-ring {
  from { transform: scale(1); opacity: 0.6; }
  to { transform: scale(2.4); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .av-live .live-dot::after {
    animation: none;
    opacity: 0;
  }
}

/* Where a token is listed: the exchange's mark in its brand colour, then its name. */
.mcard .card-name {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.card-nm {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ex-badge {
  display: inline-flex;
  flex: none;
  align-items: center;
  gap: 4px;
  padding: 1px 7px 1px 2px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
  line-height: 16px;
  white-space: nowrap;
}
.ex-badge i {
  display: grid;
  place-items: center;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  font-style: normal;
  font-size: 8.5px;
  font-weight: 800;
  line-height: 1;
}
.ex-badge small {
  font-size: 10px;
  opacity: 0.8;
}

/* Where to grab a logo by hand: the token's exchange pages, the announcement, an image search. */
.logo-sources {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
}
.logo-sources .muted {
  flex-basis: 100%;
  font-size: 12px;
}
.logo-sources:empty {
  display: none;
}

/* Admin → Overview: test points for the admin's own account. */
.adm-topup .topup-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.topup-custom {
  display: inline-flex;
  gap: 6px;
}
.topup-custom {
  align-items: center;
}
.topup-custom input {
  width: 110px;
  height: 36px;
  padding: 0 12px;
  border-radius: 999px;
  font-size: 14px;
}

/* Test points panel: title and balance in one row, quick amounts, then where the points are. */
.adm-topup {
  display: grid;
  gap: 14px;
}
.topup-head {
  display: flex;
  align-items: center;
  gap: 12px;
}
.topup-head > div:not(.topup-bal) {
  flex: 1;
  min-width: 0;
}
.topup-head h2 {
  margin: 0;
  font-size: 16px;
}
.topup-head p {
  margin: 2px 0 0;
  font-size: 13px;
}
.topup-bal {
  display: grid;
  justify-items: end;
  line-height: 1.1;
}
.topup-bal small {
  font-size: 11px;
  color: var(--muted);
}
.topup-bal b {
  font-family: var(--mono);
  font-size: 20px;
  font-weight: 600;
  color: var(--warn);
  font-variant-numeric: tabular-nums;
}
.topup-chip {
  min-width: 76px;
  justify-content: center;
}
.topup-chip.is-busy {
  opacity: 1;
}
.topup-status {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 12px;
  font-size: 13px;
}
.topup-status:empty {
  display: none;
}
.topup-pending,
.topup-done {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.topup-pending {
  color: var(--text);
}
.topup-pending b {
  color: var(--warn);
}
.topup-done {
  color: var(--up);
}
.topup-status .i {
  width: 15px;
  height: 15px;
}
.topup-status .muted {
  font-size: 12px;
}
.spin {
  display: inline-block;
  flex: none;
  width: 13px;
  height: 13px;
  margin-right: 6px;
  border: 2px solid color-mix(in srgb, currentColor 25%, transparent);
  border-top-color: currentColor;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
.topup-pending .spin {
  margin-right: 0;
  color: var(--warn);
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@media (prefers-reduced-motion: reduce) {
  .spin {
    animation-duration: 2.4s;
  }
}
.adm-topup .topup-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr)) auto;
  gap: 8px;
}
.topup-chip {
  min-width: 0;
}
.topup-pending {
  display: block;
  line-height: 1.45;
}
.topup-pending .spin,
.topup-pending .i {
  vertical-align: -2px;
  margin-right: 6px;
}
.topup-pending b {
  white-space: nowrap;
}
@media (max-width: 640px) {
  .adm-topup .topup-row {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .adm-topup .topup-custom {
    grid-column: 1 / -1;
  }
  .adm-topup .topup-custom input {
    flex: 1;
    width: auto;
  }
}

/* Prediction toast, v2: token on the left; the pick as a chip above the stake on the right. */
.pt-sym {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.pt-side {
  display: grid;
  justify-items: end;
  gap: 4px;
  margin-left: 18px;
}
.pt-side .pt-pick {
  gap: 4px;
  padding: 2px 9px 2px 7px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  line-height: 18px;
  background: color-mix(in srgb, var(--c) 14%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent);
}
.pt-side .pt-pick .i {
  width: 13px;
  height: 13px;
}
.pt-side .pt-amt {
  margin-left: 0;
  font-size: 14px;
  line-height: 1;
}
/* The prediction toast stays readable above the celebration confetti. */
#toast.pick {
  z-index: 75;
}

/* Dashboard chart ranges: easy to tap on a phone (at least 32px tall). */
@media (pointer: coarse), (max-width: 900px) {
  .pnl-range button {
    min-width: 40px;
    min-height: 32px;
  }
}

/* Phones: a more solid top bar, so text scrolling under it doesn't show through, and the
   "Closes in" line on the market page stays on one line on the narrowest screens. */
@media (max-width: 640px) {
  .topbar {
    background: color-mix(in srgb, var(--bg) 97%, transparent);
  }
}
@media (max-width: 360px) {
  .mobile-bar p {
    font-size: 13px;
    white-space: nowrap;
  }
  .mobile-bar .cta {
    padding-left: 16px;
    padding-right: 16px;
  }
}

/* Maintenance: a calm full-screen card for players while an update is deployed. */
#maint {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: grid;
  place-items: center;
  padding: 24px 16px;
  background: color-mix(in srgb, var(--bg) 96%, transparent);
}

}
.maint-card {

}
.maint-card h1 {

.maint-card p {

.maint-ico {

@keyframes maint-dot {

/* Admin: Back to the previous tab, left of the page title. */
.admin-head {

.admin-back {

.ex-badge .ex-logo img {

/* Loading: the Firstprint mark in the middle of the screen, its five bars rising and falling like a
   volume meter. It fades in only if loading takes longer than a moment, so quick pages never flash it. */
.fp-loader {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: grid;
  place-items: center;
  pointer-events: none;
  opacity: 0;
  animation: ld-in 200ms ease-out 180ms forwards;
}
.ld-mark {
  display: grid;
  gap: 5px;
  width: 44px;
  padding: 16px 14px;
  border-radius: 18px;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
}
.ld-mark i {
  display: block;
  height: 6px;
  border-radius: 3px;
  transform-origin: left center;
  animation: ld-bar 900ms cubic-bezier(0.45, 0, 0.55, 1) infinite;
}
.ld-mark i:nth-child(1) { background: var(--moon); animation-delay: 0ms; }
.ld-mark i:nth-child(2) { background: var(--up); animation-delay: 120ms; }
.ld-mark i:nth-child(3) { background: var(--flat); animation-delay: 240ms; }
.ld-mark i:nth-child(4) { background: var(--down); animation-delay: 360ms; }
.ld-mark i:nth-child(5) { background: var(--crash); animation-delay: 480ms; }
@keyframes ld-bar {
  0%, 100% { transform: scaleX(0.3); }
  50% { transform: scaleX(1); }
}
@keyframes ld-in {
  to { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .ld-mark i { animation-duration: 2.4s; }
}
.ld-mark {
  width: auto;
  grid-template-columns: 40px;
  padding: 18px 20px;
}
/* Just the five moving bars: no box around them. */
.ld-mark {
  padding: 0;
  border: 0;
  border-radius: 0;
  background: none;
  box-shadow: none;
}

/* Loader in the logo's shape: long bars top and bottom, the middle one short, all centred.
   The bars breathe from the centre in a mirrored wave (outer pair, inner pair, middle), so the
   mark keeps its symmetric X-like shape while it moves. */
.ld-mark {
  grid-template-columns: 48px;
  justify-items: center;
  gap: 6px;
}
.ld-mark i {
  transform-origin: center;
  animation: ld-breathe 1100ms cubic-bezier(0.45, 0, 0.55, 1) infinite;
}
.ld-mark i:nth-child(1),
.ld-mark i:nth-child(5) { width: 100%; animation-delay: 0ms; }
.ld-mark i:nth-child(2),
.ld-mark i:nth-child(4) { width: 80%; animation-delay: 140ms; }
.ld-mark i:nth-child(3) { width: 60%; animation-delay: 280ms; }
@keyframes ld-breathe {
  0%, 100% { transform: scaleX(1); }
  50% { transform: scaleX(0.45); }
}
/* All bars move together; the closer to the middle, the deeper they shrink, so the middle bar is
   always the shortest and the mark keeps the logo's X shape as it breathes. */
.ld-mark i:nth-child(1),
.ld-mark i:nth-child(5) { animation: ld-outer 1100ms cubic-bezier(0.45, 0, 0.55, 1) infinite; }
.ld-mark i:nth-child(2),
.ld-mark i:nth-child(4) { animation: ld-inner 1100ms cubic-bezier(0.45, 0, 0.55, 1) infinite; }
.ld-mark i:nth-child(3) { animation: ld-middle 1100ms cubic-bezier(0.45, 0, 0.55, 1) infinite; }
@keyframes ld-outer {
  0%, 100% { transform: scaleX(1); }
  50% { transform: scaleX(0.9); }
}
@keyframes ld-inner {
  0%, 100% { transform: scaleX(1); }
  50% { transform: scaleX(0.6); }
}
@keyframes ld-middle {
  0%, 100% { transform: scaleX(1); }
  50% { transform: scaleX(0.25); }
}
@media (prefers-reduced-motion: reduce) {
  .ld-mark i:nth-child(n) { animation-duration: 3s; }
}

/* After a page of cards: "Show more" for players, an invitation to sign up for guests. */
.see-more {
  display: flex;
  justify-content: center;
  margin: 18px 0 6px;
}
.see-more .btn .muted {
  margin-left: 4px;
  font-weight: 400;
}
.see-more-guest {
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 22px 18px;
  border: 1px dashed var(--line-strong);

}
.see-more-guest p {

}
.see-more-guest p b {

}

/* Long pages: blocks far below the screen skip layout and paint until they scroll near it (they
   keep their last size, so the scrollbar doesn't jump). The margin keeps card shadows unclipped. */
.grid > .mcard:nth-child(n + 7) {
  content-visibility: auto;
  contain-intrinsic-size: auto 240px;
  overflow-clip-margin: 24px;
}
#how {
  content-visibility: auto;
  contain-intrinsic-size: auto 900px;
  overflow-clip-margin: 24px;
}
/* (Only skipped while off screen: on wide screens, where it sits beside the list, nothing changes.) */
.home-rail {
  content-visibility: auto;
  contain-intrinsic-size: auto 600px;
  overflow-clip-margin: 24px;
}

/* The Earn link's colour: gold on dark, a deeper amber on light so it stays readable. */
:root {
  --earn: var(--gold);
}
:root[data-theme='light'] {
  --earn: #b7791f;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme='dark']) {
    --earn: #b7791f;
  }
}
/* Earn, next to Markets, glows so the eye goes there next; a pulsing dot when there's something to collect. */
.subnav a.nav-earn,
#tabbar a.nav-earn {
  color: var(--earn);
}
.subnav a.nav-earn {
  text-shadow: 0 0 14px color-mix(in srgb, var(--earn) 55%, transparent);
}
.subnav a.nav-earn .i,
#tabbar a.nav-earn .i {
  color: var(--earn);
  filter: drop-shadow(0 0 6px color-mix(in srgb, var(--earn) 70%, transparent));
}
.subnav a.nav-earn[aria-current='page']::after {
  background: var(--earn);
  box-shadow: 0 0 10px color-mix(in srgb, var(--earn) 70%, transparent);
}
.subnav a.nav-earn.has-more::before,
#tabbar a.nav-earn.has-more::before {
  content: '';
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--earn);
  box-shadow: 0 0 0 0 color-mix(in srgb, var(--earn) 60%, transparent);
  /* A few pings, then it rests: an endless one repaints the tab bar on every frame of every page. */
  animation: earn-ping 1.8s ease-out 4;
}
.subnav a.nav-earn.has-more::before {
  top: 9px;
  right: -9px;
}
#tabbar a.nav-earn {
  position: relative;
}
#tabbar a.nav-earn.has-more::before {
  top: 6px;
  left: calc(50% + 9px);
}
@keyframes earn-ping {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--earn) 60%, transparent); }
  80%, 100% { box-shadow: 0 0 0 7px transparent; }
}
@media (prefers-reduced-motion: reduce) {
  .subnav a.nav-earn.has-more::before,
  #tabbar a.nav-earn.has-more::before {
    animation: none;
  }
}

.pt .pt-coin {

  place-items: center;
  width: 34px;

  border-radius: 50%;

  background: color-mix(in srgb, var(--earn, var(--gold)) 14%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--earn, var(--gold)) 30%, transparent);

}

}

}

}

.x-connect .x-code {

}
.x-connect-row {

  gap: 12px;
}
.link-btn {

}

}

  align-items: center;

}

}

}

}

  height: 19px;
}
.earn2-side .st-count {
  font-size: 17px;
}
.earn2-side .st-days {
  gap: 4px;
}
.earn2-side .st-day {
  padding: 7px 0 6px;
  border-radius: 10px;

}
.earn2-side .st-day .st-n {

}
.earn2-side .st-day b {

}
.earn2-side .st-day .st-ico {

.earn2-side .st-head > .st-note,

.earn2-side .st-count {

}
.earn2-side .st-dots .sp-dot .i {

  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
}

.task-full .i {

  height: 15px;

  align-items: center;
  gap: 14px;
  margin: 0 0 22px;
  padding: 10px 12px 10px 14px;
  border-radius: 14px;
  border: 1px solid color-mix(in srgb, var(--gold) 28%, var(--line));

<script type="module">
// Generated by scripts/build-web.ts from src/engine/engine.ts. Do not edit.
/**
 * Firstprint market engine.
 *
 * Pure, dependency-free logic shared by the server and the Mini App:
 * outcome buckets, TWAP price oracle, pool caps, early-bird weights,
 * payouts, and settlement with void rules.
 *
 * Amounts are integers in minor units (points, or USDT micro-units later).
 * Times are Unix milliseconds.
 */

// ---------------------------------------------------------------------------
// Types
// ---------------------------------------------------------------------------

/** Ordered from worst to best outcome. */
const BUCKETS                    = ['crash', 'down', 'flat', 'up', 'moon'];

const DEFAULT_THRESHOLDS             = { crash: -0.5, down: -0.1, up: 0.1, moon: 0.5 };

/**
 * ladder: five outcomes, Crash to Moon, by how far the price moves from the start price.
 * binary: a Yes/No question, "will the price be at or above the target?". The target is the
 * market's start price; Yes is stored as the 'up' bucket and No as 'down'.
 */

const MINUTE = 60_000;
const HOUR = 60 * MINUTE;

const DEFAULT_CONFIG               = {
  thresholds: DEFAULT_THRESHOLDS,
  earlyBirdK: 1,
  feeBps: 400,
  softCap: 50_000,
  volumeCapRatio: null,
  perUserCapPct: 0.1,
  baselineMs: HOUR,
  durationMs: 72 * HOUR,
  settleWindowMs: HOUR,
  minCoverage: 0.5,
  minTrades: 10,
  maxListingDelayMs: 24 * HOUR,
  maxHaltMs: 6 * HOUR,
};

// ---------------------------------------------------------------------------
// Buckets
// ---------------------------------------------------------------------------

/** Rounds away float noise so exactly -10% lands in "down", not "flat". */
function clean(r        )         {
  return Math.round(r * 1e9) / 1e9;
}

function returnPct(base        , final        )         {
  if (!(base > 0) || !(final >= 0)) throw new Error('Prices must be positive');
  return clean(final / base - 1);
}

function bucketForReturn(r        , t             = DEFAULT_THRESHOLDS)         {
  const x = clean(r);
  if (x <= t.crash) return 'crash';
  if (x <= t.down) return 'down';
  if (x < t.up) return 'flat';
  if (x < t.moon) return 'up';
  return 'moon';
}

/** Yes and No in a binary market. */
const BINARY_BUCKETS                    = ['up', 'down'];

const isBinary = (cfg                                ) => cfg.outcomes === 'binary';

/** The outcomes players can pick in a market. */
function allowedBuckets(cfg                                )                    {
  return isBinary(cfg) ? BINARY_BUCKETS : BUCKETS;
}

/** The winning outcome for a price move: Yes at or above the target in a binary market, else the ladder. */
function bucketFor(r        , cfg                                               )         {
  if (isBinary(cfg)) return clean(r) >= 0 ? 'up' : 'down';
  return bucketForReturn(r, cfg.thresholds);
}

function bucketRangeLabel(b        , t             = DEFAULT_THRESHOLDS)         {
  const p = (n        ) => `${n > 0 ? '+' : ''}${Math.round(n * 100)}%`;
  switch (b) {
    case 'crash': return `${p(t.crash)} or worse`;
    case 'down': return `${p(t.crash)} to ${p(t.down)}`;
    case 'flat': return `${p(t.down)} to ${p(t.up)}`;
    case 'up': return `${p(t.up)} to ${p(t.moon)}`;
    case 'moon': return `${p(t.moon)} or better`;
  }
}

// ---------------------------------------------------------------------------
// Price oracle
// ---------------------------------------------------------------------------

/**
 * Time-weighted average of 1-minute closes over [start, end).
 * Missing minutes carry the last known price forward, including the last
 * candle before the window. Slots before any known price are skipped.
 */
function twap(candles                   , start        , end        )              {
  const sorted = [...candles].sort((a, b) => a.ts - b.ts);
  const slots = Math.max(0, Math.floor((end - start) / MINUTE));
  if (slots === 0) return { twap: null, coverage: 0, volume: 0, trades: null };

  const byMinute = new Map                ();
  let last                = null;
  for (const c of sorted) {
    if (c.ts < start) last = c.close;
    else if (c.ts < end) byMinute.set(Math.floor((c.ts - start) / MINUTE), c);
  }

  let sum = 0;
  let priced = 0;
  let real = 0;
  let volume = 0;
  let trades = 0;
  let hasTrades = false;

  for (let i = 0; i < slots; i++) {
    const c = byMinute.get(i);
    if (c) {
      last = c.close;
      real++;
      volume += c.volume;
      if (c.trades !== undefined) {
        trades += c.trades;
        hasTrades = true;
      }
    }
    if (last !== null) {
      sum += last;
      priced++;
    }
  }

  return {
    twap: priced > 0 ? sum / priced : null,
    coverage: real / slots,
    volume,
    trades: hasTrades ? trades : null,
  };
}

/**
 * Volume-weighted median across venues. A single venue with little volume
 * can't drag the result far. Falls back to a plain median without volume.
 */
function venueMedian(venues                       )                {
  const valid = venues.filter((v)                                      => v.price !== null && v.price > 0);
  if (valid.length === 0) return null;
  const sorted = [...valid].sort((a, b) => a.price - b.price);
  const total = sorted.reduce((s, v) => s + Math.max(0, v.volume), 0);

  if (total <= 0) {
    const mid = Math.floor(sorted.length / 2);
    return sorted.length % 2 ? sorted[mid].price : (sorted[mid - 1].price + sorted[mid].price) / 2;
  }

  let cum = 0;
  for (const v of sorted) {
    cum += Math.max(0, v.volume);
    if (cum >= total / 2) return v.price;
  }
  return sorted[sorted.length - 1].price;
}

// ---------------------------------------------------------------------------
// Pool
// ---------------------------------------------------------------------------

function weightFor(placedAt        , tOpen        , tClose        , k        )         {
  if (tClose <= tOpen) return 1;
  const f = (tClose - placedAt) / (tClose - tOpen);
  return 1 + k * Math.min(1, Math.max(0, f));
}

// ---------------------------------------------------------------------------
// Reverting a prediction
// ---------------------------------------------------------------------------

/**
 * A player can take a prediction back before predictions close. The fee is small in the first half
 * of the prediction window and climbs steeply in the second half, so faking a big bet to move the
 * odds and leaving just before the close costs more than it can win. Half the fee is burned and half
 * goes to the players who predicted in the first half and stayed in.
 */

const DEFAULT_REVERT_RULES              = {
  baseBps: 200,
  maxBps: 5_000,
  undoMs: 2 * MINUTE,
  lockMs: 10 * MINUTE,
  burnBps: 5_000,
};

/** True when a prediction placed at this time counts as early (first half of the window). */
function isEarly(placedAt        , tOpen        , tClose        )          {
  return placedAt < tOpen + (tClose - tOpen) / 2;
}

/** The fee rate, in basis points, for taking a prediction back at `now`. */
function revertBps(now        , tOpen        , tClose        , rules                                         )         {
  if (tClose <= tOpen) return rules.maxBps;
  const left = Math.min(1, Math.max(0, (tClose - now) / (tClose - tOpen)));
  if (left >= 0.5) return rules.baseBps;
  const x = (0.5 - left) / 0.5;
  return Math.round(rules.baseBps + (rules.maxBps - rules.baseBps) * x * x * x);
}

function revertQuote(stake        , placedAt        , now        , tOpen        , tClose        , rules             )              {
  const allowed = now < tClose - rules.lockMs;
  const free = now - placedAt <= rules.undoMs && isEarly(now, tOpen, tClose);
  const bps = free ? 0 : revertBps(now, tOpen, tClose, rules);
  const fee = Math.min(stake, Math.ceil((stake * bps) / 10_000));
  const burn = fee - Math.floor((fee * (10_000 - rules.burnBps)) / 10_000);
  return { allowed, bps, fee, back: stake - fee, burn, toEarly: fee - burn, free };
}

/** Splits the early players' share of revert fees by accepted stake. Rounding remainder is burned. */
function splitEarlyPot(pot        , early                                             )                                                  {
  const total = early.reduce((s, p) => s + p.accepted, 0);
  const shares = new Map                ();
  if (pot <= 0 || total <= 0) return { shares, burned: Math.max(0, pot) };
  let paid = 0;
  for (const p of early) {
    const n = Math.floor((pot * p.accepted) / total);
    if (n > 0) {
      shares.set(p.id, n);
      paid += n;
    }
  }
  return { shares, burned: pot - paid };
}

function hardCapFor(cfg              , baselineVolume        )         {
  if (cfg.volumeCapRatio === null) return cfg.softCap;
  return Math.max(0, Math.min(cfg.softCap, Math.floor(cfg.volumeCapRatio * baselineVolume)));
}

/**
 * Applies the pool hard cap and per-user cap in time order, so the latest
 * predictions are the ones refunded when a cap is hit.
 */
function applyCaps(
  predictions                       ,
  hardCap        ,
  cfg                                                    ,
  tOpen        ,
  tClose        ,
)                       {
  const userCap = Math.floor(hardCap * cfg.perUserCapPct);
  const used = new Map                ();
  let poolLeft = hardCap;

  const ordered = [...predictions].sort((a, b) => a.placedAt - b.placedAt || a.id.localeCompare(b.id));
  return ordered.map((p) => {
    const userLeft = userCap - (used.get(p.userId) ?? 0);
    const accepted = Math.max(0, Math.min(p.stake, userLeft, poolLeft));
    used.set(p.userId, (used.get(p.userId) ?? 0) + accepted);
    poolLeft -= accepted;
    return {
      ...p,
      accepted,
      refund: p.stake - accepted,
      weight: weightFor(p.placedAt, tOpen, tClose, cfg.earlyBirdK),
    };
  });
}

function emptyTotals()             {
  return { crash: 0, down: 0, flat: 0, up: 0, moon: 0 };
}

function poolTotals(predictions                                              )             {
  const t = emptyTotals();
  for (const p of predictions) t[p.bucket] += p.stake;
  return t;
}

/** Estimated payout for a new prediction, assuming the pool doesn't change. */
function quote(
  existing                       ,
  bucket        ,
  stake        ,
  placedAt        ,
  cfg                                             ,
  tOpen        ,
  tClose        ,
)        {
  const weight = weightFor(placedAt, tOpen, tClose, cfg.earlyBirdK);
  if (stake <= 0) return { weight, payout: 0, multiple: 0 };
  const pool = existing.reduce((s, p) => s + p.stake, 0) + stake;
  const net = pool - Math.floor((pool * cfg.feeBps) / 10_000);
  const winnersWeighted =
    existing
      .filter((p) => p.bucket === bucket)
      .reduce((s, p) => s + p.stake * weightFor(p.placedAt, tOpen, tClose, cfg.earlyBirdK), 0) +
    stake * weight;
  const payout = Math.floor((net * stake * weight) / winnersWeighted);
  return { weight, payout, multiple: payout / stake };
}

function refundAll(accepted                               , reason            )             {
  return {
    pool: accepted.reduce((s, p) => s + p.accepted, 0),
    fee: 0,
    netPool: 0,
    dust: 0,
    voidReason: reason,
    payouts: accepted.map((p) => ({
      predictionId: p.id,
      userId: p.userId,
      bucket: p.bucket,
      accepted: p.accepted,
      refund: p.refund + p.accepted,
      payout: 0,
      weight: p.weight,
    })),
  };
}

function computePayouts(
  accepted                               ,
  winning        ,
  cfg                              ,
)             {
  const live = accepted.filter((p) => p.accepted > 0);
  const pool = live.reduce((s, p) => s + p.accepted, 0);
  if (pool === 0) return refundAll(accepted, 'empty_pool');

  const bucketsUsed = new Set(live.map((p) => p.bucket));
  if (bucketsUsed.size < 2) return refundAll(accepted, 'one_sided_pool');

  const winners = live.filter((p) => p.bucket === winning);
  if (winners.length === 0) return refundAll(accepted, 'no_winners');

  const fee = Math.floor((pool * cfg.feeBps) / 10_000);
  const netPool = pool - fee;
  const totalWeighted = winners.reduce((s, p) => s + p.accepted * p.weight, 0);

  let paid = 0;
  const payouts           = accepted.map((p) => {
    const won = p.accepted > 0 && p.bucket === winning;
    const payout = won ? Math.floor((netPool * p.accepted * p.weight) / totalWeighted) : 0;
    paid += payout;
    return {
      predictionId: p.id,
      userId: p.userId,
      bucket: p.bucket,
      accepted: p.accepted,
      refund: p.refund,
      payout,
      weight: p.weight,
    };
  });

  return { pool, fee, netPool, dust: netPool - paid, payouts, voidReason: null };
}

// ---------------------------------------------------------------------------
// Settlement
// ---------------------------------------------------------------------------

function windows(cfg              , listingAt        ) {
  const settleAt = listingAt + cfg.durationMs;
  return {
    baseline: { start: listingAt, end: listingAt + cfg.baselineMs },
    final: { start: settleAt - cfg.settleWindowMs, end: settleAt },
    closeAt: listingAt + cfg.baselineMs,
    settleAt,
  };
}

function windowOk(stats               , cfg              )          {
  const good = stats.filter((s) => s.twap !== null && s.coverage >= cfg.minCoverage);
  if (good.length === 0) return false;
  const reported = good.filter((s) => s.trades !== null);
  if (reported.length === 0) return true;
  return reported.reduce((n, s) => n + (s.trades ?? 0), 0) >= cfg.minTrades;
}

function settleMarket(input                 )                   {
  const { cfg } = input;
  const w = windows(cfg, input.listingAt);
  const venues = Object.keys(input.candles);

  const baseStats                = venues.map((v) => ({ venue: v, ...twap(input.candles[v], w.baseline.start, w.baseline.end) }));
  const finalStats                = venues.map((v) => ({ venue: v, ...twap(input.candles[v], w.final.start, w.final.end) }));

  const pick = (stats               ) =>
    venueMedian(stats.filter((s) => s.coverage >= cfg.minCoverage).map((s) => ({ venue: s.venue, price: s.twap, volume: s.volume })));

  const basePrice = pick(baseStats);
  const finalPrice = pick(finalStats);

  const shell = {
    baseline: { ...w.baseline, price: basePrice, venues: baseStats },
    final: { ...w.final, price: finalPrice, venues: finalStats },
  };

  const voided = (reason            )                   => ({
    ...refundAll(input.accepted, reason),
    ...shell,
    returnPct: null,
    winningBucket: null,
  });

  if (input.retracted) return voided('retracted');
  if (input.listingAt - input.announcedListingAt > cfg.maxListingDelayMs) return voided('listing_delayed');
  if (input.haltedMs > cfg.maxHaltMs) return voided('trading_halted');
  if (basePrice === null || !windowOk(baseStats, cfg)) return voided('insufficient_baseline_data');
  if (finalPrice === null || !windowOk(finalStats, cfg)) return voided('insufficient_settlement_data');

  const r = returnPct(basePrice, finalPrice);
  const winning = bucketFor(r, cfg);
  const pool = computePayouts(input.accepted, winning, cfg);

  return {
    ...pool,
    ...shell,
    // The measured outcome stays visible even if the pool itself is refunded.
    returnPct: r,
    winningBucket: winning,
  };
}

// A player's record (the dashboard)
// ---------------------------------------------------------------------------

/** One prediction, with what happened to its market. */

/** One settled market a player was in. */

/**
 * Sums up a player's predictions market by market. A market counts as won when any of the
 * player's predictions in it paid out. Cancelled (void) markets are refunded and count as
 * neither a win nor a loss.
 */
function summarizeRecord(rows                      )               {
  const byMarket = new Map                     ();
  for (const r of rows) byMarket.set(r.marketId, [...(byMarket.get(r.marketId) ?? []), r]);

  const byOutcome = Object.fromEntries(BUCKETS.map((b) => [b, { picks: 0, wins: 0 }]))                                                   ;
  const settled                                     = [];
  const open = { markets: 0, staked: 0 };
  let refundedMarkets = 0;

  for (const [marketId, preds] of byMarket) {
    const first = preds[0];
    if (first.status === 'void') {
      refundedMarkets++;
      continue;
    }
    if (first.status !== 'resolved') {
      open.markets++;
      open.staked += preds.reduce((s, p) => s + (p.accepted ?? p.stake), 0);
      continue;
    }
    const inPool = preds.filter((p) => (p.accepted ?? 0) > 0);
    if (!inPool.length) continue; // every stake was refunded by a pool limit
    const staked = inPool.reduce((s, p) => s + (p.accepted ?? 0), 0);
    const payout = inPool.reduce((s, p) => s + (p.payout ?? 0), 0);
    for (const p of first.binary ? [] : inPool) {
      byOutcome[p.bucket].picks++;
      if ((p.payout ?? 0) > 0) byOutcome[p.bucket].wins++;
    }
    settled.push({
      marketId,
      symbol: first.symbol,
      ...(first.binary ? { binary: true } : {}),
      settledAt: first.settledAt ?? 0,
      buckets: [...new Set(inPool.map((p) => p.bucket))],
      winningBucket: first.winningBucket,
      staked,
      payout,
      profit: payout - staked,
      won: payout > 0,
    });
  }

  settled.sort((a, b) => a.settledAt - b.settledAt || a.marketId.localeCompare(b.marketId));
  let cumulative = 0;
  let streak = 0;
  let bestStreak = 0;
  const history = settled.map((m) => {
    cumulative += m.profit;
    streak = m.won ? streak + 1 : 0;
    bestStreak = Math.max(bestStreak, streak);
    return { ...m, cumulative };
  });

  const wins = history.filter((m) => m.won).length;
  const best = history.filter((m) => m.won).sort((a, b) => b.profit - a.profit)[0];
  return {
    marketsPlayed: byMarket.size,
    settled: history.length,
    wins,
    losses: history.length - wins,
    winRate: history.length ? wins / history.length : null,
    totalStaked: history.reduce((s, m) => s + m.staked, 0),
    totalWon: history.reduce((s, m) => s + m.payout, 0),
    netProfit: cumulative,
    bestWin: best ? { marketId: best.marketId, symbol: best.symbol, profit: best.profit, payout: best.payout } : null,
    currentStreak: streak,
    bestStreak,
    open,
    refundedMarkets,
    byOutcome,
    history: history.reverse(),
  };
}

class ApiError extends Error {
  constructor(status, code, message) {
    super(message);
    this.status = status;
    this.code = code;
