<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Firstprint X banner</title>
<!-- Source for x-banner.png (1500 × 500) and x-banner-4k.png (3840 × 1280): open in Chromium at a 1500 × 500 viewport
     and screenshot at device scale 1 and 2.56. The phone shows screens/markets.png, taken from the /play/ demo at 4×. -->
<style>
  @font-face { font-family: Geist; src: url(../assets/fonts/Geist-Regular.ttf); font-weight: 400; }
  @font-face { font-family: Geist; src: url(../assets/fonts/Geist-SemiBold.ttf); font-weight: 600; }
  @font-face { font-family: Geist; src: url(../assets/fonts/Geist-Bold.ttf); font-weight: 700; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1500px; height: 500px; overflow: hidden; background: #07080c; }
  .stage { position: relative; width: 1500px; height: 500px; overflow: hidden; font-family: Geist, sans-serif;
    background:
      radial-gradient(560px 420px at 1180px 300px, rgba(125,255,58,0.15), transparent 70%),
      radial-gradient(circle at 2px 2px, rgba(255,255,255,0.055) 1.2px, transparent 1.6px) 0 0 / 28px 28px,
      #07080c; }
  .copy { position: absolute; left: 116px; top: 92px; z-index: 3; }
  .brand { display: flex; align-items: center; gap: 16px; margin-left: 4px; }
  .brand span { font-size: 28px; font-weight: 600; color: #f5f5f7; letter-spacing: -0.5px; }
  h1 { margin-top: 52px; font-size: 62px; line-height: 70px; font-weight: 700; letter-spacing: -2px; color: #f5f5f7; }
  h1 em { font-style: normal; color: #8e8e93; }
  p { margin: 26px 0 0 4px; font-size: 22px; color: #9a9aa3; }

  .scene { position: absolute; inset: 0; perspective: 1700px; }
  .phone { position: absolute; left: 935px; top: -385px; width: 480px; height: 1010px; border-radius: 76px; padding: 15px;
    background: linear-gradient(150deg, #4a4d57 0%, #17181d 22%, #0e0f13 60%, #2b2d35 100%);
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.16), inset 0 0 0 5px #0a0a0d,
      -40px 60px 110px rgba(0,0,0,0.85), 0 0 120px rgba(125,255,58,0.16);
    transform: rotateZ(-10deg) rotateY(-12deg) rotateX(4deg); }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 62px; overflow: hidden;
    background: #0b0c10 url(screens/markets.png) center 0 / 100% auto no-repeat; }
  .screen::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(118deg, rgba(255,255,255,0.09), rgba(255,255,255,0) 32%),
                linear-gradient(0deg, rgba(7,8,12,0.55), rgba(7,8,12,0) 12%); }
  /* lift the Moon row a little so the eye lands on it */
  .pick { position: absolute; left: 0; right: 0; top: 544px; height: 58px; border-radius: 2px;
    box-shadow: inset 0 0 0 2px rgba(125,255,58,0.85), 0 0 34px rgba(125,255,58,0.35); }
</style>
</head>
<body>
<div class="stage">
  <div class="scene">
    <div class="phone"><div class="screen"><div class="pick"></div></div></div>
  </div>
  <div class="copy">
    <div class="brand">
      <svg width="48" height="48" viewBox="0 0 48 48">
        <rect width="48" height="48" rx="12" fill="#0b0f2a" stroke="#313b80" stroke-width="1.5"/>
        <rect x="8" y="8" width="32" height="5.2" rx="2.6" fill="#7dff3a"/>
        <rect x="12" y="15.8" width="24" height="5.2" rx="2.6" fill="#3fd69a"/>
        <rect x="16" y="23.6" width="16" height="5.2" rx="2.6" fill="#9faac0"/>
        <rect x="12" y="31.4" width="24" height="5.2" rx="2.6" fill="#ff8a5c"/>
        <rect x="8" y="39.2" width="32" height="5.2" rx="2.6" fill="#ff4d6a"/>
      </svg>
      <span>Firstprint</span>
    </div>
    <h1>Call the first move<br><em>of every new listing</em></h1>
    <p>Free prediction markets on new and trending tokens</p>
  </div>
</div>
</body>
</html>
