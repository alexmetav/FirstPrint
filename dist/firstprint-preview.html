  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Firstprint: predict crypto prices</title>
    <meta name="description" content="Free prediction markets on crypto tokens. Pick Crash, Down, Flat, Up or Moon with free points and track your win rate." />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Type: Geist for words, Geist Mono for numbers and labels. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
    <script>
// Applies the saved light/dark choice before the page paints, so there is no flash of the wrong theme.
// A separate file (not an inline script) so the Content-Security-Policy can keep forbidding inline scripts.
(function () {
  try {
    var t = localStorage.getItem('fp:theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {
    /* storage blocked: follow the device setting */
  }
})();

</script>
    <style>
/* Firstprint website styles
   Palette: ink navy surfaces; a five-step outcome scale from Crash (red) to Moon (gold).
   Type: Inter everywhere (variable, 400-700), the system font only as a fallback. */

/* Brand "The Ladder": night indigo surfaces, the five outcome colours as the palette
   (Moon gold, Up green, Flat grey, Down orange, Crash red), signal indigo for focus and
   active states, and Moon gold for the main call to action. */
:root {
  --bg: #09090b;
  --surface: #111114;
  --surface-2: #151519;
  --raised: #1d1d22;
  --line: #25252b;
  --line-strong: #35353e;
  --text: #f5f5f7;
  --muted: #a1a1aa;
  --label: #e4e4e7;
  --field: #0c0c0f;
  --field-line: #3a3a43;
  --focus: #4da3ff;
  --brand: #0a84ff;
  --brand-2: #ffd60a;
  /* Main buttons: white on dark, black on light. Blue is kept for links only. */
  --cta: #f5f5f7;
  --on-cta: #09090b;
  --gold: #ffd60a;
  --on-gold: #1d1d1f;
  --on-solid: #09090b;
  --glow: rgba(10, 132, 255, 0.08);
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 12px 32px -20px rgba(0, 0, 0, 0.9);
  --shadow-lg: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 24px 56px -28px rgba(0, 0, 0, 0.95);

  --crash: #ff453a;
  --down: #ff9f0a;
  --flat: #8e8e93;
  --up: #30d158;
  --moon: #7dff3a;
  --warn: #ffd60a;

  /* SF Pro on Apple devices (Display for large sizes is picked automatically), Inter elsewhere. */
  --display: 'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --body: 'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --page: 1200px;

  color-scheme: dark;
}

/* Light theme: chosen in the app (data-theme="light"), or the device setting when nothing is chosen. */
:root[data-theme='light'] {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --surface-2: #fbfbfd;
    --raised: #ececf0;
    --line: #e3e3e8;
    --line-strong: #c9c9d1;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --label: #1d1d1f;
    --field: #ffffff;
    --field-line: #c7c7cc;
    --focus: #0071e3;
    --brand: #0071e3;
    --brand-2: #a2670a;
    --cta: #1d1d1f;
    --on-cta: #ffffff;
    --gold: #ffcc00;
    --on-gold: #1d1d1f;
    --on-solid: #ffffff;
    --glow: rgba(0, 113, 227, 0.06);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px -16px rgba(0, 0, 0, 0.16);
    --shadow-lg: 0 1px 2px rgba(0, 0, 0, 0.05), 0 20px 48px -24px rgba(0, 0, 0, 0.22);
    --crash: #d70015;
    --down: #c93400;
    --flat: #6e6e73;
    --up: #248a3d;
    --moon: #3f9c00;
    --warn: #a2670a;
    color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme='dark']) {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --surface-2: #fbfbfd;
    --raised: #ececf0;
    --line: #e3e3e8;
    --line-strong: #c9c9d1;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --label: #1d1d1f;
    --field: #ffffff;
    --field-line: #c7c7cc;
    --focus: #0071e3;
    --brand: #0071e3;
    --brand-2: #a2670a;
    --cta: #1d1d1f;
    --on-cta: #ffffff;
    --gold: #ffcc00;
    --on-gold: #1d1d1f;
    --on-solid: #ffffff;
    --glow: rgba(0, 113, 227, 0.06);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px -16px rgba(0, 0, 0, 0.16);
    --shadow-lg: 0 1px 2px rgba(0, 0, 0, 0.05), 0 20px 48px -24px rgba(0, 0, 0, 0.22);
    --crash: #d70015;
    --down: #c93400;
    --flat: #6e6e73;
    --up: #248a3d;
    --moon: #3f9c00;
    --warn: #a2670a;
    color-scheme: light;
  }
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background:
    radial-gradient(1100px 520px at 50% -260px, var(--glow), transparent 70%),
    var(--bg);
  background-repeat: no-repeat;
  color: var(--text);
  font: 15px/1.55 var(--body);
}

a {
  color: inherit;
}

button,
input,
select {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.skip {
  position: absolute;
  left: -999px;
  top: 8px;
  padding: 8px 12px;
  background: var(--surface);
  border-radius: var(--r-sm);
  z-index: 100;
}
.skip:focus {
  left: 8px;
}

h1,
h2,
h3 {
  font-family: var(--display);
  font-weight: 600;
  margin: 0;
  letter-spacing: -0.01em;
}

.muted {
  color: var(--muted);
}

/* Outcome name, colored by its bucket */
.oc {
  color: var(--c);
  font-family: var(--display);
  font-weight: 600;
}

.loading {
  padding: 64px 0;
  text-align: center;
  color: var(--muted);
}

/* ---------------------------------------------------------------- Top bar */

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}

.topbar-inner {
  max-width: var(--page);
  margin: 0 auto;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 28px;
}

.wordmark {
  display: inline-flex;
  align-items: center;
  font-family: var(--display);
  font-weight: 600;
  font-size: 20px;
  line-height: 1;
  letter-spacing: -0.022em;
  text-decoration: none;
  white-space: nowrap;
}
/* The mark is the outcome ladder in miniature: Moon on top, Crash at the bottom. */
.wordmark .mark {
  display: inline-grid;
  gap: 2px;
  width: 16px;
  margin-right: 8px;
}
.wordmark .mark i {
  display: block;
  height: 3px;
  border-radius: 2px;
}
.wordmark .mark i:nth-child(1) { background: var(--moon); width: 100%; }
.wordmark .mark i:nth-child(2) { background: var(--up); width: 80%; }
.wordmark .mark i:nth-child(3) { background: var(--flat); width: 60%; }
.wordmark .mark i:nth-child(4) { background: var(--down); width: 80%; }
.wordmark .mark i:nth-child(5) { background: var(--crash); width: 100%; }

.wallet-chip {
  font-size: 14px;
  padding: 5px 12px;
  border-radius: 999px;
  background: var(--raised);
  text-decoration: none;
  white-space: nowrap;
}

.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--up);
}
.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--up);
  animation: pulse 1.6s ease-in-out 6;
}
@keyframes pulse {
  50% { opacity: 0.35; }
}

.wallet-options {
  display: grid;
  gap: 8px;
  margin-top: 16px;
}
.wallet-option {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--raised);
  text-align: left;
  font-weight: 600;
}
.wallet-option:hover:not(:disabled) {
  border-color: var(--focus);
}
.wallet-option img {
  border-radius: 6px;
}
.wallet-option .muted {
  font-size: 13px;
  font-weight: 400;
}
.wallet-fallback {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: grid;
  place-items: center;
  background: var(--line);
  font-family: var(--display);
}
.no-wallet {
  margin-top: 16px;
  padding: 14px;
  border: 1px dashed var(--line);
  border-radius: var(--r-md);
}
.no-wallet p {
  margin: 0 0 10px;
}
.wallet-links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.wallet-list {
  list-style: none;
  padding: 0;
  margin: 0 0 12px;
}
.wallet-list li {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.wallet-list .addr {
  font-family: var(--display);
  font-weight: 600;
}

.radar td {
  vertical-align: top;
}
.radar-sym {
  display: block;
  font-family: var(--display);
  font-weight: 600;
  font-size: 18px;
}
.radar-title {
  display: block;
  font-size: 13px;
  color: var(--muted);
  max-width: 46ch;
}
.table td a.radar-title {
  font-family: var(--body);
  font-weight: 400;
}
a.radar-title:hover {
  color: var(--text);
}

.nav {
  display: flex;
  gap: 4px;
}
.nav a {
  text-decoration: none;
  color: var(--muted);
  padding: 6px 10px;
  border-radius: var(--r-sm);
}
.nav a:hover {
  color: var(--text);
}
.nav a[aria-current='page'] {
  color: var(--text);
  background: var(--raised);
}

.account {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.points {
  font-family: var(--display);
  font-weight: 600;
  font-size: 15px;
  padding: 5px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  text-decoration: none;
  white-space: nowrap;
}

.btn {
  display: inline-block;
  text-decoration: none;
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 999px;
  padding: 7px 14px;
  font-weight: 600;
  white-space: nowrap;
}
.btn:hover {
  background: var(--raised);
}
.btn-solid {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}
.btn-solid:hover {
  background: color-mix(in srgb, var(--text) 85%, var(--bg));
}
.btn:disabled {
  opacity: 0.5;
  cursor: default;
}

/* --------------------------------------------------------------- Demo bar */

.demo-bar {
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--warn) 9%, var(--bg));
}
.demo-bar-inner {
  max-width: var(--page);
  margin: 0 auto;
  padding: 8px 20px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 14px;
  font-size: 14px;
}
.demo-bar p {
  margin: 0;
  flex: 1 1 280px;
}
.demo-bar .btn {
  padding: 4px 12px;
  font-size: 13px;
}

/* -------------------------------------------------------------- Page frame */

main {
  max-width: var(--page);
  margin: 0 auto;
  padding: 28px 20px 96px;
  min-height: 70vh;
}
main:focus {
  outline: none;
}

.footer {
  max-width: var(--page);
  margin: 0 auto;
  padding: 24px 20px 40px;
  color: var(--muted);
  font-size: 13px;
  border-top: 1px solid var(--line);
}
.footer p {
  margin: 0;
}

.page-title {
  font-size: clamp(24px, 3vw, 30px);
  letter-spacing: -0.025em;
}
.page-lede {
  color: var(--muted);
  margin: 6px 0 24px;
  max-width: 62ch;
}

/* ---------------------------------------------------------- Featured market */

.featured {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
  gap: 32px;
  align-items: center;
  padding: 28px 0 36px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 24px;
}

.featured h1 {
  font-size: clamp(26px, 3.4vw, 36px);
  line-height: 0.98;
  letter-spacing: -0.022em;
  font-weight: 600;
}
.featured h1 .countdown {
  display: block;
  color: var(--warn);
}
.featured .lede {
  color: var(--muted);
  margin: 14px 0 20px;
  max-width: 46ch;
}
.featured .actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.mini-ladder {
  display: grid;
  gap: 6px;
}
.mini-rung {
  position: relative;
  display: grid;
  grid-template-columns: 92px 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: var(--r-sm);
  background: var(--surface);
  overflow: hidden;
  font-size: 14px;
}
.mini-rung::before {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  width: var(--share);
  background: color-mix(in srgb, var(--c) 22%, transparent);
}
.mini-rung > * {
  position: relative;
}
.mini-rung b {
  font-family: var(--display);
  color: var(--c);
  white-space: nowrap;
}
.mini-rung .pct {
  font-family: var(--display);
  font-weight: 600;
}

/* ----------------------------------------------------------------- Toolbar */

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
}
.tabs button {
  border: 0;
  background: transparent;
  padding: 6px 14px;
  border-radius: 999px;
  color: var(--muted);
  font-weight: 600;
}
.tabs button[aria-selected='true'] {
  background: var(--raised);
  color: var(--text);
}
.tabs .count {
  font-weight: 500;
  margin-left: 4px;
  opacity: 0.8;
}

.select {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 14px;
}
.select select {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 6px 10px;
}

/* -------------------------------------------------------------- Market grid */

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}

.card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 16px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
  text-decoration: none;
  transition: border-color 120ms;
}
.card:hover {
  border-color: color-mix(in srgb, var(--text) 30%, var(--line));
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.sym {
  font-family: var(--display);
  font-weight: 600;
  font-size: 20px;
  letter-spacing: -0.02em;
  line-height: 1;
}
.exch {
  font-size: 13px;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 1px 8px;
}
.card-name {
  color: var(--muted);
  font-size: 14px;
  margin-top: -6px;
}

.strip {
  display: flex;
  height: 8px;
  border-radius: 999px;
  overflow: hidden;
  gap: 2px;
  background: var(--raised);
}
.strip span {
  background: var(--c);
  min-width: 3px;
}
.strip.empty span {
  opacity: 0.25;
}

.card-lead {
  font-size: 14px;
  min-height: 21px;
}
.card-lead b {
  color: var(--c);
  font-family: var(--display);
}

.card-foot {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 13px;
  color: var(--muted);
  border-top: 1px solid var(--line);
  padding-top: 10px;
  margin-top: auto;
}
.card-foot .when {
  color: var(--text);
}

.empty {
  padding: 48px 20px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed var(--line);
  border-radius: var(--r-md);
}
.empty .btn {
  margin-top: 12px;
}

/* ------------------------------------------------------------- Market page */

.market-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 32px;
  align-items: start;
}

.back {
  display: inline-block;
  color: var(--muted);
  text-decoration: none;
  font-size: 14px;
  margin-bottom: 14px;
}
.back:hover {
  color: var(--text);
}

.m-head {
  margin-bottom: 20px;
}
.m-title {
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
}
.m-title .sym {
  font-size: clamp(28px, 3.6vw, 38px);
  letter-spacing: -0.022em;
}
.m-question {
  font-size: 18px;
  margin: 8px 0 6px;
  max-width: 60ch;
}
.m-status {
  color: var(--muted);
  margin: 0;
}
.m-status strong {
  color: var(--text);
  font-weight: 600;
}

.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 28px;
  margin: 18px 0 22px;
  padding: 0;
}
.stats div {
  display: flex;
  flex-direction: column;
}
.stats dt {
  font-size: 13px;
  color: var(--muted);
}
.stats dd {
  margin: 0;
  font-family: var(--display);
  font-weight: 600;
  font-size: 20px;
}

.chart {
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
  padding: 14px 14px 10px;
  margin-bottom: 22px;
}
.chart-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 14px;
  margin-bottom: 8px;
}
.chart-head .now {
  font-family: var(--display);
  font-weight: 600;
  font-size: 18px;
}
.chart svg {
  display: block;
  width: 100%;
  height: 180px;
}
.chart-empty {
  height: 120px;
  display: grid;
  place-items: center;
  color: var(--muted);
  text-align: center;
  padding: 0 20px;
}

/* The outcome ladder: Moon at the top, Crash at the bottom. */

.ladder {
  display: grid;
  gap: 8px;
  margin-bottom: 28px;
}
.ladder-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 72px 72px 96px;
  gap: 12px;
  padding: 0 16px;
  font-size: 13px;
  color: var(--muted);
}
.ladder-head span:not(:first-child) {
  text-align: right;
}

.rung {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 72px 72px 96px;
  gap: 12px;
  align-items: center;
  width: 100%;
  text-align: left;
  padding: 14px 16px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--surface);
  overflow: hidden;
}
.rung::before {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  width: var(--share);
  background: color-mix(in srgb, var(--c) 16%, transparent);
  transition: width 400ms ease;
}
.rung > * {
  position: relative;
}
.rung:not(:disabled):hover {
  border-color: var(--c);
}
.rung:disabled {
  cursor: default;
}
.rung[aria-pressed='true'] {
  border-color: var(--c);
  box-shadow: inset 3px 0 0 var(--c);
}

.rung-name {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.rung-name b {
  font-family: var(--display);
  font-size: 19px;
  color: var(--c);
  line-height: 1.2;
}
.rung-name small {
  color: var(--muted);
  font-size: 13px;
}
.rung .num {
  text-align: right;
  font-family: var(--display);
  font-weight: 600;
  font-size: 16px;
}
.rung .num small {
  display: block;
  font-family: var(--body);
  font-weight: 400;
  font-size: 12px;
  color: var(--muted);
}

.tag {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  padding: 1px 8px;
  border-radius: 999px;
  margin-left: 8px;
  vertical-align: 2px;
  font-family: var(--body);
}
.tag-you {
  background: var(--text);
  color: var(--bg);
}
.tag-now {
  background: var(--c);
  color: var(--bg);
}

.ladder.settled .rung:not(.won) {
  opacity: 0.5;
}
.rung.won {
  border-color: var(--c);
  border-width: 2px;
  padding: 13px 15px;
}

/* Sections under the ladder */

.section {
  border-top: 1px solid var(--line);
  padding: 18px 0;
}
.section h2 {
  font-size: 20px;
  margin-bottom: 10px;
}
.section p {
  margin: 0 0 10px;
  max-width: 68ch;
}

.facts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px 24px;
  margin: 0;
}
.facts dt {
  font-size: 13px;
  color: var(--muted);
}
.facts dd {
  margin: 0;
  font-weight: 600;
}

.rules {
  margin: 0;
  padding-left: 20px;
  max-width: 68ch;
}
.rules li {
  margin-bottom: 8px;
}

.activity {
  list-style: none;
  margin: 0;
  padding: 0;
}
.activity li {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.activity b {
  color: var(--c);
  font-family: var(--display);
}

/* ------------------------------------------------------------- Trade panel */

.trade {
  position: sticky;
  top: 76px;
}

.trade-card {
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--surface);
  padding: 18px;
}
.trade-card h2 {
  font-size: 20px;
  margin-bottom: 12px;
}

.picker {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-bottom: 16px;
}
.picker button {
  border: 1px solid var(--line);
  background: var(--raised);
  border-radius: var(--r-sm);
  padding: 8px 2px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.picker button b {
  font-family: var(--display);
  font-size: 14px;
  color: var(--c);
}
.picker button small {
  font-size: 12px;
  color: var(--muted);
}
.picker button[aria-checked='true'] {
  background: var(--c);
  border-color: var(--c);
}
.picker button[aria-checked='true'] b,
.picker button[aria-checked='true'] small {
  color: var(--bg);
}

.field-label {
  display: block;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 6px;
}

.stake-input {
  display: flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--bg);
  padding: 0 14px;
}
.stake-input:focus-within {
  border-color: var(--focus);
}
.stake-input input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: transparent;
  font-family: var(--display);
  font-weight: 600;
  font-size: 26px;
  padding: 8px 0;
  outline: none;
}
.stake-input span {
  color: var(--muted);
}

.chips {
  display: flex;
  gap: 6px;
  margin: 8px 0 16px;
}
.chips button {
  flex: 1;
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 999px;
  padding: 4px 0;
  font-size: 13px;
  font-weight: 600;
}
.chips button:hover {
  background: var(--raised);
}

.summary {
  margin: 0 0 16px;
  display: grid;
  gap: 6px;
}
.summary div {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 14px;
}
.summary dt {
  color: var(--muted);
}
.summary dd {
  margin: 0;
  font-weight: 600;
}
.summary .big dd {
  font-family: var(--display);
  font-size: 20px;
  font-weight: 600;
  color: var(--c);
}

.cta {
  width: 100%;
  border: 0;
  border-radius: var(--r-md);
  padding: 14px;
  font-weight: 600;
  font-size: 16px;
  background: var(--c, var(--text));
  color: var(--bg);
}
.cta:disabled {
  opacity: 0.55;
  cursor: default;
}

.fine {
  font-size: 13px;
  color: var(--muted);
  margin: 10px 0 0;
}
.form-error {
  color: var(--crash);
  font-size: 14px;
  margin: 10px 0 0;
  min-height: 1em;
}

.position {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  border-top: 1px solid var(--line);
  font-size: 14px;
}
.position b {
  color: var(--c);
  font-family: var(--display);
}

.mobile-bar,
.sheet-close {
  display: none;
}

/* -------------------------------------------------------------- Tables */

.table {
  width: 100%;
  border-collapse: collapse;
}
.table th {
  text-align: left;
  font-weight: 500;
  font-size: 13px;
  color: var(--muted);
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
}
.table td {
  padding: 12px;
  border-bottom: 1px solid var(--line);
}
.table .right {
  text-align: right;
}
.table tr.me td {
  background: color-mix(in srgb, var(--warn) 8%, transparent);
}
.rank {
  font-family: var(--display);
  font-weight: 600;
  font-size: 18px;
  width: 48px;
}
.profit-pos {
  color: var(--up);
  font-weight: 600;
}
.profit-neg {
  color: var(--crash);
  font-weight: 600;
}
.table td a {
  text-decoration: none;
  font-family: var(--display);
  font-weight: 600;
}
.table td b {
  color: var(--c);
  font-family: var(--display);
}

.balance {
  display: flex;
  align-items: center;
  gap: 16px 24px;
  flex-wrap: wrap;
  padding: 20px 0 28px;
}
.balance .amount {
  font-family: var(--display);
  font-weight: 600;
  font-size: clamp(36px, 5vw, 48px);
  letter-spacing: -0.022em;
  line-height: 1;
}

/* ------------------------------------------------------------------ Modal */

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(5, 9, 16, 0.6);
  display: grid;
  place-items: center;
  padding: 20px;
}
.modal {
  width: min(400px, 100%);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 22px;
}
.modal h2 {
  font-size: 20px;
  margin-bottom: 4px;
}
.modal form {
  display: grid;
  gap: 12px;
  margin-top: 16px;
}
.modal input {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: var(--r-sm);
  padding: 10px 12px;
}
.modal input:focus {
  border-color: var(--focus);
  outline: none;
}
.modal .switch {
  background: none;
  border: 0;
  padding: 0;
  text-decoration: underline;
  color: var(--text);
}

/* ------------------------------------------------------------------ Toast */

#toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translate(-50%, 20px);
  opacity: 0;
  z-index: 60;
  background: var(--text);
  color: var(--bg);
  padding: 10px 16px;
  border-radius: 999px;
  font-weight: 600;
  pointer-events: none;
  transition: opacity 160ms, transform 160ms;
  max-width: calc(100vw - 40px);
  text-align: center;
}
#toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
#toast.error {
  background: var(--crash);
  color: #fff;
}

/* ------------------------------------------------------------ Responsive */

@media (max-width: 900px) {
  .featured {
    grid-template-columns: 1fr;
    gap: 22px;
    padding-top: 12px;
  }

  .market-layout {
    grid-template-columns: 1fr;
  }

  /* Trade panel becomes a bottom sheet */
  .trade {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    top: auto;
    z-index: 40;
    transform: translateY(105%);
    transition: transform 220ms ease;
    max-height: 88vh;
    overflow: auto;
  }
  .trade.open {
    transform: none;
  }
  .trade-card {
    border-radius: var(--r-lg) var(--r-lg) 0 0;
    padding-bottom: calc(18px + env(safe-area-inset-bottom));
    border-bottom: 0;
  }
  .sheet-close {
    display: block;
    float: right;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    padding: 4px 0;
  }
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    z-index: 35;
    background: rgba(5, 9, 16, 0.5);
  }

  .mobile-bar {
    display: flex;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 30;
    gap: 12px;
    align-items: center;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: var(--surface);
    border-top: 1px solid var(--line);
  }
  .mobile-bar p {
    margin: 0;
    flex: 1;
    font-size: 14px;
    color: var(--muted);
  }
  .mobile-bar .cta {
    width: auto;
    padding: 12px 20px;
  }
}

@media (max-width: 640px) {
  body {
    font-size: 15px;
  }
  .topbar-inner {
    gap: 12px;
    padding: 8px 14px;
    flex-wrap: wrap;
  }
  .nav {
    order: 3;
    width: calc(100% + 20px);
    margin: 0 -10px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav a {
    white-space: nowrap;
  }
  .wallet-chip {
    display: none;
  }
  main {
    padding: 18px 14px 110px;
  }
  .demo-bar-inner {
    padding: 8px 14px;
  }
  .ladder-head {
    display: none;
  }
  .rung {
    grid-template-columns: minmax(0, 1fr) 58px 64px;
    gap: 8px;
    padding: 12px;
  }
  .rung .pool-col {
    display: none;
  }
  .table .hide-sm {
    display: none;
  }
}

/* Reduced motion switches animation off everywhere, except the trending stack, which has its own gentle version. */
@media (prefers-reduced-motion: reduce) {
  *:not(.hero-slide),
  *::before,
  *::after {
    transition: none !important;
    animation: none !important;
  }
}

/* ------------------------------------------------------------ Live test & admin */

.tag-test {
  background: transparent;
  color: var(--warn);
  border: 1px solid color-mix(in srgb, var(--warn) 60%, transparent);
  margin-left: 4px;
}
.m-venues {
  margin: 6px 0 0;
  font-size: 14px;
  color: var(--muted);
}
.m-venues .tag-test {
  margin-left: 0;
}

.admin-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.admin-form {
  display: grid;
  gap: 12px;
  margin-top: 12px;
}
.admin-grid {
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  align-items: end;
}
.admin-form input:not([type='checkbox']),
.admin-form select,
.admin-detect input {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: var(--r-sm);
  padding: 9px 10px;
}
.venues {
  grid-column: 1 / -1;
  border: 0;
  padding: 0;
  margin: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
}
.check {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  font-size: 14px;
}
.admin-actions {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}
.suggested {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-top: 14px;
}
.suggested .btn {
  padding: 4px 12px;
  font-size: 13px;
}
.admin-list {
  display: grid;
  gap: 10px;
}
.admin-detect {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1.4fr);
  gap: 10px;
  align-items: end;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
}
.table-scroll {
  overflow-x: auto;
}
.checks td small {
  display: block;
  font-size: 12px;
  color: var(--muted);
  font-weight: 400;
}
.checks td.pass {
  color: var(--up);
  font-weight: 600;
}
.checks td.fail {
  color: var(--crash);
  font-weight: 600;
}
.footer a {
  color: var(--muted);
}
code {
  background: var(--raised);
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 0.92em;
}
@media (max-width: 640px) {
  .admin-detect {
    grid-template-columns: 1fr;
  }
}

/* Admin: manual markets */
.admin-form textarea {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: var(--r-sm);
  padding: 9px 10px;
  font: inherit;
  resize: vertical;
}
.admin-result {
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  align-items: end;
}
.admin-result .admin-list,
.admin-preview {
  grid-column: 1 / -1;
}
.admin-preview {
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 12px 14px;
}
.admin-preview p {
  margin: 0 0 6px;
}
.admin-row-actions {
  white-space: nowrap;
}
.admin-row-actions .btn {
  margin-left: 6px;
}
.m-note {
  color: var(--muted);
  margin: 0 0 10px;
  max-width: 62ch;
}
.admin-result > div:first-child {
  grid-column: 1 / -1;
}

/* Sign-in popup */
.or {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 16px 0 4px;
  color: var(--muted);
  font-size: 13px;
}
.or::before,
.or::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--line);
}
.google-slot {
  display: flex;
  justify-content: center;
  min-height: 44px;
  margin-top: 16px;
}
.code-input {
  font-size: 28px;
  letter-spacing: 0.4em;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.dev-code {
  padding: 10px 12px;
  border: 1px dashed var(--line);
  border-radius: var(--r-sm);
}
.modal .switch:disabled {
  opacity: 0.6;
  cursor: default;
  text-decoration: none;
}

/* Waking-up notice (free hosting sleeps when idle) */
.wake-bar {
  background: var(--raised);
  border-bottom: 1px solid var(--line);
}
.wake-bar p {
  margin: 0;
  padding: 10px 16px;
  text-align: center;
  font-size: 14px;
}

/* Hero for admin-run markets: short headline, countdown as a pill */
.closing-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 10px 0 0;
  padding: 6px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  font-weight: 600;
}
.closing-pill .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--up);
  animation: pulse 1.6s ease-in-out 6;
}

/* Market timeline */
.timeline {
  list-style: none;
  margin: 18px 0 22px;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}
.timeline li {
  position: relative;
  display: grid;
  gap: 2px;
  padding: 14px 14px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
  opacity: 0.7;
}
.timeline li.done,
.timeline li.now {
  opacity: 1;
}
.timeline li.now {
  border-color: var(--up);
  box-shadow: 0 0 0 1px var(--up) inset;
}
.timeline .step-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--line);
  margin-bottom: 6px;
}
.timeline .done .step-dot {
  background: var(--up);
}
.timeline .now .step-dot {
  background: var(--up);
  animation: pulse 1.6s ease-in-out 6;
}
.timeline .muted {
  font-size: 13px;
}
@media (max-width: 640px) {
  /* Stay on one row on phones so the outcome buttons aren't pushed off the screen. */
  .timeline {
    gap: 6px;
    margin: 14px 0 16px;
  }
  .timeline li {
    padding: 10px 9px 8px;
    font-size: 13px;
    line-height: 1.25;
    word-break: break-word;
  }
  .timeline .muted {
    font-size: 12px;
  }
  .timeline .step-dot {
    margin-bottom: 4px;
  }
}
.share-btn {
  margin-left: auto;
  padding: 6px 14px;
  font-size: 14px;
}

/* ------------------------------------------------------- Playful layer
   Outcome icons, the daily gift, friendlier steps, closing-soon cards,
   confetti and the phone tab bar. */

.oc-ico {
  display: inline-block;
  margin-right: 0.3em;
  font-size: 0.95em;
  line-height: 1;
  font-family: 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
}

/* Daily points: a small gift button next to the balance while today's points are unclaimed. */
.gift {
  border: 1px solid color-mix(in srgb, var(--warn) 55%, var(--line));
  background: color-mix(in srgb, var(--warn) 14%, var(--bg));
  color: var(--text);
  font-family: var(--display);
  font-weight: 600;
  font-size: 14px;
  padding: 5px 12px;
  border-radius: 999px;
  white-space: nowrap;
  cursor: pointer;
  animation: wiggle 3.2s ease-in-out 6;
}
.gift:hover {
  background: color-mix(in srgb, var(--warn) 24%, var(--bg));
}
@keyframes wiggle {
  0%, 86%, 100% { transform: rotate(0); }
  89% { transform: rotate(-6deg); }
  92% { transform: rotate(6deg); }
  95% { transform: rotate(-3deg); }
}

/* Outcome picker: a big icon on each choice, and a little lift on the chosen one. */
.picker button {
  padding: 10px 2px 8px;
  transition: transform 120ms ease, background 120ms ease;
}
.picker button:hover {
  transform: translateY(-2px);
}
.pick-ico {
  font-size: 22px;
  line-height: 1.1;
  font-family: 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
}
.picker button[aria-checked='true'] {
  transform: translateY(-2px) scale(1.04);
  box-shadow: 0 6px 20px color-mix(in srgb, var(--c) 35%, transparent);
}

/* Three steps instead of a wall of text. */
.steps {
  list-style: none;
  padding: 0;
  margin: 14px 0 10px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  counter-reset: step;
}
.steps li {
  position: relative;
  padding: 18px 18px 16px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
  counter-increment: step;
}
.steps li::after {
  content: counter(step);
  position: absolute;
  top: 14px;
  right: 16px;
  font-family: var(--display);
  font-weight: 600;
  font-size: 28px;
  line-height: 1;
  color: var(--line);
}
.step-ico {
  display: block;
  font-size: 30px;
  line-height: 1;
  margin-bottom: 10px;
  font-family: 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
}
.steps b {
  font-family: var(--display);
  font-size: 18px;
}
.steps p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 14px;
}
.full-rules summary {
  cursor: pointer;
  color: var(--muted);
  font-size: 14px;
  padding: 6px 0;
}
.full-rules summary:hover {
  color: var(--text);
}

/* Markets that close within 15 minutes get a glowing edge and a tag. */
.card {
  position: relative;
  transition: border-color 120ms, transform 120ms;
}
.card:hover {
  transform: translateY(-2px);
}
.card.soon {
  border-color: color-mix(in srgb, var(--warn) 45%, var(--line));
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--warn) 20%, transparent), 0 8px 26px color-mix(in srgb, var(--warn) 10%, transparent);
}
.soon-tag {
  position: absolute;
  top: -10px;
  left: 14px;
  font-size: 12px;
  font-weight: 600;
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--warn);
  color: #1a1300;
}

.empty-art {
  font-size: 44px;
  line-height: 1;
  margin-bottom: 8px;
  font-family: 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
}
.empty strong {
  color: var(--text);
}

/* Confetti after a prediction or a daily claim. */
#confetti {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 70;
  overflow: hidden;
}
#confetti i {
  position: absolute;
  left: 50%;
  top: 42%;
  width: 9px;
  height: 14px;
  border-radius: 2px;
  background: var(--c);
  opacity: 0;
  animation: confetti 1.5s cubic-bezier(0.2, 0.7, 0.3, 1) var(--d) forwards;
}
#confetti i:nth-child(3n) {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
@keyframes confetti {
  0% { opacity: 1; transform: translate(0, 0) rotate(0); }
  35% { opacity: 1; transform: translate(calc(var(--x) * 0.7), -26vh) rotate(calc(var(--r) * 0.5)); }
  100% { opacity: 0; transform: translate(var(--x), 48vh) rotate(var(--r)); }
}

/* The phone tab bar: hidden on wider screens, where the top nav has room. */
.tabbar {
  display: none;
}
.demo-bar .short {
  display: none;
}

/* Phones and tablets in portrait use the bottom tab bar; the top bar keeps the logo and account. */
@media (max-width: 900px) {
  .nav {
    display: none;
  }
  .topbar-inner {
    flex-wrap: nowrap;
  }
  .tabbar {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 32;
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
    /* Solid rather than blurred: at 94% the blur barely showed, and it re-blurred the page on every scroll frame. */
    background: var(--surface);
    border-top: 1px solid var(--line);
  }
  .tabbar a {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 6px 0 4px;
    border-radius: var(--r-sm);
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }
  .tabbar svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .tabbar a[aria-current='page'] {
    color: var(--text);
    background: var(--raised);
  }
  /* The "Make a prediction" bar sits just above the tab bar. */
  .mobile-bar {
    bottom: calc(62px + env(safe-area-inset-bottom));
    padding-bottom: 10px;
  }
  main {
    padding-bottom: 170px;
  }
  #toast {
    bottom: calc(82px + env(safe-area-inset-bottom));
  }
}

@media (max-width: 640px) {
  .demo-bar .long {
    display: none;
  }
  .demo-bar .short {
    display: inline;
  }
  .demo-bar-inner {
    flex-wrap: nowrap;
    gap: 8px;
  }
  .demo-bar p {
    flex: 1 1 auto;
    font-size: 13px;
  }
  .demo-bar .btn {
    white-space: nowrap;
    padding: 4px 10px;
  }
  .steps {
    grid-template-columns: 1fr;
    gap: 10px;
  }
  .steps li {
    display: grid;
    grid-template-columns: 40px 1fr;
    column-gap: 12px;
    padding: 14px 16px;
  }
  .step-ico {
    grid-row: span 2;
    margin: 2px 0 0;
  }
  .steps p {
    grid-column: 2;
  }
  .gift {
    padding: 5px 10px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .gift,
  .card:hover,
  .picker button:hover {
    animation: none;
    transform: none;
  }
}

/* ---------------------------------------------------------- Dashboard */

.dash-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 20px;
}
.count-inline {
  font-size: 0.7em;
  font-weight: 600;
}

.stat-tiles {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 12px;
  margin: 0;
}
.stat-tile {
  position: relative;
  padding: 14px 16px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
  min-width: 0;
}
.stat-tile dt {
  font-size: 13px;
  color: var(--muted);
}
.stat-tile dd {
  margin: 4px 0 2px;
  font-family: var(--display);
  font-weight: 600;
  font-size: 26px;
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.stat-tile p {
  margin: 0;
  font-size: 13px;
  color: var(--muted);
}
.stat-tile p a {
  color: var(--text);
}
.tile-btn {
  margin-top: 10px;
  padding: 5px 12px;
  font-size: 13px;
}
.meter {
  height: 6px;
  margin-top: 10px;
  border-radius: 999px;
  background: var(--raised);
  overflow: hidden;
}
.meter i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--up);
}

/* Points over time: one series, a zero line, a crosshair dot and tooltip on hover. */
.pchart {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 10px;
  padding: 14px 16px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
}
.pchart-axis {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
  text-align: right;
}
.pchart-plot {
  position: relative;
  height: 160px;
  cursor: crosshair;
  touch-action: pan-y;
}
.pchart-plot svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}
.pchart-zero {
  stroke: var(--line);
  stroke-width: 1;
  stroke-dasharray: 3 3;
}
.pchart-line {
  fill: none;
  stroke-width: 2;
  stroke-linejoin: round;
  stroke-linecap: round;
}
.pchart-line.up { stroke: var(--up); }
.pchart-line.down { stroke: var(--crash); }
.pchart-dot {
  position: absolute;
  width: 10px;
  height: 10px;
  margin: -5px 0 0 -5px;
  border-radius: 50%;
  background: var(--text);
  box-shadow: 0 0 0 2px var(--surface);
  pointer-events: none;
}
.pchart-tip {
  position: absolute;
  transform: translate(14px, -50%);
  padding: 6px 10px;
  border-radius: var(--r-sm);
  background: var(--raised);
  border: 1px solid var(--line);
  font-size: 13px;
  white-space: nowrap;
  pointer-events: none;
  z-index: 2;
}
.pchart-tip.flip {
  transform: translate(calc(-100% - 14px), -50%);
}
.pchart-tip.low {
  transform: translate(14px, calc(-100% - 8px));
}
.pchart-tip.flip.low {
  transform: translate(calc(-100% - 14px), calc(-100% - 8px));
}

/* Record per outcome: a thin bar of the share of picks that won. */
.orec {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 8px;
}
.orec li {
  display: grid;
  grid-template-columns: 96px 1fr auto;
  align-items: center;
  gap: 12px;
  font-size: 14px;
}
.orec-bar {
  height: 8px;
  border-radius: 999px;
  background: var(--raised);
  overflow: hidden;
}
.orec-bar i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--c);
}
.orec-num {
  color: var(--muted);
  white-space: nowrap;
}

@media (max-width: 640px) {
  .stat-tiles {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }
  .stat-tile dd {
    font-size: 22px;
  }
  .orec li {
    grid-template-columns: 82px 1fr auto;
    gap: 8px;
  }
}

/* ---------------------------------------------------------- Earn, onboarding, TestFPT */

.faucet-btn {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  font-weight: 600;
  font-size: 14px;
  padding: 5px 12px;
  border-radius: 999px;
  white-space: nowrap;
  cursor: pointer;
}
.faucet-btn:hover {
  border-color: color-mix(in srgb, var(--up) 50%, var(--line));
}

.howto,
.steplist {
  list-style: none;
  margin: 16px 0;
  padding: 0;
  display: grid;
  gap: 14px;
  counter-reset: howto;
}
.howto li {
  position: relative;
  padding-left: 36px;
  counter-increment: howto;
  display: grid;
  gap: 6px;
  justify-items: start;
}
.howto li::before {
  content: counter(howto);
  position: absolute;
  left: 0;
  top: 0;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 600;
  background: var(--raised);
}
.howto .muted,
.steplist .muted {
  font-size: 14px;
}
.steplist li {
  display: grid;
  grid-template-columns: 26px 1fr;
  gap: 10px;
  align-items: start;
}
.steplist li > div {
  display: grid;
  gap: 4px;
  justify-items: start;
}
.steplist li > div .btn {
  margin-top: 4px;
}
.step-check {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid var(--line);
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 600;
}
.steplist li.done .step-check {
  background: var(--up);
  border-color: var(--up);
  color: var(--bg);
}
.steplist li.done b {
  text-decoration: line-through;
  color: var(--muted);
}
.copy-row {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  max-width: 100%;
}
.copy-row code {
  font-size: 13px;
  padding: 4px 8px;
  border-radius: var(--r-sm);
  background: var(--raised);
  overflow-wrap: anywhere;
}
.copy-row input {
  flex: 1 1 220px;
  min-width: 0;
}
.row-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 4px;
}

.start-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin: 0 0 24px;
  padding: 16px 18px;
  border-radius: var(--r-md);
  border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line));
  background: color-mix(in srgb, var(--warn) 8%, var(--surface));
}
.start-card h2 {
  font-size: 19px;
  margin: 0 0 2px;
}
.start-card p {
  margin: 0;
}
.start-actions {
  display: flex;
  gap: 8px;
}

.claim-card {
  display: flex;
  gap: 18px 28px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: var(--r-lg);
  border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line));
  background: linear-gradient(135deg, color-mix(in srgb, var(--warn) 12%, var(--surface)), var(--surface));
}
.claim-amount {
  display: grid;
}
.claim-amount b {
  font-family: var(--display);
  font-size: clamp(30px, 4.5vw, 38px);
  letter-spacing: -0.02em;
  line-height: 1.05;
}
.claim-amount small {
  font-size: 0.45em;
  color: var(--muted);
}
.claim-side {
  display: grid;
  gap: 8px;
  justify-items: start;
  flex: 1 1 280px;
  max-width: 420px;
}
.claim-side .cta {
  width: 100%;
}
.claim-side .fine {
  margin: 0;
}

.earn-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.earn-card {
  padding: 16px 18px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--surface);
  display: grid;
  gap: 8px;
  align-content: start;
  justify-items: start;
}
.earn-card h2 {
  font-size: 18px;
  margin: 0;
}
.earn-card p {
  margin: 0;
}
.inline-form {
  display: flex;
  gap: 8px;
  width: 100%;
}
.inline-form input {
  flex: 1;
  min-width: 0;
}

.tasks {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 8px;
}
.task {
  display: grid;
  grid-template-columns: 40px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 12px 14px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--surface);
}
.task.is-done {
  opacity: 0.7;
}
.task-ico {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--raised);
  font-size: 20px;
  font-family: 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
}
.task-body {
  display: grid;
  min-width: 0;
}
.task-body small {
  color: var(--muted);
}
.todo-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 0 0 8px;
}
.task-body .task-hint {
  margin-top: 4px;
  color: var(--text-2, var(--muted));
}
.row-edit td {
  background: var(--surface-2, transparent);
}
.row-edit .task-form {
  margin: 4px 0;
}
.row-edit .span-all {
  grid-column: 1 / -1;
  margin: 0;
}
td .row-actions {
  justify-content: flex-end;
  margin-top: 0;
  flex-wrap: nowrap;
}
.task-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.task-done {
  color: var(--up);
  font-weight: 600;
}

.task-form {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 10px;
  align-items: end;
  margin-bottom: 14px;
}

@media (max-width: 640px) {
  .task {
    grid-template-columns: 36px 1fr;
  }
  .task-actions {
    grid-column: 1 / -1;
    justify-content: stretch;
  }
  .task-actions .btn {
    flex: 1;
    text-align: center;
  }
  .start-actions {
    width: 100%;
  }
  .start-actions .btn {
    flex: 1;
    text-align: center;
  }
  .faucet-btn {
    padding: 5px 9px;
  }
}
.earn-card .copy-row {
  width: 100%;
}
.save-keys {
  display: grid;
  gap: 6px;
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: var(--r-md);
  border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line));
  background: color-mix(in srgb, var(--warn) 8%, var(--surface));
}
.save-keys .secret {
  max-width: 100%;
  overflow-wrap: anywhere;
}

/* =====================================================================
   Premium layer: icons, surfaces, cards, dashboard, earn and admin.
   Later rules here refine the base components above.
   ===================================================================== */

/* ---------------------------------------------------------------- Icons */

.i {
  width: 1.1em;
  height: 1.1em;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  vertical-align: -0.17em;
}
.i-fill {
  fill: currentColor;
  stroke: none;
}
.oc-ico,
.pick-ico,
.step-ico,
.task-ico,
.empty-art {
  font-family: inherit;
}
.oc .oc-ico {
  margin-right: 0.28em;
  width: 1em;
  height: 1em;
  vertical-align: -0.12em;
  stroke-width: 2.4;
}

/* -------------------------------------------------------------- Buttons */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border-color: var(--line-strong);
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  padding: 8px 15px;
  font-size: 14px;
  line-height: 1.2;
  transition: background 120ms, border-color 120ms, transform 120ms, box-shadow 120ms;
}
.btn:hover {
  background: var(--raised);
  border-color: color-mix(in srgb, var(--text) 22%, var(--line-strong));
}
.btn:active:not(:disabled) {
  transform: translateY(1px);
}
.btn .i {
  width: 16px;
  height: 16px;
}
.btn-solid {
  background: var(--text);
  color: var(--on-solid);
  border-color: var(--text);
  box-shadow: 0 6px 18px -8px color-mix(in srgb, var(--text) 50%, transparent);
}
.btn-solid:hover {
  background: color-mix(in srgb, var(--text) 88%, var(--brand));
  border-color: transparent;
}
.btn-lg {
  padding: 12px 20px;
  font-size: 15px;
}
.btn-sm {
  padding: 5px 11px;
  font-size: 13px;
  gap: 5px;
}
.btn-sm .i {
  width: 14px;
  height: 14px;
}
.btn-danger {
  color: var(--crash);
  border-color: color-mix(in srgb, var(--crash) 35%, var(--line));
}
.btn-danger:hover {
  background: color-mix(in srgb, var(--crash) 12%, transparent);
  border-color: color-mix(in srgb, var(--crash) 60%, var(--line));
}
.cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 10px 26px -12px color-mix(in srgb, var(--c, var(--text)) 70%, transparent);
  transition: filter 120ms, transform 120ms;
}
.cta:hover:not(:disabled) {
  filter: brightness(1.06);
}

/* ---------------------------------------------------------------- Inputs */

main input:not([type='checkbox']):not([type='radio']),
main select,
main textarea,
.modal input,
.modal select {
  width: 100%;
  border: 1px solid var(--line-strong);
  background: color-mix(in srgb, var(--bg) 70%, var(--surface));
  color: var(--text);
  border-radius: var(--r-sm);
  padding: 10px 12px;
  font: inherit;
  font-size: 15px;
  transition: border-color 120ms, box-shadow 120ms;
}
main input::placeholder,
main textarea::placeholder,
.modal input::placeholder {
  color: color-mix(in srgb, var(--muted) 75%, transparent);
}
main input:not([type='checkbox']):not([type='radio']):focus,
main select:focus,
main textarea:focus,
.modal input:focus {
  outline: none;
  border-color: var(--brand);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent);
}
main input[readonly] {
  color: var(--muted);
}
main .stake-input input:not([type='checkbox']):not([type='radio']),
main .stake-input input:not([type='checkbox']):not([type='radio']):focus {
  border: 0;
  background: transparent;
  box-shadow: none;
  padding: 8px 0;
  font-size: 26px;
}
.select select {
  width: auto;
  padding: 7px 10px;
  font-size: 14px;
}
.field-label {
  font-weight: 600;
  font-size: 12.5px;
  letter-spacing: 0.01em;
}
input[type='checkbox'] {
  accent-color: var(--brand);
  width: 16px;
  height: 16px;
}

.input-wrap {
  position: relative;
  flex: 1;
  min-width: 0;
  display: flex;
}
.input-prefix {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}
main .input-wrap input:not([type='checkbox']) {
  padding-left: 28px;
}

/* --------------------------------------------------------------- Top bar */

.topbar {
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter: saturate(1.4) blur(14px);
  border-bottom-color: color-mix(in srgb, var(--line) 80%, transparent);
}
.topbar-inner {
  padding: 12px 20px;
}
.nav a {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 12px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 14px;
  transition: color 120ms, background 120ms;
}
.nav a .i {
  width: 16px;
  height: 16px;
  opacity: 0.85;
}
.nav a[aria-current='page'] {
  background: var(--raised);
  box-shadow: inset 0 0 0 1px var(--line-strong);
}
.nav a[aria-current='page'] .i {
  color: var(--brand);
  opacity: 1;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 36px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--text);
  font-family: var(--display);
  font-weight: 600;
  font-size: 14px;
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
}
.chip:hover {
  background: var(--raised);
}
.chip .i {
  width: 16px;
  height: 16px;
}
.chip-faucet .i {
  color: var(--brand);
}
.points .i {
  color: var(--warn);
}
.points .unit {
  color: var(--muted);
  font-weight: 600;
  font-size: 12px;
}
.gift {
  border-color: color-mix(in srgb, var(--warn) 55%, var(--line));
  background: color-mix(in srgb, var(--warn) 14%, var(--surface));
}
.gift .i {
  color: var(--warn);
}
.wallet-chip {
  padding: 0 12px 0 4px;
  font-family: var(--body);
  font-weight: 600;
  font-size: 13px;
}
.account {
  gap: 8px;
}
.account > .btn-solid {
  padding: 9px 16px;
}

/* -------------------------------------------------------------- Avatars */

.avatar {
  --size: 40px;
  width: var(--size);
  height: var(--size);
  flex: none;
  display: inline-grid;
  place-items: center;
  border-radius: 50%;
  background: linear-gradient(140deg, hsl(var(--h) 72% 60%), hsl(calc(var(--h) + 50) 68% 42%));
  color: #fff;
  font-family: var(--display);
  font-weight: 600;
  font-size: calc(var(--size) * 0.44);
  line-height: 1;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18), 0 4px 12px -6px hsl(var(--h) 70% 40%);
}
.avatar-img {
  background: var(--surface-2);
  overflow: hidden;
  text-shadow: none;
  box-shadow: inset 0 0 0 1px var(--line), 0 4px 12px -6px rgba(0, 0, 0, 0.5);
}
.avatar-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.avatar-sm { --size: 26px; }
.avatar-md { --size: 42px; }
.avatar-lg { --size: 54px; }
.avatar-xl { --size: 68px; }

/* --------------------------------------------------------- Shared pieces */

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.eyebrow .dot,
.pill .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 22%, transparent);
  animation: pulse 1.8s ease-in-out 6;
}
.eyebrow .dot {
  background: var(--up);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--up) 22%, transparent);
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  line-height: 1.5;
  font-family: var(--body);
  vertical-align: middle;
  color: var(--muted);
  background: var(--raised);
}
.pill .i {
  width: 13px;
  height: 13px;
}
.pill-live { color: var(--up); background: color-mix(in srgb, var(--up) 14%, transparent); }
.pill-soon { color: var(--brand); background: color-mix(in srgb, var(--brand) 15%, transparent); }
.pill-wait { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.pill-hot { color: var(--down); background: color-mix(in srgb, var(--down) 15%, transparent); }
.pill-done { color: var(--text); background: var(--raised); }
.pill-off { color: var(--muted); background: var(--raised); }
.pill-pts { color: var(--up); background: color-mix(in srgb, var(--up) 14%, transparent); margin-left: auto; }

.count-badge {
  display: inline-grid;
  place-items: center;
  min-width: 22px;
  height: 22px;
  padding: 0 7px;
  margin-left: 6px;
  border-radius: 999px;
  background: var(--raised);
  color: var(--muted);
  font-family: var(--body);
  font-size: 12px;
  font-weight: 600;
  vertical-align: 3px;
}

.panel {
  position: relative;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  box-shadow: var(--shadow);
  padding: 20px 22px;
  margin-bottom: 18px;
}
.section.panel {
  border-top: 1px solid var(--line);
  padding: 20px 22px;
}
.panel-flush {
  padding: 0;
  overflow: hidden;
}
.section.panel-flush {
  padding: 0;
}
.panel-flush > .section-head {
  padding: 18px 22px 14px;
  margin: 0;
}
.panel-flush .table th:first-child,
.panel-flush .table td:first-child {
  padding-left: 22px;
}
.panel-flush .table th:last-child,
.panel-flush .table td:last-child {
  padding-right: 22px;
}
.panel-flush .table tr:last-child td {
  border-bottom: 0;
}
.panel-flush .pad {
  padding: 0 22px 20px;
  margin: 0;
}
.panel-alert {
  border-color: color-mix(in srgb, var(--warn) 40%, var(--line));
  background: linear-gradient(180deg, color-mix(in srgb, var(--warn) 7%, var(--surface-2)), var(--surface));
}

.section-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}
.section-head h2 {
  font-size: 19px;
  margin: 0;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px 8px;
}
.section-head p {
  margin: 3px 0 0;
  font-size: 14px;
  max-width: 70ch;
}
.section-head .head-action {
  margin-left: auto;
}
.section-ico,
.page-ico,
.card-ico,
.tile-ico,
.todo-ico,
.start-ico,
.claim-ico {
  flex: none;
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 11px;
  color: var(--c, var(--brand));
  background: color-mix(in srgb, var(--c, var(--brand)) 14%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c, var(--brand)) 22%, transparent);
}
.section-ico .i,
.card-ico .i,
.tile-ico .i,
.todo-ico .i {
  width: 18px;
  height: 18px;
}
.section-head-tight {
  margin: 34px 0 14px;
}

.page-head {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  margin: 4px 0 22px;
}
.page-head .page-ico {
  width: 52px;
  height: 52px;
  border-radius: 16px;
}
.page-head .page-ico .i {
  width: 26px;
  height: 26px;
}
.page-head .page-lede {
  margin-bottom: 0;
}

.empty {
  border-style: dashed;
  background: color-mix(in srgb, var(--surface) 55%, transparent);
  border-radius: var(--r-lg);
  padding: 44px 20px;
}
.empty-art {
  display: inline-grid;
  place-items: center;
  width: 56px;
  height: 56px;
  border-radius: 18px;
  margin-bottom: 12px;
  color: var(--brand);
  background: color-mix(in srgb, var(--brand) 13%, transparent);
}
.empty-art .i {
  width: 26px;
  height: 26px;
}
.fine .switch,
.fine a {
  color: var(--text);
}
.fine .i {
  width: 13px;
  height: 13px;
}

/* ------------------------------------------------------- Featured market */

.featured {
  position: relative;
  padding: 30px 32px;
  margin: 6px 0 8px;
  border: 1px solid var(--line);
  border-radius: 26px;
  background:
    radial-gradient(600px 300px at 0% 0%, color-mix(in srgb, var(--brand) 16%, transparent), transparent 70%),
    radial-gradient(500px 280px at 100% 100%, color-mix(in srgb, var(--up) 10%, transparent), transparent 70%),
    linear-gradient(180deg, var(--surface-2), var(--surface));
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.featured-main {
  display: grid;
  gap: 14px;
  justify-items: start;
}
.hero-token {
  display: flex;
  align-items: center;
  gap: 16px;
}
.featured h1 {
  font-size: clamp(26px, 3.4vw, 36px);
  line-height: 1;
}
.featured .h1-soft {
  color: var(--muted);
  font-weight: 600;
}
.hero-name {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 15px;
}
.featured .lede {
  margin: 0;
}
.hero-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 0;
}
.hero-facts > div {
  display: grid;
  grid-template-columns: auto auto;
  align-items: center;
  column-gap: 8px;
  padding: 8px 14px 8px 10px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 40%, transparent);
}
.hero-facts .i {
  grid-row: span 2;
  width: 20px;
  height: 20px;
  color: var(--brand);
}
.hero-facts dt {
  font-size: 11.5px;
  color: var(--muted);
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.hero-facts dd {
  margin: 0;
  font-family: var(--display);
  font-weight: 600;
  font-size: 17px;
}
.featured .actions {
  margin-top: 4px;
}

.mini-ladder {
  padding: 16px;
  border-radius: 20px;
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 45%, var(--surface));
  gap: 7px;
}
.mini-head {
  display: flex;
  justify-content: space-between;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
  padding: 0 4px 4px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.mini-rung {
  grid-template-columns: 100px 1fr auto;
  padding: 10px 14px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
}
.mini-rung::before {
  background: linear-gradient(90deg, color-mix(in srgb, var(--c) 30%, transparent), color-mix(in srgb, var(--c) 12%, transparent));
}
.mini-rung b {
  display: inline-flex;
  align-items: center;
}

/* -------------------------------------------------------- Toolbar & tabs */

.tabs {
  background: var(--surface);
  border-color: var(--line);
  box-shadow: var(--shadow);
}
.tabs button {
  padding: 7px 15px;
  transition: background 120ms, color 120ms;
}
.tabs button[aria-selected='true'] {
  background: var(--raised);
  box-shadow: inset 0 0 0 1px var(--line-strong);
}
.tabs .count {
  display: inline-grid;
  place-items: center;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--text) 8%, transparent);
  font-size: 12px;
  margin-left: 6px;
}
.select .i {
  width: 16px;
  height: 16px;
}

/* ---------------------------------------------------------- Market cards */

.grid {
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.card {
  gap: 14px;
  padding: 18px;
  border-radius: var(--r-lg);
  border-color: var(--line);
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  box-shadow: var(--shadow);
  transition: transform 160ms ease, border-color 160ms, box-shadow 160ms;
}
.card:hover {
  transform: translateY(-3px);
  border-color: color-mix(in srgb, var(--brand) 45%, var(--line));
  box-shadow: var(--shadow-lg), 0 0 0 1px color-mix(in srgb, var(--brand) 20%, transparent);
}
.card-top {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
}
.card-title {
  display: grid;
  min-width: 0;
}
.card .sym {
  font-size: 18px;
}
.card-name {
  margin: 2px 0 0;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-lead {
  font-size: 14px;
  min-height: 0;
}
.strip {
  height: 7px;
  gap: 3px;
}
.card-venues {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  color: var(--muted);
}
.card-venues .i,
.card-foot .i {
  width: 14px;
  height: 14px;
  color: var(--muted);
}
.card-foot {
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 14px;
  padding-top: 12px;
  border-top-color: color-mix(in srgb, var(--line) 80%, transparent);
}
.card-foot span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.card-foot .when {
  font-weight: 600;
}
.card-foot .pool {
  color: var(--text);
  font-family: var(--display);
  font-weight: 600;
}
.card-foot .pool .i {
  color: var(--warn);
}
.card.soon {
  border-color: color-mix(in srgb, var(--down) 45%, var(--line));
}

/* How it works */
.steps {
  gap: 16px;
}
.steps li {
  padding: 20px;
  border-radius: var(--r-lg);
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  box-shadow: var(--shadow);
}
.steps li::after {
  font-size: 34px;
  color: color-mix(in srgb, var(--text) 8%, transparent);
}
.step-ico {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 14px;
  margin-bottom: 14px;
  color: var(--c);
  background: color-mix(in srgb, var(--c) 15%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 25%, transparent);
}
.step-ico .i {
  width: 22px;
  height: 22px;
}
#how.section {
  border-top: 0;
}

/* ----------------------------------------------------------- Market page */

.back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
}
.back .i {
  width: 16px;
  height: 16px;
}
.m-title {
  align-items: center;
  gap: 16px;
  flex-wrap: nowrap;
}
.m-title-text {
  min-width: 0;
  display: grid;
}
.m-title-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.m-title .sym {
  font-size: clamp(28px, 3.6vw, 38px);
}
.m-name {
  color: var(--muted);
  font-size: 15px;
}
.m-question {
  font-size: 19px;
  font-weight: 600;
  margin: 18px 0 6px;
}
.m-venues {
  display: flex;
  align-items: center;
  gap: 7px;
}
.m-venues .i {
  width: 15px;
  height: 15px;
}
.share-btn {
  margin-left: auto;
  align-self: flex-start;
}
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
}
.stats > div {
  display: grid;
  grid-template-columns: auto 1fr;
  column-gap: 12px;
  align-items: center;
  padding: 14px 16px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
}
.stats > div > .i {
  grid-row: span 2;
  width: 34px;
  height: 34px;
  padding: 8px;
  border-radius: 10px;
  color: var(--brand);
  background: color-mix(in srgb, var(--brand) 13%, transparent);
}
.stats dd {
  font-size: 18px;
}
.timeline li {
  border-radius: var(--r-md);
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
}
.timeline .step-dot {
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  color: var(--bg);
}
.timeline .step-dot .i {
  width: 13px;
  height: 13px;
  stroke-width: 3;
}
.timeline .now .step-dot {
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--up) 22%, transparent);
}
.rung {
  border-radius: var(--r-md);
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  transition: border-color 140ms, transform 140ms, box-shadow 140ms;
}
.rung::before {
  background: linear-gradient(90deg, color-mix(in srgb, var(--c) 26%, transparent), color-mix(in srgb, var(--c) 8%, transparent));
}
.rung:not(:disabled):hover {
  transform: translateX(2px);
}
.rung[aria-pressed='true'] {
  box-shadow: inset 4px 0 0 var(--c), 0 10px 28px -16px var(--c);
}
.rung-name b {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 2px;
}
.ladder-head {
  text-transform: uppercase;
  font-size: 11.5px;
  letter-spacing: 0.06em;
  font-weight: 600;
}
.market-layout .section {
  border-top: 0;
}
.section.panel h2 {
  margin-bottom: 0;
}
.feed li {
  align-items: center;
  padding: 10px 0;
}
.feed li:last-child {
  border-bottom: 0;
}
.feed-main {
  flex: 1;
  min-width: 0;
}
.feed .who {
  color: var(--text);
  font-family: var(--body);
  font-weight: 600;
}
.activity {
  font-size: 14px;
}

/* Trade panel */
.trade-card {
  border-radius: 22px;
  background:
    radial-gradient(360px 200px at 100% 0%, color-mix(in srgb, var(--c, var(--brand)) 12%, transparent), transparent 70%),
    linear-gradient(180deg, var(--surface-2), var(--surface));
  box-shadow: var(--shadow-lg);
  padding: 20px;
}
.trade-card h2 {
  display: flex;
  align-items: center;
  gap: 9px;
}
.trade-card h2 .i {
  color: var(--c, var(--brand));
}
.picker button {
  border-radius: 12px;
  background: var(--surface);
  padding: 11px 2px 9px;
  gap: 4px;
}
.pick-ico {
  display: grid;
  place-items: center;
  color: var(--c);
}
.pick-ico .i {
  width: 22px;
  height: 22px;
  margin: 0;
}
.picker button[aria-checked='true'] .pick-ico {
  color: var(--bg);
}
.stake-input {
  border-radius: var(--r-md);
  border-color: var(--line-strong);
  background: color-mix(in srgb, var(--bg) 70%, var(--surface));
}
.stake-input:focus-within {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent);
}
.chips button {
  padding: 6px 0;
  border-color: var(--line-strong);
}
.summary .big dt {
  display: inline-flex;
  align-items: center;
}

/* ------------------------------------------------------------ Leaderboard */

.podium {
  list-style: none;
  margin: 0 0 18px;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  align-items: end;
}
.podium li {
  --c: var(--flat);
  position: relative;
  display: grid;
  justify-items: center;
  gap: 6px;
  text-align: center;
  padding: 22px 14px 18px;
  border-radius: var(--r-lg);
  border: 1px solid color-mix(in srgb, var(--c) 35%, var(--line));
  background:
    radial-gradient(240px 140px at 50% 0%, color-mix(in srgb, var(--c) 18%, transparent), transparent 75%),
    linear-gradient(180deg, var(--surface-2), var(--surface));
  box-shadow: var(--shadow);
  min-width: 0;
}
.podium .podium-1 {
  --c: var(--warn);
  order: 2;
  padding-top: 30px;
}
.podium .podium-2 {
  --c: #b9c4d8;
  order: 1;
}
.podium .podium-3 {
  --c: #d99a6c;
  order: 3;
}
.podium li.me {
  box-shadow: var(--shadow), 0 0 0 2px var(--brand);
}
.podium-medal {
  position: absolute;
  top: 12px;
  right: 12px;
  color: var(--c);
}
.podium b {
  font-family: var(--display);
  font-size: 17px;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.podium-profit {
  font-family: var(--display);
  font-size: 20px;
}
.podium .muted {
  font-size: 13px;
}
.rank {
  display: inline-grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  font-size: 14px;
  background: var(--raised);
}
.rank.medal-1 { background: color-mix(in srgb, var(--warn) 25%, transparent); color: var(--warn); }
.rank.medal-2 { background: color-mix(in srgb, #b9c4d8 22%, transparent); color: #b9c4d8; }
.rank.medal-3 { background: color-mix(in srgb, #d99a6c 22%, transparent); color: #d99a6c; }
.who-cell,
.mkt-cell {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.mkt-cell small {
  display: block;
  font-size: 12px;
  font-family: var(--body);
  font-weight: 400;
}
.table th {
  text-transform: uppercase;
  font-size: 11.5px;
  letter-spacing: 0.06em;
  font-weight: 600;
  padding: 10px 12px;
  background: color-mix(in srgb, var(--raised) 45%, transparent);
}
.table td {
  padding: 13px 12px;
  border-bottom-color: color-mix(in srgb, var(--line) 85%, transparent);
}
.table tbody tr {
  transition: background 120ms;
}
.table tbody tr:hover td {
  background: color-mix(in srgb, var(--raised) 40%, transparent);
}
.table .num-cell {
  font-family: var(--display);
  font-weight: 600;
}
.table tr.row-off td {
  opacity: 0.6;
}

/* -------------------------------------------------------------- Dashboard */

.profile-card {
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
  padding: 24px 26px;
  margin-bottom: 18px;
  border: 1px solid var(--line);
  border-radius: 24px;
  background:
    radial-gradient(520px 240px at 0% 0%, color-mix(in srgb, var(--brand) 16%, transparent), transparent 70%),
    linear-gradient(180deg, var(--surface-2), var(--surface));
  box-shadow: var(--shadow-lg);
}
.profile-main {
  flex: 1 1 240px;
  min-width: 0;
  display: grid;
  gap: 2px;
}
.profile-main p {
  margin: 2px 0 0;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.profile-main .i {
  width: 13px;
  height: 13px;
}
.profile-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.stat-tiles {
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 18px;
}
.stat-tile {
  padding: 16px 18px;
  border-radius: var(--r-lg);
  border-color: var(--line);
  background:
    radial-gradient(220px 120px at 100% 0%, color-mix(in srgb, var(--c, var(--brand)) 10%, transparent), transparent 75%),
    linear-gradient(180deg, var(--surface-2), var(--surface));
  box-shadow: var(--shadow);
}
.stat-tile .tile-ico {
  margin-bottom: 12px;
}
.stat-tile dt {
  font-weight: 600;
}
.stat-tile dd {
  font-size: 26px;
}
.tile-btn {
  margin-top: 12px;
}
.meter {
  height: 6px;
  margin-top: 12px;
}
.meter i {
  background: linear-gradient(90deg, color-mix(in srgb, var(--up) 70%, var(--brand)), var(--up));
}
.dash-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 0 18px;
  align-items: start;
}
.pchart {
  padding: 0;
  border: 0;
  background: transparent;
}
.pchart-line {
  stroke-width: 2.5;
}
.orec li {
  grid-template-columns: minmax(64px, max-content) minmax(40px, 1fr) auto;
  gap: 10px;
  padding: 4px 0;
}
.orec-name .oc {
  display: inline-flex;
  align-items: center;
}
.wallet-list li {
  align-items: center;
}
.wallet-list a {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  text-decoration: none;
}
.ledger li {
  padding: 9px 0;
}
.ledger li:last-child {
  border-bottom: 0;
}
.ledger a {
  text-decoration: none;
  font-weight: 600;
}
.ledger a:hover {
  text-decoration: underline;
}

/* ---------------------------------------------------------------- Earn */

.earn-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 12px;
  margin: 0 0 18px;
}
.earn-stats > div {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  column-gap: 12px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
}
.earn-stats > div > .i {
  grid-row: span 2;
  width: 34px;
  height: 34px;
  padding: 8px;
  border-radius: 10px;
  color: var(--brand);
  background: color-mix(in srgb, var(--brand) 13%, transparent);
}
.earn-stats > div > .i-fill {
  padding: 9px;
  color: var(--text);
  background: var(--raised);
}
.earn-stats dt {
  font-size: 12.5px;
  color: var(--muted);
  font-weight: 600;
}
.earn-stats dd {
  margin: 0;
  font-family: var(--display);
  font-weight: 600;
  font-size: 18px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.earn-grid {
  gap: 18px;
  margin-bottom: 18px;
}
.earn-card {
  padding: 20px 22px;
  gap: 12px;
  border-radius: var(--r-lg);
  border-color: var(--line);
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  box-shadow: var(--shadow);
}
.card-head {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
}
.card-head h2 {
  font-size: 18px;
}
.card-ico .i-fill {
  width: 16px;
  height: 16px;
}
.earn-card .card-ico:has(.i-fill) {
  color: var(--text);
  background: var(--raised);
  box-shadow: inset 0 0 0 1px var(--line-strong);
}
.linked {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.linked .i {
  color: var(--up);
}
.ref-stats {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 13px;
  color: var(--muted);
}
.ref-stats span {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--raised);
}
.ref-stats b {
  color: var(--text);
}
.tasks {
  gap: 10px;
}
.task {
  grid-template-columns: 44px 1fr auto;
  gap: 14px;
  padding: 14px 16px;
  border-radius: var(--r-md);
  background: var(--surface);
  transition: border-color 140ms;
}
.task:hover {
  border-color: var(--line-strong);
}
.task-ico {
  width: 44px;
  height: 44px;
  border-radius: 13px;
  color: var(--brand);
  background: color-mix(in srgb, var(--brand) 13%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--brand) 22%, transparent);
}
.task-ico .i {
  width: 20px;
  height: 20px;
}
.task-ico-sm {
  width: 30px;
  height: 30px;
  border-radius: 9px;
}
.task-ico-sm .i {
  width: 15px;
  height: 15px;
}
.task-body b {
  font-size: 15px;
}
.task-body .pts {
  color: var(--up);
  font-weight: 600;
}
.task-done {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.task.is-done .task-ico {
  color: var(--up);
  background: color-mix(in srgb, var(--up) 13%, transparent);
}
.start-card {
  gap: 16px;
  padding: 18px 20px;
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
  flex-wrap: nowrap;
}
.start-ico,
.claim-ico {
  --c: var(--warn);
  width: 46px;
  height: 46px;
  border-radius: 14px;
}
.start-ico .i,
.claim-ico .i {
  width: 22px;
  height: 22px;
}
.start-text {
  flex: 1;
  min-width: 0;
}
.claim-card {
  border-radius: 22px;
  box-shadow: var(--shadow-lg);
  padding: 22px 24px;
}
.claim-amount {
  display: flex;
  align-items: center;
  gap: 16px;
}
.claim-amount > div {
  display: grid;
}
.steplist .step-check .i {
  width: 13px;
  height: 13px;
  stroke-width: 3;
}
.howto .btn .i {
  width: 15px;
  height: 15px;
}

/* ---------------------------------------------------------------- Modal */

.modal-backdrop {
  background: rgba(3, 6, 12, 0.66);
  backdrop-filter: blur(6px);
}
.modal {
  width: min(440px, 100%);
  border-radius: 24px;
  padding: 26px;
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  box-shadow: var(--shadow-lg);
  max-height: calc(100vh - 40px);
  overflow: auto;
}
.wallet-option {
  border-radius: var(--r-md);
  padding: 12px 14px;
  background: var(--surface);
}

/* ------------------------------------------------------------ Admin console */

.admin-login {
  max-width: 440px;
  margin: 40px auto;
  display: grid;
  justify-items: center;
  gap: 10px;
  text-align: center;
  padding: 32px 28px;
  border: 1px solid var(--line);
  border-radius: 24px;
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  box-shadow: var(--shadow-lg);
}
.admin-login .page-ico {
  width: 52px;
  height: 52px;
  border-radius: 16px;
}
.admin-login .page-ico .i {
  width: 24px;
  height: 24px;
}
.admin-login form {
  width: 100%;
  text-align: left;
}
.admin-login p {
  margin: 0;
}

.admin-shell {
