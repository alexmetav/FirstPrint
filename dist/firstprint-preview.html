.timeline-list li {
  position: relative;
  display: grid;
  grid-template-columns: 14px minmax(0, 1fr) auto;
  gap: 12px;
  padding: 0 0 16px;
  font-size: 14px;
}
.timeline-list li::before {
  content: '';
  position: absolute;
  left: 6px;
  top: 14px;
  bottom: 0;
  width: 2px;
  background: var(--line);
}
.timeline-list li:last-child {
  padding-bottom: 0;
}
.timeline-list li:last-child::before {
  display: none;
}
.tl-dot {
  width: 14px;
  height: 14px;
  margin-top: 3px;
  border-radius: 50%;
  border: 3px solid var(--surface);
  background: var(--brand);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--brand) 50%, transparent);
}
.timeline-list .muted {
  font-size: 13px;
  white-space: nowrap;
}
.timeline-list div .muted {
  white-space: normal;
}
.toggle-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 10px;
}
.toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
  font-weight: 600;
  cursor: pointer;
}
.toggle input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}
.toggle-ui {
  position: relative;
  width: 34px;
  height: 20px;
  flex: none;
  border-radius: 999px;
  background: var(--line-strong);
  transition: background 140ms;
}
.toggle-ui::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  transition: transform 140ms;
}
.toggle input:checked + .toggle-ui {
  background: var(--up);
}
.toggle input:checked + .toggle-ui::after {
  transform: translateX(14px);
}
.toggle input:focus-visible + .toggle-ui {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
.backup-line {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  color: var(--muted);
}
.backup-line.ok .i {
  color: var(--up);
}
.backup-line.bad {
  color: var(--crash);
}
.kv {
  display: grid;
  gap: 6px;
}
.progress-cell {
  display: grid;
  gap: 2px;
  min-width: 90px;
  font-weight: 600;
}
.progress-cell .meter {
  margin-top: 4px;
  height: 5px;
}
.admin-main .admin-form label:not(.check) {
  display: grid;
  gap: 0;
  min-width: 0;
}
.admin-main .admin-form input {
  min-width: 0;
}
.admin-form details > summary {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin: 0;
  padding: 6px 12px;
  border: 1px dashed var(--line-strong);
  border-radius: 999px;
}
.admin-form details > summary::before {
  content: '+';
  font-weight: 800;
}
.admin-form details[open] > summary::before {
  content: '−';
}
.admin-main .admin-grid {
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 14px;
}
.task-form {
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  margin: 0;
}
.venues {
  gap: 8px;
}
.venues .check {
  padding: 7px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  font-weight: 600;
  cursor: pointer;
}
.venues .check:has(input:checked) {
  border-color: color-mix(in srgb, var(--brand) 55%, var(--line));
  background: color-mix(in srgb, var(--brand) 10%, var(--surface));
}
.admin-form details summary {
  cursor: pointer;
}
.admin-row-actions {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
  flex-wrap: wrap;
}
.admin-row-actions .btn {
  margin-left: 0;
}
.admin-detect {
  border-radius: var(--r-md);
  background: var(--surface);
  padding: 16px;
}
.admin-result + .admin-result {
  margin-top: 12px;
}
.save-keys {
  border-radius: var(--r-md);
  padding: 14px 16px;
}
.save-keys b {
  display: flex;
  align-items: center;
  gap: 8px;
}
.save-keys b .i {
  color: var(--moon);
}
.admin-main .steplist li {
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
}

/* ------------------------------------------------------------- Responsive */



@media (max-width: 900px) {
  .featured {
    padding: 22px 20px;
  }
  .admin-shell {
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .admin-side {
    position: static;
    grid-template-columns: 1fr auto;
    align-items: center;
    padding: 10px;
  }
  .admin-nav {
    grid-column: 1 / -1;
    grid-row: 2;
    display: flex;
    overflow-x: auto;
    scrollbar-width: none;
    gap: 4px;
  }
  .admin-nav button {
    width: auto;
    white-space: nowrap;
    padding: 8px 12px;
  }
  .admin-lock {
    width: auto;
  }
}

@media (max-width: 640px) {
  .hide-sm,
  .chip .hide-sm {
    display: none;
  }
  .chip {
    height: 34px;
    padding: 0 10px;
  }
  .chip-faucet {
    padding: 0 9px;
  }
  .wallet-chip {
    display: none;
  }
  .points .unit {
    display: none;
  }
  .featured {
    border-radius: 22px;
    padding: 20px 16px;
  }
  .hero-token {
    gap: 12px;
  }
  .hero-token .avatar-xl {
    --size: 52px;
  }
  .hero-facts {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    width: 100%;
    gap: 8px;
  }
  .hero-facts > div {
    grid-template-columns: 1fr;
    padding: 8px 10px;
  }
  .hero-facts .i {
    grid-row: auto;
    margin-bottom: 4px;
  }
  .hero-facts dd {
    font-size: 15px;
  }
  .featured .actions {
    width: 100%;
  }
  .featured .actions .btn {
    flex: 1;
  }
  .mini-ladder {
    padding: 10px;
  }
  .mini-rung {
    grid-template-columns: 82px 1fr auto;
    padding: 8px 10px;
    font-size: 13px;
  }
  .tabs {
    width: 100%;
  }
  .tabs button {
    flex: 1;
    padding: 7px 6px;
    font-size: 13px;
  }
  .toolbar .select {
    margin-left: auto;
  }
  .panel,
  .section.panel {
    padding: 16px;
    border-radius: 18px;
  }
  .panel-flush,
  .section.panel-flush {
    padding: 0;
  }
  .panel-flush > .section-head {
    padding: 16px 16px 12px;
  }
  .panel-flush .table th:first-child,
  .panel-flush .table td:first-child {
    padding-left: 16px;
  }
  .panel-flush .table th:last-child,
  .panel-flush .table td:last-child {
    padding-right: 16px;
  }
  .panel-flush .pad {
    padding: 0 16px 16px;
  }
  .table td,
  .table th {
    padding-left: 8px;
    padding-right: 8px;
  }
  .stats {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }
  .stats > div {
    padding: 10px 12px;
    column-gap: 10px;
  }
  .stats > div > .i {
    width: 28px;
    height: 28px;
    padding: 6px;
  }
  .stats dd {
    font-size: 15px;
  }
  .m-title .avatar-lg {
    --size: 44px;
  }
  .profile-card {
    padding: 18px;
    gap: 14px;
  }
  .profile-card .avatar-xl {
    --size: 54px;
  }
  .profile-actions {
    width: 100%;
  }
  .profile-actions .btn {
    flex: 1;
  }
  .stat-tiles {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .stat-tile {
    padding: 14px;
  }
  .stat-tile .tile-ico {
    width: 30px;
    height: 30px;
    margin-bottom: 8px;
  }
  .dash-grid {
    grid-template-columns: 1fr;
  }
  .earn-stats {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }
  .earn-stats > div {
    padding: 10px 12px;
    column-gap: 10px;
  }
  .earn-stats > div > .i {
    width: 28px;
    height: 28px;
    padding: 6px;
  }
  .earn-stats dd {
    font-size: 15px;
  }
  .page-head .page-ico {
    width: 42px;
    height: 42px;
    border-radius: 13px;
  }
  .page-head .page-ico .i {
    width: 21px;
    height: 21px;
  }
  .podium {
    gap: 8px;
  }
  .podium li {
    padding: 16px 8px 12px;
  }
  .podium .avatar-lg {
    --size: 40px;
  }
  .podium b {
    font-size: 14px;
  }
  .podium-profit {
    font-size: 15px;
  }
  .podium .muted {
    display: none;
  }
  .podium-medal {
    top: 8px;
    right: 8px;
  }
  .start-card {
    flex-wrap: wrap;
  }
  .start-ico {
    display: none;
  }
  .task {
    grid-template-columns: 40px 1fr;
  }
  .task-ico {
    width: 40px;
    height: 40px;
  }
  .todo li {
    grid-template-columns: auto minmax(0, 1fr);
  }
  .todo li .btn {
    grid-column: 1 / -1;
  }
  .admin-row-actions {
    justify-content: flex-start;
  }
  .card-foot {
    gap: 10px;
  }
  .tabbar {
    background: color-mix(in srgb, var(--surface) 90%, transparent);
  }
  .tabbar .i {
    width: 22px;
    height: 22px;
    stroke-width: 1.9;
  }
  .tabbar a[aria-current='page'] .i {
    color: var(--brand);
  }
}

@media (prefers-reduced-motion: reduce) {
  .card:hover,
  .rung:not(:disabled):hover {
    transform: none;
  }
}
.admin-main .stat-tiles {
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
}

/* =====================================================================
   Polymarket-style additions: search and sort tabs, Yes/No markets,
   odds history, top predictors, public profiles, leaderboard periods.
   ===================================================================== */

.search {
  position: relative;
  flex: 1 1 260px;
  max-width: 420px;
  display: flex;
  align-items: center;
}
.search > .i {
  position: absolute;
  left: 13px;
  width: 17px;
  height: 17px;
  color: var(--muted);
  pointer-events: none;
}
main .search input:not([type='checkbox']) {
  padding-left: 40px;
  border-radius: 999px;
  background: var(--surface);
}
.tabs-scroll {
  display: flex;
  width: max-content;
  max-width: 100%;
  overflow-x: auto;
  scrollbar-width: none;
  margin-bottom: 16px;
}
.tabs-scroll button,
.lb-tabs button {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
}
.tabs-scroll .i {
  width: 15px;
  height: 15px;
}
.tabs-scroll button[aria-selected='true'] .i {
  color: var(--brand);
}
.results-note {
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 14px;
}
.lb-tabs {
  display: inline-flex;
  margin: 0 0 18px;
}

.tag-yn {
  margin-left: 6px;
  vertical-align: 4px;
  font-size: 11px;
  color: var(--brand);
  background: color-mix(in srgb, var(--brand) 14%, transparent);
}
.chance-row {
  display: flex;
  gap: 8px;
}
.chance {
  flex: 1;
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding: 8px 12px;
  border-radius: 12px;
  color: var(--c);
  background: color-mix(in srgb, var(--c) 12%, transparent);
  font-weight: 700;
  font-size: 13px;
}
.chance b {
  font-family: var(--display);
  font-size: 20px;
}

.ladder-yn {
  grid-template-columns: 1fr 1fr;
}
.ladder-yn .ladder-head {
  grid-column: 1 / -1;
}
.ladder-yn .fine {
  grid-column: 1 / -1;
}
.rung-yn {
  grid-template-columns: minmax(0, 1fr) auto auto;
  padding: 18px;
}
.rung-yn .pool-col {
  display: none;
}
.rung-yn .rung-name b {
  font-size: 24px;
}
.ladder-yn .ladder-head {
  display: none;
}
.picker-yn {
  grid-template-columns: 1fr 1fr;
}
.picker-yn button {
  padding: 14px 4px 12px;
}
.picker-yn button b {
  font-size: 17px;
}

/* Odds history */
.odds-big {
  margin: -4px 0 12px;
  color: var(--c);
  font-weight: 700;
}
.odds-big b {
  font-family: var(--display);
  font-size: 34px;
  margin-right: 4px;
}
.odds-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  margin: -4px 0 12px;
  font-size: 13.5px;
}
.odds-legend span {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
}
.odds-legend i {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  background: var(--c);
}
.odds-legend b {
  color: var(--text);
  font-family: var(--display);
}
.odds-plot {
  display: grid;

<script type="module">
// Generated by scripts/build-web.ts from src/engine/engine.ts. Do not edit.
/**
 * Firstprint market engine.
 *
 * Pure, dependency-free logic shared by the server and the Mini App:
 * outcome buckets, TWAP price oracle, pool caps, early-bird weights,
 * payouts, and settlement with void rules.
 *
 * Amounts are integers in minor units (points, or USDT micro-units later).
 * Times are Unix milliseconds.
 */

// ---------------------------------------------------------------------------
// Types
// ---------------------------------------------------------------------------

/** Ordered from worst to best outcome. */
const BUCKETS                    = ['crash', 'down', 'flat', 'up', 'moon'];

const DEFAULT_THRESHOLDS             = { crash: -0.5, down: -0.1, up: 0.1, moon: 0.5 };

/**
 * ladder: five outcomes, Crash to Moon, by how far the price moves from the start price.
 * binary: a Yes/No question, "will the price be at or above the target?". The target is the
 * market's start price; Yes is stored as the 'up' bucket and No as 'down'.
 */

const MINUTE = 60_000;
const HOUR = 60 * MINUTE;

const DEFAULT_CONFIG               = {
  thresholds: DEFAULT_THRESHOLDS,
  earlyBirdK: 0.5,
  feeBps: 400,
  softCap: 50_000,
  volumeCapRatio: null,
  perUserCapPct: 0.1,
  baselineMs: HOUR,
  durationMs: 72 * HOUR,
  settleWindowMs: HOUR,
  minCoverage: 0.5,
  minTrades: 10,
  maxListingDelayMs: 24 * HOUR,
  maxHaltMs: 6 * HOUR,
};

// ---------------------------------------------------------------------------
// Buckets
// ---------------------------------------------------------------------------

/** Rounds away float noise so exactly -10% lands in "down", not "flat". */
function clean(r        )         {
  return Math.round(r * 1e9) / 1e9;
}

function returnPct(base        , final        )         {
  if (!(base > 0) || !(final >= 0)) throw new Error('Prices must be positive');
  return clean(final / base - 1);
}

function bucketForReturn(r        , t             = DEFAULT_THRESHOLDS)         {
  const x = clean(r);
  if (x <= t.crash) return 'crash';
  if (x <= t.down) return 'down';
  if (x < t.up) return 'flat';
  if (x < t.moon) return 'up';
  return 'moon';
}

/** Yes and No in a binary market. */
const BINARY_BUCKETS                    = ['up', 'down'];

const isBinary = (cfg                                ) => cfg.outcomes === 'binary';

/** The outcomes players can pick in a market. */
function allowedBuckets(cfg                                )                    {
  return isBinary(cfg) ? BINARY_BUCKETS : BUCKETS;
}

/** The winning outcome for a price move: Yes at or above the target in a binary market, else the ladder. */
function bucketFor(r        , cfg                                               )         {
  if (isBinary(cfg)) return clean(r) >= 0 ? 'up' : 'down';
  return bucketForReturn(r, cfg.thresholds);
}

function bucketRangeLabel(b        , t             = DEFAULT_THRESHOLDS)         {
  const p = (n        ) => `${n > 0 ? '+' : ''}${Math.round(n * 100)}%`;
  switch (b) {
    case 'crash': return `${p(t.crash)} or worse`;
    case 'down': return `${p(t.crash)} to ${p(t.down)}`;
    case 'flat': return `${p(t.down)} to ${p(t.up)}`;
    case 'up': return `${p(t.up)} to ${p(t.moon)}`;
    case 'moon': return `${p(t.moon)} or better`;
  }
}

// ---------------------------------------------------------------------------
// Price oracle
// ---------------------------------------------------------------------------

/**
 * Time-weighted average of 1-minute closes over [start, end).
 * Missing minutes carry the last known price forward, including the last
 * candle before the window. Slots before any known price are skipped.
 */
function twap(candles                   , start        , end        )              {
  const sorted = [...candles].sort((a, b) => a.ts - b.ts);
  const slots = Math.max(0, Math.floor((end - start) / MINUTE));
  if (slots === 0) return { twap: null, coverage: 0, volume: 0, trades: null };

  const byMinute = new Map                ();
  let last                = null;
  for (const c of sorted) {
    if (c.ts < start) last = c.close;
    else if (c.ts < end) byMinute.set(Math.floor((c.ts - start) / MINUTE), c);
  }

  let sum = 0;
  let priced = 0;
  let real = 0;
  let volume = 0;
  let trades = 0;
  let hasTrades = false;

  for (let i = 0; i < slots; i++) {
    const c = byMinute.get(i);
    if (c) {
      last = c.close;
      real++;
      volume += c.volume;
      if (c.trades !== undefined) {
        trades += c.trades;
        hasTrades = true;
      }
    }
    if (last !== null) {
      sum += last;
      priced++;
    }
  }

  return {
    twap: priced > 0 ? sum / priced : null,
    coverage: real / slots,
    volume,
    trades: hasTrades ? trades : null,
  };
}

/**
 * Volume-weighted median across venues. A single venue with little volume
 * can't drag the result far. Falls back to a plain median without volume.
 */
function venueMedian(venues                       )                {
  const valid = venues.filter((v)                                      => v.price !== null && v.price > 0);
  if (valid.length === 0) return null;
  const sorted = [...valid].sort((a, b) => a.price - b.price);
  const total = sorted.reduce((s, v) => s + Math.max(0, v.volume), 0);

  if (total <= 0) {
    const mid = Math.floor(sorted.length / 2);
    return sorted.length % 2 ? sorted[mid].price : (sorted[mid - 1].price + sorted[mid].price) / 2;
  }

  let cum = 0;
  for (const v of sorted) {
    cum += Math.max(0, v.volume);
    if (cum >= total / 2) return v.price;
  }
  return sorted[sorted.length - 1].price;
}

// ---------------------------------------------------------------------------
// Pool
// ---------------------------------------------------------------------------

function weightFor(placedAt        , tOpen        , tClose        , k        )         {
  if (tClose <= tOpen) return 1;
  const f = (tClose - placedAt) / (tClose - tOpen);
  return 1 + k * Math.min(1, Math.max(0, f));
}

function hardCapFor(cfg              , baselineVolume        )         {
  if (cfg.volumeCapRatio === null) return cfg.softCap;
  return Math.max(0, Math.min(cfg.softCap, Math.floor(cfg.volumeCapRatio * baselineVolume)));
}

/**
 * Applies the pool hard cap and per-user cap in time order, so the latest
 * predictions are the ones refunded when a cap is hit.
 */
function applyCaps(
  predictions                       ,
  hardCap        ,
  cfg                                                    ,
  tOpen        ,
  tClose        ,
)                       {
  const userCap = Math.floor(hardCap * cfg.perUserCapPct);
  const used = new Map                ();
  let poolLeft = hardCap;

  const ordered = [...predictions].sort((a, b) => a.placedAt - b.placedAt || a.id.localeCompare(b.id));
  return ordered.map((p) => {
    const userLeft = userCap - (used.get(p.userId) ?? 0);
    const accepted = Math.max(0, Math.min(p.stake, userLeft, poolLeft));
    used.set(p.userId, (used.get(p.userId) ?? 0) + accepted);
    poolLeft -= accepted;
    return {
      ...p,
      accepted,
      refund: p.stake - accepted,
      weight: weightFor(p.placedAt, tOpen, tClose, cfg.earlyBirdK),
    };
  });
}

function emptyTotals()             {
  return { crash: 0, down: 0, flat: 0, up: 0, moon: 0 };
}

function poolTotals(predictions                                              )             {
  const t = emptyTotals();
  for (const p of predictions) t[p.bucket] += p.stake;
  return t;
}

/** Estimated payout for a new prediction, assuming the pool doesn't change. */
function quote(
  existing                       ,
  bucket        ,
  stake        ,
  placedAt        ,
  cfg                                             ,
  tOpen        ,
  tClose        ,
)        {
  const weight = weightFor(placedAt, tOpen, tClose, cfg.earlyBirdK);
  if (stake <= 0) return { weight, payout: 0, multiple: 0 };
  const pool = existing.reduce((s, p) => s + p.stake, 0) + stake;
  const net = pool - Math.floor((pool * cfg.feeBps) / 10_000);
  const winnersWeighted =
    existing
      .filter((p) => p.bucket === bucket)
      .reduce((s, p) => s + p.stake * weightFor(p.placedAt, tOpen, tClose, cfg.earlyBirdK), 0) +
    stake * weight;
  const payout = Math.floor((net * stake * weight) / winnersWeighted);
  return { weight, payout, multiple: payout / stake };
}

function refundAll(accepted                               , reason            )             {
  return {
    pool: accepted.reduce((s, p) => s + p.accepted, 0),
    fee: 0,
    netPool: 0,
    dust: 0,
    voidReason: reason,
    payouts: accepted.map((p) => ({
      predictionId: p.id,
      userId: p.userId,
      bucket: p.bucket,
      accepted: p.accepted,
      refund: p.refund + p.accepted,
      payout: 0,
      weight: p.weight,
    })),
  };
}

function computePayouts(
  accepted                               ,
  winning        ,
  cfg                              ,
)             {
  const live = accepted.filter((p) => p.accepted > 0);
  const pool = live.reduce((s, p) => s + p.accepted, 0);
  if (pool === 0) return refundAll(accepted, 'empty_pool');

  const bucketsUsed = new Set(live.map((p) => p.bucket));
  if (bucketsUsed.size < 2) return refundAll(accepted, 'one_sided_pool');

  const winners = live.filter((p) => p.bucket === winning);
  if (winners.length === 0) return refundAll(accepted, 'no_winners');

  const fee = Math.floor((pool * cfg.feeBps) / 10_000);
  const netPool = pool - fee;
  const totalWeighted = winners.reduce((s, p) => s + p.accepted * p.weight, 0);

  let paid = 0;
  const payouts           = accepted.map((p) => {
    const won = p.accepted > 0 && p.bucket === winning;
    const payout = won ? Math.floor((netPool * p.accepted * p.weight) / totalWeighted) : 0;
    paid += payout;
    return {
      predictionId: p.id,
      userId: p.userId,
      bucket: p.bucket,
      accepted: p.accepted,
      refund: p.refund,
      payout,
      weight: p.weight,
    };
  });

  return { pool, fee, netPool, dust: netPool - paid, payouts, voidReason: null };
}

// ---------------------------------------------------------------------------
// Settlement
// ---------------------------------------------------------------------------

function windows(cfg              , listingAt        ) {
  const settleAt = listingAt + cfg.durationMs;
  return {
    baseline: { start: listingAt, end: listingAt + cfg.baselineMs },
    final: { start: settleAt - cfg.settleWindowMs, end: settleAt },
    closeAt: listingAt + cfg.baselineMs,
    settleAt,
  };
}

function windowOk(stats               , cfg              )          {
  const good = stats.filter((s) => s.twap !== null && s.coverage >= cfg.minCoverage);
  if (good.length === 0) return false;
  const reported = good.filter((s) => s.trades !== null);
  if (reported.length === 0) return true;
  return reported.reduce((n, s) => n + (s.trades ?? 0), 0) >= cfg.minTrades;
}

function settleMarket(input                 )                   {
  const { cfg } = input;
  const w = windows(cfg, input.listingAt);
  const venues = Object.keys(input.candles);

  const baseStats                = venues.map((v) => ({ venue: v, ...twap(input.candles[v], w.baseline.start, w.baseline.end) }));
  const finalStats                = venues.map((v) => ({ venue: v, ...twap(input.candles[v], w.final.start, w.final.end) }));

  const pick = (stats               ) =>
    venueMedian(stats.filter((s) => s.coverage >= cfg.minCoverage).map((s) => ({ venue: s.venue, price: s.twap, volume: s.volume })));

  const basePrice = pick(baseStats);
  const finalPrice = pick(finalStats);

  const shell = {
    baseline: { ...w.baseline, price: basePrice, venues: baseStats },
    final: { ...w.final, price: finalPrice, venues: finalStats },
  };

  const voided = (reason            )                   => ({
    ...refundAll(input.accepted, reason),
    ...shell,
    returnPct: null,
    winningBucket: null,
  });

  if (input.retracted) return voided('retracted');
  if (input.listingAt - input.announcedListingAt > cfg.maxListingDelayMs) return voided('listing_delayed');
  if (input.haltedMs > cfg.maxHaltMs) return voided('trading_halted');
  if (basePrice === null || !windowOk(baseStats, cfg)) return voided('insufficient_baseline_data');
  if (finalPrice === null || !windowOk(finalStats, cfg)) return voided('insufficient_settlement_data');

  const r = returnPct(basePrice, finalPrice);
  const winning = bucketFor(r, cfg);
  const pool = computePayouts(input.accepted, winning, cfg);

  return {
    ...pool,
    ...shell,
    // The measured outcome stays visible even if the pool itself is refunded.
    returnPct: r,
    winningBucket: winning,
  };
}

/**
 * Sums up a player's predictions market by market. A market counts as won when any of the
 * player's predictions in it paid out. Cancelled (void) markets are refunded and count as
 * neither a win nor a loss.
 */
function summarizeRecord(rows                      )               {
  const byMarket = new Map                     ();
  for (const r of rows) byMarket.set(r.marketId, [...(byMarket.get(r.marketId) ?? []), r]);

  const byOutcome = Object.fromEntries(BUCKETS.map((b) => [b, { picks: 0, wins: 0 }]))                                                   ;
  const settled                                     = [];
  const open = { markets: 0, staked: 0 };
  let refundedMarkets = 0;

  for (const [marketId, preds] of byMarket) {
    const first = preds[0];
    if (first.status === 'void') {
      refundedMarkets++;
      continue;
    }
    if (first.status !== 'resolved') {
      open.markets++;
      open.staked += preds.reduce((s, p) => s + (p.accepted ?? p.stake), 0);
      continue;
    }
    const inPool = preds.filter((p) => (p.accepted ?? 0) > 0);
    if (!inPool.length) continue; // every stake was refunded by a pool limit
    const staked = inPool.reduce((s, p) => s + (p.accepted ?? 0), 0);
    const payout = inPool.reduce((s, p) => s + (p.payout ?? 0), 0);
    for (const p of first.binary ? [] : inPool) {
      byOutcome[p.bucket].picks++;
      if ((p.payout ?? 0) > 0) byOutcome[p.bucket].wins++;
    }
    settled.push({
      marketId,
      symbol: first.symbol,
      ...(first.binary ? { binary: true } : {}),
      settledAt: first.settledAt ?? 0,
      buckets: [...new Set(inPool.map((p) => p.bucket))],
      winningBucket: first.winningBucket,
      staked,
      payout,
      profit: payout - staked,
      won: payout > 0,
    });
  }

  settled.sort((a, b) => a.settledAt - b.settledAt || a.marketId.localeCompare(b.marketId));
  let cumulative = 0;
  let streak = 0;
  let bestStreak = 0;
  const history = settled.map((m) => {
    cumulative += m.profit;
    streak = m.won ? streak + 1 : 0;
    bestStreak = Math.max(bestStreak, streak);
    return { ...m, cumulative };
  });

  const wins = history.filter((m) => m.won).length;
  const best = history.filter((m) => m.won).sort((a, b) => b.profit - a.profit)[0];
  return {
    marketsPlayed: byMarket.size,
    settled: history.length,
    wins,
    losses: history.length - wins,
    winRate: history.length ? wins / history.length : null,
    totalStaked: history.reduce((s, m) => s + m.staked, 0),
    totalWon: history.reduce((s, m) => s + m.payout, 0),
    netProfit: cumulative,
    bestWin: best ? { marketId: best.marketId, symbol: best.symbol, profit: best.profit, payout: best.payout } : null,
    currentStreak: streak,
    bestStreak,
    open,
    refundedMarkets,
    byOutcome,
    history: history.reverse(),
  };
}

class ApiError extends Error {
  constructor(status, code, message) {
    super(message);
    this.status = status;
    this.code = code;
  }

/**
 * Free hosting puts the server to sleep when nobody visits, and the first request after that fails with a
 * gateway error until it has started (up to about a minute). Reads are retried while that happens, and the
 * page is told so it can say so instead of showing an error. Writes are never retried: they aren't safe to repeat.
 */
const wake = { onWaking: () => {}, onAwake: () => {} };
const WAKE_RETRIES = 16;
const WAKE_WAIT_MS = 4_000;
const GATEWAY = new Set([502, 503, 504, 520, 521, 522, 523, 524]);

function createApi(baseUrl = '') {
  async function request(path, init = {}) {
    const canRetry = !init.method || init.method === 'GET';
    let waking = false;
    for (let attempt = 0; ; attempt++) {
      let res;
      try {
        res = await fetch(baseUrl + path, {
          ...init,
          credentials: 'same-origin',
          headers: { 'content-type': 'application/json' },
        });
      } catch {
        if (canRetry && attempt < WAKE_RETRIES) {
          waking = true;
          wake.onWaking();
          await new Promise((r) => setTimeout(r, WAKE_WAIT_MS));
          continue;
        }
        if (waking) wake.onAwake();
        throw new ApiError(0, 'offline', 'Can’t reach Firstprint. Check your connection and try again.');
      }
      if (GATEWAY.has(res.status) && canRetry && attempt < WAKE_RETRIES) {
        waking = true;
        wake.onWaking();
        await new Promise((r) => setTimeout(r, WAKE_WAIT_MS));
        continue;
      }
      if (waking) wake.onAwake();
      return finish(res);
    }
  }

  async function finish(res) {
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new ApiError(res.status, data.error ?? 'error', data.message ?? 'Request failed.');
    return data;
  }
  const post = (path, body) => request(path, { method: 'POST', body: JSON.stringify(body ?? {}) });
  const id = (s) => encodeURIComponent(s);

  return {
    demo: false,
    config: () => request('/api/config'),
    me: () => request('/api/me'),
    login: (body) => post('/api/auth/login', body),
    logout: () => post('/api/auth/logout'),
    claimDaily: () => post('/api/me/claim-daily'),
    myPredictions: () => request('/api/me/predictions'),
    ledger: () => request('/api/me/ledger'),

    odds: (m) => request(`/api/markets/${id(m)}/odds`),
    holders: (m) => request(`/api/markets/${id(m)}/holders`),
    profile: (name) => request(`/api/users/${id(name)}`),
    emailStart: (email) => post('/api/auth/email/start', { email }),
    emailVerify: (email, code) => post('/api/auth/email/verify', { email, code, ref: referralCode() }),
    googleSignIn: (credential) => post('/api/auth/google', { credential, ref: referralCode() }),
    walletChallenge: (address) => request(`/api/auth/wallet/challenge?address=${encodeURIComponent(address)}`),
    walletVerify: (body) => post('/api/auth/wallet/verify', { ...body, ref: referralCode() }),
    rewards: () => request('/api/me/rewards'),
    connectX: (username) => post('/api/me/x', { username }),
    startTask: (t) => post(`/api/tasks/${id(t)}/start`),
    verifyTask: (t) => post(`/api/tasks/${id(t)}/verify`),
    startClaim: (wallet) => post('/api/me/claims', { wallet }),
    submitClaim: (c, transaction) => post(`/api/me/claims/${id(c)}/submit`, { transaction }),
    claimStatus: (c) => request(`/api/me/claims/${id(c)}`),
    linkWallet: (body) => post('/api/me/wallets', body),
    setUsername: (username) => post('/api/me/profile', { username }),
    detectedListings: () => request('/api/listings/detected'),
    /** Live updates over Server-Sent Events. Returns an unsubscribe function. */
    subscribe(onEvent, onStatus = () => {}) {
      if (typeof EventSource === 'undefined') return () => {};
      const es = new EventSource(`${baseUrl}/api/stream`);
      for (const type of ['price', 'market', 'listing']) {
        es.addEventListener(type, (e) => {
          try {
            onEvent(type, JSON.parse(e.data));
          } catch {
            /* ignore malformed events */
          }
        });
      }
      es.onopen = () => onStatus(true);
      es.onerror = () => onStatus(false);
      return () => es.close();
    },
  };
}

const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';

function b58encode(bytes) {
  let zeros = 0;
  while (zeros < bytes.length && bytes[zeros] === 0) zeros++;
  const digits = [];
  for (let i = zeros; i < bytes.length; i++) {
    let carry = bytes[i];
    for (let j = 0; j < digits.length; j++) {
      carry += digits[j] << 8;
      digits[j] = carry % 58;
      carry = (carry / 58) | 0;
    }
    while (carry) {
      digits.push(carry % 58);
      carry = (carry / 58) | 0;
    }
  }
  return '1'.repeat(zeros) + digits.reverse().map((d) => B58[d]).join('');
}

/**
 * Connects a wallet and signs the server's sign-in message.
 * getMessage(address) must return the exact text to sign.
 */
async function connectAndSign(entry, getMessage) {
  const encoder = new TextEncoder();
  if (entry.kind === 'standard') {
    const { accounts } = await entry.wallet.features['standard:connect'].connect();
    const account = accounts?.[0];
    if (!account) throw new Error('No account was shared by the wallet.');
    const message = await getMessage(account.address);
    const [signed] = await entry.wallet.features['solana:signMessage'].signMessage({ account, message: encoder.encode(message) });
    return { address: account.address, message, signature: b58encode(signed.signature), walletName: entry.name };
  }
  const provider = entry.provider;
  const res = await provider.connect();
  const address = (res?.publicKey ?? provider.publicKey).toString();
  const message = await getMessage(address);
  const signed = await provider.signMessage(encoder.encode(message), 'utf8');
  return { address, message, signature: b58encode(signed.signature ?? signed), walletName: entry.name };
}

const fromBase64 = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
const toBase64 = (bytes) => {
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
};

/**
 * Has the wallet holding `address` sign a transaction Firstprint prepared (base64), and returns
 * it signed (base64). Firstprint checks and sends it. Tries the wallet the player linked first.
 */
async function signTransactionWith(address, transactionBase64, cluster, walletName) {
  const transaction = fromBase64(transactionBase64);
  const chain = `solana:${cluster}`;
  const wallets = [...standardWallets.values()].filter((w) => w.features['solana:signTransaction']);
  if (!wallets.length) throw new Error('Open this page in a browser with Phantom, Solflare or Backpack installed.');
  wallets.sort((a, b) => Number(b.name === walletName) - Number(a.name === walletName));
  for (const [i, w] of wallets.entries()) {
    let account = (w.accounts ?? []).find((a) => a.address === address);
    if (!account) {
      try {
        // Ask quietly first; only the preferred wallet may show a connect prompt.
        const { accounts } = await w.features['standard:connect'].connect(i === 0 ? undefined : { silent: true });
        account = (accounts ?? []).find((a) => a.address === address);
      } catch (err) {
        if (i === 0 && (err?.code === 4001 || /reject|denied|cancel/i.test(err?.message ?? ''))) throw err;
      }
    }
    if (!account) continue;
    const [out] = await w.features['solana:signTransaction'].signTransaction({ account, transaction, chain });
    return toBase64(out.signedTransaction);
  }
  throw new Error(`Switch your wallet to the account ${shortAddress(address)} (the one linked to Firstprint), then try again.`);
}

async function disconnectWallets() {
  for (const w of standardWallets.values()) {
    try {
      await w.features['standard:disconnect']?.disconnect();
    } catch {
      /* ignore */
    }
  }
  for (const p of [window.phantom?.solana, window.solflare, window.backpack]) {
    try {
      await p?.disconnect?.();
    } catch {
      /* ignore */
    }
  }
}

  { id: 'demo-follow', kind: 'follow', title: 'Follow @firstprint on X', points: 50, url: 'https://x.com/intent/follow?screen_name=firstprint' },
  { id: 'demo-share', kind: 'share', title: 'Share Firstprint on X', points: 75, url: 'https://x.com/intent/tweet?text=Calling%20new%20listings%20on%20Firstprint&url=https%3A%2F%2Fwww.firstprint.fun' },
];

class DemoBackend {
  constructor() {
    this.demo = true;
    this.reset();
  }

  reset() {
    this.offset = 0;
    this.seq = 0;
    this.users = new Map();
    this.accounts = new Map(); // email → { userId, password }
    this.marketList = [];
    const now = Date.now();

    const bots = BOT_NAMES.map((name) => this.addUser(name, 5_000));
    const me = this.addUser('you', 1_000);
    me.wallets.push({ address: '7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU', walletName: 'Phantom' });
    this.accounts.set(DEMO_EMAIL, { userId: me.id, password: DEMO_PASSWORD });
    this.challenges = new Map();
    this.walletOwners = new Map([[me.wallets[0].address, me.id]]);
    this.detected = this.demoDetections(now);
    this.sessionUserId = me.id;

    for (const d of DEMO_MARKETS) {
      const cfg = d.fast ? FAST_CFG : REAL_CFG;
      const listingAt = now + d.at * D3_MIN;
      const openedAt = listingAt - (d.fast ? 30 * D3_MIN : 36 * D3_HOUR);
      const m = {
        id: `${d.symbol.toLowerCase()}-${d.exchange.toLowerCase()}`,
        symbol: d.symbol,
        name: d.name,
        exchange: d.exchange,
        listingAt,
        announcedListingAt: listingAt,
        openedAt,
        cfg,
        scorecard: d.scorecard,
        status: 'open',
        predictions: [],
        result: null,
        profile: { startPrice: +(0.02 + demoHash(d.symbol) * 1.5).toFixed(4), target: d.target, noise: 0.025, volume: 5_000 },
      };
      const { closeAt } = windows(cfg, listingAt);
      const lastBetAt = Math.min(now, closeAt - 1_000);
      for (let i = 0; i < d.bots; i++) {
        const bot = bots[(i + d.symbol.length) % bots.length];
        const bucket = d.oneSided ?? BUCKETS[Math.floor(demoHash(`${d.symbol}:b:${i}`) * 5)];
        const stake = [25, 50, 100, 150, 250, 400][Math.floor(demoHash(`${d.symbol}:s:${i}`) * 6)];
        const placedAt = openedAt + (lastBetAt - openedAt) * demoHash(`${d.symbol}:t:${i}`) * 0.95;
        this.addPrediction(m, bot.id, bucket, stake, placedAt);
      }
      if (d.mine) this.addPrediction(m, me.id, d.mine.bucket, d.mine.stake, Math.min(lastBetAt, listingAt - d.mine.before * D3_MIN));
      this.marketList.push(m);
    }
    this.advance();
  }

  // --- Internals ---------------------------------------------------------------

  now() {
    return Date.now() + this.offset;
  }

  addUser(username, points) {
    const u = { id: `u${++this.seq}`, username, points, lastClaimDay: null, needsUsername: false, hasEmail: true, wallets: [] };
    this.users.set(u.id, u);
    return u;
  }

  addPrediction(m, userId, bucket, stake, placedAt) {
    const u = this.users.get(userId);
    u.points -= stake;
    const p = { id: `p${++this.seq}`, userId, bucket, stake, placedAt, accepted: null, refund: null, weight: null, payout: null };
    m.predictions.push(p);
    return p;
  }

  /** Completed 1-minute candles aligned to the listing time, within [start, end). */
  candles(m, start, end) {
    const out = [];
    const now = this.now();
    const k0 = Math.max(0, Math.ceil((start - m.listingAt) / D3_MIN));
    for (let ts = m.listingAt + k0 * D3_MIN; ts < end && ts + D3_MIN <= now; ts += D3_MIN) {
      out.push({ ts, close: demoPrice(m, ts), volume: m.profile.volume, trades: 12 });
    }
    return out;
  }

  advance() {
    const now = this.now();
    for (const m of this.marketList) {
      const w = windows(m.cfg, m.listingAt);
      if (m.status === 'open' && now >= w.closeAt) {
        const accepted = applyCaps(m.predictions, m.cfg.softCap, m.cfg, m.openedAt, w.closeAt);
        for (const a of accepted) {
          const p = m.predictions.find((x) => x.id === a.id);
          Object.assign(p, { accepted: a.accepted, refund: a.refund, weight: a.weight });
          this.users.get(p.userId).points += a.refund;
        }
        m.status = 'locked';
      }
      if (m.status === 'locked' && now >= w.settleAt) {
        const candles = [...this.candles(m, w.baseline.start, w.baseline.end), ...this.candles(m, w.final.start, w.final.end)];
        const result = settleMarket({
          cfg: m.cfg,
          announcedListingAt: m.announcedListingAt,
          listingAt: m.listingAt,
          openedAt: m.openedAt,
          retracted: false,
          haltedMs: 0,
          candles: { sim: candles },
          accepted: m.predictions.map((p) => ({ ...p })),
        });
        for (const r of result.payouts) {
          const p = m.predictions.find((x) => x.id === r.predictionId);
          const u = this.users.get(p.userId);
          u.points += r.refund - (p.refund ?? 0) + r.payout;
          p.refund = r.refund;
          p.payout = r.payout;
        }
        m.result = result;
        m.settledAt = now;
        m.status = result.voidReason ? 'void' : 'resolved';
      }
    }
  }

  me_() {
    const u = this.sessionUserId && this.users.get(this.sessionUserId);
    if (!u) throw new ApiError(401, 'auth_required', 'Log in to continue.');
    return u;
  }

  publicUser(u) {
    const today = new Date(this.now()).toISOString().slice(0, 10);
    return {
      id: u.id,
      username: u.username,
      needsUsername: u.needsUsername,
      hasEmail: u.hasEmail,
      wallets: u.wallets,
      points: u.points,
      canClaimDaily: u.lastClaimDay !== today,
    };
  }

  demoDetections(now) {
    const H = 60 * D3_MIN;
    const rows = [
      ['binance', 'Binance', 'LUMA', 'Binance Will List Luma Compute (LUMA) with Seed Tag Applied', 5 * H + 12 * D3_MIN, 'luma-binance', -3 * H],
      ['bitget', 'Bitget', 'FERRO', 'Bitget Will List Ferro Pay (FERRO) in the Innovation Zone', 26 * H, 'ferro-bitget', -9 * H],
      ['bybit', 'Bybit', 'ARCO', 'New Listing: ARCO/USDT — Grab a Share of 400,000 ARCO', 30 * H, null, -40 * D3_MIN],
      ['okx', 'OKX', 'TIDE', 'OKX to list Tide Protocol (TIDE) for spot trading', 44 * H, null, -2 * H],
      ['kucoin', 'KuCoin', 'MOSS', 'Moss Network (MOSS) Gets Listed on KuCoin!', 52 * H, null, -5 * H],
      ['gate', 'Gate', 'QUILL', 'QUILL/USDT pair added on Gate', 3 * H, null, -20 * D3_MIN],
      ['mexc', 'MEXC', 'KORA', 'KORA/USDT pair added on MEXC', 3 * D3_MIN, 'kora-mexc', -30 * D3_MIN],
    ];
    return rows.map(([exchange, exchangeName, symbol, title, inMs, marketId, ago], i) => ({
      id: i + 1,
      exchange,
      exchangeName,
      symbol,
      pair: `${symbol}USDT`,
      source: title.includes('pair added') ? 'symbol_diff' : 'announcement',
      title,
      url: title.includes('pair added') ? null : `https://example.com/announcements/${symbol.toLowerCase()}`,
      listingAt: now + inMs,
      publishedAt: now + ago,
      detectedAt: now + ago,
      status: marketId ? 'approved' : 'pending',
      marketId,
    }));
  }

  find(id) {
    const m = this.marketList.find((x) => x.id === id);
    if (!m) throw new ApiError(404, 'market_not_found', 'Market not found.');
    return m;
  }

  view(m) {
    const now = this.now();
    const w = windows(m.cfg, m.listingAt);
    const afterClose = m.status !== 'open';
    const totals = emptyTotals();
    const users = new Set();
    let volume24h = 0;
    for (const p of m.predictions) {
      totals[p.bucket] += afterClose ? (p.accepted ?? 0) : p.stake;
      users.add(p.userId);
      if (p.placedAt > now - 24 * D3_HOUR) volume24h += p.stake;
    }
    const pool = Object.values(totals).reduce((s, n) => s + n, 0);
    const phase = m.status === 'open' ? (now < m.listingAt ? 'pre_listing' : 'baseline') : m.status === 'locked' ? 'running' : m.status;

    let live = null;
    if ((m.status === 'open' || m.status === 'locked') && now >= m.listingAt + D3_MIN) {
      const baseEnd = Math.min(w.baseline.end, now);
      const base = twap(this.candles(m, w.baseline.start, baseEnd), w.baseline.start, baseEnd).twap;
      const lastTs = now - D3_MIN;
      const last = venueMedian([{ venue: 'sim', price: demoPrice(m, lastTs), volume: 1 }]);
      const r = base && last ? returnPct(base, last) : null;
      live = { basePrice: base, lastPrice: last, returnPct: r, projectedBucket: r === null ? null : bucketForReturn(r, m.cfg.thresholds), provisional: m.status === 'open' };
    }

    const result = m.result
      ? {
          winningBucket: m.result.winningBucket,
          returnPct: m.result.returnPct,
          voidReason: m.result.voidReason,
          basePrice: m.result.baseline.price,
          finalPrice: m.result.final.price,
          pool: m.result.pool,
          fee: m.result.fee,
        }
      : null;

    const mine = m.predictions
      .filter((p) => p.userId === this.sessionUserId)
      .map((p) => ({ id: p.id, bucket: p.bucket, stake: p.stake, accepted: p.accepted, refund: p.refund, payout: p.payout, weight: p.weight, placedAt: p.placedAt }));

    return {
      id: m.id,
      symbol: m.symbol,
      name: m.name,
      exchange: m.exchange,
      sourceUrl: null,
      status: m.status,
      phase,
      announcedListingAt: m.announcedListingAt,
      listingAt: m.listingAt,
      openedAt: m.openedAt,
      closeAt: w.closeAt,
      settleAt: w.settleAt,
      outcomes: 'ladder',
      thresholds: m.cfg.thresholds,
      feeBps: m.cfg.feeBps,
      earlyBirdK: m.cfg.earlyBirdK,
      softCap: m.cfg.softCap,
      userCap: Math.floor(m.cfg.softCap * m.cfg.perUserCapPct),
      minStake: 10,
      pool,
      totals,
      predictors: users.size,
      volume24h,
      live,
      result,
      scorecard: m.scorecard,
      mine,
      serverTime: now,
    };
  }

  async run(fn) {
    await new Promise((r) => setTimeout(r, 60)); // feel like a network call
    this.advance();
    return structuredClone(fn());
  }

  // --- Public API (matches createApi) ----------------------------------------------

  config() {
    return this.run(() => ({ minStake: 10, dailyPoints: 100, demo: true, manualOnly: false, signIn: { google: null, email: true } }));
  }

  me() {
    return this.run(() => this.publicUser(this.me_()));
  }

  signup({ email, username, password }) {
    return this.run(() => {
      email = String(email ?? '').trim().toLowerCase();
      username = String(username ?? '').trim();
      if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) throw new ApiError(400, 'bad_username', 'Username must be 3–20 letters, numbers, or underscores.');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new ApiError(400, 'bad_email', 'Enter a valid email address.');
      if (String(password ?? '').length < 8) throw new ApiError(400, 'bad_password', 'Password must be at least 8 characters.');
      if (this.accounts.has(email)) throw new ApiError(409, 'email_taken', 'An account with this email already exists. Log in instead.');
      if ([...this.users.values()].some((u) => u.username.toLowerCase() === username.toLowerCase())) {
        throw new ApiError(409, 'username_taken', 'That username is taken. Try another.');
      }
      const u = this.addUser(username, 1_000);
      this.accounts.set(email, { userId: u.id, password });
      this.sessionUserId = u.id;
      return { user: this.publicUser(u) };
    });
  }

  /** Practice mode has no mail server: the code is always shown on screen. */
  emailStart(email) {
    return this.run(() => {
      email = String(email ?? '').trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new ApiError(400, 'bad_email', 'Enter a valid email address.');
      return { ok: true, devCode: '123456' };
    });
  }

  emailVerify(email, code) {
    return this.run(() => {
      email = String(email ?? '').trim().toLowerCase();
      if (String(code ?? '').trim() !== '123456') throw new ApiError(401, 'bad_code', 'That code is wrong. In practice mode it is 123456.');
      let acc = this.accounts.get(email);
      const created = !acc;
      if (!acc) {
        const base = (email.split('@')[0].replace(/[^A-Za-z0-9_]+/g, '_').slice(0, 16) || 'player').padEnd(3, '_');
        let username = base;
        for (let i = 2; [...this.users.values()].some((u) => u.username.toLowerCase() === username.toLowerCase()); i++) username = `${base}${i}`;
        const u = this.addUser(username, 1_000);
        acc = { userId: u.id, password: null };
        this.accounts.set(email, acc);
      }
      this.sessionUserId = acc.userId;
      return { user: this.publicUser(this.users.get(acc.userId)), created };
    });
  }

  login({ email, password }) {
    return this.run(() => {
      const acc = this.accounts.get(String(email ?? '').trim().toLowerCase());
      if (!acc || acc.password !== password) throw new ApiError(401, 'bad_credentials', 'Email or password is incorrect.');
      this.sessionUserId = acc.userId;
      return { user: this.publicUser(this.users.get(acc.userId)) };
    });
  }

  logout() {
    return this.run(() => {
      this.sessionUserId = null;
      return { ok: true };
    });
  }

  /** Practice mode: sample tasks, honour-based like the real ones; points go straight to the balance. */
  rewards() {
    return this.run(() => {
      const u = this.me_();
      u.tasks ??= {};
      const code = 'PRACTICE';
      return {
        onChain: false,
        cluster: null,
        mint: null,
        mintUrl: null,
        faucetUrl: 'https://faucet.solana.com',
        claimable: 0,
        welcomeClaimed: true,
        xUsername: u.xUsername ?? null,
        xConnectPoints: 100,
        referral: { code, link: `${location.origin}/?ref=${code}`, invited: 0, rewarded: 0, points: 0, limit: 25, perReferral: 200 },
        rewards: [],
        claims: [],
        tasks: DEMO_TASKS.map((t) => ({ ...t, done: Boolean(u.tasks[t.id]?.done), startedAt: u.tasks[t.id]?.startedAt ?? null, remaining: null })),
      };
    });
  }

  connectX(username) {
    return this.run(() => {
      const u = this.me_();
      const name = String(username ?? '').trim().replace(/^@/, '');
      if (!/^[A-Za-z0-9_]{1,15}$/.test(name)) throw new ApiError(400, 'bad_x_username', 'Enter your X username, like @firstprint (letters, numbers and _ only).');
      const first = !u.xUsername;
      u.xUsername = name;
      if (first) u.points += 100;
      return { xUsername: name, rewarded: first ? 100 : 0 };
    });
  }

  startTask(taskId) {
    return this.run(() => {
      const u = this.me_();
      u.tasks ??= {};
      u.tasks[taskId] ??= { startedAt: Date.now(), done: false };
      return { ok: true };
    });
  }

  verifyTask(taskId) {
    return this.run(() => {
      const u = this.me_();
      const t = DEMO_TASKS.find((x) => x.id === taskId);
      const mine = u.tasks?.[taskId];
      if (!t) throw new ApiError(404, 'task_not_found', 'This task is no longer available.');
      if (t.kind !== 'link' && !u.xUsername) throw new ApiError(409, 'x_required', 'Link your X username first, so we know which account did it.');
      if (!mine) throw new ApiError(409, 'task_not_started', 'Open the task first, then come back to confirm it.');
      if (mine.done) throw new ApiError(409, 'task_done', 'You already completed this task.');
      if (Date.now() - mine.startedAt < 8_000) throw new ApiError(429, 'task_too_fast', 'Give it a few seconds: finish the task on X, then confirm.');
      mine.done = true;
      u.points += t.points;
      return { points: t.points, onChain: false };
    });
  }

  startClaim() {
    return this.run(() => {
      throw new ApiError(409, 'token_off', 'In practice mode points go straight to your balance. TestFPT claims are in the full app.');
    });
  }

  claimDaily() {
    return this.run(() => {
      const u = this.me_();
      const today = new Date(this.now()).toISOString().slice(0, 10);
      if (u.lastClaimDay === today) throw new ApiError(409, 'already_claimed', 'Daily points already claimed. Come back tomorrow (UTC).');
      u.lastClaimDay = today;
      u.points += 100;
      return this.publicUser(u);
    });
  }

  markets(filter) {
    return this.run(() => {
      const pick = { open: ['open'], live: ['locked'], settled: ['resolved', 'void'], all: ['open', 'locked', 'resolved', 'void'] }[filter];
      const list = this.marketList.filter((m) => pick.includes(m.status));
      list.sort((a, b) => (filter === 'settled' ? b.listingAt - a.listingAt : a.listingAt - b.listingAt));
      return { markets: list.map((m) => this.view(m)), serverTime: this.now() };
    });
  }

  market(id) {
    return this.run(() => this.view(this.find(id)));
  }

  quote(id, bucket, stake) {
    return this.run(() => {
      const m = this.find(id);
      const { closeAt } = windows(m.cfg, m.listingAt);
      return quote(m.predictions, bucket, Math.max(0, Math.floor(stake) || 0), this.now(), m.cfg, m.openedAt, closeAt);
    });
  }

  predict(id, bucket, stake) {
    return this.run(() => {
      const u = this.me_();
      const m = this.find(id);
      const { closeAt } = windows(m.cfg, m.listingAt);
      if (!BUCKETS.includes(bucket)) throw new ApiError(400, 'bad_bucket', 'Choose Crash, Down, Flat, Up, or Moon.');
      if (!Number.isInteger(stake) || stake < 10) throw new ApiError(400, 'bad_stake', 'Stake must be a whole number of at least 10 points.');
      if (m.status !== 'open' || this.now() >= closeAt) throw new ApiError(409, 'market_closed', 'Predictions for this market are closed.');
      if (u.points < stake) throw new ApiError(400, 'insufficient_points', 'Not enough points for this prediction.');
      const userCap = Math.floor(m.cfg.softCap * m.cfg.perUserCapPct);
      const mine = m.predictions.filter((p) => p.userId === u.id).reduce((s, p) => s + p.stake, 0);
      if (mine + stake > userCap) throw new ApiError(409, 'user_cap', `You can stake up to ${userCap} points per market. You have ${userCap - mine} left.`);
      const p = this.addPrediction(m, u.id, bucket, stake, this.now());
      return { id: p.id, balance: u.points };
    });
  }

  chart(id) {
    return this.run(() => {
      const m = this.find(id);
      const { settleAt } = windows(m.cfg, m.listingAt);
      const end = Math.min(this.now(), settleAt);
      if (end <= m.listingAt) return { venue: null, series: [] };
      const span = end - m.listingAt;
      const step = Math.max(D3_MIN, Math.ceil(span / 120 / D3_MIN) * D3_MIN);
      const series = [];
      for (let ts = m.listingAt; ts < end; ts += step) series.push([ts, demoPrice(m, ts)]);
      return { venue: 'sim', series };
    });
  }

  activity(id) {
    return this.run(() => {
      const m = this.find(id);
      const activity = [...m.predictions]
        .sort((a, b) => b.placedAt - a.placedAt)
        .slice(0, 30)
        .map((p) => ({ username: this.users.get(p.userId).username, bucket: p.bucket, stake: p.stake, placedAt: p.placedAt }));
      return { activity };
    });
  }

  /** Practice mode keeps no points history. */
  ledger() {
    return this.run(() => ({ entries: [] }));
  }

  myPredictions() {
    return this.run(() => {
      const u = this.me_();
      const out = [];
      for (const m of this.marketList) {
        for (const p of m.predictions) {
          if (p.userId !== u.id) continue;
          out.push({ id: p.id, marketId: m.id, symbol: m.symbol, exchange: m.exchange, marketStatus: m.status, bucket: p.bucket, stake: p.stake, accepted: p.accepted, refund: p.refund, payout: p.payout, placedAt: p.placedAt });
        }
      }
      return { predictions: out.sort((a, b) => b.placedAt - a.placedAt) };
    });
  }

  /** A player's record, worked out the same way as on the server. */
  recordFor(userId) {
    const rows = [];
    const profit = new Map();
    for (const m of this.marketList) {
      for (const p of m.predictions) {
        if (m.status === 'resolved' && p.accepted) profit.set(p.userId, (profit.get(p.userId) ?? 0) + (p.payout ?? 0) - p.accepted);
        if (p.userId !== userId) continue;
        rows.push({
          marketId: m.id, symbol: m.symbol, status: m.status, settledAt: m.settledAt ?? null,
          winningBucket: m.status === 'resolved' ? (m.result?.winningBucket ?? null) : null,
          bucket: p.bucket, stake: p.stake, accepted: p.accepted ?? null, refund: p.refund ?? null, payout: p.payout ?? null,
        });
      }
    }
    const record = summarizeRecord(rows);
    const mine = profit.get(userId);
    return {
      ...record,
      rank: mine === undefined ? null : 1 + [...profit.values()].filter((v) => v > mine).length,
      players: profit.size,
    };
  }

  stats() {
    return this.run(() => this.recordFor(this.me_().id));
  }

  profile(name) {
    return this.run(() => {
      const u = [...this.users.values()].find((x) => x.username.toLowerCase() === String(name).toLowerCase());
      if (!u) throw new ApiError(404, 'user_not_found', 'No player with that username.');
      const positions = [];
      for (const m of this.marketList) {
        if (m.status !== 'open' && m.status !== 'locked') continue;
        const by = new Map();
        for (const p of m.predictions) if (p.userId === u.id) by.set(p.bucket, (by.get(p.bucket) ?? 0) + p.stake);
        for (const [bucket, stake] of by) positions.push({ marketId: m.id, symbol: m.symbol, name: m.name, marketStatus: m.status, outcomes: 'ladder', bucket, stake });
      }
      const stats = this.recordFor(u.id);
      return { username: u.username, joinedAt: this.now() - 30 * 24 * D3_HOUR, isMe: u.id === this.sessionUserId, stats: { ...stats, history: stats.history.slice(0, 30) }, positions };
    });
  }

  holders(id) {
    return this.run(() => {
      const m = this.find(id);
      const settled = m.status === 'resolved' || m.status === 'void';
      const by = new Map();
      for (const p of m.predictions) {
        const username = this.users.get(p.userId).username;
        const h = by.get(username) ?? { username, total: 0, payout: 0, picks: new Map() };
        h.total += p.stake;
        h.payout += p.payout ?? 0;
        h.picks.set(p.bucket, (h.picks.get(p.bucket) ?? 0) + p.stake);
        by.set(username, h);
      }
      const holders = [...by.values()]
        .sort((a, b) => b.total - a.total || a.username.localeCompare(b.username))
        .slice(0, 20)
        .map((h) => ({ username: h.username, total: h.total, payout: settled ? h.payout : null, picks: [...h.picks].map(([bucket, stake]) => ({ bucket, stake })).sort((a, b) => b.stake - a.stake) }));
      return { holders, total: by.size };
    });
  }

  odds(id) {
    return this.run(() => {
      const m = this.find(id);
      const totals = emptyTotals();
      let pool = 0;
      const series = [...m.predictions]
        .sort((a, b) => a.placedAt - b.placedAt)
        .map((p) => {
          totals[p.bucket] += p.stake;
          pool += p.stake;
          return { t: p.placedAt, shares: Object.fromEntries(BUCKETS.map((b) => [b, Math.round((totals[b] / pool) * 1000) / 1000])) };
        });
      return { outcomes: 'ladder', buckets: BUCKETS, openedAt: m.openedAt, series };
    });
  }

  leaderboard(period = 'week') {
    return this.run(() => {
      const d = new Date(this.now());
      const DAY = 24 * D3_HOUR;
      const week = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
      const day = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
      const range = {
        day: [day, day + DAY],
        week: [week, week + 7 * DAY],
        month: [Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1), Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1)],
        all: [0, null],
      }[period] ?? [week, week + 7 * DAY];
      const rows = new Map();
      for (const m of this.marketList) {
        if (m.status !== 'resolved' || (m.settledAt ?? this.now()) < range[0]) continue;
        for (const p of m.predictions) {
          if (!p.accepted) continue;
          const r = rows.get(p.userId) ?? { userId: p.userId, name: this.users.get(p.userId).username, profit: 0, wins: 0, total: 0 };
          r.profit += (p.payout ?? 0) - p.accepted;
          r.wins += p.payout > 0 ? 1 : 0;
          r.total += 1;
          rows.set(p.userId, r);
        }
      }
      const ranked = [...rows.values()].sort((a, b) => b.profit - a.profit || b.wins - a.wins).map((r, i) => ({ ...r, rank: i + 1 }));
      return {
        period,
        seasonStart: range[0],
        seasonEnd: range[1],
        entries: ranked.map(({ userId, ...r }) => ({ ...r, isMe: userId === this.sessionUserId })),
        me: ranked.find((r) => r.userId === this.sessionUserId) ?? null,
      };
    });
  }

  walletChallenge(address) {
    return this.run(() => {
      const nonce = b58encode(crypto.getRandomValues(new Uint8Array(12)));
      const message = [
        `${location.host || 'firstprint.demo'} wants you to sign in with your Solana account:`,
        address,
        '',
        'Sign in to Firstprint. This request will not trigger a transaction or cost any fees.',
        '',
        `URI: ${location.origin || 'https://firstprint.demo'}`,
        'Version: 1',
        `Nonce: ${nonce}`,
        `Issued At: ${new Date(this.now()).toISOString()}`,
      ].join('\n');
      this.challenges.set(address, message);
      return { message, nonce, expiresAt: this.now() + 5 * D3_MIN };
    });
  }

  // Demo mode accepts any signature; the real server verifies ed25519 signatures.
  walletVerify({ address, message, walletName }) {
    return this.run(() => {
      if (this.challenges.get(address) !== message) throw new ApiError(401, 'bad_signature', 'Wallet sign-in failed. Try connecting again.');
      this.challenges.delete(address);
      let created = false;
      let userId = this.walletOwners.get(address);
      if (!userId) {
        const u = this.addUser(`sol_${address.slice(0, 6)}`, 1_000);
        u.needsUsername = true;
        u.hasEmail = false;
        u.wallets.push({ address, walletName: walletName ?? null });
        this.walletOwners.set(address, u.id);
        userId = u.id;
        created = true;
      }
      this.sessionUserId = userId;
      return { user: this.publicUser(this.users.get(userId)), created };
    });
  }

  linkWallet({ address, message, walletName }) {
    return this.run(() => {
      const u = this.me_();
      if (this.challenges.get(address) !== message) throw new ApiError(401, 'bad_signature', 'Wallet sign-in failed. Try connecting again.');
      const owner = this.walletOwners.get(address);
      if (owner && owner !== u.id) throw new ApiError(409, 'wallet_taken', 'This wallet is already linked to another account.');
      if (!owner) {
        u.wallets.push({ address, walletName: walletName ?? null });
        this.walletOwners.set(address, u.id);
      }
      return { wallets: u.wallets };
    });
  }

  setUsername(username) {
    return this.run(() => {
      const u = this.me_();
      username = String(username ?? '').trim();
      if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) throw new ApiError(400, 'bad_username', 'Username must be 3–20 letters, numbers, or underscores.');
      if ([...this.users.values()].some((x) => x.id !== u.id && x.username.toLowerCase() === username.toLowerCase())) {
        throw new ApiError(409, 'username_taken', 'That username is taken. Try another.');
      }
      u.username = username;
      u.needsUsername = false;
      return this.publicUser(u);
    });
  }

  /** A random address and signature standing in for a real wallet in demo mode. */
  demoWallet() {
    return b58encode(crypto.getRandomValues(new Uint8Array(32)));
  }

  detectedListings() {
    return this.run(() => ({ listings: this.detected }));
  }

  /** Simulated live stream: price ticks for trading markets every 3 seconds. */
  subscribe(onEvent, onStatus = () => {}) {
    onStatus(true);
    const timer = setInterval(() => {
      this.advance();
      for (const m of this.marketList) {
        if (!(m.status === 'open' || m.status === 'locked') || this.now() < m.listingAt + D3_MIN) continue;
        const v = this.view(m);
        if (!v.live) continue;
        const wobble = 1 + (Math.random() - 0.5) * 0.01;
        const price = v.live.lastPrice * wobble;
        const r = v.live.basePrice ? returnPct(v.live.basePrice, price) : null;
        onEvent('price', {
          marketId: m.id,
          price,
          ts: this.now(),
          basePrice: v.live.basePrice,
          returnPct: r,
          projectedBucket: r === null ? null : bucketForReturn(r, m.cfg.thresholds),
        });
      }
    }, 3_000);
    return () => clearInterval(timer);
  }

  // --- Demo controls ----------------------------------------------------------------

  skip(ms) {
    this.offset += ms;
    this.advance();
  }
}

  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${m}m`;
  if (m) return `${m}m ${String(sec).padStart(2, '0')}s`;
  return `${sec}s`;
}

function fmtSpan(ms) {
  const h = ms / 3_600_000;
  if (h >= 1) return `${Math.round(h)} hour${Math.round(h) === 1 ? '' : 's'}`;
  const m = Math.round(ms / 60_000);
  return `${m} minute${m === 1 ? '' : 's'}`;
}

function fmtDate(ts) {
  return new Date(ts).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

const until = (ts) => `<span data-until="${ts}">${fmtDur(ts - now())}</span>`;
const outcome = (b, yn = false) => `<b class="oc" style="--c:${oVar(b, yn)}">${icon(b, yn)}${oName(b, yn)}</b>`;
const rangeLabel = (b, t) => bucketRangeLabel(b, t).replace(/-/g, '−');
/** The price range an outcome covers, for either kind of market. */
const rangeOf = (m, b) => (isYesNo(m) ? (b === 'up' ? `At or above ${fmtPrice(m.basePrice)}` : `Below ${fmtPrice(m.basePrice)}`) : rangeLabel(b, m.thresholds));
const userLink = (name, cls = '') => `<a class="user-link${cls ? ` ${cls}` : ''}" href="#/u/${encodeURIComponent(name)}">${esc(name)}</a>`;
const share = (m, b) => (m.pool ? m.totals[b] / m.pool : 0);

function estMultiple(m, b, stake = 100) {
  const net = (m.pool + stake) * (1 - m.feeBps / 10_000);
  return net / (m.totals[b] + stake);
}

function leader(m) {
  if (!m.pool) return null;
  const list = bucketsOf(m);
  return list.reduce((best, b) => (m.totals[b] > m.totals[best] ? b : best), list[0]);
}

let toastTimer;
function toast(msg, isError = false) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = `show${isError ? ' error' : ''}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.className = ''), 3200);
}

function syncClock(serverTime) {
  if (typeof serverTime === 'number') S.skew = serverTime - Date.now();
}

// ------------------------------------------------------------------ Data

async function refreshMe() {
  try {
    S.me = await S.api.me();
  } catch (err) {
    if (err instanceof ApiError && err.status === 401) S.me = null;
    else throw err;
  }
  await refreshRewards();
  renderTop();
}

/** Rewards, tasks and the referral link for the signed-in player (nothing for visitors). */
async function refreshRewards() {
  S.rewards = S.me && S.api.rewards ? await S.api.rewards().catch(() => null) : null;
}

async function loadHome() {
  const [open, live, settled] = await Promise.all(['open', 'live', 'settled'].map((f) => S.api.markets(f)));
  syncClock(open.serverTime);
  S.lists = { open: open.markets, live: live.markets, settled: settled.markets };
}

async function loadMarket(id) {
  const m = await S.api.market(id);
  syncClock(m.serverTime);
  const [chart, activity, odds, holders] = await Promise.all([
    m.phase === 'pre_listing' || isManual(m) ? Promise.resolve(null) : S.api.chart(id),
    S.api.activity(id),
    S.api.odds ? S.api.odds(id).catch(() => null) : null,
    S.api.holders ? S.api.holders(id).catch(() => null) : null,
  ]);
  if (S.market?.id !== id) {
    S.trade = { bucket: null, stake: 100, quote: null, seq: 0, busy: false };
    S.tradeKey = '';
  }
  S.market = m;
  S.chart = chart;
  S.activity = activity.activity;
  S.odds = odds;
  S.holders = holders;
}

async function refresh() {
  if (S.refreshing || S.modal || S.route.name === 'admin') return;
  S.refreshing = true;
  try {
    if (S.me) await refreshMe();
    await loadRoute(false);
  } catch (err) {
    console.error(err);
  } finally {
    S.refreshing = false;
  }
}

// ------------------------------------------------------------------ Routing

function parseRoute() {
  const h = location.hash.replace(/^#/, '');
  const m = h.match(/^\/market\/([^/]+)$/);
  if (m) return { name: 'market', id: decodeURIComponent(m[1]) };
  if (h === '/leaderboard') return { name: 'leaderboard' };
  const u = h.match(/^\/u\/([^/]+)$/);
  if (u) return { name: 'profile', id: decodeURIComponent(u[1]) };
  if (h === '/portfolio' || h === '/dashboard') return { name: 'portfolio' };
  if (h === '/radar') return { name: 'radar' };
  if (h === '/earn') return { name: 'earn' };
  if (h === '/admin') return { name: 'admin' };
  return { name: 'home' };
}

async function onRoute() {
  const next = parseRoute();
  const changed = next.name !== S.route.name || next.id !== S.route.id;
  S.route = next;
  if (changed) {
    closeSheet();
    $('#view').innerHTML = '<p class="loading">Loading</p>';
    window.scrollTo(0, 0);
  }
  renderTop();
  await loadRoute(changed);
  if (changed) $('#view').focus({ preventScroll: true });
}

async function loadRoute() {
  const view = $('#view');
  try {
    if (S.route.name === 'home') {
      await loadHome();
      view.innerHTML = homeView();
    } else if (S.route.name === 'market') {
      await loadMarket(S.route.id);
      renderMarket();
    } else if (S.route.name === 'leaderboard') {
      const lb = await S.api.leaderboard(S.lbPeriod);
      view.innerHTML = leaderboardView(lb);
    } else if (S.route.name === 'profile') {
      S.profile = await S.api.profile(S.route.id);
      view.innerHTML = profileView(S.profile);
    } else if (S.route.name === 'admin') {
      await renderAdmin();
    } else if (S.route.name === 'radar' && S.cfg?.manualOnly) {
      location.replace('#/');
      return;
    } else if (S.route.name === 'radar') {
      const { listings } = await S.api.detectedListings();
      view.innerHTML = radarView(listings);
    } else if (S.route.name === 'earn') {
      await refreshRewards();
      view.innerHTML = earnView();
    } else if (S.route.name === 'portfolio') {
      const preds = S.me ? (await S.api.myPredictions()).predictions : [];
      const history = S.me && S.api.ledger ? (await S.api.ledger().catch(() => ({ entries: [] }))).entries : [];
      const stats = S.me && S.api.stats ? await S.api.stats().catch(() => null) : null;
      view.innerHTML = portfolioView(preds, history, stats);
    }
    document.title = titleFor();
  } catch (err) {
    if (err instanceof ApiError && err.status === 404 && S.route.name === 'profile') {
      view.innerHTML = `<div class="empty"><div class="empty-art">${ico('user')}</div><p>There’s no player called “${esc(S.route.id)}”.</p><a class="btn" href="#/leaderboard">See the leaderboard</a></div>`;
    } else if (err instanceof ApiError && err.status === 404) {
      view.innerHTML = `<div class="empty"><p>This market doesn’t exist or was removed.</p><a class="btn" href="#/">Browse markets</a></div>`;
    } else {
      view.innerHTML = `<div class="empty"><p>${esc(err.message || 'Something went wrong.')}</p><button class="btn" data-action="retry">Try again</button></div>`;
    }
  }
}

function titleFor() {
  if (S.route.name === 'market' && S.market) return `${S.market.symbol} on ${S.market.exchange}: Firstprint`;
  if (S.route.name === 'leaderboard') return 'Leaderboard: Firstprint';
  if (S.route.name === 'profile') return `${S.profile?.username ?? S.route.id}: Firstprint`;
  if (S.route.name === 'radar') return 'Listing radar: Firstprint';
  if (S.route.name === 'admin') return 'Admin: Firstprint';
  if (S.route.name === 'portfolio') return 'Your dashboard: Firstprint';
  if (S.route.name === 'earn') return 'Earn points: Firstprint';
  return 'Firstprint: predict new exchange listings';
}

// ------------------------------------------------------------------ Top bar

/** Navigation: the same pages in the top bar (wide screens) and the tab bar (phones). */
const NAV_ICONS = { home: 'grid', radar: 'radar', earn: 'gift', leaderboard: 'trophy', portfolio: 'dashboard' };

/** A coloured circle with the first letter of a name or symbol; the colour is stable per name. */
function avatar(name, cls = '') {
  const text = String(name || '?');
  let h = 0;
  for (const ch of text) h = (h * 31 + ch.codePointAt(0)) % 360;
  return `<span class="avatar${cls ? ` ${cls}` : ''}" style="--h:${h}" aria-hidden="true">${esc(text.replace(/^@/, '').slice(0, 1).toUpperCase())}</span>`;
}

function renderTop() {

  const wallet = S.me?.wallets?.[0]?.address;

    ['home', '#/', 'Markets', 'Markets'],

    <div class="topbar-inner">
      <a class="wordmark" href="#/" aria-label="Firstprint home"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span class="word">Firstprint</span></a>
      <nav class="nav" aria-label="Main">
        ${pages.map(([name, href, label]) => `<a href="${href}"${cur(name)}>${ico(NAV_ICONS[name])}${label}</a>`).join('')}
      </nav>

        ${S.cfg?.rewards ? `<button class="chip chip-faucet" data-action="faucet" title="Get free test SOL for network fees">${ico('droplet')}<span class="faucet-label">Test SOL</span></button>` : ''}
        ${
          S.me
            ? `${S.me.canClaimDaily ? `<button class="chip gift" data-action="claim" title="Claim your free daily points" aria-label="Claim 100 free daily points">${ico('gift')}<span class="gift-n">+100</span></button>` : ''}
               <a class="chip points" href="#/portfolio" title="Your points balance">${ico('coins')}${fmtNum(S.me.points)}<span class="unit">pts</span></a>
               <a class="chip wallet-chip" href="#/portfolio" title="Signed in as ${esc(S.me.username)}">${avatar(S.me.username, 'avatar-sm')}<span>${wallet ? esc(shortAddress(wallet)) : esc(S.me.username)}</span></a>`

function renderDemoBar() {
  if (!S.api.demo) return;

    <div class="demo-bar"><div class="demo-bar-inner">
      <p><strong>Practice mode</strong><span class="long">: simulated prices, browser-only accounts, and no real funds or persisted predictions.</span><span class="short">: fake points, simulated prices.</span></p>
