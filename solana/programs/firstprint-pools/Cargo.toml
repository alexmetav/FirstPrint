[package]
name = "firstprint-pools"
version = "0.1.0"
description = "Firstprint on-chain prediction pools"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "firstprint_pools"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
