<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="./stage.css" />
</head>
<body>
<div id="stage"></div>
<script type="module">
  const v = new URLSearchParams(location.search).get('v') || 'v1';
  const mod = await import(`./${v}.js`);
  await document.fonts.load('600 76px Geist');
  await document.fonts.load('400 40px Geist');
  await document.fonts.load('500 36px "Geist Mono"');
  await document.fonts.ready;
  const render = mod.build();
  window.DURATION = mod.DURATION;
  window.render = (t) => render(t);
  render(0);
  window.READY = true;
</script>
</body>
</html>
