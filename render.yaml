services:
  - type: web
    name: firstprint-demo-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:demo
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0

  # The full app: accounts, points, admin panel, manual markets. Runs on Render's free plan, which has no
  # persistent disk, so the server keeps its SQLite database in a private Supabase Storage bucket: it
  # restores it at start-up, copies it (compressed) every 5 minutes when something changed, and once more on shutdown.
  # One instance only. To use a persistent disk instead, set plan: starter, add
  #   disk: { name: firstprint-data, mountPath: /data, sizeGB: 1 }
  # set DB_PATH to /data/firstprint.db, and remove the two SUPABASE_ variables.
  - type: web
    name: firstprint-app
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: NODE_ENV
        value: production
      - key: MANUAL_ONLY
        value: "1"
      # The network wallets sign in on (TestFPT itself is on TOKEN_CLUSTER below).
      - key: SOLANA_CHAIN
        value: devnet
      # firstprint.fun is served through Cloudflare: read each visitor's address from CF-Connecting-IP,
      # so rate limits apply per visitor instead of per Cloudflare server. Set to 0 without Cloudflare.
      - key: BEHIND_CLOUDFLARE
        value: "1"
      # Render creates a random key. Read it in the dashboard (Environment) to open /#/admin.
      - key: ADMIN_KEY
        generateValue: true
      # Optional: sign in with these instead of pasting the key. Emails (comma-separated) count when
      # signed in with Google or an email code; wallets (Solana addresses) when linked to the account.
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_WALLETS
        sync: false
      # Optional: a free CoinGecko demo key (works without one, with a lower rate limit). All CoinGecko
      # calls share one budget per minute: 10 without a key, 25 with one (COINGECKO_PER_MIN overrides it).
      # Admin tools may use only half, so start and result prices for live markets always have room.
      - key: COINGECKO_API_KEY
        sync: false
      # Seals the keys of the Firstprint wallets made for email and Google players. Render makes it
      # once; never change or delete it, or those wallets can no longer be used.
      - key: WALLET_ENCRYPTION_KEY
        generateValue: true
      # The address people type in the browser, e.g. https://firstprint.fun (no trailing slash).
      - key: PUBLIC_URL
        sync: false
      # Database backup (Supabase free plan): the project URL and its service_role key. Secret, enter in Render only.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # TestFPT network: testnet (default) or devnet. Set it up from the admin panel.
      - key: TOKEN_CLUSTER
        value: testnet
      # Optional sign-in methods; each is hidden in the app until it is set.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Telegram bot token from @BotFather: admin alerts and the public player channel. Secret, enter in Render only.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
