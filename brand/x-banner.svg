<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" font-family="Geist">
  <defs>
    <radialGradient id="glow" cx="0.75" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#7dff3a" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7dff3a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#07080c" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#07080c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#9faac0"/>
      <stop offset="0.55" stop-color="#30d158"/>
      <stop offset="1" stop-color="#7dff3a"/>
    </linearGradient>
    <radialGradient id="dotglow"><stop offset="0" stop-color="#7dff3a" stop-opacity="0.55"/><stop offset="1" stop-color="#7dff3a" stop-opacity="0"/></radialGradient>
    <linearGradient id="bandfade" x1="0" x2="1"><stop offset="0" stop-color="#07080c" stop-opacity="1"/><stop offset="0.18" stop-color="#07080c" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1500" height="500" fill="#07080c"/>
  <rect width="1500" height="500" fill="url(#dots)"/>
  <rect width="1500" height="500" fill="url(#fade)"/>
  <rect width="1500" height="500" fill="url(#glow)"/>

  <!-- Brand -->
  <g transform="translate(120,92)">
    <rect width="48" height="48" rx="12" fill="#0b0f2a" stroke="#313b80" stroke-width="1.5"/>
    <rect x="8" y="8" width="32" height="5.2" rx="2.6" fill="#7dff3a"/>
    <rect x="12" y="15.8" width="24" height="5.2" rx="2.6" fill="#3fd69a"/>
    <rect x="16" y="23.6" width="16" height="5.2" rx="2.6" fill="#9faac0"/>
    <rect x="12" y="31.4" width="24" height="5.2" rx="2.6" fill="#ff8a5c"/>
    <rect x="8" y="39.2" width="32" height="5.2" rx="2.6" fill="#ff4d6a"/>
    <text x="64" y="34" font-size="28" font-weight="600" fill="#f5f5f7" letter-spacing="-0.5">Firstprint</text>
  </g>

  <!-- Headline -->
  <text x="116" y="226" font-size="62" font-weight="700" fill="#f5f5f7" letter-spacing="-2">Call the first move</text>
  <text x="116" y="296" font-size="62" font-weight="700" fill="#8e8e93" letter-spacing="-2">of every new listing</text>
  <text x="120" y="344" font-size="22" fill="#9a9aa3">Free prediction markets on new and trending tokens</text>

  <!-- Outcome zones: where does the price land? -->
  <g>
    <rect x="840" y="58" width="560" height="74" fill="#7dff3a" fill-opacity="0.07"/>
    <rect x="840" y="132" width="560" height="74" fill="#30d158" fill-opacity="0.06"/>
    <rect x="840" y="206" width="560" height="88" fill="#a1a1aa" fill-opacity="0.04"/>
    <rect x="840" y="294" width="560" height="74" fill="#ff9f0a" fill-opacity="0.06"/>
    <rect x="840" y="368" width="560" height="74" fill="#ff453a" fill-opacity="0.07"/>
    <g stroke="#ffffff" stroke-opacity="0.06">
      <line x1="840" y1="132" x2="1400" y2="132"/><line x1="840" y1="206" x2="1400" y2="206"/>
      <line x1="840" y1="294" x2="1400" y2="294"/><line x1="840" y1="368" x2="1400" y2="368"/>
    </g>
    <rect x="840" y="58" width="560" height="384" fill="url(#bandfade)"/>
    <g font-size="16" font-weight="600" text-anchor="end">
      <text x="1386" y="88" fill="#7dff3a">Moon</text><text x="1386" y="108" font-family="Geist Mono" font-size="12" font-weight="500" fill="#7dff3a" fill-opacity="0.7">+50% or more</text>
      <text x="1386" y="162" fill="#30d158">Up</text><text x="1386" y="182" font-family="Geist Mono" font-size="12" font-weight="500" fill="#30d158" fill-opacity="0.7">+10% to +50%</text>
      <text x="1386" y="243" fill="#c7c7cc">Flat</text><text x="1386" y="263" font-family="Geist Mono" font-size="12" font-weight="500" fill="#c7c7cc" fill-opacity="0.7">±10%</text>
      <text x="1386" y="324" fill="#ff9f0a">Down</text><text x="1386" y="344" font-family="Geist Mono" font-size="12" font-weight="500" fill="#ff9f0a" fill-opacity="0.7">−10% to −50%</text>
      <text x="1386" y="398" fill="#ff453a">Crash</text><text x="1386" y="418" font-family="Geist Mono" font-size="12" font-weight="500" fill="#ff453a" fill-opacity="0.7">−50% or less</text>
    </g>
  </g>

  <!-- Start price and the listing moment -->
  <line x1="880" y1="250" x2="1290" y2="250" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="5 6"/>
  <line x1="900" y1="70" x2="900" y2="430" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
  <rect x="868" y="440" width="64" height="24" rx="12" fill="#ffffff" fill-opacity="0.06"/>
  <text x="900" y="457" text-anchor="middle" font-family="Geist Mono" font-size="12" fill="#c7c7cc" letter-spacing="1">LISTED</text>

  <!-- The first move -->
  <path d="M900 250 L918 262 L934 238 L950 276 L966 292 L982 268 L1000 300 L1018 282 L1036 246 L1054 258 L1072 214 L1090 226 L1108 188 L1126 200 L1146 160 L1166 172 L1188 128 L1208 138 L1230 104 L1250 112 L1270 92"
        fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1270" cy="92" r="30" fill="url(#dotglow)"/>
  <circle cx="1270" cy="92" r="7" fill="#7dff3a"/>
  <g transform="translate(1150,40)">
    <rect width="104" height="30" rx="15" fill="#7dff3a"/>
    <text x="52" y="21" text-anchor="middle" font-family="Geist Mono" font-size="15" font-weight="500" fill="#07080c">+64%</text>
  </g>

  <text x="1386" y="474" text-anchor="end" font-family="Geist Mono" font-size="16" fill="#8e8e93" letter-spacing="1">firstprint.fun</text>
</svg>
