<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Firstprint: predict new exchange listings</title>
    <meta name="description" content="Free prediction markets on newly listed crypto tokens. Pick Crash, Down, Flat, Up or Moon with free points and track your win rate." />
    <meta name="theme-color" content="#0d1421" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet" />
    <style>
/* Firstprint website styles
   Palette: ink navy surfaces; a five-step outcome scale from Crash (red) to Moon (gold).
   Type: Bricolage Grotesque for display and numbers, system UI for reading text. */

:root {
  --bg: #0d1421;
  --surface: #141d2e;
  --raised: #1b2740;
  --line: #25324a;
  --text: #e7edf7;
  --muted: #8995ab;
  --focus: #9ec5ff;

  --crash: #ff4d6a;
  --down: #ff8a5c;
  --flat: #9faac0;
  --up: #3fd69a;
  --moon: #ffc53d;

  --display: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
  --body: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --page: 1180px;

  color-scheme: dark;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f6fa;
    --surface: #ffffff;
    --raised: #eef2f8;
    --line: #dce2ec;
    --text: #0f1b2d;
    --muted: #58657a;
    --focus: #2f6fd6;
    --crash: #d92d4b;
    --down: #d9612e;
    --flat: #6e7a90;
    --up: #0e9f63;
    --moon: #b7860b;
    color-scheme: light;
  }
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 var(--body);
  font-variant-numeric: tabular-nums;
}

a {
  color: inherit;
}

button,
input,
select {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.skip {
  position: absolute;
  left: -999px;
  top: 8px;
  padding: 8px 12px;
  background: var(--surface);
  border-radius: var(--r-sm);
  z-index: 100;
}
.skip:focus {
  left: 8px;
}

h1,
h2,
h3 {
  font-family: var(--display);
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.01em;
}

.muted {
  color: var(--muted);
}

/* Outcome name, colored by its bucket */
.oc {
  color: var(--c);
  font-family: var(--display);
  font-weight: 700;
}

.loading {
  padding: 64px 0;
  text-align: center;
  color: var(--muted);
}

/* ---------------------------------------------------------------- Top bar */

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}

.topbar-inner {
  max-width: var(--page);
  margin: 0 auto;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 28px;
}

.wordmark {
  display: inline-flex;
  align-items: center;
  font-family: var(--display);
  font-weight: 800;
  font-size: 23px;
  line-height: 1;
  letter-spacing: -0.03em;
  text-decoration: none;
  white-space: nowrap;
}
/* The mark is the outcome ladder in miniature: Moon on top, Crash at the bottom. */
.wordmark .mark {
  display: inline-grid;
  gap: 2px;
  width: 16px;
  margin-right: 8px;
}
.wordmark .mark i {
  display: block;
  height: 3px;
  border-radius: 2px;
}
.wordmark .mark i:nth-child(1) { background: var(--moon); width: 100%; }
.wordmark .mark i:nth-child(2) { background: var(--up); width: 80%; }
.wordmark .mark i:nth-child(3) { background: var(--flat); width: 60%; }
.wordmark .mark i:nth-child(4) { background: var(--down); width: 80%; }
.wordmark .mark i:nth-child(5) { background: var(--crash); width: 100%; }

.wallet-chip {
  font-size: 14px;
  padding: 5px 12px;
  border-radius: 999px;
  background: var(--raised);
  text-decoration: none;
  white-space: nowrap;
}

.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--up);
}
.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--up);
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse {
  50% { opacity: 0.35; }
}

.wallet-options {
  display: grid;
  gap: 8px;
  margin-top: 16px;
}
.wallet-option {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--raised);
  text-align: left;
  font-weight: 600;
}
.wallet-option:hover:not(:disabled) {
  border-color: var(--focus);
}
.wallet-option img {
  border-radius: 6px;
}
.wallet-option .muted {
  font-size: 13px;
  font-weight: 400;
}
.wallet-fallback {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: grid;
  place-items: center;
  background: var(--line);
  font-family: var(--display);
}
.no-wallet {
  margin-top: 16px;
  padding: 14px;
  border: 1px dashed var(--line);
  border-radius: var(--r-md);
}
.no-wallet p {
  margin: 0 0 10px;
}
.wallet-links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.wallet-list {
  list-style: none;
  padding: 0;
  margin: 0 0 12px;
}
.wallet-list li {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.wallet-list .addr {
  font-family: var(--display);
  font-weight: 700;
}

.radar td {
  vertical-align: top;
}
.radar-sym {
  display: block;
  font-family: var(--display);
  font-weight: 800;
  font-size: 18px;
}
.radar-title {
  display: block;
  font-size: 13px;
  color: var(--muted);
  max-width: 46ch;
}
.table td a.radar-title {
  font-family: var(--body);
  font-weight: 400;
}
a.radar-title:hover {
  color: var(--text);
}

.nav {
  display: flex;
  gap: 4px;
}
.nav a {
  text-decoration: none;
  color: var(--muted);
  padding: 6px 10px;
  border-radius: var(--r-sm);
}
.nav a:hover {
  color: var(--text);
}
.nav a[aria-current='page'] {
  color: var(--text);
  background: var(--raised);
}

.account {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.points {
  font-family: var(--display);
  font-weight: 700;
  font-size: 15px;
  padding: 5px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  text-decoration: none;
  white-space: nowrap;
}

.btn {
  display: inline-block;
  text-decoration: none;
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 999px;
  padding: 7px 14px;
  font-weight: 600;
  white-space: nowrap;
}
.btn:hover {
  background: var(--raised);
}
.btn-solid {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}
.btn-solid:hover {
  background: color-mix(in srgb, var(--text) 85%, var(--bg));
}
.btn:disabled {
  opacity: 0.5;
  cursor: default;
}

/* --------------------------------------------------------------- Demo bar */

.demo-bar {
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--moon) 9%, var(--bg));
}
.demo-bar-inner {
  max-width: var(--page);
  margin: 0 auto;
  padding: 8px 20px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 14px;
  font-size: 14px;
}
.demo-bar p {
  margin: 0;
  flex: 1 1 280px;
}
.demo-bar .btn {
  padding: 4px 12px;
  font-size: 13px;
}

/* -------------------------------------------------------------- Page frame */

main {
  max-width: var(--page);
  margin: 0 auto;
  padding: 28px 20px 96px;
  min-height: 70vh;
}
main:focus {
  outline: none;
}

.footer {
  max-width: var(--page);
  margin: 0 auto;
  padding: 24px 20px 40px;
  color: var(--muted);
  font-size: 13px;
  border-top: 1px solid var(--line);
}
.footer p {
  margin: 0;
}

.page-title {
  font-size: clamp(28px, 4vw, 40px);
  letter-spacing: -0.025em;
}
.page-lede {
  color: var(--muted);
  margin: 6px 0 24px;
  max-width: 62ch;
}

/* ---------------------------------------------------------- Featured market */

.featured {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
  gap: 32px;
  align-items: center;
  padding: 28px 0 36px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 24px;
}

.featured h1 {
  font-size: clamp(34px, 5.4vw, 64px);
  line-height: 0.98;
  letter-spacing: -0.035em;
  font-weight: 800;
  font-stretch: 88%;
}
.featured h1 .countdown {
  display: block;
  color: var(--moon);
}
.featured .lede {
  color: var(--muted);
  margin: 14px 0 20px;
  max-width: 46ch;
}
.featured .actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.mini-ladder {
  display: grid;
  gap: 6px;
}
.mini-rung {
  position: relative;
  display: grid;
  grid-template-columns: 92px 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: var(--r-sm);
  background: var(--surface);
  overflow: hidden;
  font-size: 14px;
}
.mini-rung::before {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  width: var(--share);
  background: color-mix(in srgb, var(--c) 22%, transparent);
}
.mini-rung > * {
  position: relative;
}
.mini-rung b {
  font-family: var(--display);
  color: var(--c);
  white-space: nowrap;
}
.mini-rung .pct {
  font-family: var(--display);
  font-weight: 700;
}

/* ----------------------------------------------------------------- Toolbar */

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
}
.tabs button {
  border: 0;
  background: transparent;
  padding: 6px 14px;
  border-radius: 999px;
  color: var(--muted);
  font-weight: 600;
}
.tabs button[aria-selected='true'] {
  background: var(--raised);
  color: var(--text);
}
.tabs .count {
  font-weight: 500;
  margin-left: 4px;
  opacity: 0.8;
}

.select {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 14px;
}
.select select {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 6px 10px;
}

/* -------------------------------------------------------------- Market grid */

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}

.card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 16px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
  text-decoration: none;
  transition: border-color 120ms;
}
.card:hover {
  border-color: color-mix(in srgb, var(--text) 30%, var(--line));
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.sym {
  font-family: var(--display);
  font-weight: 800;
  font-size: 26px;
  letter-spacing: -0.02em;
  line-height: 1;
}
.exch {
  font-size: 13px;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 1px 8px;
}
.card-name {
  color: var(--muted);
  font-size: 14px;
  margin-top: -6px;
}

.strip {
  display: flex;
  height: 8px;
  border-radius: 999px;
  overflow: hidden;
  gap: 2px;
  background: var(--raised);
}
.strip span {
  background: var(--c);
  min-width: 3px;
}
.strip.empty span {
  opacity: 0.25;
}

.card-lead {
  font-size: 14px;
  min-height: 21px;
}
.card-lead b {
  color: var(--c);
  font-family: var(--display);
}

.card-foot {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 13px;
  color: var(--muted);
  border-top: 1px solid var(--line);
  padding-top: 10px;
  margin-top: auto;
}
.card-foot .when {
  color: var(--text);
}

.empty {
  padding: 48px 20px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed var(--line);
  border-radius: var(--r-md);
}
.empty .btn {
  margin-top: 12px;
}

/* ------------------------------------------------------------- Market page */

.market-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 32px;
  align-items: start;
}

.back {
  display: inline-block;
  color: var(--muted);
  text-decoration: none;
  font-size: 14px;
  margin-bottom: 14px;
}
.back:hover {
  color: var(--text);
}

.m-head {
  margin-bottom: 20px;
}
.m-title {
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
}
.m-title .sym {
  font-size: clamp(40px, 6vw, 60px);
  letter-spacing: -0.035em;
  font-stretch: 90%;
}
.m-question {
  font-size: 18px;
  margin: 8px 0 6px;
  max-width: 60ch;
}
.m-status {
  color: var(--muted);
  margin: 0;
}
.m-status strong {
  color: var(--text);
  font-weight: 600;
}

.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 28px;
  margin: 18px 0 22px;
  padding: 0;
}
.stats div {
  display: flex;
  flex-direction: column;
}
.stats dt {
  font-size: 13px;
  color: var(--muted);
}
.stats dd {
  margin: 0;
  font-family: var(--display);
  font-weight: 700;
  font-size: 20px;
}

.chart {
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
  padding: 14px 14px 10px;
  margin-bottom: 22px;
}
.chart-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 14px;
  margin-bottom: 8px;
}
.chart-head .now {
  font-family: var(--display);
  font-weight: 700;
  font-size: 18px;
}
.chart svg {
  display: block;
  width: 100%;
  height: 180px;
}
.chart-empty {
  height: 120px;
  display: grid;
  place-items: center;
  color: var(--muted);
  text-align: center;
  padding: 0 20px;
}

/* The outcome ladder: Moon at the top, Crash at the bottom. */

.ladder {
  display: grid;
  gap: 8px;
  margin-bottom: 28px;
}
.ladder-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 72px 72px 96px;
  gap: 12px;
  padding: 0 16px;
  font-size: 13px;
  color: var(--muted);
}
.ladder-head span:not(:first-child) {
  text-align: right;
}

.rung {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 72px 72px 96px;
  gap: 12px;
  align-items: center;
  width: 100%;
  text-align: left;
  padding: 14px 16px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--surface);
  overflow: hidden;
}
.rung::before {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  width: var(--share);
  background: color-mix(in srgb, var(--c) 16%, transparent);
  transition: width 400ms ease;
}
.rung > * {
  position: relative;
}
.rung:not(:disabled):hover {
  border-color: var(--c);
}
.rung:disabled {
  cursor: default;
}
.rung[aria-pressed='true'] {
  border-color: var(--c);
  box-shadow: inset 3px 0 0 var(--c);
}

.rung-name {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.rung-name b {
  font-family: var(--display);
  font-size: 19px;
  color: var(--c);
  line-height: 1.2;
}
.rung-name small {
  color: var(--muted);
  font-size: 13px;
}
.rung .num {
  text-align: right;
  font-family: var(--display);
  font-weight: 700;
  font-size: 16px;
}
.rung .num small {
  display: block;
  font-family: var(--body);
  font-weight: 400;
  font-size: 12px;
  color: var(--muted);
}

.tag {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  padding: 1px 8px;
  border-radius: 999px;
  margin-left: 8px;
  vertical-align: 2px;
  font-family: var(--body);
}
.tag-you {
  background: var(--text);
  color: var(--bg);
}
.tag-now {
  background: var(--c);
  color: var(--bg);
}

.ladder.settled .rung:not(.won) {
  opacity: 0.5;
}
.rung.won {
  border-color: var(--c);
  border-width: 2px;
  padding: 13px 15px;
}

/* Sections under the ladder */

.section {
  border-top: 1px solid var(--line);
  padding: 18px 0;
}
.section h2 {
  font-size: 20px;
  margin-bottom: 10px;
}
.section p {
  margin: 0 0 10px;
  max-width: 68ch;
}

.facts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px 24px;
  margin: 0;
}
.facts dt {
  font-size: 13px;
  color: var(--muted);
}
.facts dd {
  margin: 0;
  font-weight: 600;
}

.rules {
  margin: 0;
  padding-left: 20px;
  max-width: 68ch;
}
.rules li {
  margin-bottom: 8px;
}

.activity {
  list-style: none;
  margin: 0;
  padding: 0;
}
.activity li {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.activity b {
  color: var(--c);
  font-family: var(--display);
}

/* ------------------------------------------------------------- Trade panel */

.trade {
  position: sticky;
  top: 76px;
}

.trade-card {
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--surface);
  padding: 18px;
}
.trade-card h2 {
  font-size: 20px;
  margin-bottom: 12px;
}

.picker {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-bottom: 16px;
}
.picker button {
  border: 1px solid var(--line);
  background: var(--raised);
  border-radius: var(--r-sm);
  padding: 8px 2px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.picker button b {
  font-family: var(--display);
  font-size: 14px;
  color: var(--c);
}
.picker button small {
  font-size: 12px;
  color: var(--muted);
}
.picker button[aria-checked='true'] {
  background: var(--c);
  border-color: var(--c);
}
.picker button[aria-checked='true'] b,
.picker button[aria-checked='true'] small {
  color: var(--bg);
}

.field-label {
  display: block;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 6px;
}

.stake-input {
  display: flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--bg);
  padding: 0 14px;
}
.stake-input:focus-within {
  border-color: var(--focus);
}
.stake-input input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: transparent;
  font-family: var(--display);
  font-weight: 700;
  font-size: 26px;
  padding: 8px 0;
  outline: none;
}
.stake-input span {
  color: var(--muted);
}

.chips {
  display: flex;
  gap: 6px;
  margin: 8px 0 16px;
}
.chips button {
  flex: 1;
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 999px;
  padding: 4px 0;
  font-size: 13px;
  font-weight: 600;
}
.chips button:hover {
  background: var(--raised);
}

.summary {
  margin: 0 0 16px;
  display: grid;
  gap: 6px;
}
.summary div {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 14px;
}
.summary dt {
  color: var(--muted);
}
.summary dd {
  margin: 0;
  font-weight: 600;
}
.summary .big dd {
  font-family: var(--display);
  font-size: 22px;
  font-weight: 800;
  color: var(--c);
}

.cta {
  width: 100%;
  border: 0;
  border-radius: var(--r-md);
  padding: 14px;
  font-weight: 700;
  font-size: 16px;
  background: var(--c, var(--text));
  color: var(--bg);
}
.cta:disabled {
  opacity: 0.55;
  cursor: default;
}

.fine {
  font-size: 13px;
  color: var(--muted);
  margin: 10px 0 0;
}
.form-error {
  color: var(--crash);
  font-size: 14px;
  margin: 10px 0 0;
  min-height: 1em;
}

.position {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  border-top: 1px solid var(--line);
  font-size: 14px;
}
.position b {
  color: var(--c);
  font-family: var(--display);
}

.mobile-bar,
.sheet-close {
  display: none;
}

/* -------------------------------------------------------------- Tables */

.table {
  width: 100%;
  border-collapse: collapse;
}
.table th {
  text-align: left;
  font-weight: 500;
  font-size: 13px;
  color: var(--muted);
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
}
.table td {
  padding: 12px;
  border-bottom: 1px solid var(--line);
}
.table .right {
  text-align: right;
}
.table tr.me td {
  background: color-mix(in srgb, var(--moon) 8%, transparent);
}
.rank {
  font-family: var(--display);
  font-weight: 800;
  font-size: 18px;
  width: 48px;
}
.profit-pos {
  color: var(--up);
  font-weight: 700;
}
.profit-neg {
  color: var(--crash);
  font-weight: 700;
}
.table td a {
  text-decoration: none;
  font-family: var(--display);
  font-weight: 700;
}
.table td b {
  color: var(--c);
  font-family: var(--display);
}

.balance {
  display: flex;
  align-items: center;
  gap: 16px 24px;
  flex-wrap: wrap;
  padding: 20px 0 28px;
}
.balance .amount {
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(44px, 7vw, 72px);
  letter-spacing: -0.04em;
  line-height: 1;
}

/* ------------------------------------------------------------------ Modal */

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(5, 9, 16, 0.6);
  display: grid;
  place-items: center;
  padding: 20px;
}
.modal {
  width: min(400px, 100%);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 22px;
}
.modal h2 {
  font-size: 24px;
  margin-bottom: 4px;
}
.modal form {
  display: grid;
  gap: 12px;
  margin-top: 16px;
}
.modal input {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: var(--r-sm);
  padding: 10px 12px;
}
.modal input:focus {
  border-color: var(--focus);
  outline: none;
}
.modal .switch {
  background: none;
  border: 0;
  padding: 0;
  text-decoration: underline;
  color: var(--text);
}

/* ------------------------------------------------------------------ Toast */

#toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translate(-50%, 20px);
  opacity: 0;
  z-index: 60;
  background: var(--text);
  color: var(--bg);
  padding: 10px 16px;
  border-radius: 999px;
  font-weight: 600;
  pointer-events: none;
  transition: opacity 160ms, transform 160ms;
  max-width: calc(100vw - 40px);
  text-align: center;
}
#toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
#toast.error {
  background: var(--crash);
  color: #fff;
}

/* ------------------------------------------------------------ Responsive */

@media (max-width: 900px) {
  .featured {
    grid-template-columns: 1fr;
    gap: 22px;
    padding-top: 12px;
  }

  .market-layout {
    grid-template-columns: 1fr;
  }

  /* Trade panel becomes a bottom sheet */
  .trade {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    top: auto;
    z-index: 40;
    transform: translateY(105%);
    transition: transform 220ms ease;
    max-height: 88vh;
    overflow: auto;
  }
  .trade.open {
    transform: none;
  }
  .trade-card {
    border-radius: var(--r-lg) var(--r-lg) 0 0;
    padding-bottom: calc(18px + env(safe-area-inset-bottom));
    border-bottom: 0;
  }
  .sheet-close {
    display: block;
    float: right;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    padding: 4px 0;
  }
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    z-index: 35;
    background: rgba(5, 9, 16, 0.5);
  }

  .mobile-bar {
    display: flex;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 30;
    gap: 12px;
    align-items: center;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: var(--surface);
    border-top: 1px solid var(--line);
  }
  .mobile-bar p {
    margin: 0;
    flex: 1;
    font-size: 14px;
    color: var(--muted);
  }
  .mobile-bar .cta {
    width: auto;
    padding: 12px 20px;
  }
}

@media (max-width: 640px) {
  body {
    font-size: 15px;
  }
  .topbar-inner {
    gap: 12px;
    padding: 8px 14px;
    flex-wrap: wrap;
  }
  .nav {
    order: 3;
    width: calc(100% + 20px);
    margin: 0 -10px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav a {
    white-space: nowrap;
  }
  .wallet-chip {
    display: none;
  }
  main {
    padding: 18px 14px 110px;
  }
  .demo-bar-inner {
    padding: 8px 14px;
  }
  .ladder-head {
    display: none;
  }
  .rung {
    grid-template-columns: minmax(0, 1fr) 58px 64px;
    gap: 8px;
    padding: 12px;
  }
  .rung .pool-col {
    display: none;
  }
  .table .hide-sm {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition: none !important;
    animation: none !important;
  }
}

/* ------------------------------------------------------------ Live test & admin */

.tag-test {
  background: transparent;
  color: var(--moon);
  border: 1px solid color-mix(in srgb, var(--moon) 60%, transparent);
  margin-left: 4px;
}
.m-venues {
  margin: 6px 0 0;
  font-size: 14px;
  color: var(--muted);
}
.m-venues .tag-test {
  margin-left: 0;
}

.admin-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.admin-form {
  display: grid;
  gap: 12px;
  margin-top: 12px;
}
.admin-grid {
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  align-items: end;
}
.admin-form input:not([type='checkbox']),
.admin-form select,
.admin-detect input {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: var(--r-sm);
  padding: 9px 10px;
}
.venues {
  grid-column: 1 / -1;
  border: 0;
  padding: 0;
  margin: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
}
.check {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  font-size: 14px;
}
.admin-actions {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}
.suggested {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-top: 14px;
}
.suggested .btn {
  padding: 4px 12px;
  font-size: 13px;
}
.admin-list {
  display: grid;
  gap: 10px;
}
.admin-detect {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1.4fr);
  gap: 10px;
  align-items: end;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
}
.table-scroll {
  overflow-x: auto;
}
.checks td small {
  display: block;
  font-size: 12px;
  color: var(--muted);
  font-weight: 400;
}
.checks td.pass {
  color: var(--up);
  font-weight: 700;
}
.checks td.fail {
  color: var(--crash);
  font-weight: 700;
}
.footer a {
  color: var(--muted);
}
code {
  background: var(--raised);
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 0.92em;
}
@media (max-width: 640px) {
  .admin-detect {
    grid-template-columns: 1fr;
  }
}

/* Admin: manual markets */
.admin-form textarea {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: var(--r-sm);
  padding: 9px 10px;
  font: inherit;
  resize: vertical;
}
.admin-result {
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  align-items: end;
}
.admin-result .admin-list,
.admin-preview {
  grid-column: 1 / -1;
}
.admin-preview {
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 12px 14px;
}
.admin-preview p {
  margin: 0 0 6px;
}
.admin-row-actions {
  white-space: nowrap;
}
.admin-row-actions .btn {
  margin-left: 6px;
}
.m-note {
  color: var(--muted);
  margin: 0 0 10px;
  max-width: 62ch;
}
.admin-result > div:first-child {
  grid-column: 1 / -1;
}

/* Sign-in popup */
.or {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 16px 0 4px;
  color: var(--muted);
  font-size: 13px;
}
.or::before,
.or::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--line);
}
.google-slot {
  display: flex;
  justify-content: center;
  min-height: 44px;
  margin-top: 16px;
}
.code-input {
  font-size: 28px;
  letter-spacing: 0.4em;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.dev-code {
  padding: 10px 12px;
  border: 1px dashed var(--line);
  border-radius: var(--r-sm);
}
.modal .switch:disabled {
  opacity: 0.6;
  cursor: default;
  text-decoration: none;
}

/* Waking-up notice (free hosting sleeps when idle) */
.wake-bar {
  background: var(--raised);
  border-bottom: 1px solid var(--line);
}
.wake-bar p {
  margin: 0;
  padding: 10px 16px;
  text-align: center;
  font-size: 14px;
}

/* Hero for admin-run markets: short headline, countdown as a pill */
.closing-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 10px 0 0;
  padding: 6px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  font-weight: 600;
}
.closing-pill .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--up);
  animation: pulse 1.6s ease-in-out infinite;
}

/* Market timeline */
.timeline {
  list-style: none;
  margin: 18px 0 22px;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}
.timeline li {
  position: relative;
  display: grid;
  gap: 2px;
  padding: 14px 14px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
  opacity: 0.7;
}
.timeline li.done,
.timeline li.now {
  opacity: 1;
}
.timeline li.now {
  border-color: var(--up);
  box-shadow: 0 0 0 1px var(--up) inset;
}
.timeline .step-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--line);
  margin-bottom: 6px;
}
.timeline .done .step-dot {
  background: var(--up);
}
.timeline .now .step-dot {
  background: var(--up);
  animation: pulse 1.6s ease-in-out infinite;
}
.timeline .muted {
  font-size: 13px;
}
@media (max-width: 640px) {
  /* Stay on one row on phones so the outcome buttons aren't pushed off the screen. */
  .timeline {
    gap: 6px;
    margin: 14px 0 16px;
  }
  .timeline li {
    padding: 10px 9px 8px;
    font-size: 13px;
    line-height: 1.25;
    word-break: break-word;
  }
  .timeline .muted {
    font-size: 12px;
  }
  .timeline .step-dot {
    margin-bottom: 4px;
  }
}
.share-btn {
  margin-left: auto;
  padding: 6px 14px;
  font-size: 14px;
}

/* ------------------------------------------------------- Playful layer
   Outcome icons, the daily gift, friendlier steps, closing-soon cards,
   confetti and the phone tab bar. */

.oc-ico {
  display: inline-block;
  margin-right: 0.3em;
  font-size: 0.95em;
  line-height: 1;
  font-family: 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
}

/* Daily points: a small gift button next to the balance while today's points are unclaimed. */
.gift {
  border: 1px solid color-mix(in srgb, var(--moon) 55%, var(--line));
  background: color-mix(in srgb, var(--moon) 14%, var(--bg));
  color: var(--text);
  font-family: var(--display);
  font-weight: 700;
  font-size: 14px;
  padding: 5px 12px;
  border-radius: 999px;
  white-space: nowrap;
  cursor: pointer;
  animation: wiggle 3.2s ease-in-out infinite;
}
.gift:hover {
  background: color-mix(in srgb, var(--moon) 24%, var(--bg));
}
@keyframes wiggle {
  0%, 86%, 100% { transform: rotate(0); }
  89% { transform: rotate(-6deg); }
  92% { transform: rotate(6deg); }
  95% { transform: rotate(-3deg); }
}

/* Outcome picker: a big icon on each choice, and a little lift on the chosen one. */
.picker button {
  padding: 10px 2px 8px;
  transition: transform 120ms ease, background 120ms ease;
}
.picker button:hover {
  transform: translateY(-2px);
}
.pick-ico {
  font-size: 22px;
  line-height: 1.1;
  font-family: 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
}
.picker button[aria-checked='true'] {
  transform: translateY(-2px) scale(1.04);
  box-shadow: 0 6px 20px color-mix(in srgb, var(--c) 35%, transparent);
}

/* Three steps instead of a wall of text. */
.steps {
  list-style: none;
  padding: 0;
  margin: 14px 0 10px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  counter-reset: step;
}
.steps li {
  position: relative;
  padding: 18px 18px 16px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
  counter-increment: step;
}
.steps li::after {
  content: counter(step);
  position: absolute;
  top: 14px;
  right: 16px;
  font-family: var(--display);
  font-weight: 800;
  font-size: 28px;
  line-height: 1;
  color: var(--line);
}
.step-ico {
  display: block;
  font-size: 30px;
  line-height: 1;
  margin-bottom: 10px;
  font-family: 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
}
.steps b {
  font-family: var(--display);
  font-size: 18px;
}
.steps p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 14px;
}
.full-rules summary {
  cursor: pointer;
  color: var(--muted);
  font-size: 14px;
  padding: 6px 0;
}
.full-rules summary:hover {
  color: var(--text);
}

/* Markets that close within 15 minutes get a glowing edge and a tag. */
.card {
  position: relative;
  transition: border-color 120ms, transform 120ms;
}
.card:hover {
  transform: translateY(-2px);
}
.card.soon {
  border-color: color-mix(in srgb, var(--moon) 45%, var(--line));
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--moon) 20%, transparent), 0 8px 26px color-mix(in srgb, var(--moon) 10%, transparent);
}
.soon-tag {
  position: absolute;
  top: -10px;
  left: 14px;
  font-size: 12px;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--moon);
  color: #1a1300;
}

.empty-art {
  font-size: 44px;
  line-height: 1;
  margin-bottom: 8px;
  font-family: 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
}
.empty strong {
  color: var(--text);
}

/* Confetti after a prediction or a daily claim. */
#confetti {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 70;
  overflow: hidden;
}
#confetti i {
  position: absolute;
  left: 50%;
  top: 42%;
  width: 9px;
  height: 14px;
  border-radius: 2px;
  background: var(--c);
  opacity: 0;
  animation: confetti 1.5s cubic-bezier(0.2, 0.7, 0.3, 1) var(--d) forwards;
}
#confetti i:nth-child(3n) {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
@keyframes confetti {
  0% { opacity: 1; transform: translate(0, 0) rotate(0); }
  35% { opacity: 1; transform: translate(calc(var(--x) * 0.7), -26vh) rotate(calc(var(--r) * 0.5)); }
  100% { opacity: 0; transform: translate(var(--x), 48vh) rotate(var(--r)); }
}

/* The phone tab bar: hidden on wider screens, where the top nav has room. */
.tabbar {
  display: none;
}
.demo-bar .short {
  display: none;
}

@media (max-width: 640px) {
  .nav {
    display: none;
  }
  .topbar-inner {
    flex-wrap: nowrap;
  }
  .tabbar {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 32;
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--surface) 94%, transparent);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
  }
  .tabbar a {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 6px 0 4px;
    border-radius: var(--r-sm);
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }
  .tabbar svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .tabbar a[aria-current='page'] {
    color: var(--text);
    background: var(--raised);
  }
  /* The "Make a prediction" bar sits just above the tab bar. */
  .mobile-bar {
    bottom: calc(62px + env(safe-area-inset-bottom));
    padding-bottom: 10px;
  }
  main {
    padding-bottom: 170px;
  }
  #toast {
    bottom: calc(82px + env(safe-area-inset-bottom));
  }
  .demo-bar .long {
    display: none;
  }
  .demo-bar .short {
    display: inline;
  }
  .demo-bar-inner {
    flex-wrap: nowrap;
    gap: 8px;
  }
  .demo-bar p {
    flex: 1 1 auto;
    font-size: 13px;
  }
  .demo-bar .btn {
    white-space: nowrap;
    padding: 4px 10px;
  }
  .steps {
    grid-template-columns: 1fr;
    gap: 10px;
  }
  .steps li {
    display: grid;
    grid-template-columns: 40px 1fr;
    column-gap: 12px;
    padding: 14px 16px;
  }
  .step-ico {
    grid-row: span 2;
    margin: 2px 0 0;
  }
  .steps p {
    grid-column: 2;
  }
  .gift {
    padding: 5px 10px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .gift,
  .card:hover,
  .picker button:hover {
    animation: none;
    transform: none;
  }
}

/* ---------------------------------------------------------- Dashboard */

.dash-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 20px;
}
.count-inline {
  font-size: 0.7em;
  font-weight: 600;
}

.stat-tiles {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 12px;
  margin: 0;
}
.stat-tile {
  position: relative;
  padding: 14px 16px;

<script type="module">
// Generated by scripts/build-web.ts from src/engine/engine.ts. Do not edit.
/**
 * Firstprint market engine.
 *
 * Pure, dependency-free logic shared by the server and the Mini App:
 * outcome buckets, TWAP price oracle, pool caps, early-bird weights,
 * payouts, and settlement with void rules.
 *
 * Amounts are integers in minor units (points, or USDT micro-units later).
 * Times are Unix milliseconds.
 */

// ---------------------------------------------------------------------------
// Types
// ---------------------------------------------------------------------------

/** Ordered from worst to best outcome. */
const BUCKETS                    = ['crash', 'down', 'flat', 'up', 'moon'];

const DEFAULT_THRESHOLDS             = { crash: -0.5, down: -0.1, up: 0.1, moon: 0.5 };

const MINUTE = 60_000;
const HOUR = 60 * MINUTE;

const DEFAULT_CONFIG               = {
  thresholds: DEFAULT_THRESHOLDS,
  earlyBirdK: 0.5,
  feeBps: 400,
  softCap: 50_000,
  volumeCapRatio: null,
  perUserCapPct: 0.1,
  baselineMs: HOUR,
  durationMs: 72 * HOUR,
  settleWindowMs: HOUR,
  minCoverage: 0.5,
  minTrades: 10,
  maxListingDelayMs: 24 * HOUR,
  maxHaltMs: 6 * HOUR,
};

// ---------------------------------------------------------------------------
// Buckets
// ---------------------------------------------------------------------------

/** Rounds away float noise so exactly -10% lands in "down", not "flat". */
function clean(r        )         {
  return Math.round(r * 1e9) / 1e9;
}

function returnPct(base        , final        )         {
  if (!(base > 0) || !(final >= 0)) throw new Error('Prices must be positive');
  return clean(final / base - 1);
}

function bucketForReturn(r        , t             = DEFAULT_THRESHOLDS)         {
  const x = clean(r);
  if (x <= t.crash) return 'crash';
  if (x <= t.down) return 'down';
  if (x < t.up) return 'flat';
  if (x < t.moon) return 'up';
  return 'moon';
}

function bucketRangeLabel(b        , t             = DEFAULT_THRESHOLDS)         {
  const p = (n        ) => `${n > 0 ? '+' : ''}${Math.round(n * 100)}%`;
  switch (b) {
    case 'crash': return `${p(t.crash)} or worse`;
    case 'down': return `${p(t.crash)} to ${p(t.down)}`;
    case 'flat': return `${p(t.down)} to ${p(t.up)}`;
    case 'up': return `${p(t.up)} to ${p(t.moon)}`;
    case 'moon': return `${p(t.moon)} or better`;
  }
}

// ---------------------------------------------------------------------------
// Price oracle
// ---------------------------------------------------------------------------

/**
 * Time-weighted average of 1-minute closes over [start, end).
 * Missing minutes carry the last known price forward, including the last
 * candle before the window. Slots before any known price are skipped.
 */
function twap(candles                   , start        , end        )              {
  const sorted = [...candles].sort((a, b) => a.ts - b.ts);
  const slots = Math.max(0, Math.floor((end - start) / MINUTE));
  if (slots === 0) return { twap: null, coverage: 0, volume: 0, trades: null };

  const byMinute = new Map                ();
  let last                = null;
  for (const c of sorted) {
    if (c.ts < start) last = c.close;
    else if (c.ts < end) byMinute.set(Math.floor((c.ts - start) / MINUTE), c);
  }

  let sum = 0;
  let priced = 0;
  let real = 0;
  let volume = 0;
  let trades = 0;
  let hasTrades = false;

  for (let i = 0; i < slots; i++) {
    const c = byMinute.get(i);
    if (c) {
      last = c.close;
      real++;
      volume += c.volume;
      if (c.trades !== undefined) {
        trades += c.trades;
        hasTrades = true;
      }
    }
    if (last !== null) {
      sum += last;
      priced++;
    }
  }

  return {
    twap: priced > 0 ? sum / priced : null,
    coverage: real / slots,
    volume,
    trades: hasTrades ? trades : null,
  };
}

/**
 * Volume-weighted median across venues. A single venue with little volume
 * can't drag the result far. Falls back to a plain median without volume.
 */
function venueMedian(venues                       )                {
  const valid = venues.filter((v)                                      => v.price !== null && v.price > 0);
  if (valid.length === 0) return null;
  const sorted = [...valid].sort((a, b) => a.price - b.price);
  const total = sorted.reduce((s, v) => s + Math.max(0, v.volume), 0);

  if (total <= 0) {
    const mid = Math.floor(sorted.length / 2);
    return sorted.length % 2 ? sorted[mid].price : (sorted[mid - 1].price + sorted[mid].price) / 2;
  }

  let cum = 0;
  for (const v of sorted) {
    cum += Math.max(0, v.volume);
    if (cum >= total / 2) return v.price;
  }
  return sorted[sorted.length - 1].price;
}

// ---------------------------------------------------------------------------
// Pool
// ---------------------------------------------------------------------------

function weightFor(placedAt        , tOpen        , tClose        , k        )         {
  if (tClose <= tOpen) return 1;
  const f = (tClose - placedAt) / (tClose - tOpen);
  return 1 + k * Math.min(1, Math.max(0, f));
}

function hardCapFor(cfg              , baselineVolume        )         {
  if (cfg.volumeCapRatio === null) return cfg.softCap;
  return Math.max(0, Math.min(cfg.softCap, Math.floor(cfg.volumeCapRatio * baselineVolume)));
}

/**
 * Applies the pool hard cap and per-user cap in time order, so the latest
 * predictions are the ones refunded when a cap is hit.
 */
function applyCaps(
  predictions                       ,
  hardCap        ,
  cfg                                                    ,
  tOpen        ,
  tClose        ,
)                       {
  const userCap = Math.floor(hardCap * cfg.perUserCapPct);
  const used = new Map                ();
  let poolLeft = hardCap;

  const ordered = [...predictions].sort((a, b) => a.placedAt - b.placedAt || a.id.localeCompare(b.id));
  return ordered.map((p) => {
    const userLeft = userCap - (used.get(p.userId) ?? 0);
    const accepted = Math.max(0, Math.min(p.stake, userLeft, poolLeft));
    used.set(p.userId, (used.get(p.userId) ?? 0) + accepted);
    poolLeft -= accepted;
    return {
      ...p,
      accepted,
      refund: p.stake - accepted,
      weight: weightFor(p.placedAt, tOpen, tClose, cfg.earlyBirdK),
    };
  });
}

function emptyTotals()             {
  return { crash: 0, down: 0, flat: 0, up: 0, moon: 0 };
}

function poolTotals(predictions                                              )             {
  const t = emptyTotals();
  for (const p of predictions) t[p.bucket] += p.stake;
  return t;
}

/** Estimated payout for a new prediction, assuming the pool doesn't change. */
function quote(
  existing                       ,
  bucket        ,
  stake        ,
  placedAt        ,
  cfg                                             ,
  tOpen        ,
  tClose        ,
)        {
  const weight = weightFor(placedAt, tOpen, tClose, cfg.earlyBirdK);
  if (stake <= 0) return { weight, payout: 0, multiple: 0 };
  const pool = existing.reduce((s, p) => s + p.stake, 0) + stake;
  const net = pool - Math.floor((pool * cfg.feeBps) / 10_000);
  const winnersWeighted =
    existing
      .filter((p) => p.bucket === bucket)
      .reduce((s, p) => s + p.stake * weightFor(p.placedAt, tOpen, tClose, cfg.earlyBirdK), 0) +
    stake * weight;
  const payout = Math.floor((net * stake * weight) / winnersWeighted);
  return { weight, payout, multiple: payout / stake };
}

function refundAll(accepted                               , reason            )             {
  return {
    pool: accepted.reduce((s, p) => s + p.accepted, 0),
    fee: 0,
    netPool: 0,
    dust: 0,
    voidReason: reason,
    payouts: accepted.map((p) => ({
      predictionId: p.id,
      userId: p.userId,
      bucket: p.bucket,
      accepted: p.accepted,
      refund: p.refund + p.accepted,
      payout: 0,
      weight: p.weight,
    })),
  };
}

function computePayouts(
  accepted                               ,
  winning        ,
  cfg                              ,
)             {
  const live = accepted.filter((p) => p.accepted > 0);
  const pool = live.reduce((s, p) => s + p.accepted, 0);
  if (pool === 0) return refundAll(accepted, 'empty_pool');

  const bucketsUsed = new Set(live.map((p) => p.bucket));
  if (bucketsUsed.size < 2) return refundAll(accepted, 'one_sided_pool');

  const winners = live.filter((p) => p.bucket === winning);
  if (winners.length === 0) return refundAll(accepted, 'no_winners');

  const fee = Math.floor((pool * cfg.feeBps) / 10_000);
  const netPool = pool - fee;
  const totalWeighted = winners.reduce((s, p) => s + p.accepted * p.weight, 0);

  let paid = 0;
  const payouts           = accepted.map((p) => {
    const won = p.accepted > 0 && p.bucket === winning;
    const payout = won ? Math.floor((netPool * p.accepted * p.weight) / totalWeighted) : 0;
    paid += payout;
    return {
      predictionId: p.id,
      userId: p.userId,
      bucket: p.bucket,
      accepted: p.accepted,
      refund: p.refund,
      payout,
      weight: p.weight,
    };
  });

  return { pool, fee, netPool, dust: netPool - paid, payouts, voidReason: null };
}

// ---------------------------------------------------------------------------
// Settlement
// ---------------------------------------------------------------------------

function windows(cfg              , listingAt        ) {
  const settleAt = listingAt + cfg.durationMs;
  return {
    baseline: { start: listingAt, end: listingAt + cfg.baselineMs },
    final: { start: settleAt - cfg.settleWindowMs, end: settleAt },
    closeAt: listingAt + cfg.baselineMs,
    settleAt,
  };
}

function windowOk(stats               , cfg              )          {
  const good = stats.filter((s) => s.twap !== null && s.coverage >= cfg.minCoverage);
  if (good.length === 0) return false;
  const reported = good.filter((s) => s.trades !== null);
  if (reported.length === 0) return true;
  return reported.reduce((n, s) => n + (s.trades ?? 0), 0) >= cfg.minTrades;
}

function settleMarket(input                 )                   {
  const { cfg } = input;
  const w = windows(cfg, input.listingAt);
  const venues = Object.keys(input.candles);

  const baseStats                = venues.map((v) => ({ venue: v, ...twap(input.candles[v], w.baseline.start, w.baseline.end) }));
  const finalStats                = venues.map((v) => ({ venue: v, ...twap(input.candles[v], w.final.start, w.final.end) }));

  const pick = (stats               ) =>
    venueMedian(stats.filter((s) => s.coverage >= cfg.minCoverage).map((s) => ({ venue: s.venue, price: s.twap, volume: s.volume })));

  const basePrice = pick(baseStats);
  const finalPrice = pick(finalStats);

  const shell = {
    baseline: { ...w.baseline, price: basePrice, venues: baseStats },
    final: { ...w.final, price: finalPrice, venues: finalStats },
  };

  const voided = (reason            )                   => ({
    ...refundAll(input.accepted, reason),
    ...shell,
    returnPct: null,
    winningBucket: null,
  });

  if (input.retracted) return voided('retracted');
  if (input.listingAt - input.announcedListingAt > cfg.maxListingDelayMs) return voided('listing_delayed');
  if (input.haltedMs > cfg.maxHaltMs) return voided('trading_halted');
  if (basePrice === null || !windowOk(baseStats, cfg)) return voided('insufficient_baseline_data');
  if (finalPrice === null || !windowOk(finalStats, cfg)) return voided('insufficient_settlement_data');

  const r = returnPct(basePrice, finalPrice);
  const winning = bucketForReturn(r, cfg.thresholds);
  const pool = computePayouts(input.accepted, winning, cfg);

  return {
    ...pool,
    ...shell,
    // The measured outcome stays visible even if the pool itself is refunded.
    returnPct: r,
    winningBucket: winning,
  };
}

/**
 * Sums up a player's predictions market by market. A market counts as won when any of the
 * player's predictions in it paid out. Cancelled (void) markets are refunded and count as
 * neither a win nor a loss.
 */
function summarizeRecord(rows                      )               {
  const byMarket = new Map                     ();
  for (const r of rows) byMarket.set(r.marketId, [...(byMarket.get(r.marketId) ?? []), r]);

  const byOutcome = Object.fromEntries(BUCKETS.map((b) => [b, { picks: 0, wins: 0 }]))                                                   ;
  const settled                                     = [];
  const open = { markets: 0, staked: 0 };
  let refundedMarkets = 0;

  for (const [marketId, preds] of byMarket) {
    const first = preds[0];
    if (first.status === 'void') {
      refundedMarkets++;
      continue;
    }
    if (first.status !== 'resolved') {
      open.markets++;
      open.staked += preds.reduce((s, p) => s + (p.accepted ?? p.stake), 0);
      continue;
    }
    const inPool = preds.filter((p) => (p.accepted ?? 0) > 0);
    if (!inPool.length) continue; // every stake was refunded by a pool limit
    const staked = inPool.reduce((s, p) => s + (p.accepted ?? 0), 0);
    const payout = inPool.reduce((s, p) => s + (p.payout ?? 0), 0);
    for (const p of inPool) {
      byOutcome[p.bucket].picks++;
      if ((p.payout ?? 0) > 0) byOutcome[p.bucket].wins++;
    }
    settled.push({
      marketId,
      symbol: first.symbol,
      settledAt: first.settledAt ?? 0,
      buckets: [...new Set(inPool.map((p) => p.bucket))],
      winningBucket: first.winningBucket,
      staked,
      payout,
      profit: payout - staked,
      won: payout > 0,
    });
  }

  settled.sort((a, b) => a.settledAt - b.settledAt || a.marketId.localeCompare(b.marketId));
  let cumulative = 0;
  let streak = 0;
  let bestStreak = 0;
  const history = settled.map((m) => {
    cumulative += m.profit;
    streak = m.won ? streak + 1 : 0;
    bestStreak = Math.max(bestStreak, streak);
    return { ...m, cumulative };
  });

  const wins = history.filter((m) => m.won).length;
  const best = history.filter((m) => m.won).sort((a, b) => b.profit - a.profit)[0];
  return {
    marketsPlayed: byMarket.size,
    settled: history.length,
    wins,
    losses: history.length - wins,
    winRate: history.length ? wins / history.length : null,
    totalStaked: history.reduce((s, m) => s + m.staked, 0),
    totalWon: history.reduce((s, m) => s + m.payout, 0),
    netProfit: cumulative,
    bestWin: best ? { marketId: best.marketId, symbol: best.symbol, profit: best.profit, payout: best.payout } : null,
    currentStreak: streak,
    bestStreak,
    open,
    refundedMarkets,
    byOutcome,
    history: history.reverse(),
  };
}

class ApiError extends Error {
  constructor(status, code, message) {
    super(message);
    this.status = status;
    this.code = code;
  }
}

/**
 * Free hosting puts the server to sleep when nobody visits, and the first request after that fails with a
 * gateway error until it has started (up to about a minute). Reads are retried while that happens, and the
 * page is told so it can say so instead of showing an error. Writes are never retried: they aren't safe to repeat.
 */
const wake = { onWaking: () => {}, onAwake: () => {} };
const WAKE_RETRIES = 16;
const WAKE_WAIT_MS = 4_000;
const GATEWAY = new Set([502, 503, 504, 520, 521, 522, 523, 524]);

function createApi(baseUrl = '') {
  async function request(path, init = {}) {
    const canRetry = !init.method || init.method === 'GET';
    let waking = false;
    for (let attempt = 0; ; attempt++) {
      let res;
      try {
        res = await fetch(baseUrl + path, {
          ...init,
          credentials: 'same-origin',
          headers: { 'content-type': 'application/json' },
        });
      } catch {
        if (canRetry && attempt < WAKE_RETRIES) {
          waking = true;
          wake.onWaking();
          await new Promise((r) => setTimeout(r, WAKE_WAIT_MS));
          continue;
        }
        if (waking) wake.onAwake();
        throw new ApiError(0, 'offline', 'Can’t reach Firstprint. Check your connection and try again.');
      }
      if (GATEWAY.has(res.status) && canRetry && attempt < WAKE_RETRIES) {
        waking = true;
        wake.onWaking();
        await new Promise((r) => setTimeout(r, WAKE_WAIT_MS));
        continue;
      }
      if (waking) wake.onAwake();
      return finish(res);
    }
  }

  async function finish(res) {
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new ApiError(res.status, data.error ?? 'error', data.message ?? 'Request failed.');
    return data;
  }
  const post = (path, body) => request(path, { method: 'POST', body: JSON.stringify(body ?? {}) });
  const id = (s) => encodeURIComponent(s);

  return {
    demo: false,
    config: () => request('/api/config'),
    me: () => request('/api/me'),
    login: (body) => post('/api/auth/login', body),
    logout: () => post('/api/auth/logout'),
    claimDaily: () => post('/api/me/claim-daily'),
    myPredictions: () => request('/api/me/predictions'),
    ledger: () => request('/api/me/ledger'),
    stats: () => request('/api/me/stats'),
    markets: (filter) => request(`/api/markets?filter=${filter}`),
    market: (m) => request(`/api/markets/${id(m)}`),
    quote: (m, bucket, stake) => request(`/api/markets/${id(m)}/quote?bucket=${bucket}&stake=${stake}`),
    predict: (m, bucket, stake) => post(`/api/markets/${id(m)}/predictions`, { bucket, stake }),
    chart: (m) => request(`/api/markets/${id(m)}/chart`),
    activity: (m) => request(`/api/markets/${id(m)}/activity`),
    leaderboard: () => request('/api/leaderboard'),
    emailStart: (email) => post('/api/auth/email/start', { email }),
    emailVerify: (email, code) => post('/api/auth/email/verify', { email, code, ref: referralCode() }),
    googleSignIn: (credential) => post('/api/auth/google', { credential, ref: referralCode() }),
    walletChallenge: (address) => request(`/api/auth/wallet/challenge?address=${encodeURIComponent(address)}`),
    walletVerify: (body) => post('/api/auth/wallet/verify', { ...body, ref: referralCode() }),
    rewards: () => request('/api/me/rewards'),
    connectX: (username) => post('/api/me/x', { username }),
    startTask: (t) => post(`/api/tasks/${id(t)}/start`),
    verifyTask: (t) => post(`/api/tasks/${id(t)}/verify`),
    startClaim: (wallet) => post('/api/me/claims', { wallet }),
    submitClaim: (c, transaction) => post(`/api/me/claims/${id(c)}/submit`, { transaction }),
    claimStatus: (c) => request(`/api/me/claims/${id(c)}`),
    linkWallet: (body) => post('/api/me/wallets', body),
    setUsername: (username) => post('/api/me/profile', { username }),
    detectedListings: () => request('/api/listings/detected'),
    /** Live updates over Server-Sent Events. Returns an unsubscribe function. */
    subscribe(onEvent, onStatus = () => {}) {
      if (typeof EventSource === 'undefined') return () => {};
      const es = new EventSource(`${baseUrl}/api/stream`);
      for (const type of ['price', 'market', 'listing']) {
        es.addEventListener(type, (e) => {
          try {
            onEvent(type, JSON.parse(e.data));
          } catch {
            /* ignore malformed events */
          }
        });
      }
      es.onopen = () => onStatus(true);
      es.onerror = () => onStatus(false);
      return () => es.close();
    },
  };
}

// Solflare, Backpack, and others) with a fallback to legacy injected providers.

const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';

function b58encode(bytes) {
  let zeros = 0;
  while (zeros < bytes.length && bytes[zeros] === 0) zeros++;
  const digits = [];
  for (let i = zeros; i < bytes.length; i++) {
    let carry = bytes[i];
    for (let j = 0; j < digits.length; j++) {
      carry += digits[j] << 8;
      digits[j] = carry % 58;
      carry = (carry / 58) | 0;
    }
    while (carry) {
      digits.push(carry % 58);
      carry = (carry / 58) | 0;
    }
  }
  return '1'.repeat(zeros) + digits.reverse().map((d) => B58[d]).join('');
}

const shortAddress = (a) => (a ? `${a.slice(0, 4)}…${a.slice(-4)}` : '');

const standardWallets = new Map();
const walletListeners = new Set();

function isSolanaStandard(w) {
  return Boolean(
    w?.features?.['standard:connect'] &&
      w?.features?.['solana:signMessage'] &&
      (w.chains ?? []).some((c) => String(c).startsWith('solana:')),
  );
}

(function discover() {
  const api = {
    register(...wallets) {
      for (const w of wallets) if (isSolanaStandard(w)) standardWallets.set(w.name, w);
      walletListeners.forEach((fn) => fn());
      return () => wallets.forEach((w) => standardWallets.delete(w.name));
    },
  };
  window.addEventListener('wallet-standard:register-wallet', (e) => {
    try {
      e.detail(api);
    } catch {
      /* ignore misbehaving wallets */
    }
  });
  try {
    window.dispatchEvent(new CustomEvent('wallet-standard:app-ready', { detail: api }));
  } catch {
    /* old browsers */
  }
})();

function onWalletsChanged(fn) {
  walletListeners.add(fn);
  return () => walletListeners.delete(fn);
}

/** Wallets available in this browser. */
function listWallets() {
  const out = [...standardWallets.values()].map((w) => ({
    kind: 'standard',
    name: w.name,
    icon: typeof w.icon === 'string' && w.icon.startsWith('data:image/') ? w.icon : null,
    wallet: w,
  }));
  const legacy = [
    ['Phantom', window.phantom?.solana?.isPhantom ? window.phantom.solana : null],
    ['Solflare', window.solflare?.isSolflare ? window.solflare : null],
    ['Backpack', window.backpack?.isBackpack ? window.backpack : null],
  ];
  for (const [name, provider] of legacy) {
    if (provider && !out.some((w) => w.name.toLowerCase().includes(name.toLowerCase()))) {
      out.push({ kind: 'legacy', name, icon: null, provider });
    }
  }
  return out;
}

/**
 * Connects a wallet and signs the server's sign-in message.
 * getMessage(address) must return the exact text to sign.
 */
async function connectAndSign(entry, getMessage) {
  const encoder = new TextEncoder();
  if (entry.kind === 'standard') {
    const { accounts } = await entry.wallet.features['standard:connect'].connect();
    const account = accounts?.[0];
    if (!account) throw new Error('No account was shared by the wallet.');
    const message = await getMessage(account.address);
    const [signed] = await entry.wallet.features['solana:signMessage'].signMessage({ account, message: encoder.encode(message) });
    return { address: account.address, message, signature: b58encode(signed.signature), walletName: entry.name };
  }
  const provider = entry.provider;
  const res = await provider.connect();
  const address = (res?.publicKey ?? provider.publicKey).toString();
  const message = await getMessage(address);
  const signed = await provider.signMessage(encoder.encode(message), 'utf8');
  return { address, message, signature: b58encode(signed.signature ?? signed), walletName: entry.name };
}

const fromBase64 = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
const toBase64 = (bytes) => {
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
};

/**
 * Has the wallet holding `address` sign a transaction Firstprint prepared (base64), and returns
 * it signed (base64). Firstprint checks and sends it. Tries the wallet the player linked first.
 */
async function signTransactionWith(address, transactionBase64, cluster, walletName) {
  const transaction = fromBase64(transactionBase64);
  const chain = `solana:${cluster}`;
  const wallets = [...standardWallets.values()].filter((w) => w.features['solana:signTransaction']);
  if (!wallets.length) throw new Error('Open this page in a browser with Phantom, Solflare or Backpack installed.');
  wallets.sort((a, b) => Number(b.name === walletName) - Number(a.name === walletName));
  for (const [i, w] of wallets.entries()) {
    let account = (w.accounts ?? []).find((a) => a.address === address);
    if (!account) {
      try {
        // Ask quietly first; only the preferred wallet may show a connect prompt.
        const { accounts } = await w.features['standard:connect'].connect(i === 0 ? undefined : { silent: true });
        account = (accounts ?? []).find((a) => a.address === address);
      } catch (err) {
        if (i === 0 && (err?.code === 4001 || /reject|denied|cancel/i.test(err?.message ?? ''))) throw err;
      }
    }
    if (!account) continue;
    const [out] = await w.features['solana:signTransaction'].signTransaction({ account, transaction, chain });
    return toBase64(out.signedTransaction);
  }
  throw new Error(`Switch your wallet to the account ${shortAddress(address)} (the one linked to Firstprint), then try again.`);
}

async function disconnectWallets() {
  for (const w of standardWallets.values()) {
    try {
      await w.features['standard:disconnect']?.disconnect();
    } catch {
      /* ignore */
    }
  }
  for (const p of [window.phantom?.solana, window.solflare, window.backpack]) {
    try {
      await p?.disconnect?.();
    } catch {
      /* ignore */
    }
  }
}

function demoHash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return ((h >>> 0) % 1_000_000) / 1_000_000;
}

function demoPrice(m, ts) {
  const p = m.profile;
  const f = Math.max(0, (ts - m.listingAt) / m.cfg.durationMs);
  const trend = p.startPrice * Math.pow(1 + p.target, Math.min(f, 1.2));
  const noise = (demoHash(`${m.symbol}:${ts}`) - 0.5) * 2 * p.noise;
  return Math.max(1e-9, trend * (1 + noise));
}

      const lastBetAt = Math.min(now, closeAt - 1_000);
      for (let i = 0; i < d.bots; i++) {
        const bot = bots[(i + d.symbol.length) % bots.length];
        const bucket = d.oneSided ?? BUCKETS[Math.floor(demoHash(`${d.symbol}:b:${i}`) * 5)];
        const stake = [25, 50, 100, 150, 250, 400][Math.floor(demoHash(`${d.symbol}:s:${i}`) * 6)];
        const placedAt = openedAt + (lastBetAt - openedAt) * demoHash(`${d.symbol}:t:${i}`) * 0.95;
        this.addPrediction(m, bot.id, bucket, stake, placedAt);
      }
      if (d.mine) this.addPrediction(m, me.id, d.mine.bucket, d.mine.stake, Math.min(lastBetAt, listingAt - d.mine.before * D3_MIN));
      this.marketList.push(m);
    }
    this.advance();
  }

  // --- Internals ---------------------------------------------------------------

  now() {
    return Date.now() + this.offset;
  }

  addUser(username, points) {
    const u = { id: `u${++this.seq}`, username, points, lastClaimDay: null, needsUsername: false, hasEmail: true, wallets: [] };
    this.users.set(u.id, u);
    return u;
  }

  addPrediction(m, userId, bucket, stake, placedAt) {
    const u = this.users.get(userId);
    u.points -= stake;
    const p = { id: `p${++this.seq}`, userId, bucket, stake, placedAt, accepted: null, refund: null, weight: null, payout: null };
    m.predictions.push(p);
    return p;
  }

  /** Completed 1-minute candles aligned to the listing time, within [start, end). */
  candles(m, start, end) {
    const out = [];
    const now = this.now();
    const k0 = Math.max(0, Math.ceil((start - m.listingAt) / D3_MIN));
    for (let ts = m.listingAt + k0 * D3_MIN; ts < end && ts + D3_MIN <= now; ts += D3_MIN) {
      out.push({ ts, close: demoPrice(m, ts), volume: m.profile.volume, trades: 12 });
    }
    return out;
  }

  advance() {
    const now = this.now();
    for (const m of this.marketList) {
      const w = windows(m.cfg, m.listingAt);
      if (m.status === 'open' && now >= w.closeAt) {
        const accepted = applyCaps(m.predictions, m.cfg.softCap, m.cfg, m.openedAt, w.closeAt);
        for (const a of accepted) {
          const p = m.predictions.find((x) => x.id === a.id);
          Object.assign(p, { accepted: a.accepted, refund: a.refund, weight: a.weight });
          this.users.get(p.userId).points += a.refund;
        }
        m.status = 'locked';
      }
      if (m.status === 'locked' && now >= w.settleAt) {
        const candles = [...this.candles(m, w.baseline.start, w.baseline.end), ...this.candles(m, w.final.start, w.final.end)];
        const result = settleMarket({
          cfg: m.cfg,
          announcedListingAt: m.announcedListingAt,
          listingAt: m.listingAt,
          openedAt: m.openedAt,
          retracted: false,
          haltedMs: 0,
          candles: { sim: candles },
          accepted: m.predictions.map((p) => ({ ...p })),
        });
        for (const r of result.payouts) {
          const p = m.predictions.find((x) => x.id === r.predictionId);
          const u = this.users.get(p.userId);
          u.points += r.refund - (p.refund ?? 0) + r.payout;
          p.refund = r.refund;
          p.payout = r.payout;
        }
        m.result = result;
        m.settledAt = now;
        m.status = result.voidReason ? 'void' : 'resolved';
      }
    }
  }

  me_() {
    const u = this.sessionUserId && this.users.get(this.sessionUserId);
    if (!u) throw new ApiError(401, 'auth_required', 'Log in to continue.');
    return u;
  }

  publicUser(u) {
    const today = new Date(this.now()).toISOString().slice(0, 10);
    return {
      id: u.id,
      username: u.username,
      needsUsername: u.needsUsername,
      hasEmail: u.hasEmail,
      wallets: u.wallets,
      points: u.points,
      canClaimDaily: u.lastClaimDay !== today,
    };
  }

  demoDetections(now) {
    const H = 60 * D3_MIN;
    const rows = [
      ['binance', 'Binance', 'LUMA', 'Binance Will List Luma Compute (LUMA) with Seed Tag Applied', 5 * H + 12 * D3_MIN, 'luma-binance', -3 * H],
      ['bitget', 'Bitget', 'FERRO', 'Bitget Will List Ferro Pay (FERRO) in the Innovation Zone', 26 * H, 'ferro-bitget', -9 * H],
      ['bybit', 'Bybit', 'ARCO', 'New Listing: ARCO/USDT — Grab a Share of 400,000 ARCO', 30 * H, null, -40 * D3_MIN],
      ['okx', 'OKX', 'TIDE', 'OKX to list Tide Protocol (TIDE) for spot trading', 44 * H, null, -2 * H],
      ['kucoin', 'KuCoin', 'MOSS', 'Moss Network (MOSS) Gets Listed on KuCoin!', 52 * H, null, -5 * H],
      ['gate', 'Gate', 'QUILL', 'QUILL/USDT pair added on Gate', 3 * H, null, -20 * D3_MIN],
      ['mexc', 'MEXC', 'KORA', 'KORA/USDT pair added on MEXC', 3 * D3_MIN, 'kora-mexc', -30 * D3_MIN],
    ];
    return rows.map(([exchange, exchangeName, symbol, title, inMs, marketId, ago], i) => ({
      id: i + 1,
      exchange,
      exchangeName,
      symbol,
      pair: `${symbol}USDT`,
      source: title.includes('pair added') ? 'symbol_diff' : 'announcement',
      title,
      url: title.includes('pair added') ? null : `https://example.com/announcements/${symbol.toLowerCase()}`,
      listingAt: now + inMs,
      publishedAt: now + ago,
      detectedAt: now + ago,
      status: marketId ? 'approved' : 'pending',
      marketId,
    }));
  }

  find(id) {
    const m = this.marketList.find((x) => x.id === id);
    if (!m) throw new ApiError(404, 'market_not_found', 'Market not found.');
    return m;
  }

  view(m) {
    const now = this.now();
    const w = windows(m.cfg, m.listingAt);
    const afterClose = m.status !== 'open';
    const totals = emptyTotals();
    const users = new Set();
    for (const p of m.predictions) {
      totals[p.bucket] += afterClose ? (p.accepted ?? 0) : p.stake;
      users.add(p.userId);
    }
    const pool = Object.values(totals).reduce((s, n) => s + n, 0);
    const phase = m.status === 'open' ? (now < m.listingAt ? 'pre_listing' : 'baseline') : m.status === 'locked' ? 'running' : m.status;

    let live = null;
    if ((m.status === 'open' || m.status === 'locked') && now >= m.listingAt + D3_MIN) {
      const baseEnd = Math.min(w.baseline.end, now);
      const base = twap(this.candles(m, w.baseline.start, baseEnd), w.baseline.start, baseEnd).twap;
      const lastTs = now - D3_MIN;
      const last = venueMedian([{ venue: 'sim', price: demoPrice(m, lastTs), volume: 1 }]);
      const r = base && last ? returnPct(base, last) : null;
      live = { basePrice: base, lastPrice: last, returnPct: r, projectedBucket: r === null ? null : bucketForReturn(r, m.cfg.thresholds), provisional: m.status === 'open' };
    }

    const result = m.result
      ? {
          winningBucket: m.result.winningBucket,
          returnPct: m.result.returnPct,
          voidReason: m.result.voidReason,
          basePrice: m.result.baseline.price,
          finalPrice: m.result.final.price,
          pool: m.result.pool,
          fee: m.result.fee,
        }
      : null;

    const mine = m.predictions
      .filter((p) => p.userId === this.sessionUserId)
      .map((p) => ({ id: p.id, bucket: p.bucket, stake: p.stake, accepted: p.accepted, refund: p.refund, payout: p.payout, weight: p.weight, placedAt: p.placedAt }));

    return {
      id: m.id,
      symbol: m.symbol,
      name: m.name,
      exchange: m.exchange,
      sourceUrl: null,
      status: m.status,
      phase,
      announcedListingAt: m.announcedListingAt,
      listingAt: m.listingAt,
      openedAt: m.openedAt,
      closeAt: w.closeAt,
      settleAt: w.settleAt,
      thresholds: m.cfg.thresholds,
      feeBps: m.cfg.feeBps,
      earlyBirdK: m.cfg.earlyBirdK,
      softCap: m.cfg.softCap,
      userCap: Math.floor(m.cfg.softCap * m.cfg.perUserCapPct),
      minStake: 10,
      pool,
      totals,
      predictors: users.size,
      live,
      result,
      scorecard: m.scorecard,
      mine,
      serverTime: now,
    };
  }

  async run(fn) {
    await new Promise((r) => setTimeout(r, 60)); // feel like a network call
    this.advance();
    return structuredClone(fn());
  }

  // --- Public API (matches createApi) ----------------------------------------------

  config() {
    return this.run(() => ({ minStake: 10, dailyPoints: 100, demo: true, manualOnly: false, signIn: { google: null, email: true } }));
  }

  me() {
    return this.run(() => this.publicUser(this.me_()));
  }

  signup({ email, username, password }) {
    return this.run(() => {
      email = String(email ?? '').trim().toLowerCase();
      username = String(username ?? '').trim();
      if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) throw new ApiError(400, 'bad_username', 'Username must be 3–20 letters, numbers, or underscores.');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new ApiError(400, 'bad_email', 'Enter a valid email address.');
      if (String(password ?? '').length < 8) throw new ApiError(400, 'bad_password', 'Password must be at least 8 characters.');
      if (this.accounts.has(email)) throw new ApiError(409, 'email_taken', 'An account with this email already exists. Log in instead.');
      if ([...this.users.values()].some((u) => u.username.toLowerCase() === username.toLowerCase())) {
        throw new ApiError(409, 'username_taken', 'That username is taken. Try another.');
      }
      const u = this.addUser(username, 1_000);
      this.accounts.set(email, { userId: u.id, password });
      this.sessionUserId = u.id;
      return { user: this.publicUser(u) };
    });
  }

  /** Practice mode has no mail server: the code is always shown on screen. */
  emailStart(email) {
    return this.run(() => {
      email = String(email ?? '').trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new ApiError(400, 'bad_email', 'Enter a valid email address.');
      return { ok: true, devCode: '123456' };
    });
  }

  emailVerify(email, code) {
    return this.run(() => {
      email = String(email ?? '').trim().toLowerCase();
      if (String(code ?? '').trim() !== '123456') throw new ApiError(401, 'bad_code', 'That code is wrong. In practice mode it is 123456.');
      let acc = this.accounts.get(email);
      const created = !acc;
      if (!acc) {
        const base = (email.split('@')[0].replace(/[^A-Za-z0-9_]+/g, '_').slice(0, 16) || 'player').padEnd(3, '_');
        let username = base;
        for (let i = 2; [...this.users.values()].some((u) => u.username.toLowerCase() === username.toLowerCase()); i++) username = `${base}${i}`;
        const u = this.addUser(username, 1_000);
        acc = { userId: u.id, password: null };
        this.accounts.set(email, acc);
      }
      this.sessionUserId = acc.userId;
      return { user: this.publicUser(this.users.get(acc.userId)), created };
    });
  }

  login({ email, password }) {
    return this.run(() => {
      const acc = this.accounts.get(String(email ?? '').trim().toLowerCase());
      if (!acc || acc.password !== password) throw new ApiError(401, 'bad_credentials', 'Email or password is incorrect.');
      this.sessionUserId = acc.userId;
      return { user: this.publicUser(this.users.get(acc.userId)) };
    });
  }

  logout() {
    return this.run(() => {
      this.sessionUserId = null;
      return { ok: true };
    });

  startTask(taskId) {
    return this.run(() => {
      const u = this.me_();
      u.tasks ??= {};
      u.tasks[taskId] ??= { startedAt: Date.now(), done: false };
      return { ok: true };
    });

  verifyTask(taskId) {
    return this.run(() => {
      const u = this.me_();
      const t = DEMO_TASKS.find((x) => x.id === taskId);
      const mine = u.tasks?.[taskId];
      if (!t) throw new ApiError(404, 'task_not_found', 'This task is no longer available.');
      if (t.kind !== 'link' && !u.xUsername) throw new ApiError(409, 'x_required', 'Link your X username first, so we know which account did it.');
      if (!mine) throw new ApiError(409, 'task_not_started', 'Open the task first, then come back to confirm it.');
      if (mine.done) throw new ApiError(409, 'task_done', 'You already completed this task.');
      if (Date.now() - mine.startedAt < 8_000) throw new ApiError(429, 'task_too_fast', 'Give it a few seconds: finish the task on X, then confirm.');
      mine.done = true;
      u.points += t.points;
      return { points: t.points, onChain: false };

  startClaim() {
    return this.run(() => {
      throw new ApiError(409, 'token_off', 'In practice mode points go straight to your balance. TestFPT claims are in the full app.');
    });
