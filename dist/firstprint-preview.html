  transition: background 120ms, color 120ms;
}
.admin-nav button:hover {
  color: var(--text);
  background: color-mix(in srgb, var(--raised) 60%, transparent);
}
.admin-nav button[aria-current='page'] {
  color: var(--text);
  background: var(--raised);
  box-shadow: inset 0 0 0 1px var(--line-strong);
}
.admin-nav button[aria-current='page'] .i {
  color: var(--brand);
}
.admin-nav .i {
  width: 17px;
  height: 17px;
}
.nav-badge {
  margin-left: auto;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  display: grid;
  place-items: center;
  border-radius: 999px;
  background: var(--crash);
  color: #fff;
  font-size: 11.5px;
  font-weight: 600;
}
.admin-lock {
  width: 100%;
}
.admin-top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.admin-top .page-title {
  margin: 4px 0 2px;
}
.admin-top p {
  margin: 0;
}
.admin-status {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--muted);
}
.status-chip .i {
  width: 14px;
  height: 14px;
}
.status-chip.ok {
  color: var(--up);
  border-color: color-mix(in srgb, var(--up) 35%, var(--line));
}
.status-chip.bad {
  color: var(--moon);
  border-color: color-mix(in srgb, var(--moon) 40%, var(--line));
}
.todo {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}
.todo li {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
}
.todo li > div {
  display: grid;
  min-width: 0;
}
.todo .muted {
  font-size: 13px;
}
.all-good {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--up);
  font-weight: 600;
  margin: 0;
}
.timeline-list {
  list-style: none;
  margin: 0;
  padding: 0;
}
.timeline-list li {
  position: relative;
  display: grid;
  grid-template-columns: 14px minmax(0, 1fr) auto;
  gap: 12px;
  padding: 0 0 16px;
  font-size: 14px;
}
.timeline-list li::before {
  content: '';
  position: absolute;
  left: 6px;
  top: 14px;
  bottom: 0;
  width: 2px;
  background: var(--line);
}
.timeline-list li:last-child {
  padding-bottom: 0;
}
.timeline-list li:last-child::before {
  display: none;
}
.tl-dot {
  width: 14px;
  height: 14px;
  margin-top: 3px;
  border-radius: 50%;
  border: 3px solid var(--surface);
  background: var(--brand);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--brand) 50%, transparent);
}
.timeline-list .muted {
  font-size: 13px;
  white-space: nowrap;
}
.timeline-list div .muted {
  white-space: normal;
}
.toggle-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 10px;
}
.toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
  font-weight: 600;
  cursor: pointer;
}
.toggle input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}
.toggle-ui {
  position: relative;
  width: 34px;
  height: 20px;
  flex: none;
  border-radius: 999px;
  background: var(--line-strong);
  transition: background 140ms;
}
.toggle-ui::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  transition: transform 140ms;
}
.toggle input:checked + .toggle-ui {
  background: var(--up);
}
.toggle input:checked + .toggle-ui::after {
  transform: translateX(14px);
}
.toggle input:focus-visible + .toggle-ui {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
.backup-line {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  color: var(--muted);
}
.backup-line.ok .i {
  color: var(--up);
}
.backup-line.bad {
  color: var(--crash);
}
.kv {
  display: grid;
  gap: 6px;
}
.progress-cell {
  display: grid;
  gap: 2px;
  min-width: 90px;
  font-weight: 600;
}
.progress-cell .meter {
  margin-top: 4px;
  height: 5px;
}
.admin-main .admin-form label:not(.check) {
  display: grid;
  gap: 0;
  min-width: 0;
}
.admin-main .admin-form input {
  min-width: 0;
}
.admin-form details > summary {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin: 0;
  padding: 6px 12px;
  border: 1px dashed var(--line-strong);
  border-radius: 999px;
}
.admin-form details > summary::before {
  content: '+';
  font-weight: 600;
}
.admin-form details[open] > summary::before {
  content: '−';
}
.admin-main .admin-grid {
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 14px;
}
.task-form {
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  margin: 0;
}
.venues {
  gap: 8px;
}
.venues .check {
  padding: 7px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  font-weight: 600;
  cursor: pointer;
}
.venues .check:has(input:checked) {
  border-color: color-mix(in srgb, var(--brand) 55%, var(--line));
  background: color-mix(in srgb, var(--brand) 10%, var(--surface));
}
.admin-form details summary {
  cursor: pointer;
}
.admin-row-actions {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
  flex-wrap: wrap;
}
.admin-row-actions .btn {
  margin-left: 0;
}
.admin-detect {
  border-radius: var(--r-md);
  background: var(--surface);
  padding: 16px;
}
.admin-result + .admin-result {
  margin-top: 12px;
}
.save-keys {
  border-radius: var(--r-md);
  padding: 14px 16px;
}
.save-keys b {
  display: flex;
  align-items: center;
  gap: 8px;
}
.save-keys b .i {
  color: var(--moon);
}
.admin-main .steplist li {
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
}

/* ------------------------------------------------------------- Responsive */



@media (max-width: 900px) {
  .featured {
    padding: 22px 20px;
  }
  .admin-shell {
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .admin-side {
    position: static;
    grid-template-columns: 1fr auto;
    align-items: center;
    padding: 10px;
  }
  .admin-nav {
    grid-column: 1 / -1;
    grid-row: 2;
    display: flex;
    overflow-x: auto;
    scrollbar-width: none;
    gap: 4px;
  }
  .admin-nav button {
    width: auto;
    white-space: nowrap;
    padding: 8px 12px;
  }
  .admin-lock {
    width: auto;
  }
}

@media (max-width: 640px) {
  .hide-sm,
  .chip .hide-sm {
    display: none;
  }
  .chip {
    height: 34px;
    padding: 0 10px;
  }
  .chip-faucet {
    padding: 0 9px;
  }
  .wallet-chip {
    display: none;
  }
  .points .unit {
    display: none;
  }
  .featured {
    border-radius: 22px;
    padding: 20px 16px;
  }
  .hero-token {
    gap: 12px;
  }
  .hero-token .avatar-xl {
    --size: 52px;
  }
  .hero-facts {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    width: 100%;
    gap: 8px;
  }
  .hero-facts > div {
    grid-template-columns: 1fr;
    padding: 8px 10px;
  }
  .hero-facts .i {
    grid-row: auto;
    margin-bottom: 4px;
  }
  .hero-facts dd {
    font-size: 15px;
  }
  .featured .actions {
    width: 100%;
  }
  .featured .actions .btn {
    flex: 1;
  }
  .mini-ladder {
    padding: 10px;
  }
  .mini-rung {
    grid-template-columns: 82px 1fr auto;
    padding: 8px 10px;
    font-size: 13px;
  }
  .tabs {
    width: 100%;
  }
  .tabs button {
    flex: 1;
    padding: 7px 6px;
    font-size: 13px;
  }
  .toolbar .select {
    margin-left: auto;
  }
  .panel,
  .section.panel {
    padding: 16px;
    border-radius: 18px;
  }
  .panel-flush,
  .section.panel-flush {
    padding: 0;
  }
  .panel-flush > .section-head {
    padding: 16px 16px 12px;
  }
  .panel-flush .table th:first-child,
  .panel-flush .table td:first-child {
    padding-left: 16px;
  }
  .panel-flush .table th:last-child,
  .panel-flush .table td:last-child {
    padding-right: 16px;
  }
  .panel-flush .pad {
    padding: 0 16px 16px;
  }
  .table td,
  .table th {
    padding-left: 8px;
    padding-right: 8px;
  }
  .stats {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }
  .stats > div {
    padding: 10px 12px;
    column-gap: 10px;
  }
  .stats > div > .i {
    width: 28px;
    height: 28px;
    padding: 6px;
  }
  .stats dd {
    font-size: 15px;
  }
  .m-title .avatar-lg {
    --size: 44px;
  }
  .profile-card {
    padding: 18px;
    gap: 14px;
  }
  .profile-card .avatar-xl {
    --size: 54px;
  }
  .profile-actions {
    width: 100%;
  }
  .profile-actions .btn {
    flex: 1;
  }
  .stat-tiles {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .stat-tile {
    padding: 14px;
  }
  .stat-tile .tile-ico {
    width: 30px;
    height: 30px;
    margin-bottom: 8px;
  }
  .dash-grid {
    grid-template-columns: 1fr;
  }
  .earn-stats {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }
  .earn-stats > div {
    padding: 10px 12px;
    column-gap: 10px;
  }
  .earn-stats > div > .i {
    width: 28px;
    height: 28px;
    padding: 6px;
  }
  .earn-stats dd {
    font-size: 15px;
  }
  .page-head .page-ico {
    width: 42px;
    height: 42px;
    border-radius: 13px;
  }
  .page-head .page-ico .i {
    width: 21px;
    height: 21px;
  }
  .podium {
    gap: 8px;
  }
  .podium li {
    padding: 16px 8px 12px;
  }
  .podium .avatar-lg {
    --size: 40px;
  }
  .podium b {
    font-size: 14px;
  }
  .podium-profit {
    font-size: 15px;
  }
  .podium .muted {
    display: none;
  }
  .podium-medal {
    top: 8px;
    right: 8px;
  }
  .start-card {
    flex-wrap: wrap;
  }
  .start-ico {
    display: none;
  }
  .task {
    grid-template-columns: 40px 1fr;
  }
  .task-ico {
    width: 40px;
    height: 40px;
  }
  .todo li {
    grid-template-columns: auto minmax(0, 1fr);
  }
  .todo li .btn {
    grid-column: 1 / -1;
  }
  .admin-row-actions {
    justify-content: flex-start;
  }
  .card-foot {
    gap: 10px;
  }
  .tabbar {
    background: color-mix(in srgb, var(--surface) 90%, transparent);
  }
  .tabbar .i {
    width: 22px;
    height: 22px;
    stroke-width: 1.9;
  }
  .tabbar a[aria-current='page'] .i {
    color: var(--brand);
  }
}

@media (prefers-reduced-motion: reduce) {
  .card:hover,
  .rung:not(:disabled):hover {
    transform: none;
  }
}
.admin-main .stat-tiles {
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
}

/* =====================================================================
   Polymarket-style additions: search and sort tabs, Yes/No markets,
   odds history, top predictors, public profiles, leaderboard periods.
   ===================================================================== */

.search {
  position: relative;
  flex: 1 1 260px;
  max-width: 420px;
  display: flex;
  align-items: center;
}
.search > .i {
  position: absolute;
  left: 13px;
  width: 17px;
  height: 17px;
  color: var(--muted);
  pointer-events: none;
}
main .search input:not([type='checkbox']) {
  padding-left: 40px;
  border-radius: 999px;
  background: var(--surface);
}
.tabs-scroll {
  display: flex;
  width: max-content;
  max-width: 100%;
  overflow-x: auto;
  scrollbar-width: none;
  margin-bottom: 16px;
}
.tabs-scroll button,
.lb-tabs button {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
}
.tabs-scroll .i {
  width: 15px;
  height: 15px;
}
.tabs-scroll button[aria-selected='true'] .i {
  color: var(--brand);
}
.results-note {
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 14px;
}
.lb-tabs {
  display: inline-flex;
  margin: 0 0 18px;
}

.tag-yn {
  margin-left: 6px;
  vertical-align: 4px;
  font-size: 11px;
  color: var(--brand);
  background: color-mix(in srgb, var(--brand) 14%, transparent);
}
.chance-row {
  display: flex;
  gap: 8px;
}
.chance {
  flex: 1;
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding: 8px 12px;
  border-radius: 12px;
  color: var(--c);
  background: color-mix(in srgb, var(--c) 12%, transparent);
  font-weight: 600;
  font-size: 13px;
}
.chance b {
  font-family: var(--display);
  font-size: 20px;
}

.ladder-yn {
  grid-template-columns: 1fr 1fr;
}
.ladder-yn .ladder-head {
  grid-column: 1 / -1;
}
.ladder-yn .fine {
  grid-column: 1 / -1;
}
.rung-yn {
  grid-template-columns: minmax(0, 1fr) auto auto;
  padding: 18px;
}
.rung-yn .pool-col {
  display: none;
}
.rung-yn .rung-name b {
  font-size: 24px;
}
.ladder-yn .ladder-head {
  display: none;
}
.picker-yn {
  grid-template-columns: 1fr 1fr;
}
.picker-yn button {
  padding: 14px 4px 12px;
}
.picker-yn button b {
  font-size: 17px;
}

/* Odds history */
.odds-big {
  margin: -4px 0 12px;
  color: var(--c);
  font-weight: 600;
}
.odds-big b {
  font-family: var(--display);
  font-size: 28px;
  margin-right: 4px;
}
.odds-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  margin: -4px 0 12px;
  font-size: 13.5px;
}
.odds-legend span {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
}
.odds-legend i {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  background: var(--c);
}
.odds-legend b {
  color: var(--text);
  font-family: var(--display);
}
.odds-plot {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  grid-template-rows: 190px;
  gap: 10px;
}
.odds-axis {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  font-size: 11.5px;
  color: var(--muted);
  text-align: right;
}
.odds-plot svg {
  display: block;
  width: 100%;
  height: 100%;
  min-height: 0;
  overflow: visible;
}
.odds-grid {
  stroke: var(--line);
  stroke-dasharray: 3 4;
}
.odds-line {
  fill: none;
  stroke-width: 2.25;
  stroke-linejoin: round;
}
.odds-time {
  display: flex;
  justify-content: space-between;
  margin: 6px 0 0 40px;
  font-size: 12px;
}

/* Top predictors and links to profiles */
.user-link {
  color: inherit;
  text-decoration: none;
  font-weight: 600;
}
.user-link:hover {
  color: var(--brand);
  text-decoration: underline;
}
.table td a.user-link {
  font-family: var(--body);
}
.picks {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 4px 10px;
  align-items: baseline;
}
.picks .muted {
  font-size: 12px;
}
.holders .rank {
  width: 26px;
  height: 26px;
  font-size: 12.5px;
}
.podium b .user-link {
  font-family: var(--display);
}

/* Admin: market type */
.type-pick {
  border: 0;
  padding: 0;
  margin: 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 10px;
}
.type-pick legend {
  margin-bottom: 6px;
}
.type-card {
  position: relative;
  cursor: pointer;
}
.type-card input {
  position: absolute;
  opacity: 0;
}
.type-card > span {
  display: grid;
  grid-template-columns: auto 1fr;
  column-gap: 10px;
  row-gap: 2px;
  height: 100%;
  padding: 14px 16px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  background: var(--surface);
  transition: border-color 120ms, box-shadow 120ms;
}
.type-card .i {
  grid-row: span 2;
  width: 20px;
  height: 20px;
  margin-top: 2px;
  color: var(--brand);
}
.type-card small {
  color: var(--muted);
  font-size: 13px;
}
.type-card input:checked + span {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 20%, transparent);
  background: color-mix(in srgb, var(--brand) 7%, var(--surface));
}
.type-card input:focus-visible + span {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
.type-pick:disabled .type-card {
  cursor: default;
  opacity: 0.7;
}
#admin-market[data-outcomes='ladder'] .binary-only,
#admin-market[data-outcomes='binary'] .ladder-only {
  display: none;
}

@media (max-width: 640px) {
  .search {
    max-width: none;
    flex-basis: 100%;
  }
  .toolbar .select {
    margin-left: 0;
  }
  .tabs-scroll button {
    flex: none;
    padding: 7px 12px;
  }
  .ladder-yn {
    grid-template-columns: 1fr;
  }
  .odds-plot {
    grid-template-rows: 150px;
  }
  .lb-tabs {
    display: flex;
    width: 100%;
  }
  .lb-tabs button {
    flex: 1;
    justify-content: center;
    padding: 7px 4px;
  }
}

/* =====================================================================
   Every device: compact top bar, touch targets, no zoom on focus,
   notches, landscape phones and large screens.
   ===================================================================== */

html {
  -webkit-tap-highlight-color: transparent;
}
body {
  overflow-x: clip;
}
.topbar-inner,
main,
.footer,
.demo-bar-inner {
  padding-left: max(20px, env(safe-area-inset-left));
  padding-right: max(20px, env(safe-area-inset-right));
}

/* Laptops and small desktops: drop secondary labels so the top bar fits on one line. */
@media (max-width: 1180px) {
  .topbar-inner {
    gap: 18px;
  }
  .nav a .i,
  .faucet-label,
  .points .unit,
  .wallet-chip > span:not(.avatar) {
    display: none;
  }
  .wallet-chip {
    padding: 0 4px;
  }
  .chip-faucet {
    padding: 0 10px;
  }
}

/* Tablets and phones: the bottom tab bar takes over navigation. */
@media (max-width: 900px) {
  .tabbar {
    background: color-mix(in srgb, var(--surface) 90%, transparent);
  }
  .tabbar .i {
    width: 22px;
    height: 22px;
    stroke-width: 1.9;
  }
  .tabbar a[aria-current='page'] .i {
    color: var(--brand);
  }
  .account {
    margin-left: auto;
  }
  /* iPhones zoom into inputs smaller than 16px; keep them at 16px. */
  main input:not([type='checkbox']):not([type='radio']):not(#stake):not(.code-input),
  main select,
  main .select select,
  main textarea,
  .modal input:not(.code-input),
  .modal select {
    font-size: 16px;
  }
}

@media (max-width: 640px) {
  .topbar-inner,
  main,
  .footer,
  .demo-bar-inner {
    padding-left: max(14px, env(safe-area-inset-left));
    padding-right: max(14px, env(safe-area-inset-right));
  }
}

/* Small phones */
@media (max-width: 400px) {
  .topbar-inner {
    gap: 8px;
  }
  .wordmark {
    font-size: 20px;
  }
  .account {
    gap: 6px;
  }
  .gift .gift-n {
    display: none;
  }
  .gift {
    padding: 0 9px;
  }
}
@media (max-width: 350px) {
  .wordmark .word {
    display: none;
  }
  .wordmark .mark {
    width: 20px;
    margin-right: 0;
  }
  .wordmark .mark i {
    height: 4px;
  }
}

/* Touch screens: comfortable tap targets (about 40px). */
@media (pointer: coarse), (max-width: 900px) {
  .btn {
    min-height: 40px;
  }
  .btn-sm {
    min-height: 36px;
  }
  .chip {
    min-height: 36px;
  }
  .back {
    padding: 8px 0;
  }
  .wordmark {
    min-height: 40px;
  }
  .tabs button,
  .chips button {
    min-height: 38px;
  }
  .tabbar a {
    min-height: 48px;
    justify-content: center;
  }
  .admin-nav button {
    min-height: 40px;
  }
  .toggle,
  .venues .check {
    min-height: 44px;
  }
  .card:hover,
  .rung:not(:disabled):hover,
  .picker button:hover {
    transform: none;
  }
}

/* Phones held sideways: very little height. */
@media (max-height: 500px) and (orientation: landscape) {
  .topbar {
    position: static;
  }
  .trade {
    max-height: 94vh;
  }
  .modal-backdrop {
    align-items: start;
    overflow-y: auto;
  }
  .modal {
    max-height: none;
  }
  .tabbar {
    padding-top: 2px;
    padding-bottom: calc(2px + env(safe-area-inset-bottom));
  }
  .tabbar a {
    flex-direction: row;
    justify-content: center;
    gap: 6px;
    min-height: 40px;
  }
  .mobile-bar {
    bottom: calc(46px + env(safe-area-inset-bottom));
  }
  .featured {
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
  }
}

/* Large monitors: use the extra width. */
@media (min-width: 1600px) {
  :root {
    --page: 1400px;
  }
  .grid {
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  }
}

/* Market title: long symbols and the Share button share one row on small phones. */
.m-title-text {
  flex: 1;
}
.m-title .sym {
  overflow-wrap: anywhere;
}
.share-btn {
  flex: none;
}
@media (max-width: 400px) {
  .m-title {
    gap: 12px;
  }
  .m-title .sym {
    font-size: clamp(24px, 7vw, 30px);
  }
  .m-title-row {
    gap: 6px;
  }
}

@media (max-width: 900px) {
  .market-layout {
    grid-template-columns: minmax(0, 1fr);
  }
}
@media (max-width: 350px) {
  .wordmark {
    min-width: 40px;
    justify-content: center;
  }
}

/* Phones sideways: the screen is wide but short, so navigation moves back to the top bar. */
@media (max-height: 500px) and (orientation: landscape) and (min-width: 641px) {
  .nav {
    display: flex;
  }
  .nav a {
    padding: 6px 10px;
  }
  .tabbar {
    display: none;
  }
  .mobile-bar {
    bottom: 0;
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
    padding-top: 8px;
  }
  main {
    padding-bottom: 90px;
  }
  #toast {
    bottom: calc(70px + env(safe-area-inset-bottom));
  }
  .wordmark .word {
    display: none;
  }
}

/* Very small phones: tighter featured-market facts. */
@media (max-width: 360px) {
  .hero-facts {
    gap: 6px;
  }
  .hero-facts > div {
    padding: 8px;
  }
  .hero-facts .i {
    display: none;
  }
  .hero-facts dt {
    font-size: 10px;
    letter-spacing: 0.02em;
  }
  .hero-facts dd {
    font-size: 14px;
  }
  .featured h1 {
    font-size: 26px;
  }
  .hero-token .avatar-xl {
    --size: 44px;
  }
}

/* =====================================================================
   Brand: the ladder badge, gold call to action.
   ===================================================================== */

.wordmark {
  gap: 10px;
}
/* The mark is the five-bar ladder inside a rounded badge: Moon on top, Crash at the bottom. */
.wordmark .mark {
  width: 32px;
  height: 32px;
  margin-right: 0;
  border-radius: 9px;
  background: #111114;
  box-shadow: inset 0 0 0 1px #35353e;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2.5px;
  flex: none;
}
.wordmark .mark i {
  height: 3px;
  border-radius: 2px;
}
.wordmark .mark i:nth-child(1) { width: 20px; background: #ffd60a; }
.wordmark .mark i:nth-child(2) { width: 15px; background: #30d158; }
.wordmark .mark i:nth-child(3) { width: 10px; background: #8e8e93; }
.wordmark .mark i:nth-child(4) { width: 15px; background: #ff9f0a; }
.wordmark .mark i:nth-child(5) { width: 20px; background: #ff453a; }
.wordmark .word {
  font-weight: 600;
  letter-spacing: -0.022em;
}
@media (max-width: 350px) {
  .wordmark .mark {
    width: 36px;
    height: 36px;
  }
  .wordmark .mark i {
    height: 3.5px;
  }
}

/* The one action that matters on a screen. */
.btn-gold,
.btn-gold:hover {
  background: var(--cta);
  border-color: var(--cta);
  color: var(--on-cta);
  box-shadow: 0 8px 20px -12px color-mix(in srgb, var(--cta) 80%, transparent);
}
.btn-gold:hover {
  filter: brightness(1.05);
}
.mobile-bar .cta {
  background: var(--cta);
  color: var(--on-cta);
}
.nav a[aria-current='page'] .i,
.tabbar a[aria-current='page'] .i {
  color: var(--brand);
}
h1,
h2,
.page-title {
  letter-spacing: -0.022em;
}

/* =====================================================================
   Results bell and inbox, win popup, first-time tour, price links,
   your pick on cards.
   ===================================================================== */

.bell {
  position: relative;
  padding: 0 10px;
}
.bell.has-new .i {
  color: var(--gold);
  animation: bellRing 3.6s ease-in-out infinite;
  transform-origin: 50% 10%;
}
@keyframes bellRing {
  0%, 80%, 100% { transform: rotate(0); }
  84% { transform: rotate(12deg); }
  88% { transform: rotate(-10deg); }
  92% { transform: rotate(6deg); }
}
.bell-n {
  position: absolute;
  top: -5px;
  right: -5px;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  background: var(--crash);
  color: #fff;
  font-family: var(--body);
  font-size: 11px;
  font-weight: 600;
  box-shadow: 0 0 0 2px var(--bg);
}

.inbox {
  list-style: none;
  margin: 16px 0 0;
  padding: 0;
  display: grid;
  gap: 8px;
  max-height: min(60vh, 520px);
  overflow-y: auto;
}
.inbox li {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  padding: 12px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--surface);
}
.inbox li.unread {
  border-color: color-mix(in srgb, var(--c) 45%, var(--line));
  background: color-mix(in srgb, var(--c) 7%, var(--surface));
}
.inbox-ico {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  color: var(--c);
  background: color-mix(in srgb, var(--c) 15%, transparent);
}
.inbox a {
  display: grid;
  gap: 2px;
  text-decoration: none;
  min-width: 0;
}
.inbox a span {
  color: var(--muted);
  font-size: 14px;
}
.inbox a small {
  color: var(--muted);
  font-size: 12px;
}
.inbox-empty {
  margin-top: 16px;
  display: grid;
  justify-items: center;
  gap: 8px;
  text-align: center;
  color: var(--muted);
}
.inbox-empty .i {
  width: 32px;
  height: 32px;
  color: var(--brand);
}

.win-modal,
.tour-modal {
  text-align: center;
  display: grid;
  justify-items: center;
  gap: 8px;
  padding: 30px 26px 22px;
}
.win-modal {
  background:
    radial-gradient(320px 180px at 50% 0%, color-mix(in srgb, var(--gold) 18%, transparent), transparent 70%),
    linear-gradient(180deg, var(--surface-2), var(--surface));
  border-color: color-mix(in srgb, var(--gold) 45%, var(--line));
}
.win-ico,
.tour-ico {
  width: 64px;
  height: 64px;
  border-radius: 20px;
  display: grid;
  place-items: center;
  color: var(--gold);
  background: color-mix(in srgb, var(--gold) 16%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gold) 30%, transparent);
}
.win-ico .i,
.tour-ico .i {
  width: 30px;
  height: 30px;
}
.tour-ico {
  color: var(--brand);
  background: color-mix(in srgb, var(--brand) 15%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--brand) 30%, transparent);
}
.win-amount {
  margin: 0;
  font-family: var(--display);
  font-weight: 600;
  font-size: 44px;
  line-height: 1;
  color: var(--gold);
  letter-spacing: -0.022em;
}
.win-amount small {
  font-size: 0.4em;
  color: var(--muted);
}
.win-modal .muted,
.tour-body {
  margin: 0 0 6px;
  max-width: 34ch;
}
.tour-body {
  color: var(--muted);
  line-height: 1.55;
}
.win-actions,
.tour-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  width: 100%;
  margin-top: 6px;
}
.tour-dots {
  display: flex;
  gap: 6px;
  margin-bottom: 6px;
}
.tour-dots i {
  width: 22px;
  height: 4px;
  border-radius: 2px;
  background: var(--line-strong);
}
.tour-dots i.on {
  background: var(--gold);
}
.tour-modal .eyebrow {
  margin: 4px 0 0;
}
@media (max-width: 400px) {
  .win-actions {
    grid-template-columns: 1fr;
  }
}

.price-links {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
}
.price-links > span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
}
.price-links .i {
  width: 15px;
  height: 15px;
}

.card-mine {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 10px;
  border-radius: 10px;
  background: color-mix(in srgb, var(--brand) 10%, transparent);
  font-size: 13px;
}
.card-mine > .i {
  width: 14px;
  height: 14px;
  color: var(--brand);
}

@media (prefers-reduced-motion: reduce) {
  .bell.has-new .i {
    animation: none;
  }
}
@media (max-width: 400px) {
  .account {
    gap: 4px;
  }
  .chip,
  .bell,
  .gift,
  .chip-faucet {
    padding: 0 8px;
  }
}
/* The faucet link is also on the Earn page and in the start steps; very small phones drop it here. */
@media (max-width: 370px) {
  .chip-faucet {
    display: none;
  }
}

/* Token logo field in the admin market form */
.logo-field { display: grid; gap: 8px; }
.logo-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.logo-preview {
  width: 48px;
  height: 48px;
  flex: none;
  border-radius: 50%;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: var(--surface-2);
  border: 1px dashed var(--line-strong);
  color: var(--muted, #8b93c9);
}
.logo-preview img { width: 100%; height: 100%; object-fit: cover; }
.logo-preview svg { width: 22px; height: 22px; }
.logo-link { flex: 1 1 260px; min-width: 0; }
.logo-upload { cursor: pointer; }
.logo-field small { font-size: 0.8rem; }

/* ------------------------------------------------- Contrast and theme layer
   Clear steps between page, cards and fields; brighter labels; visible borders. */

body {
  background:
    radial-gradient(1200px 560px at 50% -280px, var(--glow), transparent 70%),
    var(--bg);
  background-repeat: no-repeat;
}
.topbar {
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  border-bottom: 1px solid var(--line);
}
.card,
.panel {
  border-color: var(--line);
  background: linear-gradient(180deg, var(--surface-2), var(--surface) 70%);
}
.field-label,
legend.field-label,
summary.field-label {
  color: var(--label);
  font-size: 13px;
  font-weight: 600;
}
main input:not([type='checkbox']):not([type='radio']),
main select,
main textarea,
.modal input,
.modal select,
.admin-form input:not([type='checkbox']):not([type='radio']),
.admin-form select,
.admin-form textarea,
.admin-detect input {
  background: var(--field);
  border: 1px solid var(--field-line);
  color: var(--text);
  border-radius: var(--r-sm);
}
main input:not([type='checkbox']):not([type='radio']):hover,
main select:hover,
main textarea:hover {
  border-color: color-mix(in srgb, var(--brand) 55%, var(--field-line));
}
.admin-form input:not([type='checkbox']):not([type='radio']):focus,
.admin-form textarea:focus,
.admin-form select:focus {
  outline: none;
  border-color: var(--brand);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 25%, transparent);
}
main input::placeholder,
main textarea::placeholder,
.modal input::placeholder {
  color: color-mix(in srgb, var(--muted) 80%, transparent);
}
.muted,
.hero-name,
.section-head p {
  color: var(--muted);
}
.btn:not(.btn-solid):not(.btn-gold) {
  border-color: var(--line-strong);
}
.btn:not(.btn-solid):not(.btn-gold):hover {
  border-color: color-mix(in srgb, var(--brand) 60%, var(--line-strong));
}
.chip {
  border-color: var(--line-strong);
}
.tabs button[aria-selected='true'],
.nav a[aria-current='page'],
.admin-nav button[aria-current='page'] {
  background: var(--raised);
  box-shadow: inset 0 0 0 1px var(--line-strong);
  color: var(--text);
}
.tabs button[aria-selected='true'] .i,
.admin-nav button[aria-current='page'] .i {
  color: var(--brand);
}
.venues .check,
.check {
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  background: var(--surface);
}
.check:has(input:checked) {
  border-color: color-mix(in srgb, var(--brand) 70%, transparent);
  background: color-mix(in srgb, var(--brand) 14%, var(--surface));
}
.type-card:has(input:checked) > span,
.type-card input:checked + span {
  border-color: var(--brand);
  background: color-mix(in srgb, var(--brand) 12%, var(--surface));
}

/* Theme switch in the top bar */
.theme-toggle {
  width: 36px;
  padding: 0;
  justify-content: center;
}
.theme-toggle .i {
  color: var(--moon);
}
.featured .h1-soft {
  color: color-mix(in srgb, var(--brand) 75%, var(--text));
}
@media (max-width: 900px) {
  .admin-nav {
    padding: 2px;
    scroll-padding-inline: 12px;
  }
}
.btn[hidden],
.chip[hidden] {
  display: none;
}

/* ------------------------------------------------------------------ Dashboard
   One spacing scale (8 / 16 / 24 / 32), flat calm cards, accent colour only for the claim
   action, wins/losses and live status. */

.dash {
  --dash-gap: 24px;
  display: grid;
  gap: var(--dash-gap);
}
.dash > .start-card {
  margin: 0;
}
.dash-card,
.sum-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  box-shadow: none;
}

/* Header: identity left, quiet actions right. No banner. */
.dash-head {
  display: flex;
  align-items: center;
  gap: 16px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--line);
}
.dash-id {
  min-width: 0;
  flex: 1;
  display: grid;
  gap: 2px;
}
.dash-eyebrow {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.dash-name {
  margin: 0;
  font-family: var(--display);
  font-size: 24px;
  font-weight: 600;
  line-height: 1.15;
  letter-spacing: -0.01em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dash-meta {
  margin: 0;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 14px;
  color: var(--muted);
}
.dash-meta .i {
  width: 13px;
  height: 13px;
}
.dash-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.dash-actions .btn-sm {
  min-height: 36px;
  padding: 0 14px;
}
.link-quiet {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 0 8px;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
  border-radius: var(--r-sm);
}
.link-quiet:hover {
  color: var(--text);
  background: color-mix(in srgb, var(--text) 6%, transparent);
}
.link-quiet .i {
  width: 14px;
  height: 14px;
}

/* Summary: cards sized to what they hold. */
.dash-summary {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}
.dash-summary.has-record {
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.6fr);
}
.sum-card {
  padding: 16px 24px 24px;
  display: grid;
  align-content: start;
  gap: 8px;
}
.sum-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 32px;
}
.sum-label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
}
.sum-label .i {
  width: 16px;
  height: 16px;
}
.sum-points .sum-label .i {
  color: var(--moon);
}
.sum-note {
  font-size: 12px;
  color: var(--muted);
}
.sum-value {
  font-family: var(--display);
  font-size: 30px;
  font-weight: 600;
  line-height: 1.05;
  letter-spacing: -0.02em;
}
.sum-na {
  color: color-mix(in srgb, var(--muted) 70%, transparent);
  font-weight: 500;
}
.sum-sub {
  margin: 0;
  font-size: 13px;
  color: var(--muted);
}
.sum-card .meter {
  margin: 4px 0 0;
}
.record-grid {
  margin: 0;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
}
.record-grid dt {
  font-size: 12px;
  color: var(--muted);
}
.record-grid dd {
  margin: 4px 0 0;
  font-family: var(--display);
  font-size: 20px;
  font-weight: 600;
}
.record-grid p {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--muted);
}

.dash-insights {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
  gap: 16px;
}
.dash-insights > .panel {
  margin: 0;
  background: var(--surface);
  box-shadow: none;
}

/* Main column + sidebar. */
.dash-layout {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
  gap: 16px;
  align-items: start;
}
.dash-side {
  display: grid;
  gap: 16px;
}
.dash-main {
  overflow: hidden;
}
.dash-tabs {
  display: flex;
  gap: 24px;
  padding: 0 24px;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  scrollbar-width: none;
}
.dash-tabs button {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 48px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
}
.dash-tabs button:hover {
  color: var(--text);
}
.dash-tabs button[aria-selected='true'] {
  color: var(--text);
}
.dash-tabs button[aria-selected='true']::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 2px;
  border-radius: 2px;
  background: var(--brand);
}
.dash .count {
  display: inline-grid;
  place-items: center;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--text) 8%, transparent);
  color: var(--text);
  font-size: 12px;
  font-weight: 600;
}
.dash-table {
  margin: 0;
}
.dash-table th:first-child,
.dash-table td:first-child {
  padding-left: 24px;
}
.dash-table th:last-child,
.dash-table td:last-child {
  padding-right: 24px;
}
.dash-table .mkt-cell small {
  display: block;
  font-size: 12px;
  font-weight: 400;
}
.dash-main .fine {
  margin: 0;
  padding: 16px 24px;
  border-top: 1px solid var(--line);
}

.dash-empty {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  padding: 24px;
}
.dash-empty p {
  flex: 1 1 240px;
  margin: 0;
  font-size: 14px;
  color: var(--muted);
}
.dash-empty-ico {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  flex: none;
  border-radius: 50%;
  background: color-mix(in srgb, var(--text) 6%, transparent);
  color: var(--muted);
}
.dash-empty-ico .i {
  width: 18px;
  height: 18px;
}
.dash-empty .btn {
  min-height: 36px;
  padding: 0 14px;
}

/* Sidebar cards. */
.dash-side .dash-card {
  padding: 16px 16px 16px;
}
.dash-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.dash-card-head h2 {
  margin: 0;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 600;
}
.dash-card-head h2 .i {
  width: 16px;
  height: 16px;
  color: var(--muted);
}
.dash-card-text {
  margin: 0 0 16px;
  font-size: 13px;
  color: var(--muted);
}
.dash-card-btn {
  width: 100%;
  justify-content: center;
  min-height: 40px;
}
.dash-wallets,
.dash-ledger {
  list-style: none;
  margin: 0;
  padding: 0;
}
.dash-wallets {
  margin-bottom: 16px;
}
.dash-wallets li,
.dash-ledger li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  border-top: 1px solid var(--line);
}
.dash-wallets li:first-child,
.dash-ledger li:first-child {
  border-top: 0;
}
.dw-main,
.dl-main {
  min-width: 0;
  display: grid;
  gap: 2px;
}
.dw-main .addr {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 13px;
}
.dw-main .muted,
.dl-main small {
  font-size: 12px;
  color: var(--muted);
}
.dl-main a,
.dl-main {
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-decoration: none;
}
.dl-main a:hover {
  text-decoration: underline;
}
.dash-ledger {
  max-height: 360px;
  overflow-y: auto;
  margin-right: -8px;
  padding-right: 8px;
}
.dash-ledger b {
  font-size: 13px;
  white-space: nowrap;
}
.dl-neg {
  color: var(--text);
}
.dw-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 32px;
  font-size: 12px;
  color: var(--muted);
  text-decoration: none;
  white-space: nowrap;
}
.dw-link:hover {
  color: var(--text);
}
.dw-link .i {
  width: 12px;
  height: 12px;
}

@media (max-width: 1080px) {
  .dash-summary.has-record {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .dash-summary.has-record .sum-record {
    grid-column: 1 / -1;
  }
}
@media (max-width: 900px) {
  .dash {
    --dash-gap: 16px;
  }
  .dash-layout,
  .dash-insights {
    grid-template-columns: minmax(0, 1fr);
  }
}
@media (max-width: 640px) {
  .dash-head {
    flex-wrap: wrap;
    padding-bottom: 16px;
  }
  .dash-name {
    font-size: 20px;
  }
  .dash-actions {
    width: 100%;
    justify-content: flex-start;
  }
  .dash-actions .btn-sm {
    flex: 1 1 0;
    justify-content: center;
    min-height: 44px;
  }
  .dash-actions .link-quiet {
    min-height: 44px;
  }
  .dash-summary,
  .dash-summary.has-record {
    grid-template-columns: minmax(0, 1fr);
  }
  .sum-card {
    padding: 16px;
  }
  .sum-value {
    font-size: 26px;
  }
  .record-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .dash-tabs {
    padding: 0 16px;
    gap: 20px;
  }
  .dash-tabs button {
    min-height: 48px;
  }
  .dash-table th:first-child,
  .dash-table td:first-child {
    padding-left: 16px;
  }
  .dash-table th:last-child,
  .dash-table td:last-child {
    padding-right: 16px;
  }
  .dash-empty {
    padding: 16px;
  }
  .dash-empty .btn {
    width: 100%;
    justify-content: center;
    min-height: 44px;
  }
}

/* Chart row on the dashboard: same heading scale and padding as the other cards. */
.dash-insights {
  align-items: start;
}
.dash-insights > .panel {
  padding: 16px 24px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
}
.dash-insights .section-head {
  margin: 0 0 8px;
  gap: 8px;
  align-items: center;
}
.dash-insights .section-head h2 {
  font-family: var(--body);
  font-size: 15px;
  font-weight: 600;
  margin: 0;
}
.dash-insights .section-ico {
  width: auto;
  height: auto;
  background: none;
  border: 0;
  box-shadow: none;
  color: var(--muted);
}
.dash-insights .section-ico .i {
  width: 16px;
  height: 16px;
}
.dash-insights .pchart {
  padding: 8px 0 0;
  background: none;
  border: 0;
}
.dash-insights .pchart-plot {
  height: 140px;
}
.dash-insights .fine {
  margin: 8px 0 0;
}
.dash-insights .orec {
  margin: 8px 0 0;
}
@media (max-width: 640px) {
  .dash-insights > .panel {
    padding: 16px;
  }
}
@media (max-width: 640px) {
  .dash-summary,
  .dash-summary.has-record {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }
  .dash-summary .sum-record {
    grid-column: 1 / -1;
  }
  /* Points on a phone: label, number, note, then a full-width claim button. */
  .sum-points .sum-top {
    display: contents;
  }
  .sum-points .sum-label {
    min-height: 32px;
  }
  .sum-points .sum-top .btn,
  .sum-points .sum-note {

  }
  .sum-points .sum-top .btn {

    justify-content: center;
    min-height: 44px;
    margin-top: 4px;

  .sum-value {

  }
