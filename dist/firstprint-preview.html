/**
 * Free hosting puts the server to sleep when nobody visits, and the first request after that fails with a
 * gateway error until it has started (up to about a minute). Reads are retried while that happens, and the
 * page is told so it can say so instead of showing an error. Writes are never retried: they aren't safe to repeat.
 */
const wake = { onWaking: () => {}, onAwake: () => {} };

/**
 * The server's clock, from each response's Date header (fresh even when the body comes from the
 * browser cache after a 304), so countdowns match the server. null until the first answer.
 */
const serverClock = { skew: null };
const WAKE_RETRIES = 12;
/** Wait before retry n: grows from 3 s to 20 s, with a random spread so pages don't retry in step. */
const wakeWait = (n) => Math.min(20_000, 3_000 * 1.5 ** n) * (0.6 + Math.random() * 0.8);
const GATEWAY = new Set([502, 503, 504, 520, 521, 522, 523, 524]);

/**
 * An admin testing the site during maintenance: their own actions still go through, so the key
 * (kept for this tab only) rides along on writes.
 */
function adminHeader(init) {
  if (!init.method || init.method === 'GET') return {};
  try {
    const key = sessionStorage.getItem('fp_admin_key');
    return key ? { 'x-admin-key': key } : {};
  } catch {
    return {};
  }
}

function createApi(baseUrl = '') {
  async function request(path, init = {}) {
    const canRetry = !init.method || init.method === 'GET';
    let waking = false;
    for (let attempt = 0; ; attempt++) {
      let res;
      try {
        res = await fetch(baseUrl + path, {
          ...init,
          credentials: 'same-origin',
          headers: { 'content-type': 'application/json', ...adminHeader(init) },
        });
      } catch {
        if (canRetry && attempt < WAKE_RETRIES) {
          waking = true;
          wake.onWaking();
          await new Promise((r) => setTimeout(r, wakeWait(attempt)));
          continue;
        }
        if (waking) wake.onAwake();
        throw new ApiError(0, 'offline', 'Can’t reach Firstprint. Check your connection and try again.');
      }
      if (GATEWAY.has(res.status) && canRetry && attempt < WAKE_RETRIES) {
        waking = true;
        wake.onWaking();
        await new Promise((r) => setTimeout(r, wakeWait(attempt)));
        continue;
      }
      if (waking) wake.onAwake();
      return finish(res);

    const date = Date.parse(res.headers.get('date') ?? '');
    // The header has whole seconds: add half a second to land in the middle.

    const data = await res.json().catch(() => ({}));
    if (res.status === 503 && data.error === 'maintenance') wake.onMaintenance?.(data.message);
    if (!res.ok) throw new ApiError(res.status, data.error ?? 'error', data.message ?? 'Request failed.');
    return data;

    subscribe(onEvent, onStatus = () => {}) {
      if (typeof EventSource === 'undefined') return () => {};

/** The referral code from an invite link (?ref=...), kept until sign-up. */
function referralCode() {
  try {
    return localStorage.getItem('fp:ref') || null;
  } catch {
    return null;
  }
}

/** Remembers ?ref=CODE from the address bar, so the invite counts when this visitor signs up. */
function captureReferral() {
  const code = new URLSearchParams(location.search).get('ref');
  if (!code || !/^[A-Za-z0-9]{6,12}$/.test(code)) return;
  try {
    localStorage.setItem('fp:ref', code.toUpperCase());
  } catch {
    /* storage blocked: the invite just won't count */
  }
}

}

// Solana wallet connection without SDKs: Wallet Standard discovery (Phantom,
// Solflare, Backpack, and others) with a fallback to legacy injected providers.

const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';

function b58encode(bytes) {
  let zeros = 0;
  while (zeros < bytes.length && bytes[zeros] === 0) zeros++;
  const digits = [];
  for (let i = zeros; i < bytes.length; i++) {
    let carry = bytes[i];
    for (let j = 0; j < digits.length; j++) {
      carry += digits[j] << 8;
      digits[j] = carry % 58;
      carry = (carry / 58) | 0;
    }
    while (carry) {
      digits.push(carry % 58);
      carry = (carry / 58) | 0;
    }
  }
  return '1'.repeat(zeros) + digits.reverse().map((d) => B58[d]).join('');
}

const standardWallets = new Map();
const walletListeners = new Set();

function isSolanaStandard(w) {
  return Boolean(
    w?.features?.['standard:connect'] &&
      w?.features?.['solana:signMessage'] &&
      (w.chains ?? []).some((c) => String(c).startsWith('solana:')),
  );
}

(function discover() {
  const api = {
    register(...wallets) {
      for (const w of wallets) if (isSolanaStandard(w)) standardWallets.set(w.name, w);
      walletListeners.forEach((fn) => fn());
      return () => wallets.forEach((w) => standardWallets.delete(w.name));
    },
  };
  window.addEventListener('wallet-standard:register-wallet', (e) => {
    try {
      e.detail(api);
    } catch {
      /* ignore misbehaving wallets */
    }
  });
  try {
    window.dispatchEvent(new CustomEvent('wallet-standard:app-ready', { detail: api }));
  } catch {
    /* old browsers */
  }
})();

function onWalletsChanged(fn) {
  walletListeners.add(fn);
  return () => walletListeners.delete(fn);
}

/** Wallets available in this browser. */
function listWallets() {
  const out = [...standardWallets.values()].map((w) => ({
    kind: 'standard',
    name: w.name,
    icon: typeof w.icon === 'string' && w.icon.startsWith('data:image/') ? w.icon : null,
    wallet: w,
  }));
  const legacy = [
    ['Phantom', window.phantom?.solana?.isPhantom ? window.phantom.solana : null],
    ['Solflare', window.solflare?.isSolflare ? window.solflare : null],
    ['Backpack', window.backpack?.isBackpack ? window.backpack : null],
  ];
  for (const [name, provider] of legacy) {
    if (provider && !out.some((w) => w.name.toLowerCase().includes(name.toLowerCase()))) {
      out.push({ kind: 'legacy', name, icon: null, provider });
    }
  }
  return out;
}

/**
 * Connects a wallet and signs the server's sign-in message.
 * getMessage(address) must return the exact text to sign.
 */
async function connectAndSign(entry, getMessage) {
  const encoder = new TextEncoder();
  if (entry.kind === 'standard') {
    const { accounts } = await entry.wallet.features['standard:connect'].connect();
    const account = accounts?.[0];
    if (!account) throw new Error('No account was shared by the wallet.');
    const message = await getMessage(account.address);
    const [signed] = await entry.wallet.features['solana:signMessage'].signMessage({ account, message: encoder.encode(message) });
    return { address: account.address, message, signature: b58encode(signed.signature), walletName: entry.name };
  }
  const provider = entry.provider;
  const res = await provider.connect();
  const address = (res?.publicKey ?? provider.publicKey).toString();
  const message = await getMessage(address);
  const signed = await provider.signMessage(encoder.encode(message), 'utf8');
  return { address, message, signature: b58encode(signed.signature ?? signed), walletName: entry.name };
}

const fromBase64 = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
const toBase64 = (bytes) => {
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
};

/**
 * Has the wallet holding `address` sign a transaction Firstprint prepared (base64), and returns
 * it signed (base64). Firstprint checks and sends it. Tries the wallet the player linked first.
 */
async function signTransactionWith(address, transactionBase64, cluster, walletName) {
  const transaction = fromBase64(transactionBase64);
  const chain = `solana:${cluster}`;
  const wallets = [...standardWallets.values()].filter((w) => w.features['solana:signTransaction']);
  if (!wallets.length) throw new Error('Open this page in a browser with Phantom, Solflare or Backpack installed.');
  wallets.sort((a, b) => Number(b.name === walletName) - Number(a.name === walletName));
  for (const [i, w] of wallets.entries()) {
    let account = (w.accounts ?? []).find((a) => a.address === address);
    if (!account) {
      try {
        // Ask quietly first; only the preferred wallet may show a connect prompt.
        const { accounts } = await w.features['standard:connect'].connect(i === 0 ? undefined : { silent: true });
        account = (accounts ?? []).find((a) => a.address === address);
      } catch (err) {
        if (i === 0 && (err?.code === 4001 || /reject|denied|cancel/i.test(err?.message ?? ''))) throw err;
      }
    }
    if (!account) continue;
    const [out] = await w.features['solana:signTransaction'].signTransaction({ account, transaction, chain });
    return toBase64(out.signedTransaction);
  }
  throw new Error(`Switch your wallet to the account ${shortAddress(address)} (the one linked to Firstprint), then try again.`);
}

async function disconnectWallets() {
  for (const w of standardWallets.values()) {
    try {
      await w.features['standard:disconnect']?.disconnect();
    } catch {
      /* ignore */
    }
  }
  for (const p of [window.phantom?.solana, window.solflare, window.backpack]) {
    try {
      await p?.disconnect?.();
    } catch {
      /* ignore */
    }
  }
}

function demoHash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return ((h >>> 0) % 1_000_000) / 1_000_000;
}

function demoPrice(m, ts) {
  const p = m.profile;
  const f = Math.max(0, (ts - m.listingAt) / m.cfg.durationMs);
  const trend = p.startPrice * Math.pow(1 + p.target, Math.min(f, 1.2));
  const noise = (demoHash(`${m.symbol}:${ts}`) - 0.5) * 2 * p.noise;
  return Math.max(1e-9, trend * (1 + noise));
}

  // --- Internals ---------------------------------------------------------------

  now() {
    return Date.now() + this.offset;
  }

  addUser(username, points) {
    const u = { id: `u${++this.seq}`, username, points, lastClaimDay: null, needsUsername: false, hasEmail: true, wallets: [] };
    this.users.set(u.id, u);
    return u;
  }

  addPrediction(m, userId, bucket, stake, placedAt) {
    const u = this.users.get(userId);
    u.points -= stake;
    const p = { id: `p${++this.seq}`, userId, bucket, stake, placedAt, accepted: null, refund: null, weight: null, payout: null };
    m.predictions.push(p);
    return p;
  }

  /** Completed 1-minute candles aligned to the listing time, within [start, end). */
  candles(m, start, end) {
    const out = [];
    const now = this.now();
    const k0 = Math.max(0, Math.ceil((start - m.listingAt) / D3_MIN));
    for (let ts = m.listingAt + k0 * D3_MIN; ts < end && ts + D3_MIN <= now; ts += D3_MIN) {
      out.push({ ts, close: demoPrice(m, ts), volume: m.profile.volume, trades: 12 });
    }
    return out;
  }

  advance() {
    const now = this.now();
    for (const m of this.marketList) {
      const w = windows(m.cfg, m.listingAt);
      if (m.status === 'open' && now >= w.closeAt) {
        const accepted = applyCaps(m.predictions, m.cfg.softCap, m.cfg, m.openedAt, w.closeAt);
        for (const a of accepted) {
          const p = m.predictions.find((x) => x.id === a.id);
          Object.assign(p, { accepted: a.accepted, refund: a.refund, weight: a.weight });
          this.users.get(p.userId).points += a.refund;
        }
        m.status = 'locked';
      }
      if (m.status === 'locked' && now >= w.settleAt) {
        const candles = [...this.candles(m, w.baseline.start, w.baseline.end), ...this.candles(m, w.final.start, w.final.end)];
        const result = settleMarket({
          cfg: m.cfg,
          announcedListingAt: m.announcedListingAt,
          listingAt: m.listingAt,
          openedAt: m.openedAt,
          retracted: false,
          haltedMs: 0,
          candles: { sim: candles },
          accepted: m.predictions.map((p) => ({ ...p })),
        });
        for (const r of result.payouts) {
          const p = m.predictions.find((x) => x.id === r.predictionId);
          const u = this.users.get(p.userId);
          u.points += r.refund - (p.refund ?? 0) + r.payout;
          p.refund = r.refund;
          p.payout = r.payout;
        }
        m.result = result;
        m.settledAt = now;
        m.status = result.voidReason ? 'void' : 'resolved';
      }
    }
  }

  me_() {
    const u = this.sessionUserId && this.users.get(this.sessionUserId);
    if (!u) throw new ApiError(401, 'auth_required', 'Log in to continue.');
    return u;
  }

  publicUser(u) {
    const today = new Date(this.now()).toISOString().slice(0, 10);
    return {
      id: u.id,
      username: u.username,
      needsUsername: u.needsUsername,
      hasEmail: u.hasEmail,
      wallets: u.wallets,
      points: u.points,
      canClaimDaily: u.lastClaimDay !== today,
      daily: this.dailyStatus(u),
    };
  }

  /** Same streak rules as the server: 50 on day 1, +25 a day, 200 from day 7; a missed day resets. */
  dailyStatus(u) {
    const day = (t) => new Date(t).toISOString().slice(0, 10);
    const today = day(this.now());
    const claimedToday = u.lastClaimDay === today;
    const alive = claimedToday || u.lastClaimDay === day(this.now() - 86_400_000);
    const streak = alive ? Math.max(1, u.streak ?? 1) : 0;
    return { streak, claimedToday, nextDay: streak + 1, next: Math.min(200, 50 + 25 * streak), max: 200 };
  }

  daily() {
    return this.run(() => {
      const u = this.me_();
      return { ...this.dailyStatus(u), today: new Date(this.now()).toISOString().slice(0, 10), days: u.claims ?? [], schedule: [50, 75, 100, 125, 150, 175, 200] };
    });
  }

  demoDetections(now) {
    const H = 60 * D3_MIN;
    const rows = [
      ['binance', 'Binance', 'LUMA', 'Binance Will List Luma Compute (LUMA) with Seed Tag Applied', 5 * H + 12 * D3_MIN, 'luma-binance', -3 * H],
      ['bitget', 'Bitget', 'FERRO', 'Bitget Will List Ferro Pay (FERRO) in the Innovation Zone', 26 * H, 'ferro-bitget', -9 * H],
      ['bybit', 'Bybit', 'ARCO', 'New Listing: ARCO/USDT — Grab a Share of 400,000 ARCO', 30 * H, null, -40 * D3_MIN],
      ['okx', 'OKX', 'TIDE', 'OKX to list Tide Protocol (TIDE) for spot trading', 44 * H, null, -2 * H],
      ['kucoin', 'KuCoin', 'MOSS', 'Moss Network (MOSS) Gets Listed on KuCoin!', 52 * H, null, -5 * H],
      ['gate', 'Gate', 'QUILL', 'QUILL/USDT pair added on Gate', 3 * H, null, -20 * D3_MIN],
      ['mexc', 'MEXC', 'KORA', 'KORA/USDT pair added on MEXC', 3 * D3_MIN, 'kora-mexc', -30 * D3_MIN],
    ];
    return rows.map(([exchange, exchangeName, symbol, title, inMs, marketId, ago], i) => ({
      id: i + 1,
      exchange,
      exchangeName,
      symbol,
      pair: `${symbol}USDT`,
      source: title.includes('pair added') ? 'symbol_diff' : 'announcement',
      title,
      url: title.includes('pair added') ? null : `https://example.com/announcements/${symbol.toLowerCase()}`,
      listingAt: now + inMs,
      publishedAt: now + ago,
      detectedAt: now + ago,
      status: marketId ? 'approved' : 'pending',
      marketId,
    }));
  }

  find(id) {
    const m = this.marketList.find((x) => x.id === id);
    if (!m) throw new ApiError(404, 'market_not_found', 'Market not found.');
    return m;
  }

  view(m) {
    const now = this.now();
    const w = windows(m.cfg, m.listingAt);
    const afterClose = m.status !== 'open';
    const totals = emptyTotals();
    const users = new Set();
    let volume24h = 0;
    for (const p of m.predictions) {
      totals[p.bucket] += afterClose ? (p.accepted ?? 0) : p.stake;
      users.add(p.userId);
      if (p.placedAt > now - 24 * D3_HOUR) volume24h += p.stake;
    }
    const pool = Object.values(totals).reduce((s, n) => s + n, 0);
    const phase = m.status === 'open' ? (now < m.listingAt ? 'pre_listing' : 'baseline') : m.status === 'locked' ? 'running' : m.status;

    let live = null;
    if ((m.status === 'open' || m.status === 'locked') && now >= m.listingAt + D3_MIN) {
      const baseEnd = Math.min(w.baseline.end, now);
      const base = twap(this.candles(m, w.baseline.start, baseEnd), w.baseline.start, baseEnd).twap;
      const lastTs = now - D3_MIN;
      const last = venueMedian([{ venue: 'sim', price: demoPrice(m, lastTs), volume: 1 }]);
      const r = base && last ? returnPct(base, last) : null;
      live = { basePrice: base, lastPrice: last, returnPct: r, projectedBucket: r === null ? null : bucketForReturn(r, m.cfg.thresholds), provisional: m.status === 'open' };
    }

    const result = m.result
      ? {
          winningBucket: m.result.winningBucket,
          returnPct: m.result.returnPct,
          voidReason: m.result.voidReason,
          basePrice: m.result.baseline.price,
          finalPrice: m.result.final.price,
          pool: m.result.pool,
          fee: m.result.fee,
        }
      : null;

    const mine = m.predictions
      .filter((p) => p.userId === this.sessionUserId)
      .map((p) => ({ id: p.id, bucket: p.bucket, stake: p.stake, accepted: p.accepted, refund: p.refund, payout: p.payout, weight: p.weight, placedAt: p.placedAt }));

    return {
      id: m.id,
      symbol: m.symbol,
      name: m.name,
      exchange: m.exchange,
      sourceUrl: null,
      logoUrl: m.logoUrl ?? null,
      status: m.status,
      phase,
      announcedListingAt: m.announcedListingAt,
      listingAt: m.listingAt,
      openedAt: m.openedAt,
      closeAt: w.closeAt,
      settleAt: w.settleAt,
      outcomes: 'ladder',
      thresholds: m.cfg.thresholds,
      feeBps: m.cfg.feeBps,
      earlyBirdK: m.cfg.earlyBirdK,
      softCap: m.cfg.softCap,
      userCap: Math.floor(m.cfg.softCap * m.cfg.perUserCapPct),
      minStake: 10,
      pool,
      totals,
      predictors: users.size,
      volume24h,
      live,
      result,
      scorecard: m.scorecard,
      mine,
      earlyPot: m.status === 'open' || m.status === 'locked' ? (m.earlyPot ?? 0) : 0,
      revert: DEFAULT_REVERT_RULES,
      serverTime: now,
    };
  }

  async run(fn) {
    await new Promise((r) => setTimeout(r, 60)); // feel like a network call
    this.advance();
    return structuredClone(fn());
  }

  // --- Public API (matches createApi) ----------------------------------------------

  config() {
    return this.run(() => ({ minStake: 10, dailyPoints: 50, dailyMax: 200, demo: true, manualOnly: false, signIn: { google: null, email: true } }));
  }

  me() {
    return this.run(() => ({ ...this.publicUser(this.me_()), unreadNotifications: 0 }));
  }

  /** Practice mode keeps no result notifications. */
  notifications() {
    return this.run(() => ({ unread: 0, notifications: [] }));
  }

  markNotificationsRead() {
    return this.run(() => ({ unread: 0 }));
  }

  signup({ email, username, password }) {
    return this.run(() => {
      email = String(email ?? '').trim().toLowerCase();
      username = String(username ?? '').trim();
      if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) throw new ApiError(400, 'bad_username', 'Username must be 3–20 letters, numbers, or underscores.');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new ApiError(400, 'bad_email', 'Enter a valid email address.');
      if (String(password ?? '').length < 8) throw new ApiError(400, 'bad_password', 'Password must be at least 8 characters.');
      if (this.accounts.has(email)) throw new ApiError(409, 'email_taken', 'An account with this email already exists. Log in instead.');
      if ([...this.users.values()].some((u) => u.username.toLowerCase() === username.toLowerCase())) {
        throw new ApiError(409, 'username_taken', 'That username is taken. Try another.');
      }
      const u = this.addUser(username, 1_000);
      this.accounts.set(email, { userId: u.id, password });
      this.sessionUserId = u.id;
      return { user: this.publicUser(u) };
    });
  }

  /** Practice mode has no mail server: the code is always shown on screen. */
  emailStart(email) {
    return this.run(() => {
      email = String(email ?? '').trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new ApiError(400, 'bad_email', 'Enter a valid email address.');
      return { ok: true, devCode: '123456' };
    });
  }

  emailVerify(email, code) {
    return this.run(() => {
      email = String(email ?? '').trim().toLowerCase();
      if (String(code ?? '').trim() !== '123456') throw new ApiError(401, 'bad_code', 'That code is wrong. In practice mode it is 123456.');
      let acc = this.accounts.get(email);
      const created = !acc;
      if (!acc) {
        const base = (email.split('@')[0].replace(/[^A-Za-z0-9_]+/g, '_').slice(0, 16) || 'player').padEnd(3, '_');
        let username = base;
        for (let i = 2; [...this.users.values()].some((u) => u.username.toLowerCase() === username.toLowerCase()); i++) username = `${base}${i}`;
        const u = this.addUser(username, 1_000);
        acc = { userId: u.id, password: null };
        this.accounts.set(email, acc);
      }
      this.sessionUserId = acc.userId;
      return { user: this.publicUser(this.users.get(acc.userId)), created };
    });
  }

  login({ email, password }) {
    return this.run(() => {
      const acc = this.accounts.get(String(email ?? '').trim().toLowerCase());
      if (!acc || acc.password !== password) throw new ApiError(401, 'bad_credentials', 'Email or password is incorrect.');
      this.sessionUserId = acc.userId;
      return { user: this.publicUser(this.users.get(acc.userId)) };
    });
  }

  logout() {
    return this.run(() => {
      this.sessionUserId = null;
      return { ok: true };
    });
  }

  /** Practice mode: sample tasks, honour-based like the real ones; points go straight to the balance. */
  rewards() {
    return this.run(() => {
      const u = this.me_();
      u.tasks ??= {};
      const code = 'PRACTICE';
      return {
        onChain: false,
        cluster: null,
        mint: null,
        mintUrl: null,
        faucetUrl: 'https://faucet.solana.com',

  connectX(username) {
    return this.run(() => {
      const u = this.me_();
      const name = String(username ?? '').trim().replace(/^@/, '');
      if (!/^[A-Za-z0-9_]{1,15}$/.test(name)) throw new ApiError(400, 'bad_x_username', 'Enter your X username, like @firstprint (letters, numbers and _ only).');
      const first = !u.xUsername;
      u.xUsername = name;
      if (first) u.points += 100;
      return { xUsername: name, rewarded: first ? 100 : 0 };

  startTask(taskId) {
    return this.run(() => {
      const u = this.me_();
      u.tasks ??= {};
      u.tasks[taskId] ??= { startedAt: Date.now(), done: false };
      return { ok: true };
    });
  }

  verifyTask(taskId) {
    return this.run(() => {
      const u = this.me_();
      const t = DEMO_TASKS.find((x) => x.id === taskId);
      const mine = u.tasks?.[taskId];
      if (!t) throw new ApiError(404, 'task_not_found', 'This task is no longer available.');
      if (t.kind !== 'link' && !u.xUsername) throw new ApiError(409, 'x_required', 'Link your X username first, so we know which account did it.');
      if (!mine) throw new ApiError(409, 'task_not_started', 'Open the task first, then come back to confirm it.');
      if (mine.done) throw new ApiError(409, 'task_done', 'You already completed this task.');
      if (Date.now() - mine.startedAt < 8_000) throw new ApiError(429, 'task_too_fast', 'Give it a few seconds: finish the task on X, then confirm.');
      mine.done = true;
      u.points += t.points;
      return { points: t.points, onChain: false };
    });
  }

  startClaim() {
    return this.run(() => {
      throw new ApiError(409, 'token_off', 'In practice mode points go straight to your balance. TestFPT claims are in the full app.');
    });
  }

  claimDaily() {
    return this.run(() => {
      const u = this.me_();
      const today = new Date(this.now()).toISOString().slice(0, 10);
      if (u.lastClaimDay === today) throw new ApiError(409, 'already_claimed', 'Daily points already claimed. Come back tomorrow (UTC).');
      const { nextDay } = this.dailyStatus(u);
      const reward = Math.min(200, 50 + 25 * (nextDay - 1));
      u.lastClaimDay = today;
      u.streak = nextDay;
      u.points += reward;
      (u.claims ??= []).push({ day: today, points: reward });
      return this.publicUser(u);
    });
  }

  markets(filter) {
    return this.run(() => {
      const pick = { open: ['open'], live: ['locked'], settled: ['resolved', 'void'], all: ['open', 'locked', 'resolved', 'void'] }[filter];
      const list = this.marketList.filter((m) => pick.includes(m.status));
      list.sort((a, b) => (filter === 'settled' ? b.listingAt - a.listingAt : a.listingAt - b.listingAt));
      return { markets: list.map((m) => this.view(m)), serverTime: this.now() };
    });
  }

  market(id) {
    return this.run(() => this.view(this.find(id)));
  }

  quote(id, bucket, stake) {
    return this.run(() => {
      const m = this.find(id);
      const { closeAt } = windows(m.cfg, m.listingAt);
      return quote(m.predictions, bucket, Math.max(0, Math.floor(stake) || 0), this.now(), m.cfg, m.openedAt, closeAt);
    });
  }

  predict(id, bucket, stake) {
    return this.run(() => {
      const u = this.me_();
      const m = this.find(id);
      const { closeAt } = windows(m.cfg, m.listingAt);
      if (!BUCKETS.includes(bucket)) throw new ApiError(400, 'bad_bucket', 'Choose Crash, Down, Flat, Up, or Moon.');
      if (!Number.isInteger(stake) || stake < 10) throw new ApiError(400, 'bad_stake', 'Stake must be a whole number of at least 10 points.');
      if (m.status !== 'open' || this.now() >= closeAt) throw new ApiError(409, 'market_closed', 'Predictions for this market are closed.');
      if (u.points < stake) throw new ApiError(400, 'insufficient_points', 'Not enough points for this prediction.');
      const userCap = Math.floor(m.cfg.softCap * m.cfg.perUserCapPct);
      const mine = m.predictions.filter((p) => p.userId === u.id).reduce((s, p) => s + p.stake, 0);
      if (mine + stake > userCap) throw new ApiError(409, 'user_cap', `You can stake up to ${userCap} points per market. You have ${userCap - mine} left.`);
      const p = this.addPrediction(m, u.id, bucket, stake, this.now());
      return { id: p.id, balance: u.points };
    });
  }

  /** Finds one of the player's predictions on an open market, with what taking it back costs now. */
  revertTarget(pid) {
    const u = this.me_();
    const m = this.marketList.find((x) => x.predictions.some((p) => p.id === pid));
    const p = m?.predictions.find((x) => x.id === pid);
    if (!p || p.userId !== u.id) throw new ApiError(404, 'prediction_not_found', 'Prediction not found.');
    const { closeAt } = windows(m.cfg, m.listingAt);
    if (m.status !== 'open' || this.now() >= closeAt) throw new ApiError(409, 'market_closed', 'Predictions for this market are closed.');
    return { u, m, p, closeAt, q: revertQuote(p.stake, p.placedAt, this.now(), m.openedAt, closeAt, DEFAULT_REVERT_RULES) };
  }

  revertQuote(pid) {
    return this.run(() => {
      const { p, q, closeAt } = this.revertTarget(pid);
      return { predictionId: p.id, stake: p.stake, ...q, lockAt: closeAt - DEFAULT_REVERT_RULES.lockMs };
    });
  }

  revert(pid) {
    return this.run(() => {
      const { u, m, p, q } = this.revertTarget(pid);
      if (!q.allowed) throw new ApiError(409, 'revert_locked', 'Predictions can’t be taken back this close to the close.');
      m.predictions = m.predictions.filter((x) => x.id !== p.id);
      m.earlyPot = (m.earlyPot ?? 0) + q.toEarly;
      u.points += q.back;
      return { id: p.id, back: q.back, fee: q.fee, burned: q.burn, toEarly: q.toEarly, free: q.free, balance: u.points };
    });
  }

  chart(id) {
    return this.run(() => {
      const m = this.find(id);
      const { settleAt } = windows(m.cfg, m.listingAt);
      const end = Math.min(this.now(), settleAt);
      if (end <= m.listingAt) return { venue: null, series: [] };
      const span = end - m.listingAt;
      const step = Math.max(D3_MIN, Math.ceil(span / 120 / D3_MIN) * D3_MIN);
      const series = [];
      for (let ts = m.listingAt; ts < end; ts += step) series.push([ts, demoPrice(m, ts)]);
      return { venue: 'sim', series };
    });
  }

  activity(id) {
    return this.run(() => {
      const m = this.find(id);
      const activity = [...m.predictions]
        .sort((a, b) => b.placedAt - a.placedAt)
        .slice(0, 30)
        .map((p) => ({ username: this.users.get(p.userId).username, bucket: p.bucket, stake: p.stake, placedAt: p.placedAt }));
      return { activity };
    });
  }

  /** Practice mode keeps no points history. */
  ledger() {
    return this.run(() => ({ entries: [] }));
  }

  myPredictions() {
    return this.run(() => {
      const u = this.me_();
      const out = [];
      for (const m of this.marketList) {
        for (const p of m.predictions) {
          if (p.userId !== u.id) continue;
          out.push({ id: p.id, marketId: m.id, symbol: m.symbol, exchange: m.exchange, marketStatus: m.status, bucket: p.bucket, stake: p.stake, accepted: p.accepted, refund: p.refund, payout: p.payout, placedAt: p.placedAt });
        }
      }
      return { predictions: out.sort((a, b) => b.placedAt - a.placedAt) };
    });
  }

  /** A player's record, worked out the same way as on the server. */
  recordFor(userId) {
    const rows = [];
    const profit = new Map();
    for (const m of this.marketList) {
      for (const p of m.predictions) {
        if (m.status === 'resolved' && p.accepted) profit.set(p.userId, (profit.get(p.userId) ?? 0) + (p.payout ?? 0) - p.accepted);
        if (p.userId !== userId) continue;
        rows.push({
          marketId: m.id, symbol: m.symbol, status: m.status, settledAt: m.settledAt ?? null,
          winningBucket: m.status === 'resolved' ? (m.result?.winningBucket ?? null) : null,
          bucket: p.bucket, stake: p.stake, accepted: p.accepted ?? null, refund: p.refund ?? null, payout: p.payout ?? null,
        });
      }
    }
    const record = summarizeRecord(rows);
    const mine = profit.get(userId);
    return {
      ...record,
      rank: mine === undefined ? null : 1 + [...profit.values()].filter((v) => v > mine).length,
      players: profit.size,
    };
  }

  stats() {
    return this.run(() => this.recordFor(this.me_().id));
  }

  profile(name) {
    return this.run(() => {
      const u = [...this.users.values()].find((x) => x.username.toLowerCase() === String(name).toLowerCase());
      if (!u) throw new ApiError(404, 'user_not_found', 'No player with that username.');
      const positions = [];
      for (const m of this.marketList) {
        if (m.status !== 'open' && m.status !== 'locked') continue;
        const by = new Map();
        for (const p of m.predictions) if (p.userId === u.id) by.set(p.bucket, (by.get(p.bucket) ?? 0) + p.stake);
        for (const [bucket, stake] of by) positions.push({ marketId: m.id, symbol: m.symbol, name: m.name, marketStatus: m.status, outcomes: 'ladder', bucket, stake });
      }
      const stats = this.recordFor(u.id);
      return { username: u.username, joinedAt: this.now() - 30 * 24 * D3_HOUR, isMe: u.id === this.sessionUserId, stats: { ...stats, history: stats.history.slice(0, 30) }, positions };
    });
  }

  holders(id) {
    return this.run(() => {
      const m = this.find(id);
      const settled = m.status === 'resolved' || m.status === 'void';
      const by = new Map();
      for (const p of m.predictions) {
        const username = this.users.get(p.userId).username;
        const h = by.get(username) ?? { username, total: 0, payout: 0, picks: new Map() };
        h.total += p.stake;
        h.payout += p.payout ?? 0;
        h.picks.set(p.bucket, (h.picks.get(p.bucket) ?? 0) + p.stake);
        by.set(username, h);
      }
      const holders = [...by.values()]
        .sort((a, b) => b.total - a.total || a.username.localeCompare(b.username))
        .slice(0, 20)
        .map((h) => ({ username: h.username, total: h.total, payout: settled ? h.payout : null, picks: [...h.picks].map(([bucket, stake]) => ({ bucket, stake })).sort((a, b) => b.stake - a.stake) }));
      return { holders, total: by.size };
    });
  }

  odds(id) {
    return this.run(() => {
      const m = this.find(id);
      const totals = emptyTotals();
      let pool = 0;
      const series = [...m.predictions]
        .sort((a, b) => a.placedAt - b.placedAt)
        .map((p) => {
          totals[p.bucket] += p.stake;
          pool += p.stake;
          return { t: p.placedAt, shares: Object.fromEntries(BUCKETS.map((b) => [b, Math.round((totals[b] / pool) * 1000) / 1000])) };
        });
      return { outcomes: 'ladder', buckets: BUCKETS, openedAt: m.openedAt, series };
    });
  }

  leaderboard(period = 'week') {
    return this.run(() => {
      const d = new Date(this.now());
      const DAY = 24 * D3_HOUR;
      const week = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
      const day = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
      const range = {
        day: [day, day + DAY],
        week: [week, week + 7 * DAY],
        month: [Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1), Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1)],
        all: [0, null],
      }[period] ?? [week, week + 7 * DAY];
      const rows = new Map();
      for (const m of this.marketList) {
        if (m.status !== 'resolved' || (m.settledAt ?? this.now()) < range[0]) continue;
        for (const p of m.predictions) {
          if (!p.accepted) continue;
          const r = rows.get(p.userId) ?? { userId: p.userId, name: this.users.get(p.userId).username, profit: 0, wins: 0, total: 0 };
          r.profit += (p.payout ?? 0) - p.accepted;
          r.wins += p.payout > 0 ? 1 : 0;
          r.total += 1;
          rows.set(p.userId, r);
        }
      }
      const ranked = [...rows.values()].sort((a, b) => b.profit - a.profit || b.wins - a.wins).map((r, i) => ({ ...r, rank: i + 1 }));
      return {
        period,
        seasonStart: range[0],
        seasonEnd: range[1],
        entries: ranked.map(({ userId, ...r }) => ({ ...r, isMe: userId === this.sessionUserId })),
        me: ranked.find((r) => r.userId === this.sessionUserId) ?? null,
      };
    });
  }

  walletChallenge(address) {
    return this.run(() => {
      const nonce = b58encode(crypto.getRandomValues(new Uint8Array(12)));
      const message = [
        `${location.host || 'firstprint.demo'} wants you to sign in with your Solana account:`,
        address,
        '',
        'Sign in to Firstprint. This request will not trigger a transaction or cost any fees.',
        '',
        `URI: ${location.origin || 'https://firstprint.demo'}`,
        'Version: 1',
        `Nonce: ${nonce}`,
        `Issued At: ${new Date(this.now()).toISOString()}`,
      ].join('\n');
      this.challenges.set(address, message);
      return { message, nonce, expiresAt: this.now() + 5 * D3_MIN };
    });
  }

  // Demo mode accepts any signature; the real server verifies ed25519 signatures.
  walletVerify({ address, message, walletName }) {
    return this.run(() => {
      if (this.challenges.get(address) !== message) throw new ApiError(401, 'bad_signature', 'Wallet sign-in failed. Try connecting again.');
      this.challenges.delete(address);
      let created = false;
      let userId = this.walletOwners.get(address);
      if (!userId) {
        const u = this.addUser(`sol_${address.slice(0, 6)}`, 1_000);
        u.needsUsername = true;
        u.hasEmail = false;
        u.wallets.push({ address, walletName: walletName ?? null });
        this.walletOwners.set(address, u.id);
        userId = u.id;
        created = true;
      }
      this.sessionUserId = userId;
      return { user: this.publicUser(this.users.get(userId)), created };
    });
  }

  linkWallet({ address, message, walletName }) {
    return this.run(() => {
      const u = this.me_();
      if (this.challenges.get(address) !== message) throw new ApiError(401, 'bad_signature', 'Wallet sign-in failed. Try connecting again.');
      const owner = this.walletOwners.get(address);
      if (owner && owner !== u.id) throw new ApiError(409, 'wallet_taken', 'This wallet is already linked to another account.');
      if (!owner) {
        u.wallets.push({ address, walletName: walletName ?? null });
        this.walletOwners.set(address, u.id);
      }
      return { wallets: u.wallets };
    });
  }

  setUsername(username) {
    return this.run(() => {
      const u = this.me_();
      username = String(username ?? '').trim();
      if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) throw new ApiError(400, 'bad_username', 'Username must be 3–20 letters, numbers, or underscores.');
      if ([...this.users.values()].some((x) => x.id !== u.id && x.username.toLowerCase() === username.toLowerCase())) {
        throw new ApiError(409, 'username_taken', 'That username is taken. Try another.');
      }
      u.username = username;
      u.needsUsername = false;
      return this.publicUser(u);
    });
  }

  /** A random address and signature standing in for a real wallet in demo mode. */
  demoWallet() {
    return b58encode(crypto.getRandomValues(new Uint8Array(32)));
  }

  detectedListings() {
    return this.run(() => ({ listings: this.detected }));
  }

  /** Simulated live stream: price ticks for trading markets every 3 seconds. */
  subscribe(onEvent, onStatus = () => {}) {
    onStatus(true);
    const timer = setInterval(() => {
      this.advance();
      for (const m of this.marketList) {
        if (!(m.status === 'open' || m.status === 'locked') || this.now() < m.listingAt + D3_MIN) continue;
        const v = this.view(m);
        if (!v.live) continue;
        const wobble = 1 + (Math.random() - 0.5) * 0.01;
        const price = v.live.lastPrice * wobble;
        const r = v.live.basePrice ? returnPct(v.live.basePrice, price) : null;
        onEvent('price', {
          marketId: m.id,
          price,
          ts: this.now(),
          basePrice: v.live.basePrice,
          returnPct: r,
          projectedBucket: r === null ? null : bucketForReturn(r, m.cfg.thresholds),
        });
      }
    }, 3_000);
    return () => clearInterval(timer);
  }

  // --- Demo controls ----------------------------------------------------------------

  skip(ms) {
    this.offset += ms;
    this.advance();
  }
}

// Errors players hit (crashes in the page, failures nothing else caught) go to Admin → Errors.
// The same error is sent once per page load, and at most 15 a load, so a loop can't flood it.
const reportedErrors = new Set();
function reportClientError(code, message, detail = null) {
  if (S.api?.demo || reportedErrors.size >= 15) return;
  const key = `${code}|${message}`;
  if (reportedErrors.has(key)) return;
  reportedErrors.add(key);
  fetch('/api/client-error', {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ code, message: String(message ?? '').slice(0, 400), where: `${location.pathname}${location.hash}`.slice(0, 200), detail: detail ? String(detail).slice(0, 3000) : null }),
  }).catch(() => {});
}
window.addEventListener('error', (e) => {
  if (!e.message) return; // a broken image or script tag, not a crash
  reportClientError('app_crash', e.message, `${e.filename ?? ''}:${e.lineno ?? ''}:${e.colno ?? ''}\n${e.error?.stack ?? ''}`);
});
window.addEventListener('unhandledrejection', (e) => {
  const r = e.reason;
  // Answers from our server are recorded there already (5xx) or are the player's own mistakes (4xx).
  if (r && typeof r.status === 'number') return;
  reportClientError('app_crash', r?.message ?? String(r), r?.stack ?? null);
});

// ------------------------------------------------------------------ Utilities

const $ = (sel, root = document) => root.querySelector(sel);
const now = () => Date.now() + S.skew;

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}
// Number and date formats are built once: toLocaleString makes a new formatter on every call, and
// a page draws hundreds of numbers and dates.
const NUM_FMT = new Intl.NumberFormat('en-US');
const PRICE_FMT_2 = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const PRICE_FMT_4 = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
const DATE_FMT = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const DAY_FMT = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric' });
const fmtNum = (n) => NUM_FMT.format(Math.round(n ?? 0));
const fmtPts = (n) => `${fmtNum(n)} pts`;
/** The early bonus a prediction placed right now would get. */
const bonusNow = (m) => weightFor(now(), m.openedAt, m.closeAt, m.earlyBirdK ?? 0);
/** What taking a prediction back would cost right now (the server has the final word). */
const revertNow = (m, p) => (m.revert ? revertQuote(p.stake, p.placedAt, now(), m.openedAt, m.closeAt, m.revert) : null);
const pctText = (bps) => `${Math.round(bps / 10) / 10}%`;

/** A number that counts smoothly to its new value when it changes (see the ticker observer below). */
const tick = (key, n) => `<span class="tick" data-tick="${esc(key)}" data-val="${Number(n) || 0}">${fmtNum(n)}</span>`;

/** Payout multiple for one outcome as the pool stands now, after the fee. */
const poolMultiple = (m, b) => (m.totals[b] ? (m.pool * (1 - m.feeBps / 10_000)) / m.totals[b] : null);

function fmtPct(r, digits = 1) {
  if (r === null || r === undefined) return '–';
  const v = Math.abs(r * 100).toFixed(digits);
  if (Number(v) === 0) return `0.${'0'.repeat(digits)}%`;
  return `${r > 0 ? '+' : '−'}${v}%`;
}

function fmtPrice(p) {
  if (!p) return '–';
  if (p < 1) return `$${p.toPrecision(4)}`;
  return `$${(p >= 100 ? PRICE_FMT_2 : PRICE_FMT_4).format(p)}`;
}

function fmtDur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${m}m`;
  if (m) return `${m}m ${String(sec).padStart(2, '0')}s`;
  return `${sec}s`;
}

function fmtSpan(ms) {
  const h = ms / 3_600_000;
  if (h >= 1) return `${Math.round(h)} hour${Math.round(h) === 1 ? '' : 's'}`;
  const m = Math.round(ms / 60_000);
  return `${m} minute${m === 1 ? '' : 's'}`;
}

function fmtDate(ts) {
  const d = new Date(ts);
  return Number.isNaN(d.getTime()) ? 'Invalid Date' : DATE_FMT.format(d);
}

const until = (ts) => `<span data-until="${ts}">${fmtDur(ts - now())}</span>`;
/** "Oct 10, 6:00 PM" with the countdown beside it, so the exact time the admin set is always shown. */
const atAndIn = (ts) => `${fmtDate(ts)} <span class="feat-sub">in ${until(ts)}</span>`;
/** "Oct 10" with the countdown under it: the short form for cards (the market page has the exact time). */
const dayAndIn = (ts) => `<span title="${esc(fmtDate(ts))}">${DAY_FMT.format(ts)}</span> <span class="feat-sub">in ${until(ts)}</span>`;
const outcome = (b, yn = false) => `<b class="oc" style="--c:${oVar(b, yn)}">${icon(b, yn)}${oName(b, yn)}</b>`;
const rangeLabel = (b, t) => bucketRangeLabel(b, t).replace(/-/g, '−');
/** The price range an outcome covers, for either kind of market. */
/** A market created before its token traded has no start price yet: it's the opening price. */
const hasStart = (m) => m.basePrice != null;
/** A token that isn't trading yet: predictions close when it lists, and its opening price is the start. */
const isUpcoming = (m) => m.mode === 'manual' && !hasStart(m) && !m.startAtClose && m.status === 'open' && m.phase !== 'awaiting_result' && m.closeAt > now();
/** The start price before it is known: the price when predictions close, or an upcoming token's opening price. */
const startText = (m, short = false) => (hasStart(m) ? fmtPrice(m.basePrice) : m.startAtClose ? (short ? 'close price' : 'its price when predictions close') : short ? 'opening price' : 'its opening price');
/** Short label for an unknown start price, for fact rows. */
const startLater = (m) => (m.startAtClose ? 'At the close' : 'At listing');
const rangeOf = (m, b) => (isYesNo(m) ? (b === 'up' ? `At or above ${hasStart(m) ? fmtPrice(m.basePrice) : m.startAtClose ? 'close' : 'open'}` : `Below ${hasStart(m) ? fmtPrice(m.basePrice) : m.startAtClose ? 'close' : 'open'}`) : rangeLabel(b, m.thresholds));
const userLink = (name, cls = '') => `<a class="user-link${cls ? ` ${cls}` : ''}" href="#/u/${encodeURIComponent(name)}">${esc(name)}</a>`;
const share = (m, b) => (m.pool ? m.totals[b] / m.pool : 0);

function estMultiple(m, b, stake = 100) {
  const net = (m.pool + stake) * (1 - m.feeBps / 10_000);
  return net / (m.totals[b] + stake);
}

function leader(m) {
  if (!m.pool) return null;
  const list = bucketsOf(m);
  return list.reduce((best, b) => (m.totals[b] > m.totals[best] ? b : best), list[0]);
}

let toastTimer;

  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

function syncClock(serverTime) {
  // The live server: its Date header (a cached body's serverTime can be old). The demo: its serverTime.
  if (!S.api?.demo && serverClock.skew !== null) S.skew = serverClock.skew;
  else if (typeof serverTime === 'number') S.skew = serverTime - Date.now();
}

// ------------------------------------------------------------------ Data

async function refreshMe() {
  try {
    S.me = await S.api.me();
  } catch (err) {
    if (err instanceof ApiError && err.status === 401) S.me = null;
    else throw err;
  }
  await refreshRewards();
  renderTop();
  if (S.me?.unreadNotifications) maybeCelebrate();
}

/** Rewards, tasks and the referral link for the signed-in player (nothing for visitors). */
async function refreshRewards() {
  S.rewards = S.me && S.api.rewards ? await S.api.rewards().catch(() => null) : null;
  S.claimsPage = null; // back to the newest claims
}

async function loadHome() {
  const [open, live, settled] = await Promise.all(['open', 'live', 'settled'].map((f) => S.api.markets(f)));
  syncClock(open.serverTime);
  S.lists = { open: open.markets, live: live.markets, settled: settled.markets };
  // Guests get a short list from the server; the totals say how many there really are.
  S.totals = { open: open.total ?? open.markets.length, live: live.total ?? live.markets.length, settled: settled.total ?? settled.markets.length };
  S.stats = open.stats ?? null;
  S.limited = Boolean(open.limited || live.limited || settled.limited);
  const featured = featuredMarket();
  const [odds, leaders] = await Promise.all([
    featured && S.api.odds ? S.api.odds(featured.id).catch(() => null) : null,
    S.api.leaderboard ? S.api.leaderboard('all').catch(() => null) : null,
  ]);
  S.featuredOdds = featured ? { id: featured.id, odds } : null;
  S.topLeaders = leaders?.entries?.slice(0, 5) ?? [];
}

async function loadMarket(id) {
  const m = await S.api.market(id);
  syncClock(m.serverTime);
  const [chart, activity, odds, holders] = await Promise.all([
    m.phase === 'pre_listing' || isManual(m) ? Promise.resolve(null) : S.api.chart(id),
    S.api.activity(id),
    S.api.odds ? S.api.odds(id).catch(() => null) : null,
    S.api.holders ? S.api.holders(id).catch(() => null) : null,
  ]);
  if (S.market?.id !== id) {
    S.trade = { bucket: null, stake: 100, quote: null, seq: 0, busy: false };
    S.tradeKey = '';
  }
  S.market = m;
  S.chart = chart;
  S.activity = activity.activity;
  S.odds = odds;
  S.holders = holders;
}

async function refresh() {
  // Admin and the partner stats page load their own data; redrawing them would close open tables and tooltips.
  if (S.refreshing || S.modal || S.route.name === 'admin' || S.route.name === 'stats') return;
  S.refreshing = true;
  S.refreshedAt = Date.now();
  try {
    if (S.me) await refreshMe();
    await loadRoute(false);
  } catch (err) {
    console.error(err);
  } finally {
    S.refreshing = false;
  }
}

// ------------------------------------------------------------------ Routing

function parseRoute() {
  const h = location.hash.replace(/^#/, '');
  const m = h.match(/^\/market\/([^/]+)$/);
  if (m) return { name: 'market', id: decodeURIComponent(m[1]) };
  if (h === '/leaderboard') return { name: 'leaderboard' };
  const u = h.match(/^\/u\/([^/]+)$/);
  if (u) return { name: 'profile', id: decodeURIComponent(u[1]) };
  if (h === '/portfolio' || h === '/dashboard') return { name: 'portfolio' };
  if (h === '/radar') return { name: 'radar' };
  if (h === '/earn') return { name: 'earn' };
  if (h === '/admin') return { name: 'admin' };
  const st = h.match(/^\/stats\/(.*)$/);
  if (st) return { name: 'stats', key: st[1] };
  return { name: 'home' };
}

/** Placeholders shaped like the page that is loading, instead of a spinner. */

const loaderMark = (label = 'Loading') => `<div class="fp-loader" role="status" aria-label="${esc(label)}"><span class="ld-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></div>`;

function skeletonView(name) {

  if (name === 'portfolio') return `${loaderMark('Loading your dashboard')}<div class="skeleton" aria-busy="true" aria-label="Loading your dashboard"><div class="sk-row"><i class="sk sk-circle lg"></i><span class="sk-col"><i class="sk sk-line w20"></i><i class="sk sk-title w30"></i></span></div><div class="sk-grid two"><div class="sk-card tall"></div><div class="sk-card tall"></div></div><div class="sk-card block"></div></div>`;

/**
 * A short fade-and-rise when a new page appears (not on live updates of the same page). Run with the
 * Web Animations API on the first few blocks only: opacity and transform stay on the compositor, and
 * nothing forces a layout or restyles the whole page (a class toggle on #view did both).
 */
function enterView() {
  const view = $('#view');
  if (!view?.animate || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  [...view.children].slice(0, 4).forEach((el, i) =>
    el.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], {
      duration: 340,
      delay: Math.min(i, 2) * 40,
      easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
      fill: 'backwards',
    }),
  );
}

// --- Maintenance -------------------------------------------------------------------
// While an admin deploys a big change, players see a quiet screen (and can't write); admins keep
// using the site, with a banner reminding them it's on. Pages check every 20 seconds and come back
// by themselves when it ends.

const isAdminViewer = () => Boolean(readAdminKey()) || Boolean(S.me?.isAdmin);

function applyMaintenance(m) {
  const was = Boolean(S.maint?.on);
  S.maint = m?.on ? { on: true, message: m.message ?? '', since: m.since ?? null } : { on: false };
  const blocked = S.maint.on && !isAdminViewer() && S.route.name !== 'admin';
  let screen = $('#maint');
  if (blocked) {
    if (!screen) {
      screen = document.createElement('div');
      screen.id = 'maint';
      screen.setAttribute('role', 'alertdialog');
      screen.setAttribute('aria-modal', 'true');
      document.body.append(screen);
    }
    const note = S.maint.message || 'We’re making Firstprint better. Back in a few minutes.';
    screen.innerHTML = `<div class="maint-card">
      <span class="maint-ico">${ico('sliders')}</span>
      <h1>Updating Firstprint</h1>
      <p>${esc(note)}</p>
      <p class="muted">Your points and predictions are safe. This page comes back by itself.</p>
      <span class="maint-dots" aria-hidden="true"><i></i><i></i><i></i></span>
    </div>`;
    document.documentElement.classList.add('in-maint');
  } else {
    screen?.remove();
    document.documentElement.classList.remove('in-maint');
  }
  let bar = $('#maint-admin');
  if (S.maint.on && isAdminViewer()) {
    if (!bar) {
      bar = document.createElement('a');
      bar.id = 'maint-admin';
      bar.href = '#/admin';
      document.body.append(bar);
    }
    bar.innerHTML = `${ico('alert')}<span>Maintenance is on: players see the update screen. Turn it off in Admin → Settings.</span>`;
  } else bar?.remove();
  // Back from maintenance: reload what's on screen, so prices, pools and balances are current.
  if (was && !S.maint.on) {
    toast('Firstprint is back. Thanks for waiting.');
    void loadRoute();
  }
}

function watchMaintenance() {
  clearInterval(watchMaintenance.timer);
  watchMaintenance.timer = setInterval(async () => {
    if (document.hidden || !S.api.status) return;
    try {
      const { maintenance } = await S.api.status();
      if (Boolean(maintenance?.on) !== Boolean(S.maint?.on) || (maintenance?.on && maintenance.message !== S.maint.message)) applyMaintenance(maintenance);
    } catch {
      /* offline or waking: try again next round */
    }
  }, 20_000);
}

async function onRoute() {
  const next = parseRoute();
  if (S.maint?.on) queueMicrotask(() => applyMaintenance(S.maint));
  const changed = next.name !== S.route.name || next.id !== S.route.id;
  S.route = next;
  // Opening a page fresh starts its long lists on their first page; refreshes keep the page shown.
  if (changed) S.pg = {};
  S.menuOpen = false;
  S.streakOpen = false;
  if (changed) {
    closeSheet();
    // Overlays that belong to the page being left (the tour, results inbox, PnL card) close with it.
    if (['tour', 'inbox', 'pnl'].includes(S.modal) && !S.modalBusy) closeModal();
    $('#view').innerHTML = skeletonView(next.name);
    window.scrollTo(0, 0);
  }
  renderTop();
  await loadRoute(changed);
  if (changed) enterView();
  if (changed && document.activeElement?.id !== 'market-search') $('#view').focus({ preventScroll: true });
}

/**
 * Writes a page into an element only when it changed. The 8-second refresh redraws the page, and
 * rebuilding a few thousand unchanged nodes costs a slow phone a noticeable pause, so an identical
 * page (countdown text aside, which the 1-second ticker keeps current) is left alone.
 */
function setHtml(el, html) {
  const key = html.replace(/(data-until="\d+">)[^<]*/g, '$1');
  if (el.__html === key && el.firstElementChild && el.firstElementChild === el.__first) return;
  // A redraw (new odds, "1m ago") must not snap shut a section the reader opened.
  const tag = (d, i) => `${d.className}#${i}`;
  const opened = new Set([...el.querySelectorAll('details')].map((d, i) => (d.open ? tag(d, i) : '')).filter(Boolean));
  el.innerHTML = html;
  if (opened.size) el.querySelectorAll('details').forEach((d, i) => opened.has(tag(d, i)) && (d.open = true));
  el.__html = key;
  el.__first = el.firstElementChild;
}

async function loadRoute() {
  const view = $('#view');
  // Quick taps from page to page: only the latest page may draw, so a slow earlier one can't
  // land on top of it (or leave the screen blank) when its data finally arrives.
  const seq = (S.routeSeq = (S.routeSeq ?? 0) + 1);
  const stale = () => seq !== S.routeSeq;
  try {
    if (S.route.name === 'home') {
      await loadHome();
      await heroFlipDone();
      if (stale()) return;
      setHtml(view, homeView());
      animateCounts();
    } else if (S.route.name === 'market') {
      await loadMarket(S.route.id);
      const pending = S.pendingPick;
      if (pending?.id === S.route.id) {
        S.pendingPick = null;
        if (S.market.status === 'open' && bucketsOf(S.market).includes(pending.bucket)) S.trade.bucket = pending.bucket;
      }
      if (stale()) return;
      renderMarket();
      if (pending?.id === S.route.id && S.trade.bucket) {
        requestQuote();
        if (isMobile()) openSheet();
        else setTimeout(() => $('#stake')?.focus({ preventScroll: true }), 50);
      }
    } else if (S.route.name === 'leaderboard') {
      const lb = await S.api.leaderboard(S.lbPeriod);
      if (stale()) return;
      setHtml(view, leaderboardView(lb));
    } else if (S.route.name === 'profile') {
      S.profile = await S.api.profile(S.route.id);
      if (stale()) return;
      setHtml(view, profileView(S.profile));
    } else if (S.route.name === 'admin') {
      await renderAdmin();
    } else if (S.route.name === 'stats') {
      if (!S.api.publicAnalytics) {
        view.innerHTML = '<div class="empty"><p>Stats aren’t available in practice mode.</p></div>';
      } else {
        const dead = (msg) => `<div class="empty"><div class="empty-art">${ico('chart')}</div><p><strong>${msg}</strong><br />Ask Firstprint for a new link.</p></div>`;
        if (!/^[A-Za-z0-9_-]{10,64}$/.test(S.route.key)) {
          view.innerHTML = dead('This stats link isn’t complete.');
        } else {
          try {
            const data = await S.api.publicAnalytics(S.route.key, S.vizDays ?? 30);
            if (stale()) return;
            view.innerHTML = analyticsView(data, { shared: true });
          } catch (err) {
    if (stale()) return;
            view.innerHTML =
              err.status === 404
                ? dead('This stats link is no longer active.')
                : `<div class="empty"><div class="empty-art">${ico('chart')}</div><p><strong>Couldn’t load the stats.</strong><br />${esc(err.message)}</p><button class="btn btn-solid" data-action="viz-retry">${ico('refresh')}Try again</button></div>`;
          }
        }
      }
    } else if (S.route.name === 'radar' && S.cfg?.manualOnly) {
      location.replace('#/');
      return;
    } else if (S.route.name === 'radar') {
      const { listings } = await S.api.detectedListings();
      if (stale()) return;
      setHtml(view, radarView(listings));
    } else if (S.route.name === 'earn') {
      await Promise.all([refreshRewards(), loadDaily()]);
      if (stale()) return;
      setHtml(view, earnView());
    } else if (S.route.name === 'portfolio') {
      const preds = S.me ? (await S.api.myPredictions()).predictions : [];
      // Long lists come a page at a time (the page shown stays put when the dashboard refreshes).
      S.pg ??= {};
      const history = S.me && S.api.ledger ? await S.api.ledger(S.pg.ledger ?? 1).catch(() => ({ entries: [] })) : { entries: [] };
      const stats = S.me && S.api.stats ? await S.api.stats().catch(() => null) : null;
      const chain = S.me && S.api.chain ? await S.api.chain(S.pg.chain ?? 1).catch(() => null) : null;
      // Open markets give the active positions their crowd share, payout and closing time.
      if (S.me && preds.some((p) => p.marketStatus === 'open' || p.marketStatus === 'locked')) {
        const [open, live] = await Promise.all(['open', 'live'].map((f) => S.api.markets(f).catch(() => null)));
        if (open) S.lists.open = open.markets;
        if (live) S.lists.live = live.markets;
      }
      S.dashData = [preds, history, stats, chain];
      if (stale()) return;
      setHtml(view, portfolioView(preds, history, stats, chain));
    }
    document.title = titleFor();
  } catch (err) {
    if (err instanceof ApiError && err.status === 404 && S.route.name === 'profile') {
      view.innerHTML = `<div class="empty"><div class="empty-art">${ico('user')}</div><p>There’s no player called “${esc(S.route.id)}”.</p><a class="btn" href="#/leaderboard">See the leaderboard</a></div>`;
    } else if (err instanceof ApiError && err.status === 404) {
      view.innerHTML = `<div class="empty"><p>This market doesn’t exist or was removed.</p><a class="btn" href="#/">Browse markets</a></div>`;
    } else {
      view.innerHTML = `<div class="empty"><p>${esc(err.message || 'Something went wrong.')}</p><button class="btn" data-action="retry">Try again</button></div>`;
    }
  }
}

function titleFor() {
  if (S.route.name === 'market' && S.market) return `${S.market.symbol} on ${S.market.exchange}: Firstprint`;
  if (S.route.name === 'leaderboard') return 'Leaderboard: Firstprint';
  if (S.route.name === 'profile') return `${S.profile?.username ?? S.route.id}: Firstprint`;
  if (S.route.name === 'radar') return 'Listing radar: Firstprint';
  if (S.route.name === 'admin') return 'Admin: Firstprint';
  if (S.route.name === 'portfolio') return 'Your dashboard: Firstprint';
  if (S.route.name === 'earn') return 'Earn points: Firstprint';
  if (S.route.name === 'stats') return 'Live stats: Firstprint';
  return 'Firstprint: predict crypto prices';
}

/** A market's token logo, falling back to the letter circle. Takes a market, or a row with symbol + marketId. */
function tokenAvatar(m, cls = '') {
  const logo = m.logoUrl ?? logoOf(m.marketId);
  if (!logo) return avatar(m.symbol, cls);
  return `<span class="avatar avatar-img${cls ? ` ${cls}` : ''}" aria-hidden="true"><img class="tok-logo" src="${esc(logo)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" data-sym="${esc(m.symbol)}" /></span>`;
}

/** Looks up a logo from the loaded market lists (portfolio and history rows carry only the id). */
function logoOf(id) {
  if (!id || !S.lists) return null;
  for (const list of [S.lists.open, S.lists.live, S.lists.settled]) {
    const hit = (list ?? []).find((x) => x.id === id);
    if (hit) return hit.logoUrl ?? null;
  }
  return null;
}

/** Navigation: the same pages in the top bar (wide screens) and the tab bar (phones). */
const NAV_ICONS = { home: 'grid', radar: 'radar', earn: 'gift', leaderboard: 'trophy', portfolio: 'dashboard' };

/** A coloured circle with the first letter of a name or symbol; the colour is stable per name. */
function avatar(name, cls = '') {
  const text = String(name || '?');
  let h = 0;
  for (const ch of text) h = (h * 31 + ch.codePointAt(0)) % 360;
  return `<span class="avatar${cls ? ` ${cls}` : ''}" style="--h:${h}" aria-hidden="true">${esc(text.replace(/^@/, '').slice(0, 1).toUpperCase())}</span>`;
}

/** The theme in use: the saved choice, else the device setting. */
function currentTheme() {
  const set = document.documentElement.dataset.theme;
  if (set === 'light' || set === 'dark') return set;
  return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
}

function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  try {
    localStorage.setItem('fp:theme', theme);
  } catch {
    /* storage blocked: the choice lasts for this visit */
  }
  syncThemeColor();
  renderTop();
}

/** Keeps the browser's address-bar colour in step with the theme. */
function syncThemeColor() {
  const color = currentTheme() === 'light' ? '#f5f5f7' : '#09090b';
  document.querySelectorAll('meta[name="theme-color"]').forEach((m) => {
    m.setAttribute('content', color);
    m.removeAttribute('media');
  });
}

function themeButton() {
  const light = currentTheme() === 'light';
  return `<button class="chip theme-toggle" data-action="theme" aria-label="Switch to ${light ? 'dark' : 'light'} mode" title="Switch to ${light ? 'dark' : 'light'} mode">${ico(light ? 'moon' : 'sun')}</button>`;
}

function renderTop() {

// --- Daily streak --------------------------------------------------------------------
const DAILY_SCHEDULE = [50, 75, 100, 125, 150, 175, 200];
const dailyReward = (day) => DAILY_SCHEDULE[Math.min(DAILY_SCHEDULE.length, Math.max(1, day)) - 1];
/** Points the next claim gives (today's if not claimed yet, otherwise tomorrow's). */

function dailyLine() {

/** The flame next to the bell: the streak length, glowing when today's points are waiting. */

/**
 * TestFPT waiting to be claimed, as a small chip in the top bar. It shows up when a reward is
 * earned and goes once it is claimed (the coins fly into the points balance). Players with a
 * Firstprint wallet never see it: their rewards are sent by themselves.
 */
function claimChip() {
  const r = S.rewards;
  // Rewards sent by themselves (a Firstprint wallet, or a linked one while the server pays) need no chip.
  if (!r?.onChain || r.firstprintWallet || (r.autoSend && !r.chainPaused) || !(r.claimable > 0)) {
    S.claimChipShown = false;
    return '';
  }
  // It pops in only when it first appears, not on every redraw of the top bar.
  const fresh = !S.claimChipShown;
  S.claimChipShown = true;
  const busy = Boolean(S.claimBusy);
  return `<button class="chip claim-chip${fresh ? ' is-new' : ''}${busy ? ' is-busy' : ''}" data-action="claim-tokens"${busy ? ' disabled' : ''} title="${busy ? 'Claiming your TestFPT…' : `Claim ${fmtNum(r.claimable)} TestFPT to your wallet`}" aria-label="${busy ? 'Claiming' : `Claim ${fmtNum(r.claimable)} TestFPT`}">${busy ? '<span class="spin" aria-hidden="true"></span>' : ico('token')}<span class="claim-n">${fmtNum(r.claimable)}</span><span class="claim-word">${busy ? 'Claiming' : 'Claim'}</span></button>`;
}

/** The streak, small: seven days as circles (green once claimed) with their points, and the claim button. */
function streakPop() {
  const d = S.me.daily;
  if (!d) return '';
  const can = S.me.canClaimDaily;
  const pos = Math.min(d.claimedToday ? d.streak : d.nextDay, 7);
  const days = DAILY_SCHEDULE.map((pts, i) => {
    const n = i + 1;
    const done = n < pos || (n === pos && d.claimedToday);
    const state = done ? 'done' : n === pos ? 'today' : 'next';
    return `<li class="sp-day ${state}"><span class="sp-dot">${done ? ico('check') : ''}</span><b>+${pts}</b><small>${n === 7 ? 'Day 7+' : `Day ${n}`}</small></li>`;
  }).join('');
  return `
    <div class="streak-pop" id="streak-pop" role="dialog" aria-label="Daily streak">
      <div class="sp-head">
        <span class="sp-flame${d.streak ? ' lit' : ''}">${ico('flame')}</span>
        <div><b>${d.streak ? `${d.streak}-day streak` : 'Start a streak'}</b><small>${can ? `Today: +${d.next} points` : `Claimed today · +${d.next} tomorrow`}</small></div>
      </div>
      <ol class="sp-days">${days}</ol>

}

async function loadDaily() {

  S.daily = await S.api.daily().catch(() => null);

/** Streak tiles (days 1–7 and their points) and a calendar of this month's claims. */
function streakCard(compact = false) {
  const d = S.daily;
  if (!S.me || !d) return '';
  const today = d.today;
  const cur = d.claimedToday ? d.streak : d.streak + 1; // the streak day today counts as
  const pos = Math.min(cur, 7);
  // In the side column: one small circle per day (like the streak pop-up), the points under it.
  const dots = DAILY_SCHEDULE.map((pts, i) => {
    const n = i + 1;
    const done = n < pos || (n === pos && d.claimedToday);
    const state = done ? 'done' : n === pos ? 'today' : 'next';
    return `<li class="sp-day ${state}"><span class="sp-dot" title="Day ${n === 7 ? '7+' : n}">${done ? ico('check') : ''}</span><b>+${pts}</b></li>`;
  }).join('');
  const tiles = DAILY_SCHEDULE.map((pts, i) => {
    const n = i + 1;
    const state = n < pos ? 'done' : n === pos ? (d.claimedToday ? 'done today' : 'today') : 'next';
    const label = n === 7 ? (cur > 7 ? `Day ${cur}` : 'Day 7+') : `Day ${n}`;
    return `<li class="st-day ${state}"><span class="st-n">${label}</span><b>+${pts}</b><span class="st-ico">${state.includes('done') ? ico('check') : n === pos ? ico('gift') : ''}</span></li>`;
  }).join('');
  // This month's calendar, Monday first, in UTC like the claims.
  const [y, m] = today.split('-').map(Number);
  const first = new Date(Date.UTC(y, m - 1, 1));
  const daysIn = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const lead = (first.getUTCDay() + 6) % 7;
  const claimed = new Map(d.days.map((x) => [x.day, x.points]));
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push('<span class="cal-cell blank"></span>');
  for (let day = 1; day <= daysIn; day++) {
    const key = `${y}-${String(m).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const pts = claimed.get(key);
    const cls = ['cal-cell', pts ? 'hit' : '', key === today ? 'is-today' : '', key > today ? 'future' : ''].filter(Boolean).join(' ');
    cells.push(`<span class="${cls}"${pts ? ` title="+${pts} points"` : ''}>${day}</span>`);
  }
  const month = first.toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
  const claimedThisMonth = d.days.filter((x) => x.day.startsWith(today.slice(0, 7))).length;
  return `
    <section class="panel streak-card${compact ? ' compact' : ''}">
      <div class="st-head">
        <span class="st-flame${d.streak ? ' lit' : ''}">${ico('flame')}</span>
        <div><span class="eyebrow">Daily streak</span><b class="st-count">${d.streak ? `${d.streak} day${d.streak === 1 ? '' : 's'}` : 'No streak yet'}</b></div>
        ${d.claimedToday ? `<span class="st-note">${ico('check')}Claimed today · +${d.next} tomorrow</span>` : `<button class="btn btn-gold btn-sm" data-action="claim">${ico('gift')}Claim +${d.next}</button>`}
      </div>
      ${compact ? `<ol class="sp-days st-dots">${dots}</ol>` : `<ol class="st-days">${tiles}</ol>`}
      <p class="st-rule muted">${compact ? 'One claim a day (UTC). Miss a day and it resets.' : 'Claim once a day (UTC): 50 points on day 1, 25 more each day, 200 a day from day 7. Miss a day and it starts again at 50.'}</p>
      ${
        compact
          ? `<details class="st-cal-more"><summary>${ico('calendar')}${month}<span class="muted">${claimedThisMonth} day${claimedThisMonth === 1 ? '' : 's'} claimed</span></summary>
              <div class="cal-grid">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((w) => `<span class="cal-wd">${w}</span>`).join('')}${cells.join('')}</div>
            </details>`
          : `<div class="st-cal">
              <div class="st-cal-head"><b>${month}</b><span class="muted">${claimedThisMonth} day${claimedThisMonth === 1 ? '' : 's'} claimed</span></div>
              <div class="cal-grid">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((w) => `<span class="cal-wd">${w}</span>`).join('')}${cells.join('')}</div>
            </div>`
      }
    </section>`;
}

// --- Analytics (admin, and the read-only partner link) --------------------------------------
const VIZ = { W: 640, H: 210, L: 40, R: 14, T: 14, B: 26 };
const SHORT_DAY_FMT = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
const fmtShortDay = (d) => SHORT_DAY_FMT.format(new Date(`${d}T00:00:00Z`));

function niceMax(v) {
  if (v <= 4) return 4;
  const p = 10 ** Math.floor(Math.log10(v));
  // Steps whose half is still a round number, so the middle gridline reads cleanly.
  for (const m of [1, 2, 3, 4, 5, 6, 8, 10]) if (m * p >= v && (m * p) % 2 === 0) return m * p;
  return 10 * p;
}

/** Axis, gridlines and date labels shared by the time charts. */
function vizFrame(days, max, W = VIZ.W) {
  const { H, L, R, T, B } = VIZ;
  const y = (v) => T + (H - T - B) * (1 - v / max);
  const ticks = [0, max / 2, max]
    .map((v) => `<line class="viz-grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="viz-axis" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmtCompact(Math.round(v))}</text>`)
    .join('');
  const slot = (W - L - R) / days.length;
  const at = [0, Math.floor((days.length - 1) / 2), days.length - 1];
  const xl = [...new Set(at)]
    .map((i, k) => `<text class="viz-axis" x="${L + slot * (i + 0.5)}" y="${H - 6}" text-anchor="${k === 0 ? 'start' : k === at.length - 1 ? 'end' : 'middle'}">${fmtShortDay(days[i])}</text>`)
    .join('');
  return { y, slot, axes: ticks + xl };
}

/** Columns sit in half-width cards, so they draw on a narrower canvas to keep the text a readable size. */
function columnChart(days, values, label, W = 380) {
  const { H, L, B } = VIZ;
  const max = niceMax(Math.max(...values));
  const { y, slot, axes } = vizFrame(days, max, W);
  const bw = Math.max(2, Math.min(24, slot * 0.7));
  const base = H - B;
  const cols = values
    .map((v, i) => {
      const x = L + slot * i + (slot - bw) / 2;
      const top = y(v);
      const h = base - top;
      const r = Math.min(4, bw / 2, h);
      const bar = v > 0 ? `<path class="viz-bar" d="M${x},${base}V${top + r}Q${x},${top} ${x + r},${top}H${x + bw - r}Q${x + bw},${top} ${x + bw},${top + r}V${base}Z"/>` : '';
      return `<g class="viz-slot" data-tip="${esc(fmtShortDay(days[i]))}|${fmtNum(v)} ${esc(label)}"><rect class="viz-hit" x="${L + slot * i}" y="0" width="${slot}" height="${H}"/>${bar}</g>`;
    })
    .join('');
  return `<svg class="viz" viewBox="0 0 ${W} ${VIZ.H}" role="img" aria-label="${esc(label)} per day">${axes}${cols}</svg>`;
}

/** Drawn twice: a wide canvas for desktop and a narrow one for phones, so the text stays readable on both. */
function lineChart(days, values, label) {
  return lineSvg(days, values, label, VIZ.W, 'viz-wide') + lineSvg(days, values, label, 380, 'viz-narrow');
}

function lineSvg(days, values, label, W, cls) {
  const { H, L, B, T } = VIZ;
  const max = niceMax(Math.max(...values));
  const { y, slot, axes } = vizFrame(days, max, W);
  const pts = values.map((v, i) => [L + slot * (i + 0.5), y(v)]);
  const line = pts.map(([x, py], i) => `${i ? 'L' : 'M'}${x.toFixed(1)},${py.toFixed(1)}`).join('');
  const area = `${line}L${pts[pts.length - 1][0].toFixed(1)},${H - B}L${pts[0][0].toFixed(1)},${H - B}Z`;
  const [ex, ey] = pts[pts.length - 1];
  const hits = values
    .map((v, i) => `<g class="viz-slot" data-tip="${esc(fmtShortDay(days[i]))}|${fmtNum(v)} ${esc(label)}"><rect class="viz-hit" x="${L + slot * i}" y="0" width="${slot}" height="${H}"/><line class="viz-guide" x1="${pts[i][0]}" x2="${pts[i][0]}" y1="${T}" y2="${H - B}"/><circle class="viz-pt" cx="${pts[i][0]}" cy="${pts[i][1]}" r="4.5"/></g>`)
    .join('');
  return `<svg class="viz ${cls}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)} per day">${axes}<path class="viz-area" d="${area}"/><path class="viz-line" d="${line}"/><circle class="viz-end" cx="${ex}" cy="${ey}" r="4.5"/><text class="viz-end-label" x="${Math.min(ex, W - 4)}" y="${Math.max(ey - 12, 12)}" text-anchor="end">${fmtNum(values[values.length - 1])}</text>${hits}</svg>`;
}

/** Change against the previous period of the same length. */
function vizDelta(cur, prev) {
  if (!prev) return cur ? '<span class="viz-delta up">New</span>' : '';
  const ch = (cur - prev) / prev;
  if (Math.abs(ch) < 0.005) return '<span class="viz-delta">0%</span>';
  return `<span class="viz-delta ${ch > 0 ? 'up' : 'down'}">${ch > 0 ? '▲' : '▼'} ${Math.abs(Math.round(ch * 100))}%</span>`;
}

function hbars(rows, unit = '') {
  const max = Math.max(1, ...rows.map((r) => r.value));
  return `<div class="hbars">${rows
    .map(
      (r) => `<div class="hbar" data-tip="${esc(r.label)}|${fmtNum(r.value)}${unit ? ` ${unit}` : ''}"><span class="hbar-label">${r.html ?? esc(r.label)}</span><span class="hbar-track"><i style="width:${Math.max(r.value ? 2 : 0, (r.value / max) * 100)}%"></i></span><b>${fmtNum(r.value)}</b></div>`,
    )
    .join('')}</div>`;
}

/** Country name and flag from a two-letter code (no code: "Unknown"). */
const REGION_NAMES = (() => {
  try {
    return new Intl.DisplayNames(['en'], { type: 'region' });
  } catch {
    return null;
  }
})();
const countryName = (code) => (code ? (REGION_NAMES?.of(code) ?? code) : 'Unknown');
const countryFlag = (code) => (code ? String.fromCodePoint(...[...code].map((c) => 0x1f1a5 + c.charCodeAt(0))) : '🌐');

/** Everything on the analytics page as one sheet (CSV, opens in Excel or Google Sheets): one block per section. */
function analyticsCsv(d) {
  const cell = (v) => {
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const rows = [];
  const block = (title, head, body) => {
    if (rows.length) rows.push([]);
    rows.push([title]);
    rows.push(head);
    for (const r of body) rows.push(r);
  };
  const P = d.period;
  const T = d.totals;
  const C = d.onChain;
  block('Firstprint analytics', ['Item', 'Value'], [
    ['Period (UTC)', `${d.from} to ${d.to}`],
    ['Generated', new Date(d.generatedAt).toISOString()],
    ['Players (all time)', T.players],
    [`New players (${d.days} days)`, P.newPlayers],
    [`Active players (${d.days} days)`, P.active],
    ['Returning players', P.returning],
    [`Predictions (${d.days} days)`, P.predictions],
    [`Points staked (${d.days} days)`, P.staked],
    ['Predictions (all time)', T.predictions],
    ['Points staked (all time)', T.staked],
    ['Wallets linked', T.walletsLinked],
    ['Markets (open / settled / total)', `${T.marketsOpen} / ${T.marketsSettled} / ${T.marketsTotal}`],
    ['Players invited by friends', T.referred],
    ['Tasks completed', T.tasksDone],
  ]);
  block('Daily (UTC)', ['Day', 'Active', 'New players', 'Predictions', 'Points staked', 'On-chain transfers'], d.series.map((x) => [x.day, x.active, x.newPlayers, x.predictions, x.staked, x.onChain ?? 0]));
  block('Countries', ['Country', 'Code', 'Players', `New in ${d.days} days`], (d.countries ?? []).map((c) => [countryName(c.country), c.country ?? '', c.players, c.newPlayers]));
  block('Sign-in', ['Method', 'Players'], [['Google or email', d.signIn.emailOnly], ['Wallet', d.signIn.walletOnly], ['Both', d.signIn.both]]);
  block(`Most played markets (${d.days} days)`, ['Token', 'Name', 'Exchange', 'Status', 'Predictions', 'Participants', 'Points staked'], d.topMarkets.map((m) => [m.symbol, m.name ?? '', m.exchange, m.status, m.predictions, m.predictors, m.staked]));
  if (C)
    block('On chain (TestFPT, Solana ' + (d.chain?.cluster ?? 'testnet') + ')', ['Item', 'Transfers', 'TestFPT'], [
      ['All transfers', C.transfers, ''],
      [`Transfers in ${d.days} days`, C.transfersInPeriod, ''],
      ['Rewards sent', C.rewards.transfers, C.rewards.amount],
      ['Stakes', C.stakes.transfers, C.stakes.amount],
      ['Payouts', C.payouts.transfers, C.payouts.amount],
      ['Refunds', C.refunds.transfers, C.refunds.amount],
      ['Claims signed by players', C.claims.transfers, C.claims.amount],
      ['Wallets that received TestFPT', C.holders, ''],
      ['Firstprint wallets', C.firstprintWallets, ''],
      ['Waiting to send', C.waiting, ''],
      ['Failed', C.failed, ''],
      ['Mint', d.chain?.mint ?? '', ''],
    ]);
  return '\ufeff' + rows.map((r) => r.map(cell).join(',')).join('\r\n');
}

function downloadAnalytics() {
  const d = S.vizData;
  if (!d) return;
  const blob = new Blob([analyticsCsv(d)], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `firstprint-analytics-${d.to}-${d.days}d.csv`;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// One tooltip for every chart: marks carry data-tip="label|value".
document.addEventListener('pointerover', (e) => {
  const el = e.target.closest?.('[data-tip]');
  let tip = document.getElementById('viz-tip');
  if (!el) {
    if (tip) tip.hidden = true;
    return;
  }
  if (!tip) {
    tip = document.createElement('div');
    tip.id = 'viz-tip';
    tip.setAttribute('role', 'status');
    document.body.append(tip);
  }
  const [label, value] = el.dataset.tip.split('|');
  const v = document.createElement('b');
  v.textContent = value ?? '';
  const l = document.createElement('span');
  l.textContent = label;
  tip.replaceChildren(v, l);
  tip.hidden = false;
});
document.addEventListener('pointermove', (e) => {
  const tip = document.getElementById('viz-tip');
  if (!tip || tip.hidden) return;
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
  const y = e.clientY - tip.offsetHeight - 12 < 8 ? e.clientY + 18 : e.clientY - tip.offsetHeight - 12;
  tip.style.transform = `translate(${x}px, ${y}px)`;
});
